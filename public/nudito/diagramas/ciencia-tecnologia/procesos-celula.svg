<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Procesos que permiten vivir a una célula unicelular</title>
  <desc id="descripcion">Una célula de levadura intercambia sustancias con el medio, responde a cambios del ambiente y puede originar una nueva célula.</desc>
  <rect width="900" height="560" rx="28" fill="#f8fafc"/>
  <text x="450" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172554">Una célula unicelular realiza procesos para vivir</text>
  <g transform="translate(55 105)">
    <rect width="240" height="340" rx="22" fill="#ecfeff" stroke="#0f766e" stroke-width="5"/>
    <ellipse cx="120" cy="170" rx="70" ry="60" fill="#ccfbf1" stroke="#0f766e" stroke-width="6"/>
    <circle cx="120" cy="170" r="21" fill="#5eead4"/>
    <path d="M23 150h57m-18-14 18 14-18 14M218 208h-57m18-14-18 14 18 14" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#115e59">Intercambia sustancias</text>
    <text x="120" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#115e59">toma nutrientes</text>
    <text x="120" y="329" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#115e59">y elimina desechos</text>
  </g>
  <g transform="translate(330 105)">
    <rect width="240" height="340" rx="22" fill="#eef2ff" stroke="#4338ca" stroke-width="5"/>
    <ellipse cx="120" cy="170" rx="70" ry="60" fill="#e0e7ff" stroke="#4338ca" stroke-width="6"/>
    <circle cx="120" cy="170" r="21" fill="#a5b4fc"/>
    <path d="M42 78c24 20 40 20 64 0M134 77c24 20 40 20 64 0" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
    <path d="M120 101v28M109 116l11 13 11-13" fill="none" stroke="#4338ca" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="120" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#3730a3">Responde al ambiente</text>
    <text x="120" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#3730a3">detecta cambios</text>
    <text x="120" y="329" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#3730a3">a su alrededor</text>
  </g>
  <g transform="translate(605 105)">
    <rect width="240" height="340" rx="22" fill="#fff7ed" stroke="#b45309" stroke-width="5"/>
    <ellipse cx="99" cy="170" rx="62" ry="55" fill="#fef3c7" stroke="#b45309" stroke-width="6"/>
    <ellipse cx="159" cy="132" rx="37" ry="33" fill="#fde68a" stroke="#b45309" stroke-width="5"/>
    <circle cx="92" cy="170" r="18" fill="#f59e0b" opacity=".55"/>
    <text x="120" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#713f12">Origina otra célula</text>
    <text x="120" y="304" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#713f12">en la levadura</text>
    <text x="120" y="329" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#713f12">aparece una yema</text>
  </g>
  <text x="450" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#475569">Este ejemplo muestra un organismo unicelular.</text>
  <text x="450" y="532" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#475569">En seres pluricelulares, las células trabajan de manera coordinada.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d"><title id="t">Comparar a la cría con el adulto</title><desc id="d">Dos columnas: lo que se parece, con dos círculos del mismo color, y lo que es distinto, con un círculo grande y uno pequeño.</desc><rect width="640" height="480" rx="24" fill="#FFF8EC"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#1E2A78">
<rect x="20" y="40" width="290" height="400" rx="20" fill="#E4F5E9"/><rect x="330" y="40" width="290" height="400" rx="20" fill="#FFE9DC"/>
<text x="165" y="95" font-size="36" font-weight="bold">Se parece</text><text x="475" y="95" font-size="36" font-weight="bold">Es distinto</text>
<circle cx="105" cy="225" r="45" fill="#A5703F"/><circle cx="215" cy="225" r="45" fill="#A5703F"/>
<circle cx="425" cy="215" r="60" fill="#A5703F"/><circle cx="530" cy="240" r="30" fill="#A5703F"/>
<text x="165" y="345" font-size="28">el mismo color,</text><text x="165" y="385" font-size="28">la misma forma</text>
<text x="475" y="345" font-size="28">el tamaño</text><text x="475" y="385" font-size="28">no es igual</text>
</g>
</svg>

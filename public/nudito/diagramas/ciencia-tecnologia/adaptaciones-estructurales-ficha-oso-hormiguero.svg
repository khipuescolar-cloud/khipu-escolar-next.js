<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Ficha del oso hormiguero de la selva: come hormigas del hormiguero, tiene garras fuertes de uñas largas y curvas y una lengua larga y delgada que sale de un hocico fino"><title>Ficha del oso hormiguero de la selva: come hormigas del hormiguero, tiene garras fuertes de uñas largas y curvas y una lengua larga y delgada que sale de un hocico fino</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><rect x="35" y="30" width="570" height="130" rx="14" fill="#E2F3F1" stroke="#0F7C7A" stroke-width="3"/><text x="320" y="80" font-family="sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="middle">Oso hormiguero de la selva</text><text x="320" y="125" font-family="sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="middle">come hormigas del hormiguero</text><rect x="35" y="190" width="570" height="110" rx="14" fill="#FBE3AE" stroke="#8A5A00" stroke-width="3"/><text x="320" y="238" font-family="sans-serif" font-size="30" font-weight="700" fill="#8A5A00" text-anchor="middle">Garras fuertes</text><text x="320" y="278" font-family="sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="middle">de uñas largas y curvas</text><rect x="35" y="330" width="570" height="110" rx="14" fill="#DCE6F7" stroke="#1E2A78" stroke-width="3"/><text x="320" y="378" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Lengua larga y delgada</text><text x="320" y="418" font-family="sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="middle">sale de un hocico fino</text></svg>

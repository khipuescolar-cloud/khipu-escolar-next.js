<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Todos los seres vivos están formados por células</title>
  <desc id="descripcion">Una levadura está formada por una célula. Una planta y un cóndor están formados por muchas células que trabajan juntas.</desc>
  <rect width="900" height="560" rx="28" fill="#f8fafc"/>
  <text x="450" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172554">La célula es la unidad de la vida</text>
  <g transform="translate(355 86)">
    <ellipse cx="95" cy="90" rx="94" ry="78" fill="#dbeafe" stroke="#2563eb" stroke-width="6"/>
    <ellipse cx="104" cy="91" rx="33" ry="29" fill="#a5b4fc" stroke="#4338ca" stroke-width="4"/>
    <circle cx="44" cy="63" r="9" fill="#14b8a6"/>
    <circle cx="57" cy="123" r="7" fill="#14b8a6"/>
    <circle cx="150" cy="54" r="8" fill="#14b8a6"/>
    <text x="95" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1e2a78">CÉLULA</text>
  </g>
  <path d="M450 302v40M450 342H170M450 342h280M170 342v35M450 342v35M730 342v35" fill="none" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
  <g transform="translate(60 382)">
    <ellipse cx="110" cy="53" rx="54" ry="45" fill="#fde68a" stroke="#b45309" stroke-width="5"/>
    <ellipse cx="149" cy="29" rx="24" ry="21" fill="#fef3c7" stroke="#b45309" stroke-width="4"/>
    <circle cx="99" cy="53" r="17" fill="#f59e0b" opacity=".55"/>
    <text x="110" y="126" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#713f12">Levadura</text>
    <text x="110" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#713f12">una célula</text>
  </g>
  <g transform="translate(350 380)">
    <path d="M100 4C28 31 25 92 100 121c75-29 72-90 0-117Z" fill="#86efac" stroke="#15803d" stroke-width="5"/>
    <path d="M100 13v103M100 59 66 39M100 76l37-24" fill="none" stroke="#15803d" stroke-width="4"/>
    <text x="100" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#14532d">Planta</text>
    <text x="100" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#14532d">muchas células</text>
  </g>
  <g transform="translate(620 378)">
    <path d="M25 77c42-52 89-57 128-35 18 10 35 9 58-4-12 26-31 43-58 48-38 8-76 5-128-9Z" fill="#a5b4fc" stroke="#3730a3" stroke-width="5"/>
    <path d="m38 78-19 34 44-24M180 52l26-24-8 34" fill="#a5b4fc" stroke="#3730a3" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="177" cy="48" r="4" fill="#172554"/>
    <text x="116" y="153" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#1e2a78">Cóndor</text>
    <text x="116" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#1e2a78">muchas células</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Orden de las tres erres: reducir, reutilizar y reciclar"><title>Orden de las tres erres: reducir, reutilizar y reciclar</title><rect width="640" height="480" fill="#FCF0D6"/><rect x="40" y="40" width="560" height="110" rx="20" fill="#0F7C7A"/><circle cx="105" cy="95" r="32" fill="#FCF0D6"/><text x="105" y="106" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">1</text><text x="160" y="90" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Reducir</text><text x="160" y="128" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#FFFFFF" text-anchor="start">Compra solo lo necesario</text><rect x="40" y="180" width="560" height="110" rx="20" fill="#F2B84B"/><circle cx="105" cy="235" r="32" fill="#FCF0D6"/><text x="105" y="246" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">2</text><text x="160" y="230" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="start">Reutilizar</text><text x="160" y="268" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="start">Usa otra vez lo que sirve</text><rect x="40" y="320" width="560" height="110" rx="20" fill="#1E2A78"/><circle cx="105" cy="375" r="32" fill="#FCF0D6"/><text x="105" y="386" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">3</text><text x="160" y="370" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="start">Reciclar</text><text x="160" y="408" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#FFFFFF" text-anchor="start">Residuos en productos nuevos</text></svg>

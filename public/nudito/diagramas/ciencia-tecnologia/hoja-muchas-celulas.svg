  </g>
  <path d="M342 260h102" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
  <path d="m427 243 22 17-22 17" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

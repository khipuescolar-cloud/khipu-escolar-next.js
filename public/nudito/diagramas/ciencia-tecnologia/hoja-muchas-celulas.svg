<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Una hoja está formada por muchas células</title>
  <desc id="descripcion">Una hoja de papa se amplía en un círculo. Dentro se observan numerosas células vegetales contiguas, cada una con pared, citoplasma y núcleo representados.</desc>

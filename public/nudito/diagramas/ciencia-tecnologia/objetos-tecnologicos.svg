<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-labelledby="t d"><title id="t">Una linterna resuelve la necesidad de ver en la oscuridad</title><desc id="d">Una linterna emite un haz de luz que ilumina un camino oscuro.</desc><rect width="760" height="320" rx="20" fill="#262C50"/><path d="M280 113l63 56-63 56-55-27v-58z" fill="#3A4BB5" stroke="#A9B5FF" stroke-width="5"/><rect x="129" y="136" width="102" height="68" rx="12" fill="#A9B5FF"/><path d="M342 169L670 76v186z" fill="#F2B84B" opacity=".55"/><path d="M365 260h302" stroke="#F4EEE4" stroke-width="6"/><circle cx="587" cy="237" r="17" fill="#F2B84B"/><g fill="white" font-family="Arial,sans-serif" font-size="22"><text x="65" y="58">Necesidad: ver</text><text x="84" y="271">Objeto: linterna</text><text x="464" y="58">Función: alumbrar</text></g></svg>
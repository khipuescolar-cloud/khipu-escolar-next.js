<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d"><title id="t">Tres lugares y el ecuador</title><desc id="d">Un globo terráqueo con el polo norte arriba, el polo sur abajo y el ecuador como línea punteada. Tres puntos marcan Pucallpa cerca del ecuador, Madrid al norte y una base polar cerca del polo sur.</desc><rect width="640" height="480" fill="#FFF8EC"/><circle cx="320" cy="250" r="170" fill="#DDEFFA" stroke="#1E2A78" stroke-width="4"/><path d="M150 250H490" stroke="#B3402F" stroke-width="5" stroke-dasharray="14 8"/><text x="320" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">Polo norte</text><text x="320" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">Polo sur</text><text x="20" y="238" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#B3402F">Ecuador</text><circle cx="220" cy="265" r="9" fill="#1E2A78"/><text x="236" y="274" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78">Pucallpa</text><circle cx="220" cy="174" r="9" fill="#1E2A78"/><text x="236" y="183" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78">Madrid</text><circle cx="235" cy="382" r="9" fill="#1E2A78"/><text x="251" y="391" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78">Base polar</text></svg>

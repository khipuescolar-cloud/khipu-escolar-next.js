<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres tarjetas: migrar es viajar a otro lugar, hibernar es dormir meses en el frío y vivir en grupo es vigilar y defenderse juntos"><title>Tres tarjetas: migrar es viajar a otro lugar, hibernar es dormir meses en el frío y vivir en grupo es vigilar y defenderse juntos</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><rect x="35" y="45" width="570" height="110" rx="14" fill="#E2F3F1" stroke="#0F7C7A" stroke-width="3"/><text x="320" y="93" font-family="sans-serif" font-size="30" font-weight="700" fill="#0F7C7A" text-anchor="middle">Migrar</text><text x="320" y="133" font-family="sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="middle">viajar a otro lugar</text><rect x="35" y="185" width="570" height="110" rx="14" fill="#FBE3AE" stroke="#8A5A00" stroke-width="3"/><text x="320" y="233" font-family="sans-serif" font-size="30" font-weight="700" fill="#8A5A00" text-anchor="middle">Hibernar</text><text x="320" y="273" font-family="sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="middle">dormir meses en el frío</text><rect x="35" y="325" width="570" height="110" rx="14" fill="#DCE6F7" stroke="#1E2A78" stroke-width="3"/><text x="320" y="373" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Vivir en grupo</text><text x="320" y="413" font-family="sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="middle">vigilar y defenderse juntos</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d"><title id="t">Tres funciones vitales</title><desc id="d">Tres cuadros: nutrición, que se relaciona con alimento, aire y desechos; relación, que recibe información y responde; y reproducción, que origina nuevos seres vivos.</desc><rect width="640" height="480" fill="#FFF8EC"/><rect x="30" y="30" width="580" height="120" rx="22" fill="#D8EFC9" stroke="#1E2A78" stroke-width="3"/><text x="320" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#1E2A78">Nutrición</text><text x="320" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">alimento, aire y desechos</text><rect x="30" y="178" width="580" height="120" rx="22" fill="#CFE8F5" stroke="#1E2A78" stroke-width="3"/><text x="320" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#1E2A78">Relación</text><text x="320" y="272" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">recibe información y responde</text><rect x="30" y="326" width="580" height="120" rx="22" fill="#FBE3B8" stroke="#1E2A78" stroke-width="3"/><text x="320" y="378" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#1E2A78">Reproducción</text><text x="320" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">origina nuevos seres vivos</text></svg>

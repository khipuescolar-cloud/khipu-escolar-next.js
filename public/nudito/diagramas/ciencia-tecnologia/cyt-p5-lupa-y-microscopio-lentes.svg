<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d"><title id="t">Lentes de un microscopio</title><desc id="d">Un ocular de 10 aumentos y tres objetivos de 4, 10 y 40 aumentos.</desc><rect width="640" height="480" rx="20" fill="#FBF6EA"/><text x="130" y="70" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1E2A78">Ocular</text><rect x="70" y="100" width="120" height="150" rx="14" fill="#8D98E0" stroke="#1E2A78" stroke-width="5"/><text x="130" y="195" font-family="Arial,sans-serif" font-size="44" font-weight="700" text-anchor="middle" fill="#1E2A78">10×</text><text x="450" y="70" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#1E2A78">Objetivos</text><rect x="310" y="100" width="60" height="70" rx="10" fill="#F2B84B" stroke="#1E2A78" stroke-width="5"/><text x="340" y="218" font-family="Arial,sans-serif" font-size="38" font-weight="700" text-anchor="middle" fill="#1E2A78">4×</text><rect x="420" y="100" width="60" height="100" rx="10" fill="#F2B84B" stroke="#1E2A78" stroke-width="5"/><text x="450" y="248" font-family="Arial,sans-serif" font-size="38" font-weight="700" text-anchor="middle" fill="#1E2A78">10×</text><rect x="530" y="100" width="60" height="135" rx="10" fill="#F2B84B" stroke="#1E2A78" stroke-width="5"/><text x="560" y="283" font-family="Arial,sans-serif" font-size="38" font-weight="700" text-anchor="middle" fill="#1E2A78">40×</text><text x="320" y="440" font-family="Arial,sans-serif" font-size="26" font-weight="400" text-anchor="middle" fill="#3A4BB5">Una muestra se mira por un ocular y un objetivo</text></svg>
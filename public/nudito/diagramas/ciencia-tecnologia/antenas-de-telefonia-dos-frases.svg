<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dos frases sobre las antenas: la primera dice que enferman porque lo dijo un tío; la segunda dice que un organismo de salud revisó estudios y no halló daño bajo los límites"><title>Dos frases sobre las antenas: la primera dice que enferman porque lo dijo un tío; la segunda dice que un organismo de salud revisó estudios y no halló daño bajo los límites</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><rect x="35" y="30" width="570" height="170" rx="14" fill="#E2F3F1" stroke="#0F7C7A" stroke-width="3"/><text x="320" y="75" font-family="sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="middle">Frase uno</text><text x="320" y="120" font-family="sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="middle">«Las antenas enferman,</text><text x="320" y="156" font-family="sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="middle">me lo dijo mi tío.»</text><rect x="35" y="224" width="570" height="226" rx="14" fill="#DCE6F7" stroke="#1E2A78" stroke-width="3"/><text x="320" y="269" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Frase dos</text><text x="320" y="314" font-family="sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="middle">«Un organismo de salud</text><text x="320" y="350" font-family="sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="middle">revisó estudios y no halló</text><text x="320" y="386" font-family="sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="middle">daño bajo los límites.»</text></svg>

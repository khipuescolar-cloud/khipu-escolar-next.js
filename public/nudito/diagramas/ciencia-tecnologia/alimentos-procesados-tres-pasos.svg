<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres pasos: mira si el alimento es fresco o procesado, lee la etiqueta buscando azúcar, sal y grasas, y piensa en el envase y la basura"><title>Tres pasos: mira si el alimento es fresco o procesado, lee la etiqueta buscando azúcar, sal y grasas, y piensa en el envase y la basura</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><rect x="35" y="24" width="570" height="133" rx="14" fill="#E2F3F1" stroke="#0F7C7A" stroke-width="3"/><text x="320" y="78" font-family="sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="middle">Mira el alimento</text><text x="320" y="118" font-family="sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="middle">¿es fresco o procesado?</text><rect x="35" y="173" width="570" height="133" rx="14" fill="#FBE3AE" stroke="#8A5A00" stroke-width="3"/><text x="320" y="227" font-family="sans-serif" font-size="30" font-weight="700" fill="#8A5A00" text-anchor="middle">Lee la etiqueta</text><text x="320" y="267" font-family="sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="middle">busca azúcar, sal y grasas</text><rect x="35" y="322" width="570" height="133" rx="14" fill="#DCE6F7" stroke="#1E2A78" stroke-width="3"/><text x="320" y="376" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Piensa en el envase</text><text x="320" y="416" font-family="sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="middle">¿qué basura deja?</text></svg>

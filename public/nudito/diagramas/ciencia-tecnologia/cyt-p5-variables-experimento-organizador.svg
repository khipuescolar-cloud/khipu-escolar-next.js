<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d"><title id="t">Tres tipos de variables</title><desc id="d">Tres cuadros: variable independiente lo que se cambia, dependiente lo que se mide y controladas lo que se mantiene igual.</desc><rect width="640" height="480" rx="20" fill="#FBF6EA"/><rect x="30" y="25" width="580" height="125" rx="18" fill="#FBE3C2" stroke="#1E2A78" stroke-width="5"/><text x="60" y="77" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1E2A78">Variable independiente</text><text x="60" y="120" font-family="Arial,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#3A4BB5">Lo que yo cambio</text><rect x="30" y="175" width="580" height="125" rx="18" fill="#D6EEF8" stroke="#1E2A78" stroke-width="5"/><text x="60" y="227" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1E2A78">Variable dependiente</text><text x="60" y="270" font-family="Arial,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#3A4BB5">Lo que yo mido</text><rect x="30" y="325" width="580" height="125" rx="18" fill="#E7F5D8" stroke="#1E2A78" stroke-width="5"/><text x="60" y="377" font-family="Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#1E2A78">Variables controladas</text><text x="60" y="420" font-family="Arial,sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#3A4BB5">Lo que mantengo igual</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres categorías: parque nacional protege ecosistemas completos, reserva nacional permite uso ordenado, santuario nacional protege una especie o lugar especial"><title>Tres categorías: parque nacional protege ecosistemas completos, reserva nacional permite uso ordenado, santuario nacional protege una especie o lugar especial</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><rect x="35" y="24" width="570" height="133" rx="14" fill="#E2F3F1" stroke="#0F7C7A" stroke-width="3"/><text x="320" y="78" font-family="sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="middle">Parque nacional</text><text x="320" y="118" font-family="sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="middle">protege ecosistemas completos</text><rect x="35" y="173" width="570" height="133" rx="14" fill="#FBE3AE" stroke="#8A5A00" stroke-width="3"/><text x="320" y="210" font-family="sans-serif" font-size="30" font-weight="700" fill="#8A5A00" text-anchor="middle">Reserva nacional</text><text x="320" y="250" font-family="sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="middle">permite un uso ordenado</text><text x="320" y="284" font-family="sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="middle">de los recursos</text><rect x="35" y="322" width="570" height="133" rx="14" fill="#DCE6F7" stroke="#1E2A78" stroke-width="3"/><text x="320" y="359" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Santuario nacional</text><text x="320" y="399" font-family="sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="middle">protege una especie</text><text x="320" y="433" font-family="sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="middle">o un lugar especial</text></svg>

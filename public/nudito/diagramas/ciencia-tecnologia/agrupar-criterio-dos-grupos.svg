<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dos círculos: uno para los seres vivos que sí cumplen el criterio y otro para los que no lo cumplen, cada uno con cinco puntos"><title>Dos círculos: uno para los seres vivos que sí cumplen el criterio y otro para los que no lo cumplen, cada uno con cinco puntos</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="60" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Un criterio, dos grupos</text><circle cx="170" cy="300" r="120" fill="#E2F3F1" stroke="#0F7C7A" stroke-width="4"/><circle cx="470" cy="300" r="120" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="170" y="150" font-family="sans-serif" font-size="28" font-weight="700" fill="#0F7C7A" text-anchor="middle">Sí lo cumplen</text><text x="470" y="150" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">No lo cumplen</text><circle cx="125" cy="270" r="16" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><circle cx="215" cy="270" r="16" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><circle cx="170" cy="320" r="16" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><circle cx="140" cy="370" r="16" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><circle cx="200" cy="370" r="16" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><circle cx="425" cy="270" r="16" fill="#C9CDE8" stroke="#1E2A78" stroke-width="3"/><circle cx="515" cy="270" r="16" fill="#C9CDE8" stroke="#1E2A78" stroke-width="3"/><circle cx="470" cy="320" r="16" fill="#C9CDE8" stroke="#1E2A78" stroke-width="3"/><circle cx="440" cy="370" r="16" fill="#C9CDE8" stroke="#1E2A78" stroke-width="3"/><circle cx="500" cy="370" r="16" fill="#C9CDE8" stroke="#1E2A78" stroke-width="3"/></svg>
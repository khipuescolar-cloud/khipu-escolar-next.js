<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Cinco pasos para un debate: escribe la pregunta, busca fuentes confiables, separa hechos de miedos, arma tu postura con dos razones y escucha y responde con datos"><title>Cinco pasos para un debate: escribe la pregunta, busca fuentes confiables, separa hechos de miedos, arma tu postura con dos razones y escucha y responde con datos</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><rect x="35" y="24" width="570" height="72" rx="14" fill="#E2F3F1" stroke="#0F7C7A" stroke-width="3"/><circle cx="82" cy="60" r="22" fill="#0F7C7A"/><text x="82" y="70" font-family="sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="122" y="70" font-family="sans-serif" font-size="26" font-weight="600" fill="#1E2A78" text-anchor="start">Escribe la pregunta del debate</text><rect x="35" y="112" width="570" height="72" rx="14" fill="#FBE3AE" stroke="#8A5A00" stroke-width="3"/><circle cx="82" cy="148" r="22" fill="#8A5A00"/><text x="82" y="158" font-family="sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="122" y="158" font-family="sans-serif" font-size="26" font-weight="600" fill="#1E2A78" text-anchor="start">Busca fuentes confiables</text><rect x="35" y="200" width="570" height="72" rx="14" fill="#DCE6F7" stroke="#1E2A78" stroke-width="3"/><circle cx="82" cy="236" r="22" fill="#1E2A78"/><text x="82" y="246" font-family="sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="122" y="246" font-family="sans-serif" font-size="26" font-weight="600" fill="#1E2A78" text-anchor="start">Separa hechos de miedos</text><rect x="35" y="288" width="570" height="72" rx="14" fill="#E2F3F1" stroke="#0F7C7A" stroke-width="3"/><circle cx="82" cy="324" r="22" fill="#0F7C7A"/><text x="82" y="334" font-family="sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><text x="122" y="334" font-family="sans-serif" font-size="26" font-weight="600" fill="#1E2A78" text-anchor="start">Arma tu postura con dos razones</text><rect x="35" y="376" width="570" height="72" rx="14" fill="#FBE3AE" stroke="#8A5A00" stroke-width="3"/><circle cx="82" cy="412" r="22" fill="#8A5A00"/><text x="82" y="422" font-family="sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><text x="122" y="422" font-family="sans-serif" font-size="26" font-weight="600" fill="#1E2A78" text-anchor="start">Escucha y responde con datos</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d"><title id="t">Las tres funciones básicas de una célula</title><desc id="d">Tres filas. Nutrición: una célula recibe sustancias que entran hacia ella. Relación: una señal en zigzag llega a una célula. Reproducción: una célula se divide y forma dos células nuevas.</desc><rect width="640" height="480" rx="20" fill="#F6F1E4"/><circle cx="190" cy="80" r="44" fill="#FBE0D4" stroke="#D9825B" stroke-width="5"/><circle cx="190" cy="80" r="15" fill="#8E7CC3"/><path d="M40 45L140 65" stroke="#3E8EBF" stroke-width="5" stroke-linecap="round"/><circle cx="40" cy="45" r="9" fill="#6AB8E0"/><path d="M40 80L134 80" stroke="#3E8EBF" stroke-width="5" stroke-linecap="round"/><circle cx="40" cy="80" r="9" fill="#6AB8E0"/><path d="M40 115L140 98" stroke="#3E8EBF" stroke-width="5" stroke-linecap="round"/><circle cx="40" cy="115" r="9" fill="#6AB8E0"/><text x="300" y="76" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="start">Nutrición</text><text x="300" y="112" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#1E2A78" text-anchor="start">Toma sustancias</text><path d="M20 160H620" stroke="#B9B09A" stroke-width="2" stroke-dasharray="6 6"/><circle cx="190" cy="240" r="44" fill="#FBE0D4" stroke="#D9825B" stroke-width="5"/><circle cx="190" cy="240" r="15" fill="#8E7CC3"/><path d="M40 190L90 235L65 238L125 290" fill="none" stroke="#E0A020" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><text x="300" y="236" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="start">Relación</text><text x="300" y="272" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#1E2A78" text-anchor="start">Capta una señal</text><text x="300" y="302" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#1E2A78" text-anchor="start">y responde</text><path d="M20 320H620" stroke="#B9B09A" stroke-width="2" stroke-dasharray="6 6"/><circle cx="95" cy="400" r="40" fill="#FBE0D4" stroke="#D9825B" stroke-width="5"/><circle cx="95" cy="400" r="14" fill="#8E7CC3"/><path d="M150 400H190" stroke="#4A4A4A" stroke-width="5" stroke-linecap="round"/><path d="M182 388L198 400L182 412" fill="none" stroke="#4A4A4A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="235" cy="400" r="30" fill="#FBE0D4" stroke="#D9825B" stroke-width="5"/><circle cx="235" cy="400" r="10" fill="#8E7CC3"/><circle cx="305" cy="400" r="30" fill="#FBE0D4" stroke="#D9825B" stroke-width="5"/><circle cx="305" cy="400" r="10" fill="#8E7CC3"/><text x="360" y="396" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="start">Reproducción</text><text x="360" y="432" font-family="Arial,sans-serif" font-size="26" font-weight="normal" fill="#1E2A78" text-anchor="start">Se divide en dos</text></svg>
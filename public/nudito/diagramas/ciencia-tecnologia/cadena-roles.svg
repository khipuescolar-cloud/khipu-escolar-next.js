<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d"><title id="t">Roles en una cadena alimenticia</title><desc id="d">Una cadena de arriba hacia abajo: la hierba, productor, es comida por el saltamontes, consumidor, y este por la rana, consumidor. Aparte, los hongos descomponen restos.</desc><rect width="640" height="480" fill="#FFF8EC"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E2A78"/></marker></defs><rect x="30" y="20" width="290" height="70" rx="18" fill="#D8EFC9" stroke="#1E2A78" stroke-width="3"/><text x="175" y="66" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1E2A78">Hierba</text><text x="345" y="66" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">productor</text><path d="M175 94V134" stroke="#1E2A78" stroke-width="5" marker-end="url(#a)"/><rect x="30" y="140" width="290" height="70" rx="18" fill="#FBE3B8" stroke="#1E2A78" stroke-width="3"/><text x="175" y="186" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1E2A78">Saltamontes</text><text x="345" y="186" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">consumidor</text><path d="M175 214V254" stroke="#1E2A78" stroke-width="5" marker-end="url(#a)"/><rect x="30" y="260" width="290" height="70" rx="18" fill="#CFE8F5" stroke="#1E2A78" stroke-width="3"/><text x="175" y="306" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1E2A78">Rana</text><text x="345" y="306" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">consumidor</text><path d="M20 372H620" stroke="#8A8F9E" stroke-width="3" stroke-dasharray="10 8"/><rect x="30" y="395" width="120" height="64" rx="18" fill="#E7DCCB" stroke="#1E2A78" stroke-width="3"/><text x="90" y="437" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">Restos</text><path d="M156 427H210" stroke="#1E2A78" stroke-width="4" marker-end="url(#a)"/><rect x="222" y="395" width="150" height="64" rx="18" fill="#E7C9E3" stroke="#1E2A78" stroke-width="3"/><text x="297" y="437" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78">Hongos</text><text x="385" y="437" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">descomponedor</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d"><title id="t">Tres pasos para reconocer una adaptación</title><desc id="d">Tres cuadros en columna unidos por flechas hacia abajo: mira el hábitat, observa la característica y pregunta qué problema resuelve.</desc><rect width="640" height="480" fill="#FFF8EC"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E2A78"/></marker></defs><rect x="40" y="30" width="560" height="100" rx="22" fill="#CFE8F5" stroke="#1E2A78" stroke-width="3"/><text x="320" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1E2A78">Mira el hábitat</text><path d="M320 134V174" stroke="#1E2A78" stroke-width="5" marker-end="url(#a)"/><rect x="40" y="180" width="560" height="100" rx="22" fill="#D8EFC9" stroke="#1E2A78" stroke-width="3"/><text x="320" y="242" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1E2A78">Observa la característica</text><path d="M320 284V324" stroke="#1E2A78" stroke-width="5" marker-end="url(#a)"/><rect x="40" y="330" width="560" height="100" rx="22" fill="#FBE3B8" stroke="#1E2A78" stroke-width="3"/><text x="320" y="392" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1E2A78">Pregunta qué problema resuelve</text></svg>

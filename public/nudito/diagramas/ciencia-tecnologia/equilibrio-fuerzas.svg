<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d"><title id="t">Fuerzas iguales y fuerzas distintas</title><desc id="d">Arriba, un bloque con dos flechas largas iguales hacia lados opuestos. Abajo, un bloque con una flecha larga a la izquierda y una corta a la derecha.</desc><rect width="640" height="480" fill="#FFF8EC"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E2A78"/></marker></defs><text x="320" y="44" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1E2A78">Fuerzas iguales y opuestas</text><rect x="250" y="80" width="140" height="90" rx="12" fill="#D8EFC9" stroke="#1E2A78" stroke-width="3"/><path d="M246 125H70" stroke="#1E2A78" stroke-width="10" marker-end="url(#a)"/><path d="M394 125H570" stroke="#1E2A78" stroke-width="10" marker-end="url(#a)"/><text x="320" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">se compensan: sigue quieto</text><path d="M20 250H620" stroke="#8A8F9E" stroke-width="3" stroke-dasharray="10 8"/><text x="320" y="296" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1E2A78">Fuerzas distintas</text><rect x="250" y="330" width="140" height="90" rx="12" fill="#FBE3B8" stroke="#1E2A78" stroke-width="3"/><path d="M246 375H70" stroke="#B3402F" stroke-width="10" marker-end="url(#a)"/><path d="M394 375H470" stroke="#1E2A78" stroke-width="10" marker-end="url(#a)"/><text x="320" y="464" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">se mueve hacia la fuerza mayor</text></svg>

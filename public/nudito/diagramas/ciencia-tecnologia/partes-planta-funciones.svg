<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d"><title id="t">Partes de una planta y su función</title><desc id="d">Una planta de maíz con hojas, tallo y raíz bajo la tierra; cada parte tiene una frase que dice qué hace.</desc><rect width="640" height="480" rx="24" fill="#FFF8EC"/><g font-family="Arial,sans-serif" fill="#1E2A78">
<rect x="0" y="300" width="640" height="180" fill="#C69B6D"/><rect x="0" y="296" width="640" height="8" fill="#7A5A3A"/>

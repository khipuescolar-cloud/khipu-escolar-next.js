<path d="M130 190q-90-10-100-80q80 0 100 80zM130 150q90-20 100-90q-85 10-100 90z" fill="#3CB371"/>
<g stroke="#6B4A2B" stroke-width="8" stroke-linecap="round" fill="none"><path d="M130 304v80M130 320q-50 20-70 70M130 320q50 20 70 70M130 350q-20 30-25 70M130 350q20 30 25 70"/></g>
<g font-size="28"><text x="290" y="110" font-weight="bold">Hojas</text><text x="290" y="145">reciben la luz</text>

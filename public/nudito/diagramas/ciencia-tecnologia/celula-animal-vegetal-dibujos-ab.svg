<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d"><title id="t">Dos dibujos de células rotulados A y B</title><desc id="d">El dibujo A es una célula rectangular con una cubierta gruesa verde, núcleo y varios puntos verdes ovalados. El dibujo B es una célula redondeada con una membrana delgada y un núcleo.</desc><rect width="640" height="480" rx="20" fill="#F6F1E4"/><rect x="40" y="110" width="260" height="290" rx="26" fill="#E4F1D5" stroke="#4E8F3F" stroke-width="18"/><rect x="58" y="128" width="224" height="254" rx="14" fill="#FFF4D6" stroke="#D9825B" stroke-width="3"/><circle cx="170" cy="255" r="34" fill="#8E7CC3" stroke="#5E4E9A" stroke-width="3"/><ellipse cx="100" cy="170" rx="20" ry="12" fill="#3E9B3E" stroke="#2A6B2A" stroke-width="2"/><ellipse cx="235" cy="175" rx="20" ry="12" fill="#3E9B3E" stroke="#2A6B2A" stroke-width="2"/><ellipse cx="110" cy="340" rx="20" ry="12" fill="#3E9B3E" stroke="#2A6B2A" stroke-width="2"/><ellipse cx="240" cy="335" rx="20" ry="12" fill="#3E9B3E" stroke="#2A6B2A" stroke-width="2"/><ellipse cx="180" cy="160" rx="20" ry="12" fill="#3E9B3E" stroke="#2A6B2A" stroke-width="2"/><path d="M360 250C360 150 430 110 500 112C570 114 610 170 606 255C602 340 560 392 490 394C420 396 360 350 360 250Z" fill="#FBE0D4" stroke="#D9825B" stroke-width="5"/><circle cx="486" cy="252" r="34" fill="#8E7CC3" stroke="#5E4E9A" stroke-width="3"/><text x="170" y="66" font-family="Arial,sans-serif" font-size="40" font-weight="bold" fill="#1E2A78" text-anchor="middle">Dibujo A</text><text x="485" y="66" font-family="Arial,sans-serif" font-size="40" font-weight="bold" fill="#1E2A78" text-anchor="middle">Dibujo B</text></svg>
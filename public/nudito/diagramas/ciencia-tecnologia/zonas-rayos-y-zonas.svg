<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d"><title id="t">Rayos del Sol y zonas climáticas</title><desc id="d">Rayos del Sol llegan desde la izquierda a un globo terráqueo. En el ecuador llegan rectos y, hacia los polos, más inclinados. El borde del globo tiene una franja cálida central, dos templadas y dos polares.</desc><rect width="640" height="480" fill="#FFF8EC"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E2A78"/></marker></defs><circle cx="430" cy="240" r="170" fill="#F3F8FB" stroke="#1E2A78" stroke-width="3"/><path d="M274.1 307.8A170 170 0 0 1 274.1 172.2" fill="none" stroke="#E8892B" stroke-width="20"/><path d="M274.1 172.2A170 170 0 0 1 362.2 84.1" fill="none" stroke="#6DB36B" stroke-width="20"/><path d="M362.2 395.9A170 170 0 0 1 274.1 307.8" fill="none" stroke="#6DB36B" stroke-width="20"/><path d="M362.2 84.1A170 170 0 0 1 430.0 70.0" fill="none" stroke="#5AA7D6" stroke-width="20"/><path d="M430.0 410.0A170 170 0 0 1 362.2 395.9" fill="none" stroke="#5AA7D6" stroke-width="20"/><path d="M30 240.0H234.0" stroke="#E5B000" stroke-width="7" marker-end="url(#a)"/><path d="M30 119.8H283.8" stroke="#E5B000" stroke-width="7" marker-end="url(#a)"/><path d="M30 72.6H374.5" stroke="#E5B000" stroke-width="7" marker-end="url(#a)"/><text x="20" y="196" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Rayos del Sol</text><text x="360" y="249" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Zona cálida</text><text x="380" y="160" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Zona templada</text><text x="440" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Zona polar</text><text x="320" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Una cálida, dos templadas y dos polares</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Una levadura es un organismo de una sola célula</title>
  <desc id="descripcion">Una célula de levadura toma nutrientes de la masa, responde a su ambiente y puede originar otra célula mediante una yema.</desc>
  <rect width="900" height="560" rx="28" fill="#fff7ed"/>
  <text x="450" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#713f12">Una célula puede ser un organismo completo</text>
  <g transform="translate(250 96)">
    <ellipse cx="200" cy="190" rx="170" ry="145" fill="#fef3c7" stroke="#b45309" stroke-width="9"/>
    <ellipse cx="337" cy="95" rx="76" ry="67" fill="#fde68a" stroke="#b45309" stroke-width="8"/>
    <ellipse cx="190" cy="190" rx="60" ry="53" fill="#f59e0b" opacity=".52" stroke="#b45309" stroke-width="5"/>
    <circle cx="89" cy="143" r="15" fill="#fb7185" opacity=".8"/>
    <circle cx="125" cy="269" r="13" fill="#14b8a6" opacity=".8"/>
    <circle cx="272" cy="267" r="16" fill="#14b8a6" opacity=".8"/>
    <circle cx="282" cy="139" r="12" fill="#fb7185" opacity=".8"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#713f12">
    <text x="120" y="160" font-size="22" font-weight="700">Nutrientes</text>
    <text x="112" y="188" font-size="18">entran desde la masa</text>
    <text x="675" y="164" font-size="22" font-weight="700">Yema</text>
    <text x="650" y="192" font-size="18">puede formar otra célula</text>
    <text x="450" y="518" text-anchor="middle" font-size="23" font-weight="700">Levadura = organismo unicelular</text>
  </g>
  <path d="M250 174H190M190 174l18-13m-18 13 18 13M650 179l-68-30M582 149l11-17m-11 17 20 1" fill="none" stroke="#9a3412" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

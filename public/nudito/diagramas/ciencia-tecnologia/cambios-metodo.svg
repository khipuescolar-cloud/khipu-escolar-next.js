<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d"><title id="t">Preguntar si un cambio puede deshacerse</title><desc id="d">Un cuadro Antes lleva con una flecha a un cuadro Después. Una flecha punteada regresa del Después al Antes con la pregunta si puede volver al inicio.</desc><rect width="640" height="480" fill="#FFF8EC"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1E2A78"/></marker></defs><rect x="30" y="60" width="230" height="130" rx="22" fill="#CFE8F5" stroke="#1E2A78" stroke-width="3"/><text x="145" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#1E2A78">Antes</text><rect x="380" y="60" width="230" height="130" rx="22" fill="#FBE3B8" stroke="#1E2A78" stroke-width="3"/><text x="495" y="138" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#1E2A78">Después</text><path d="M266 125H374" stroke="#1E2A78" stroke-width="6" marker-end="url(#a)"/><text x="320" y="92" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">cambio</text><path d="M495 200C495 330 145 330 145 204" fill="none" stroke="#B3402F" stroke-width="6" stroke-dasharray="14 10" marker-end="url(#a)"/><text x="320" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#B3402F">¿Puede volver al inicio?</text><text x="320" y="436" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Si vuelve el mismo material, es reversible</text></svg>

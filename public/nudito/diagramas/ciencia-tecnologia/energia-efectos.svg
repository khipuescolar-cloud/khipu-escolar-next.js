<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="t d"><title id="t">Del efecto a la forma de energía</title><desc id="d">Cuatro filas relacionan un efecto con su forma de energía: luz con energía luminosa, calor con térmica, sonido con sonora y movimiento con energía de movimiento.</desc><rect width="640" height="480" fill="#FFF8EC"/><rect x="30" y="24" width="580" height="88" rx="20" fill="#FFE9A8" stroke="#1E2A78" stroke-width="3"/><text x="60" y="80" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1E2A78">Luz</text><text x="248" y="80" font-family="Arial,sans-serif" font-size="30" fill="#1E2A78">→</text><text x="292" y="80" font-family="Arial,sans-serif" font-size="27" fill="#1E2A78">energía luminosa</text><rect x="30" y="136" width="580" height="88" rx="20" fill="#FAC9B8" stroke="#1E2A78" stroke-width="3"/><text x="60" y="192" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1E2A78">Calor</text><text x="248" y="192" font-family="Arial,sans-serif" font-size="30" fill="#1E2A78">→</text><text x="292" y="192" font-family="Arial,sans-serif" font-size="27" fill="#1E2A78">energía térmica</text><rect x="30" y="248" width="580" height="88" rx="20" fill="#CFE8F5" stroke="#1E2A78" stroke-width="3"/><text x="60" y="304" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1E2A78">Sonido</text><text x="248" y="304" font-family="Arial,sans-serif" font-size="30" fill="#1E2A78">→</text><text x="292" y="304" font-family="Arial,sans-serif" font-size="27" fill="#1E2A78">energía sonora</text><rect x="30" y="360" width="580" height="88" rx="20" fill="#D8EFC9" stroke="#1E2A78" stroke-width="3"/><text x="60" y="416" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1E2A78">Movimiento</text><text x="248" y="416" font-family="Arial,sans-serif" font-size="30" fill="#1E2A78">→</text><text x="292" y="416" font-family="Arial,sans-serif" font-size="27" fill="#1E2A78">energía de movimiento</text></svg>

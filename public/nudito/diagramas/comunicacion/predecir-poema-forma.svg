<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Un texto en líneas cortas</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="50" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Mira cómo está escrito</text>
<rect x="130" y="70" width="380" height="300" rx="14" fill="#FFFFFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="320.0" y="133" font-size="26" font-weight="bold" fill="#1B1F2A" text-anchor="middle">Canto al amanecer</text>
<text x="320.0" y="181" font-size="26" fill="#1B1F2A" text-anchor="middle">Canta el gallo,</text>
<text x="320.0" y="229" font-size="26" fill="#1B1F2A" text-anchor="middle">ya sale el sol</text>
<text x="320.0" y="277" font-size="26" fill="#1B1F2A" text-anchor="middle">y el cerro se viste</text>
<text x="320.0" y="325" font-size="26" fill="#1B1F2A" text-anchor="middle">de color.</text>
<rect x="20" y="386" width="600" height="80" rx="14" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/>
<text x="320.0" y="436" font-size="28" font-weight="bold" fill="#1B1F2A" text-anchor="middle">¿Qué texto parece?</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Separar dos oraciones con punto y mayúscula</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="50" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Dos ideas, dos oraciones</text>
<rect x="20" y="76" width="600" height="150" rx="14" fill="#FBEAEA" stroke="#B91C1C" stroke-width="3"/>
<text x="320.0" y="124" font-size="26" font-weight="bold" fill="#8A1414" text-anchor="middle">Antes</text>
<text x="320.0" y="160" font-size="26" fill="#8A1414" text-anchor="middle">Pedro guardó su lápiz luego</text>
<text x="320.0" y="196" font-size="26" fill="#8A1414" text-anchor="middle">salió al patio</text>
<circle cx="52" cy="106" r="17" fill="#B91C1C"/><path d="M45 99 L59 113 M59 99 L45 113" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
<line x1="320" y1="234" x2="320" y2="276" stroke="#1E2A78" stroke-width="5" stroke-linecap="round"/>
<polygon points="320,276 312,262 328,262" fill="#1E2A78"/>
<rect x="20" y="286" width="600" height="170" rx="14" fill="#E3F3E1" stroke="#2F7D32" stroke-width="3"/>
<text x="320.0" y="344" font-size="26" font-weight="bold" fill="#1B5E20" text-anchor="middle">Después</text>
<text x="320.0" y="380" font-size="26" fill="#1B5E20" text-anchor="middle">Pedro guardó su lápiz.</text>
<text x="320.0" y="416" font-size="26" fill="#1B5E20" text-anchor="middle">Luego salió al patio.</text>
<circle cx="52" cy="314" r="17" fill="#2F7D32"/><path d="M44 314 L50 321 L61 307" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Dos frases para pedir un libro a la profesora</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="14" width="600" height="68" rx="14" fill="#FCF0D6" stroke="#FCF0D6" stroke-width="3"/><text x="320.0" y="58" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">Quieres pedir un libro a la profesora.</text><rect x="20" y="98" width="600" height="68" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="320.0" y="142" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">Oye, dame eso.</text><rect x="20" y="182" width="600" height="108" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="320.0" y="226" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">Profesora, ¿me presta el libro,</text><text x="320.0" y="266" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">por favor?</text><rect x="20" y="306" width="600" height="68" rx="14" fill="#FFE9A8" stroke="#1E2A78" stroke-width="3"/><text x="320.0" y="350" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">¿Qué le dices a la profesora?</text>
</svg>

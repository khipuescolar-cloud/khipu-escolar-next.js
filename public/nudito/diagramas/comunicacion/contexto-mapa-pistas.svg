<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Las pistas rodean la palabra nueva</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="14" width="600" height="86" rx="14" fill="#FFE9A8" stroke="#1E2A78" stroke-width="5"/>
<text x="320" y="68" fill="#1E2A78" font-size="26" font-weight="bold" text-anchor="middle">Palabra nueva: ?</text>
<rect x="70" y="124" width="550" height="70" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="92" y="170" fill="#1E2A78" font-size="26" text-anchor="start">Una acción que se cuenta</text>
<rect x="70" y="212" width="550" height="70" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="92" y="258" fill="#1E2A78" font-size="26" text-anchor="start">Un ejemplo cercano</text>
<rect x="70" y="300" width="550" height="70" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="92" y="346" fill="#1E2A78" font-size="26" text-anchor="start">Una explicación al lado</text>
<rect x="70" y="388" width="550" height="70" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="92" y="434" fill="#1E2A78" font-size="26" text-anchor="start">Un opuesto: «pero», «no como»</text>
<path d="M36 450 V120 M24 134 L36 116 L48 134" fill="none" stroke="#3A4BB5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Carta de Mateo con saludo y despedida por completar</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="30" y="16" width="580" height="448" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/><text x="60" y="62" text-anchor="start" font-size="26" fill="#1E2A78">Lima, 12 de junio de 2026</text><rect x="60" y="82" width="340" height="56" rx="14" fill="#FFD966" stroke="#1E2A78" stroke-width="3"/><text x="230" y="119" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E2A78">Saludo: ?</text><text x="60" y="186" text-anchor="start" font-size="26" fill="#1E2A78">Mi equipo de vóley llegó a la</text><text x="60" y="222" text-anchor="start" font-size="26" fill="#1E2A78">final. ¡Ven a verme jugar el sábado!</text><rect x="60" y="250" width="340" height="56" rx="14" fill="#FFD966" stroke="#1E2A78" stroke-width="3"/><text x="230" y="287" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E2A78">Despedida: ?</text><text x="60" y="356" text-anchor="start" font-size="26" fill="#1E2A78">Mateo</text><text x="60" y="426" text-anchor="start" font-size="26" font-weight="bold" fill="#1E2A78">Para: su tía Rosa, de Tacna</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Revisión de un texto corto sobre mi barrio</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="50" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Revisa tu texto</text>
<rect x="20" y="76" width="600" height="270" rx="14" fill="#FFFFFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="320.0" y="154" font-size="26" font-weight="bold" fill="#1B1F2A" text-anchor="middle">Mi barrio</text>
<text x="320.0" y="198" font-size="26" fill="#1B1F2A" text-anchor="middle">Mi barrio tiene un parque grande.</text>
<text x="320.0" y="242" font-size="26" fill="#1B1F2A" text-anchor="middle">Allí juego con mis primos.</text>
<text x="320.0" y="286" font-size="26" fill="#1B1F2A" text-anchor="middle">Los domingos vamos a la feria.</text>
<rect x="20" y="366" width="600" height="84" rx="14" fill="#E3F3E1" stroke="#2F7D32" stroke-width="3"/>
<text x="320.0" y="417" font-size="26" font-weight="bold" fill="#1B5E20" text-anchor="middle">Todas hablan de mi barrio</text>
<circle cx="52" cy="408" r="17" fill="#2F7D32"/><path d="M44 408 L50 415 L61 401" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Lo que el texto dice y lo que no dice</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="16" width="600" height="104" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#1E2A78" font-size="26">
<text x="320" y="60">Don Raúl pesca en el lago</text><text x="320" y="98">Titicaca con su hijo.</text>
<text x="320" y="164" font-weight="bold">¿Con quién pesca don Raúl?</text></g>
<rect x="20" y="190" width="600" height="124" rx="14" fill="#E3F3E1" stroke="#2F7D32" stroke-width="4"/>
<text x="320" y="238" text-anchor="middle" fill="#1B5E20" font-family="Arial,sans-serif" font-size="28" font-weight="bold">Está escrito</text>
<text x="320" y="284" text-anchor="middle" fill="#1B5E20" font-family="Arial,sans-serif" font-size="26">con su hijo</text>
<rect x="20" y="334" width="600" height="124" rx="14" fill="#fff" stroke="#777" stroke-width="4" stroke-dasharray="10 8"/>
<text x="320" y="382" text-anchor="middle" fill="#444" font-family="Arial,sans-serif" font-size="28" font-weight="bold">No está escrito</text>
<text x="320" y="428" text-anchor="middle" fill="#444" font-family="Arial,sans-serif" font-size="26">cuántos peces sacó</text>
</svg>

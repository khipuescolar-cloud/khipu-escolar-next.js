<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Dos oraciones de una reseña para clasificar</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="12" width="600" height="200" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="52" text-anchor="start" font-size="26" font-weight="bold" fill="#1E2A78">1. La feria del libro de Piura</text><text x="40" y="90" text-anchor="start" font-size="26" font-weight="bold" fill="#1E2A78">se realizó del 12 al 15 de junio.</text><rect x="40" y="116" width="560" height="68" rx="14" fill="#FFD966" stroke="#1E2A78" stroke-width="3"/><text x="320" y="160" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E2A78">¿Hecho u opinión?</text><rect x="20" y="240" width="600" height="224" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="284" text-anchor="start" font-size="26" font-weight="bold" fill="#1E2A78">2. Fue la mejor feria de todas.</text><rect x="40" y="330" width="560" height="68" rx="14" fill="#FFD966" stroke="#1E2A78" stroke-width="3"/><text x="320" y="374" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E2A78">¿Hecho u opinión?</text>
</g>
</svg>

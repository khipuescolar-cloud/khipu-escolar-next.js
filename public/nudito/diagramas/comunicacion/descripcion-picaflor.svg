<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Detalles del picaflor</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="14" width="600" height="76" rx="14" fill="#FFE9A8" stroke="#1E2A78" stroke-width="5"/>
<text x="320" y="65" fill="#1E2A78" font-size="26" font-weight="bold" text-anchor="middle">El picaflor</text>
<rect x="20" y="106" width="600" height="76" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="44" y="156" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="start">Tamaño</text>
<text x="250" y="156" fill="#1E2A78" font-size="26" text-anchor="start">pequeño</text>
<rect x="20" y="196" width="600" height="76" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="44" y="246" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="start">Color</text>
<text x="250" y="246" fill="#1E2A78" font-size="26" text-anchor="start">plumas verdes</text>
<rect x="20" y="286" width="600" height="76" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="44" y="336" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="start">Forma</text>
<text x="250" y="336" fill="#1E2A78" font-size="26" text-anchor="start">pico largo y delgado</text>
<rect x="20" y="376" width="600" height="76" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="44" y="426" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="start">Se mueve</text>
<text x="250" y="426" fill="#1E2A78" font-size="26" text-anchor="start">vuela muy rápido</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Expresión agua al cuello con la situación de doña Rosa</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="16" width="600" height="122" rx="14" fill="#FFE9A8" stroke="#1E2A78" stroke-width="3"/><text x="320" y="68" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">Doña Rosa dice:</text><text x="320" y="112" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#1E2A78" text-anchor="middle">«Hoy estoy con el agua al cuello.»</text><text x="320" y="182" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78" text-anchor="middle">Situación: hoy hay muchos clientes.</text><rect x="20" y="214" width="600" height="110" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="320" y="266" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">¿Habla del agua de verdad?</text><text x="320" y="306" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">Mira la situación.</text><rect x="20" y="350" width="600" height="100" rx="14" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="320" y="412" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">¿Qué quiere decir?</text>
</svg>

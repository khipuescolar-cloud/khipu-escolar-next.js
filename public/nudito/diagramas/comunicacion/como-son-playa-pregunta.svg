<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Busca las pistas</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="46" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Busca las pistas</text>
<rect x="24" y="70" width="592" height="142" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/>
<text x="44" y="112" font-size="28" fill="#1E2A78" text-anchor="start">Pedro llegó a la playa. El sol</text>
<text x="44" y="150" font-size="28" fill="#1E2A78" text-anchor="start">brillaba fuerte y la arena quemaba</text>
<text x="44" y="188" font-size="28" fill="#1E2A78" text-anchor="start">sus pies.</text>
<rect x="24" y="232" width="592" height="66" rx="14" fill="#FFF3D1" stroke="#F2B84B" stroke-width="3"/>
<text x="44" y="274" font-size="28" font-weight="bold" fill="#8A5A00" text-anchor="start">¿Cómo está la arena?</text>
</svg>

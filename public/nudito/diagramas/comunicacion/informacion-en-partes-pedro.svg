<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Tres partes de un texto sobre el día de Pedro</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif" fill="#1E2A78" font-size="26">
<text x="320" y="42" text-anchor="middle" font-weight="bold">¿Qué hace Pedro al atardecer?</text>
<rect x="20" y="64" width="600" height="120" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="44" y="112" font-weight="bold" fill="#3A4BB5">Inicio · al amanecer</text><text x="44" y="154">ordeña las vacas</text>
<rect x="20" y="196" width="600" height="120" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="44" y="244" font-weight="bold" fill="#3A4BB5">Medio · al mediodía</text><text x="44" y="286">almuerza</text>
<rect x="20" y="328" width="600" height="120" rx="14" fill="#FFE9A8" stroke="#1E2A78" stroke-width="6"/>
<text x="44" y="376" font-weight="bold">Final · al atardecer</text><text x="44" y="418">guarda las ovejas</text></g>
</svg>

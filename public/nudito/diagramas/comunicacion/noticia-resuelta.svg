<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Titular y entrada de la noticia con los datos marcados</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="12" width="600" height="456" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="40" y="50" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#3A4BB5">Titular (noticia imaginaria)</text>
<text x="40" y="90" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1E2A78">Alumnos de Tacna presentan 40</text>
<text x="40" y="126" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1E2A78">proyectos en feria de ciencias</text>
<text x="40" y="186" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#3A4BB5">Entrada</text>
<text x="40" y="228" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78"><tspan fill="#B4361F" font-weight="bold">El jueves por la mañana,</tspan> <tspan fill="#1F7A4D" font-weight="bold">estudiantes</tspan></text>
<text x="40" y="262" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78"><tspan fill="#1F7A4D" font-weight="bold">de sexto grado del colegio Santa Rosa,</tspan></text>
<text x="40" y="296" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78"><tspan fill="#7A2E9E" font-weight="bold">de Tacna,</tspan> <tspan fill="#9A5A00" font-weight="bold">presentaron 40 proyectos</tspan></text>
<text x="40" y="330" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78"><tspan fill="#9A5A00" font-weight="bold">en su feria de ciencias.</tspan></text>
<text x="40" y="420" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#B4361F">Cuándo</text>
<text x="196" y="420" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1F7A4D">Quién</text>
<text x="322" y="420" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#7A2E9E">Dónde</text>
<text x="452" y="420" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#9A5A00">Qué</text>
</svg>

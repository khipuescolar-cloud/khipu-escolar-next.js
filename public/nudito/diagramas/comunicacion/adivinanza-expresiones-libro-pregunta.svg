<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Adivinanza con tres pistas sobre hojas, lomo e historias</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="20" width="600" height="90" rx="14" fill="#FCF0D6" stroke="#FCF0D6" stroke-width="3"/><text x="320" y="76" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Pistas de la adivinanza:</text><rect x="20" y="124" width="600" height="72" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="320" y="172" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">Tiene hojas y no es árbol.</text><rect x="20" y="208" width="600" height="72" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="320" y="256" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">Tiene lomo y no es caballo.</text><rect x="20" y="292" width="600" height="72" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="320" y="340" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">Te cuenta mil historias.</text><rect x="20" y="384" width="600" height="80" rx="14" fill="#FFE9A8" stroke="#1E2A78" stroke-width="3"/><text x="320" y="436" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">¿Qué es?</text>
</svg>

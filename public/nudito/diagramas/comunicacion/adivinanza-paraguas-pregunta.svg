<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Otra adivinanza</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="46" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Otra adivinanza</text>
<g transform="translate(0,36)">
<rect x="24" y="72" width="592" height="142" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/>
<text x="44" y="116" font-size="28" fill="#1E2A78" text-anchor="start">Me abro como una flor y no</text>
<text x="44" y="154" font-size="28" fill="#1E2A78" text-anchor="start">tengo pétalos; cuando llueve,</text>
<text x="44" y="192" font-size="28" fill="#1E2A78" text-anchor="start">te protejo.</text>
<rect x="24" y="234" width="592" height="66" rx="14" fill="#FFF3D1" stroke="#F2B84B" stroke-width="3"/>
<text x="44" y="278" font-size="28" font-weight="bold" fill="#8A5A00" text-anchor="start">¿Qué soy?</text>
</g>
</svg>

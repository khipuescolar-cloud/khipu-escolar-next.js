<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>El párrafo y la tabla se completan para responder</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="14" width="600" height="128" rx="14" fill="#DCE4FF" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="56" text-anchor="start" font-size="28" font-weight="bold" fill="#1E2A78">El párrafo</text><text x="40" y="96" text-anchor="start" font-size="26" fill="#1E2A78">cuenta la situación y da</text><text x="40" y="130" text-anchor="start" font-size="26" fill="#1E2A78">reglas, nombres o precios</text><rect x="20" y="158" width="600" height="128" rx="14" fill="#DCE4FF" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="200" text-anchor="start" font-size="28" font-weight="bold" fill="#1E2A78">La tabla o el gráfico</text><text x="40" y="240" text-anchor="start" font-size="26" fill="#1E2A78">ordena cantidades, horas</text><text x="40" y="274" text-anchor="start" font-size="26" fill="#1E2A78">o nombres</text><path d="M320 290 L320 310" stroke="#1E2A78" stroke-width="5" fill="none"/><path d="M308 306 L320 320 L332 306 Z" fill="#1E2A78"/><rect x="20" y="324" width="600" height="142" rx="14" fill="#FFD966" stroke="#1E2A78" stroke-width="3"/><text x="40" y="366" text-anchor="start" font-size="28" font-weight="bold" fill="#1E2A78">La respuesta</text><text x="40" y="406" text-anchor="start" font-size="26" fill="#1E2A78">junta los datos de ambas partes</text><text x="40" y="442" text-anchor="start" font-size="26" fill="#1E2A78">que la pregunta necesita</text>
</g>
</svg>

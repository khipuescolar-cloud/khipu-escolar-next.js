<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>la casa con un espacio para el adjetivo</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="24" width="600" height="120" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="320" y="100" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="#1E2A78" text-anchor="middle">la casa ____</text><rect x="20" y="176" width="600" height="100" rx="14" fill="#FCF0D6" stroke="#0F7C7A" stroke-width="3"/><text x="320" y="238" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Una casa que mide mucho.</text><rect x="20" y="308" width="600" height="128" rx="14" fill="#FFE9A8" stroke="#1E2A78" stroke-width="3"/><text x="320" y="360" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">Busca una palabra que diga</text><text x="320" y="400" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">cómo es la casa.</text>

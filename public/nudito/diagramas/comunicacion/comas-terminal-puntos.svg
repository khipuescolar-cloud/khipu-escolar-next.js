<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Separar oraciones con punto seguido</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="50" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Pon los puntos</text>
<rect x="20" y="70" width="600" height="150" rx="14" fill="#FBEAEA" stroke="#B91C1C" stroke-width="3"/>
<text x="320.0" y="118" font-size="26" font-weight="bold" fill="#8A1414" text-anchor="middle">Antes</text>
<text x="320.0" y="154" font-size="26" fill="#8A1414" text-anchor="middle">Llegamos al terminal compramos</text>
<text x="320.0" y="190" font-size="26" fill="#8A1414" text-anchor="middle">pasajes el bus salió a las ocho</text>
<circle cx="52" cy="100" r="17" fill="#B91C1C"/><path d="M45 93 L59 107 M59 93 L45 107" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
<rect x="20" y="260" width="600" height="200" rx="14" fill="#E3F3E1" stroke="#2F7D32" stroke-width="3"/>
<text x="320.0" y="315" font-size="26" font-weight="bold" fill="#1B5E20" text-anchor="middle">Después</text>
<text x="320.0" y="351" font-size="26" fill="#1B5E20" text-anchor="middle">Llegamos al terminal.</text>
<text x="320.0" y="387" font-size="26" fill="#1B5E20" text-anchor="middle">Compramos pasajes.</text>
<text x="320.0" y="423" font-size="26" fill="#1B5E20" text-anchor="middle">El bus salió a las ocho.</text>
<circle cx="52" cy="290" r="17" fill="#2F7D32"/><path d="M44 290 L50 297 L61 283" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

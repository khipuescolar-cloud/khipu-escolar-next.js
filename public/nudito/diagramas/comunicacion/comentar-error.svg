<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Respuestas a Carla</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="46" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Respuestas a Carla</text>
<g transform="translate(0,27)">
<rect x="24" y="68" width="592" height="104" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/>
<text x="44" y="112" font-size="28" fill="#1E2A78" text-anchor="start">Carla dice: «Mi abuelo me</text>
<text x="44" y="150" font-size="28" fill="#1E2A78" text-anchor="start">enseñó a sembrar frijoles».</text>
<rect x="24" y="186" width="592" height="104" rx="14" fill="#FBEAEA" stroke="#B91C1C" stroke-width="3"/>
<text x="82" y="230" font-size="28" font-weight="bold" fill="#8A1414" text-anchor="start">«Hoy comí arroz.»</text>
<text x="82" y="268" font-size="28" font-weight="bold" fill="#8A1414" text-anchor="start">«Ajá.»</text>
<circle cx="50" cy="238" r="15" fill="#B91C1C"/><path d="M43 231 L57 245 M57 231 L43 245" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<rect x="24" y="304" width="592" height="104" rx="14" fill="#E3F3E1" stroke="#2F7D32" stroke-width="3"/>
<text x="82" y="348" font-size="28" font-weight="bold" fill="#1B5E20" text-anchor="start">«¿Cuántos frijoles</text>
<text x="82" y="386" font-size="28" font-weight="bold" fill="#1B5E20" text-anchor="start">sembraste?»</text>
<circle cx="50" cy="356" r="15" fill="#2F7D32"/><path d="M42 356 L48 363 L59 348" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>

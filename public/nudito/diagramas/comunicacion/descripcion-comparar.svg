<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Dos descripciones del mismo perro</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="14" width="600" height="150" rx="14" fill="#fff" stroke="#B91C1C" stroke-width="4"/>
<path d="M48 46 L72 70 M72 46 L48 70" stroke="#B91C1C" stroke-width="6" stroke-linecap="round"/>
<text x="100" y="64" fill="#B91C1C" font-size="26" font-weight="bold" text-anchor="start">Casi no dice nada</text>
<text x="320" y="128" fill="#1E2A78" font-size="26" text-anchor="middle">Mi perro es bonito.</text>
<rect x="20" y="184" width="600" height="282" rx="14" fill="#fff" stroke="#166534" stroke-width="4"/>
<path d="M46 228 L56 239 L74 216" fill="none" stroke="#166534" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="234" fill="#166534" font-size="26" font-weight="bold" text-anchor="start">Podemos imaginarlo</text>
<text x="320" y="300" fill="#1E2A78" font-size="26" text-anchor="middle">Chato es pequeño, de pelo</text>
<text x="320" y="344" fill="#1E2A78" font-size="26" text-anchor="middle">marrón y con orejas caídas.</text>
<text x="320" y="408" fill="#6B6B6B" font-size="26" text-anchor="middle">Tamaño, color y forma.</text>
</g>
</svg>

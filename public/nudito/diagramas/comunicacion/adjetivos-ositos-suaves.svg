<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>los ositos suaves con el adjetivo en plural</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="24" width="600" height="92" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="320" y="84" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#1E2A78" text-anchor="middle">los ositos suaves</text><rect x="20" y="140" width="600" height="150" rx="14" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="320" y="192" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">Ositos va en plural,</text><text x="320" y="232" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">así que suaves también:</text><text x="320" y="272" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">termina en s.</text><rect x="20" y="318" width="600" height="110" rx="14" fill="#FFE9A8" stroke="#1E2A78" stroke-width="3"/><text x="320" y="370" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Suaves dice cómo son</text><text x="320" y="410" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">los ositos.</text>
</svg>

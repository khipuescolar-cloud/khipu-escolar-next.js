<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Texto sobre Elena con una pregunta por inferir</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="12" width="600" height="250" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="52" text-anchor="start" font-size="26" fill="#1E2A78">Cuando Elena abrió la puerta, el</text><text x="40" y="92" text-anchor="start" font-size="26" fill="#1E2A78">piso estaba mojado y había un</text><text x="40" y="132" text-anchor="start" font-size="26" fill="#1E2A78">balde bajo el techo. Afuera, el</text><text x="40" y="172" text-anchor="start" font-size="26" fill="#1E2A78">cielo estaba gris y había</text><text x="40" y="212" text-anchor="start" font-size="26" fill="#1E2A78">charcos en la calle.</text><rect x="20" y="282" width="600" height="80" rx="14" fill="#FFD966" stroke="#1E2A78" stroke-width="3"/><text x="320" y="334" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E2A78">¿Por qué había un balde?</text><rect x="20" y="382" width="600" height="84" rx="14" fill="#fff" stroke="#1E2A78" stroke-width="3" stroke-dasharray="10 6"/><text x="320" y="436" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E2A78">Mi inferencia: ?</text>
</g>
</svg>

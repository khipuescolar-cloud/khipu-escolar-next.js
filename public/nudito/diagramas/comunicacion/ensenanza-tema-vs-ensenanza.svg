<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Tema y enseñanza son distintos</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="50" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">No es lo mismo</text>
<rect x="20" y="76" width="600" height="170" rx="14" fill="#E8ECFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="320.0" y="152" font-size="26" font-weight="bold" fill="#1B1F2A" text-anchor="middle">Tema: de qué trata</text>
<text x="320.0" y="188" font-size="26" fill="#1B1F2A" text-anchor="middle">Hormigas que cargan una hoja</text>
<rect x="20" y="276" width="600" height="170" rx="14" fill="#F8E4EC" stroke="#A8325E" stroke-width="3"/>
<text x="320.0" y="352" font-size="26" font-weight="bold" fill="#1B1F2A" text-anchor="middle">Enseñanza: lo que aprendemos</text>
<text x="320.0" y="388" font-size="26" fill="#1B1F2A" text-anchor="middle">Juntos logramos más que solos</text>
</svg>

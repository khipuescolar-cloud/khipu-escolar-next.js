<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Saludo y despedida según quién recibe la carta</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="14" width="600" height="216" rx="14" fill="#DCE4FF" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="56" text-anchor="start" font-size="26" font-weight="bold" fill="#1E2A78">Carta a la tía Rosa: tono cercano</text><text x="40" y="114" text-anchor="start" font-size="26" fill="#1E2A78">Saludo: Querida tía Rosa:</text><text x="40" y="168" text-anchor="start" font-size="26" fill="#1E2A78">Despedida: Con cariño,</text><rect x="20" y="248" width="600" height="218" rx="14" fill="#FFD966" stroke="#1E2A78" stroke-width="3"/><text x="40" y="290" text-anchor="start" font-size="26" font-weight="bold" fill="#1E2A78">Carta a la bibliotecaria: tono formal</text><text x="40" y="348" text-anchor="start" font-size="26" fill="#1E2A78">Saludo: Estimada señora Paredes:</text><text x="40" y="402" text-anchor="start" font-size="26" fill="#1E2A78">Despedida: Atentamente,</text>
</g>
</svg>

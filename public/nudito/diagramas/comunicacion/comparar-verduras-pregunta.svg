<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Compara</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="46" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Compara</text>
<rect x="24" y="70" width="592" height="142" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/>
<text x="44" y="112" font-size="28" fill="#1E2A78" text-anchor="start">El tomate es rojo y redondo. La</text>
<text x="44" y="150" font-size="28" fill="#1E2A78" text-anchor="start">zanahoria es anaranjada y larga.</text>
<text x="44" y="188" font-size="28" fill="#1E2A78" text-anchor="start">Los dos son verduras.</text>
<rect x="24" y="232" width="592" height="104" rx="14" fill="#FFF3D1" stroke="#F2B84B" stroke-width="3"/>
<text x="44" y="274" font-size="28" font-weight="bold" fill="#8A5A00" text-anchor="start">¿En qué se parecen y en qué se</text>
<text x="44" y="312" font-size="28" font-weight="bold" fill="#8A5A00" text-anchor="start">diferencian?</text>
</svg>

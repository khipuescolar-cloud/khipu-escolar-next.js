<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Dos finales posibles para el cuento de Tomás</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="16" width="600" height="170" rx="14" fill="#FFFFFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="320.0" y="74" font-size="26" font-weight="bold" fill="#1B1F2A" text-anchor="middle">Inicio y nudo</text>
<text x="320.0" y="110" font-size="26" fill="#1B1F2A" text-anchor="middle">Tomás cruzaba el cerro con su burro.</text>
<text x="320.0" y="146" font-size="26" fill="#1B1F2A" text-anchor="middle">De pronto, el burro no quiso avanzar.</text>
<rect x="20" y="206" width="290" height="250" rx="14" fill="#E8ECFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="165.0" y="286" font-size="26" font-weight="bold" fill="#1B1F2A" text-anchor="middle">Final 1</text>
<text x="165.0" y="322" font-size="26" fill="#1B1F2A" text-anchor="middle">Tomás le dio agua</text>
<text x="165.0" y="358" font-size="26" fill="#1B1F2A" text-anchor="middle">y el burro siguió</text>
<text x="165.0" y="394" font-size="26" fill="#1B1F2A" text-anchor="middle">caminando.</text>
<rect x="330" y="206" width="290" height="250" rx="14" fill="#F8E4EC" stroke="#A8325E" stroke-width="3"/>
<text x="475.0" y="286" font-size="26" font-weight="bold" fill="#1B1F2A" text-anchor="middle">Final 2</text>
<text x="475.0" y="322" font-size="26" fill="#1B1F2A" text-anchor="middle">Tomás vio una nube</text>
<text x="475.0" y="358" font-size="26" fill="#1B1F2A" text-anchor="middle">en forma de</text>
<text x="475.0" y="394" font-size="26" fill="#1B1F2A" text-anchor="middle">montaña.</text>
</svg>

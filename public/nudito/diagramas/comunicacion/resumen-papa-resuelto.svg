<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Cómo se resume el texto de la papa</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="16" y="12" width="608" height="72" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="36" y="57" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#1E2A78">Quitar: quién siembra y a qué alturas</text>
<rect x="16" y="92" width="608" height="72" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="36" y="137" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#1E2A78">Agrupar: amarillas, moradas… → variedades</text>
<rect x="16" y="172" width="608" height="72" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="36" y="217" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#1E2A78">Unir: origen, diversidad y resistencia</text>
<rect x="16" y="258" width="608" height="208" rx="14" fill="#DFF3E6" stroke="#1F7A4D" stroke-width="3"/>
<text x="36" y="298" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1F7A4D">Resumen</text>
<text x="36" y="342" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">La papa, originaria de los Andes,</text>
<text x="36" y="376" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">tiene miles de variedades en el Perú;</text>
<text x="36" y="410" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">así, siempre hay alguna que resiste</text>
<text x="36" y="444" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">heladas o sequías.</text>
</svg>

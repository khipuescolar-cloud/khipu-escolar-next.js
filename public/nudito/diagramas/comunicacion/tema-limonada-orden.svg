<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Texto con palabras de orden sobre la limonada</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="50" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Un texto con palabras de orden</text>
<rect x="20" y="76" width="600" height="250" rx="14" fill="#FFFFFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="150" font-size="26" text-anchor="middle" fill="#1B1F2A"><tspan fill="#A8325E" font-weight="bold">Primero</tspan><tspan fill="#1B1F2A">&#160;pon agua en un vaso.</tspan></text>
<text x="320" y="202" font-size="26" text-anchor="middle" fill="#1B1F2A"><tspan fill="#A8325E" font-weight="bold">Luego</tspan><tspan fill="#1B1F2A">&#160;agrega el polvo de limonada.</tspan></text>
<text x="320" y="254" font-size="26" text-anchor="middle" fill="#1B1F2A"><tspan fill="#A8325E" font-weight="bold">Al final</tspan><tspan fill="#1B1F2A">, mueve con una cuchara.</tspan></text>
<rect x="20" y="346" width="600" height="100" rx="14" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/>
<text x="320.0" y="406" font-size="28" font-weight="bold" fill="#1B1F2A" text-anchor="middle">¿Para qué se escribió?</text>
</svg>

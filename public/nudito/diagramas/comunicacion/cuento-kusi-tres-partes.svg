<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Cuento de Kusi en tres párrafos</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="16" width="600" height="140" rx="14" fill="#E8ECFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="320.0" y="59" font-size="26" font-weight="bold" fill="#1B1F2A" text-anchor="middle">Inicio</text>
<text x="320.0" y="95" font-size="26" fill="#1B1F2A" text-anchor="middle">En la puna vivía Kusi,</text>
<text x="320.0" y="131" font-size="26" fill="#1B1F2A" text-anchor="middle">una vicuña pequeña.</text>
<rect x="20" y="170" width="600" height="140" rx="14" fill="#F8E4EC" stroke="#A8325E" stroke-width="3"/>
<text x="320.0" y="213" font-size="26" font-weight="bold" fill="#1B1F2A" text-anchor="middle">Nudo</text>
<text x="320.0" y="249" font-size="26" fill="#1B1F2A" text-anchor="middle">Un día se alejó de su manada</text>
<text x="320.0" y="285" font-size="26" fill="#1B1F2A" text-anchor="middle">y empezó a nevar.</text>
<rect x="20" y="324" width="600" height="140" rx="14" fill="#DDF3F2" stroke="#0F7C7A" stroke-width="3"/>
<text x="320.0" y="367" font-size="26" font-weight="bold" fill="#1B1F2A" text-anchor="middle">Final</text>
<text x="320.0" y="403" font-size="26" fill="#1B1F2A" text-anchor="middle">Su mamá la encontró y juntas</text>
<text x="320.0" y="439" font-size="26" fill="#1B1F2A" text-anchor="middle">volvieron al abrigo.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>El bus llega ampliada con el momento</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="20" width="600" height="100" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="320" y="84" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#1E2A78" text-anchor="middle">El bus llega.</text><rect x="20" y="150" width="600" height="110" rx="14" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="320" y="218" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#1E2A78" text-anchor="middle">por la mañana.</text><text x="320" y="320" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#8A5A00" text-anchor="middle">El detalle dice cuándo.</text><text x="320" y="368" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">La acción sigue siendo llegar.</text>
</svg>

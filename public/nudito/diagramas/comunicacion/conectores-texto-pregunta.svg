<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Texto con dos espacios para conectores</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="16" width="600" height="290" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="44" y="66" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">El sábado llovió y el mercado de</text>
<text x="44" y="114" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">Chiclayo cerró temprano. <tspan font-weight="bold" fill="#B4361F">[1]</tspan> doña</text>
<text x="44" y="162" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">Marta perdió ventas. <tspan font-weight="bold" fill="#B4361F">[2]</tspan> no se</text>
<text x="44" y="210" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">desanimó: el domingo abrió desde</text>
<text x="44" y="258" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">las seis de la mañana.</text>
<rect x="20" y="330" width="600" height="134" rx="14" fill="#FFE9A8" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="390" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">¿Qué conector va en [1]?</text>
<text x="320" y="438" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">¿Y cuál va en [2]?</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Corregir una oración sin mayúscula ni punto</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="50" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Corrige la oración</text>
<rect x="20" y="76" width="600" height="140" rx="14" fill="#FBEAEA" stroke="#B91C1C" stroke-width="3"/>
<text x="320.0" y="137" font-size="26" font-weight="bold" fill="#8A1414" text-anchor="middle">Antes</text>
<text x="320.0" y="173" font-size="26" fill="#8A1414" text-anchor="middle">hoy llovió en el cerro</text>
<circle cx="52" cy="106" r="17" fill="#B91C1C"/><path d="M45 99 L59 113 M59 99 L45 113" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
<line x1="320" y1="224" x2="320" y2="268" stroke="#1E2A78" stroke-width="5" stroke-linecap="round"/>
<polygon points="320,268 312,254 328,254" fill="#1E2A78"/>
<rect x="20" y="278" width="600" height="150" rx="14" fill="#E3F3E1" stroke="#2F7D32" stroke-width="3"/>
<text x="320.0" y="344" font-size="26" font-weight="bold" fill="#1B5E20" text-anchor="middle">Después</text>
<text x="320.0" y="380" font-size="26" fill="#1B5E20" text-anchor="middle">Hoy llovió en el cerro.</text>
<circle cx="52" cy="308" r="17" fill="#2F7D32"/><path d="M44 308 L50 315 L61 301" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

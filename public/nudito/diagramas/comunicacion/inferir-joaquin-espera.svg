<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Joaquín espera a su abuela</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="50" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Una espera larga</text>
<rect x="20" y="76" width="600" height="250" rx="14" fill="#FFFFFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="320.0" y="150" font-size="26" fill="#1B1F2A" text-anchor="middle">Joaquín mira el reloj, golpea</text>
<text x="320.0" y="190" font-size="26" fill="#1B1F2A" text-anchor="middle">el piso con el pie y suspira</text>
<text x="320.0" y="230" font-size="26" fill="#1B1F2A" text-anchor="middle">cada minuto. Su abuela aún</text>
<text x="320.0" y="270" font-size="26" fill="#1B1F2A" text-anchor="middle">no llega.</text>
<rect x="20" y="346" width="600" height="100" rx="14" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/>
<text x="320.0" y="406" font-size="28" font-weight="bold" fill="#1B1F2A" text-anchor="middle">¿Cómo estará Joaquín?</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Las tres partes de una noticia</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="16" width="600" height="136" rx="14" fill="#FFE9A8" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="70" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="middle">Titular</text>
<text x="320" y="118" fill="#1E2A78" font-size="26" text-anchor="middle">Resume el hecho en pocas palabras.</text>
<rect x="20" y="168" width="600" height="136" rx="14" fill="#D9F0EE" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="222" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="middle">Entrada</text>
<text x="320" y="270" fill="#1E2A78" font-size="26" text-anchor="middle">Dice qué pasó, quién, cuándo y dónde.</text>
<rect x="20" y="320" width="600" height="136" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="374" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="middle">Cuerpo</text>
<text x="320" y="422" fill="#1E2A78" font-size="26" text-anchor="middle">Da detalles y explicaciones.</text>
</g>
</svg>

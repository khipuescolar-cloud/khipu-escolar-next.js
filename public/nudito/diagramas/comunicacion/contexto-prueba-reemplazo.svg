<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Probar significados en la oración</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="14" width="600" height="76" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="64" fill="#1E2A78" font-size="26" text-anchor="middle">Mi vecino es tacaño: nunca presta nada.</text>
<rect x="20" y="104" width="600" height="184" rx="14" fill="#fff" stroke="#B91C1C" stroke-width="4"/>
<text x="60" y="146" fill="#B91C1C" font-size="26" font-weight="bold" text-anchor="start">Pruebo: generoso</text>
<path d="M578 120 L602 144 M602 120 L578 144" stroke="#B91C1C" stroke-width="6" stroke-linecap="round"/>
<text x="40" y="190" fill="#1E2A78" font-size="26" text-anchor="start">Mi vecino es generoso: nunca</text>
<text x="40" y="228" fill="#1E2A78" font-size="26" text-anchor="start">presta nada.</text>
<text x="40" y="266" fill="#B91C1C" font-size="26" font-weight="bold" text-anchor="start">No encaja: se contradice.</text>
<rect x="20" y="300" width="600" height="172" rx="14" fill="#fff" stroke="#166534" stroke-width="4"/>
<text x="60" y="342" fill="#166534" font-size="26" font-weight="bold" text-anchor="start">Pruebo: no quiere compartir</text>
<path d="M576 328 L586 339 L604 316" fill="none" stroke="#166534" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="386" fill="#1E2A78" font-size="26" text-anchor="start">Mi vecino es una persona que no</text>
<text x="40" y="424" fill="#1E2A78" font-size="26" text-anchor="start">quiere compartir: nunca presta nada.</text>
<text x="40" y="460" fill="#166534" font-size="26" font-weight="bold" text-anchor="start">Sí encaja.</text>
</g>
</svg>

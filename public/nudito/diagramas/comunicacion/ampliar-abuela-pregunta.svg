<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Oración Mi abuela cocina con dos preguntas</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="24" width="600" height="100" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="320" y="88" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#1E2A78" text-anchor="middle">Mi abuela cocina.</text><rect x="20" y="150" width="290" height="100" rx="14" fill="#FCF0D6" stroke="#0F7C7A" stroke-width="3"/><text x="165" y="212" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">¿Qué cocina?</text><rect x="330" y="150" width="290" height="100" rx="14" fill="#FCF0D6" stroke="#0F7C7A" stroke-width="3"/><text x="475" y="212" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">¿Dónde?</text><rect x="20" y="280" width="600" height="130" rx="14" fill="#FFE9A8" stroke="#1E2A78" stroke-width="3"/><text x="320" y="334" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">Cada pregunta pide</text><text x="320" y="374" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">un detalle nuevo.</text>
</svg>

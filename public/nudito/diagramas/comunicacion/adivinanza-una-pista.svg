<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Una sola pista deja varias respuestas posibles</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="60" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">Primera pista:</text><text x="320" y="100" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">«Soy amarillo.»</text><rect x="20" y="140" width="190" height="150" rx="14" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="3"/><text x="115.0" y="200" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">el sol</text><text x="115.0" y="258" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0F7C7A" text-anchor="middle">sirve</text><rect x="225" y="140" width="190" height="150" rx="14" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="3"/><text x="320.0" y="200" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">el plátano</text><text x="320.0" y="258" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0F7C7A" text-anchor="middle">sirve</text><rect x="430" y="140" width="190" height="150" rx="14" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="3"/><text x="525.0" y="200" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">el limón</text><text x="525.0" y="258" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0F7C7A" text-anchor="middle">sirve</text><rect x="20" y="330" width="600" height="118" rx="14" fill="#FFE9A8" stroke="#1E2A78" stroke-width="3"/><text x="320" y="382" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Con una sola pista sirven</text><text x="320" y="422" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">tres respuestas distintas.</text>
</svg>

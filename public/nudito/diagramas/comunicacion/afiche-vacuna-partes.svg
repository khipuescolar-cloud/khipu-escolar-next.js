<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Afiche de vacunación con sus tres partes</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="16" width="600" height="126" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<rect x="20" y="154" width="600" height="150" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<rect x="20" y="316" width="600" height="146" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="40" y="70" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#3A4BB5">Imagen</text>
<g transform="translate(330,50)" stroke="#3A4BB5" stroke-width="4" fill="#fff" stroke-linejoin="round"><rect x="0" y="22" width="150" height="30" rx="6"/><rect x="150" y="32" width="50" height="10"/><rect x="200" y="12" width="8" height="50"/><rect x="-26" y="12" width="26" height="50" rx="4" fill="#FFE9A8"/></g>
<path d="M565 66 q-18 24 0 32 q18 -8 0 -32z" fill="#3A4BB5"/>
<text x="40" y="224" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#3A4BB5">Letras</text>
<text x="40" y="258" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#3A4BB5">grandes</text>
<text x="250" y="222" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#1E2A78">¡Vacúnate contra</text>
<text x="250" y="264" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#1E2A78">la influenza!</text>
<text x="40" y="378" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#3A4BB5">Letra</text>
<text x="40" y="412" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#3A4BB5">pequeña</text>
<text x="250" y="376" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Gratis en tu posta de salud.</text>
<text x="250" y="414" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Hasta el 30 de mayo.</text>
</svg>

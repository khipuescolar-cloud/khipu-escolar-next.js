<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Cómo agrupar</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="46" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Cómo agrupar</text>
<rect x="24" y="64" width="592" height="104" rx="14" fill="#FBEAEA" stroke="#B91C1C" stroke-width="3"/>
<text x="82" y="106" font-size="28" font-weight="bold" fill="#8A1414" text-anchor="start">Mesa, mono y mango van juntas</text>
<text x="82" y="144" font-size="28" font-weight="bold" fill="#8A1414" text-anchor="start">porque empiezan igual.</text>
<circle cx="50" cy="116" r="15" fill="#B91C1C"/><path d="M43 109 L57 123 M57 109 L43 123" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<rect x="24" y="182" width="592" height="142" rx="14" fill="#E3F3E1" stroke="#2F7D32" stroke-width="3"/>
<text x="82" y="224" font-size="28" font-weight="bold" fill="#1B5E20" text-anchor="start">No. Mesa es un mueble, mono</text>
<text x="82" y="262" font-size="28" font-weight="bold" fill="#1B5E20" text-anchor="start">es un animal y mango es una</text>
<text x="82" y="300" font-size="28" font-weight="bold" fill="#1B5E20" text-anchor="start">fruta.</text>
<circle cx="50" cy="253" r="15" fill="#2F7D32"/><path d="M42 253 L48 260 L59 245" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

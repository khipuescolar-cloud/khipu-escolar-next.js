<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Cuatro pasos desordenados para lavarse las manos</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<text x="320" y="44" fill="#1E2A78" font-size="26" font-weight="bold" text-anchor="middle">Cómo lavarse las manos</text>
<rect x="20" y="64" width="600" height="84" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="44" y="118" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="start">A.</text>
<text x="104" y="118" fill="#1E2A78" font-size="26" text-anchor="start">Enjuágalas con agua.</text>
<rect x="20" y="164" width="600" height="84" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="44" y="218" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="start">B.</text>
<text x="104" y="218" fill="#1E2A78" font-size="26" text-anchor="start">Mójate las manos.</text>
<rect x="20" y="264" width="600" height="84" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="44" y="318" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="start">C.</text>
<text x="104" y="318" fill="#1E2A78" font-size="26" text-anchor="start">Sécalas con una toalla.</text>
<rect x="20" y="364" width="600" height="84" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="44" y="418" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="start">D.</text>
<text x="104" y="418" fill="#1E2A78" font-size="26" text-anchor="start">Frótalas con jabón.</text>
</g>
</svg>

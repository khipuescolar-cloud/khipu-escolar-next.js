<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>la casa grande con el adjetivo señalado</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="24" width="600" height="110" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="320" y="92" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="#1E2A78" text-anchor="middle">la casa grande</text><rect x="20" y="164" width="600" height="130" rx="14" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="320" y="216" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">Casa es la cosa.</text><text x="320" y="256" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Grande dice cómo es la casa.</text><rect x="20" y="324" width="600" height="110" rx="14" fill="#FFE9A8" stroke="#1E2A78" stroke-width="3"/><text x="320" y="376" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Grande es un adjetivo.</text><text x="320" y="416" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">Es la palabra que describe.</text>
</svg>

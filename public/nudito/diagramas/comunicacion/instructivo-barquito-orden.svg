<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Pasos ordenados con primero, luego y finalmente</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<text x="320" y="48" fill="#1E2A78" font-size="26" font-weight="bold" text-anchor="middle">Cómo armar un barquito de papel</text>
<rect x="20" y="76" width="600" height="118" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="40" y="122" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="start">1. Primero</text>
<text x="40" y="168" fill="#1E2A78" font-size="26" text-anchor="start">Dobla la hoja por la mitad.</text>
<rect x="20" y="210" width="600" height="118" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="40" y="256" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="start">2. Luego</text>
<text x="40" y="302" fill="#1E2A78" font-size="26" text-anchor="start">Dobla las puntas hacia el centro.</text>
<rect x="20" y="344" width="600" height="118" rx="14" fill="#FFE9A8" stroke="#3A4BB5" stroke-width="3"/>
<text x="40" y="390" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="start">3. Finalmente</text>
<text x="40" y="436" fill="#1E2A78" font-size="26" text-anchor="start">Sube los bordes de abajo.</text>
</g>
</svg>

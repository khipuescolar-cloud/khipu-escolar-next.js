<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Un cuento corto sobre Tito</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="50" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Un cuento corto</text>
<rect x="20" y="76" width="600" height="230" rx="14" fill="#FFFFFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="320.0" y="160" font-size="26" fill="#1B1F2A" text-anchor="middle">Tito vio que el perro de Ana</text>
<text x="320.0" y="200" font-size="26" fill="#1B1F2A" text-anchor="middle">tenía sed. Fue a su casa y</text>
<text x="320.0" y="240" font-size="26" fill="#1B1F2A" text-anchor="middle">le trajo agua.</text>
<rect x="20" y="336" width="600" height="100" rx="14" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/>
<text x="320.0" y="396" font-size="28" font-weight="bold" fill="#1B1F2A" text-anchor="middle">¿Cómo es Tito?</text>
</svg>

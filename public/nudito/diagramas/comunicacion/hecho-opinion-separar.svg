<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Una oración con opinión y hecho separados</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="14" width="600" height="128" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="58" text-anchor="start" font-size="26" fill="#1E2A78">Pienso que deberíamos reciclar más,</text><text x="40" y="92" text-anchor="start" font-size="26" fill="#1E2A78">porque este mes el colegio juntó</text><text x="40" y="126" text-anchor="start" font-size="26" fill="#1E2A78">120 kg de papel.</text><rect x="20" y="160" width="600" height="138" rx="14" fill="#FFD966" stroke="#1E2A78" stroke-width="3"/><text x="40" y="204" text-anchor="start" font-size="30" font-weight="bold" fill="#1E2A78">Opinión</text><text x="40" y="248" text-anchor="start" font-size="26" fill="#1E2A78">Pienso que deberíamos reciclar más.</text><text x="40" y="284" text-anchor="start" font-size="26" fill="#1E2A78">Depende de lo que él piensa.</text><rect x="20" y="318" width="600" height="148" rx="14" fill="#DCE4FF" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="362" text-anchor="start" font-size="30" font-weight="bold" fill="#1E2A78">Hecho</text><text x="40" y="406" text-anchor="start" font-size="26" fill="#1E2A78">El colegio juntó 120 kg de papel.</text><text x="40" y="444" text-anchor="start" font-size="26" fill="#1E2A78">Se comprueba pesando.</text>
</g>
</svg>

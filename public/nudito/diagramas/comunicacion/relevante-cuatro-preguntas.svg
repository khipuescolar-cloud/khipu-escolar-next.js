<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Preguntas para hallar lo relevante</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="14" width="600" height="100" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="40" y="54" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="start">Quién</text>
<text x="40" y="96" fill="#1E2A78" font-size="26" text-anchor="start">Lupe</text>
<rect x="20" y="128" width="600" height="100" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="40" y="168" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="start">Qué hizo</text>
<text x="40" y="210" fill="#1E2A78" font-size="26" text-anchor="start">vendió mazamorra morada</text>
<rect x="20" y="242" width="600" height="100" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="40" y="282" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="start">Para qué</text>
<text x="40" y="324" fill="#1E2A78" font-size="26" text-anchor="start">comprar cuadernos para sus primos</text>
<rect x="20" y="356" width="600" height="100" rx="14" fill="#EFEFEF" stroke="#6B6B6B" stroke-width="3" stroke-dasharray="8 6"/>
<text x="40" y="396" fill="#6B6B6B" font-size="26" font-weight="bold" text-anchor="start">Detalle</text>
<text x="40" y="438" fill="#6B6B6B" font-size="26" text-anchor="start">su gato duerme en el techo</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>El tema se repite y un dato suelto no</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="50" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Lo que se repite</text>
<rect x="20" y="76" width="600" height="170" rx="14" fill="#E3F3E1" stroke="#2F7D32" stroke-width="3"/>
<text x="320.0" y="152" font-size="26" font-weight="bold" fill="#1B5E20" text-anchor="middle">Tema: el cuy</text>
<text x="320.0" y="188" font-size="26" fill="#1B5E20" text-anchor="middle">aparece en las tres oraciones</text>
<circle cx="52" cy="108" r="17" fill="#2F7D32"/><path d="M44 108 L50 115 L61 101" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="20" y="276" width="600" height="170" rx="14" fill="#FBEAEA" stroke="#B91C1C" stroke-width="3" stroke-dasharray="10 8"/>
<text x="320.0" y="352" font-size="26" font-weight="bold" fill="#8A1414" text-anchor="middle">Dato suelto: el pasto</text>
<text x="320.0" y="388" font-size="26" fill="#8A1414" text-anchor="middle">aparece en una sola oración</text>
<circle cx="52" cy="308" r="17" fill="#B91C1C"/><path d="M45 301 L59 315 M59 301 L45 315" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
</svg>

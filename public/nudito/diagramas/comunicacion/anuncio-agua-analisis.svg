<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Análisis del anuncio de agua</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="14" width="600" height="104" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="40" y="60" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#1E2A78">«La mejor del mundo. Nadie la supera.»</text>
<text x="40" y="96" font-family="Arial,sans-serif" font-size="26" fill="#B4361F">Exageración: no se puede comprobar</text>
<rect x="20" y="126" width="600" height="104" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="40" y="172" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#1E2A78">Imagen de una deportista sonriente</text>
<text x="40" y="208" font-family="Arial,sans-serif" font-size="26" fill="#B4361F">Busca que sientas energía y alegría</text>
<rect x="20" y="238" width="600" height="104" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="40" y="284" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#1E2A78">Letra pequeña: agua mineral, 500 ml</text>
<text x="40" y="320" font-family="Arial,sans-serif" font-size="26" fill="#B4361F">Dato real, pero casi no se nota</text>
<rect x="20" y="350" width="600" height="112" rx="14" fill="#DFF3E6" stroke="#1F7A4D" stroke-width="3"/>
<text x="40" y="400" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#1F7A4D">Intención: vender</text>
<text x="40" y="436" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Quiere que compres esa marca</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Plan de tres preguntas para escribir un cuento</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="50" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Mi plan para escribir</text>
<rect x="20" y="76" width="600" height="106" rx="14" fill="#E8ECFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="320.0" y="138" font-size="26" font-weight="bold" fill="#1B1F2A" text-anchor="middle">Inicio: ¿quién y dónde?</text>
<circle cx="62" cy="129" r="22" fill="#1E2A78"/><text x="62" y="138" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<rect x="20" y="202" width="600" height="106" rx="14" fill="#F8E4EC" stroke="#A8325E" stroke-width="3"/>
<text x="320.0" y="264" font-size="26" font-weight="bold" fill="#1B1F2A" text-anchor="middle">Nudo: ¿qué problema pasa?</text>
<circle cx="62" cy="255" r="22" fill="#1E2A78"/><text x="62" y="264" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<rect x="20" y="328" width="600" height="106" rx="14" fill="#DDF3F2" stroke="#0F7C7A" stroke-width="3"/>
<text x="320.0" y="390" font-size="26" font-weight="bold" fill="#1B1F2A" text-anchor="middle">Final: ¿cómo se resuelve?</text>
<circle cx="62" cy="381" r="22" fill="#1E2A78"/><text x="62" y="390" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
</svg>

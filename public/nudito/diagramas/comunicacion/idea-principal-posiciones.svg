<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>La idea principal puede estar al inicio, en medio o al final</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#1E2A78" font-size="28" font-weight="bold">
<text x="116" y="52">Inicio</text><text x="320" y="52">Medio</text><text x="524" y="52">Final</text></g>
<g stroke="#3A4BB5" stroke-width="3">
<rect x="22" y="72" width="188" height="56" rx="10" fill="#FFD966" stroke="#1E2A78" stroke-width="6"/>
<rect x="22" y="144" width="188" height="56" rx="10" fill="#fff"/>
<rect x="22" y="216" width="188" height="56" rx="10" fill="#fff"/>
<rect x="22" y="288" width="188" height="56" rx="10" fill="#fff"/>
<rect x="226" y="72" width="188" height="56" rx="10" fill="#fff"/>
<rect x="226" y="144" width="188" height="56" rx="10" fill="#fff"/>
<rect x="226" y="216" width="188" height="56" rx="10" fill="#FFD966" stroke="#1E2A78" stroke-width="6"/>
<rect x="226" y="288" width="188" height="56" rx="10" fill="#fff"/>
<rect x="430" y="72" width="188" height="56" rx="10" fill="#fff"/>
<rect x="430" y="144" width="188" height="56" rx="10" fill="#fff"/>
<rect x="430" y="216" width="188" height="56" rx="10" fill="#fff"/>
<rect x="430" y="288" width="188" height="56" rx="10" fill="#FFD966" stroke="#1E2A78" stroke-width="6"/>
</g>
<text x="320" y="410" text-anchor="middle" fill="#1E2A78" font-family="Arial,sans-serif" font-size="26">Resaltada: idea principal</text>
<text x="320" y="450" text-anchor="middle" fill="#1E2A78" font-family="Arial,sans-serif" font-size="26">Blancas: ideas secundarias</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Texto separado en dos párrafos con punto aparte</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<text x="320" y="40" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E2A78">Dos ideas, dos párrafos</text><rect x="20" y="58" width="600" height="132" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="96" text-anchor="start" font-size="26" fill="#1E2A78">El sábado fuimos al río con mis</text><text x="40" y="130" text-anchor="start" font-size="26" fill="#1E2A78">primos. Armamos una carpa y</text><text x="40" y="164" text-anchor="start" font-size="26" fill="#1E2A78">jugamos en la orilla.</text><text x="320" y="230" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E2A78">Punto aparte y línea nueva</text><path d="M320 242 L320 266" stroke="#1E2A78" stroke-width="5" fill="none"/><path d="M308 262 L320 276 L332 262 Z" fill="#1E2A78"/><rect x="20" y="284" width="600" height="132" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="322" text-anchor="start" font-size="26" fill="#1E2A78">Al día siguiente, mi papá nos</text><text x="40" y="356" text-anchor="start" font-size="26" fill="#1E2A78">llevó al mercado. Compramos</text><text x="40" y="390" text-anchor="start" font-size="26" fill="#1E2A78">frutas y pan para el desayuno.</text><text x="320" y="454" text-anchor="middle" font-size="26" fill="#1E2A78">Cambia el momento: «Al día siguiente»</text>
</g>
</svg>

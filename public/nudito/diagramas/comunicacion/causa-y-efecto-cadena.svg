<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Una cadena de causas y efectos</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="20" y="12" width="600" height="90" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="48" fill="#3A4BB5" font-size="26" font-weight="bold">Causa</text>
<text x="320" y="84" fill="#1E2A78" font-size="26">Olvidó su sombrero</text>
<rect x="20" y="136" width="600" height="90" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="172" fill="#3A4BB5" font-size="26" font-weight="bold">Efecto y causa</text>
<text x="320" y="208" fill="#1E2A78" font-size="26">Tomó mucho sol</text>
<rect x="20" y="260" width="600" height="90" rx="14" fill="#FFE9A8" stroke="#1E2A78" stroke-width="5"/>
<text x="320" y="296" fill="#1E2A78" font-size="26" font-weight="bold">Efecto final</text>
<text x="320" y="332" fill="#1E2A78" font-size="26">Se quemó la cara</text>
<rect x="20" y="370" width="600" height="100" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="410" fill="#3A4BB5" font-size="26" font-weight="bold">Palabras que unen</text>
<text x="320" y="450" fill="#1E2A78" font-size="26">porque · como · por eso · así que</text></g>
<g fill="none" stroke="#3A4BB5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
<path d="M320 106 V132 M308 122 L320 134 L332 122"/><path d="M320 230 V256 M308 246 L320 258 L332 246"/></g>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Tabla de talleres con el que cumple las condiciones resaltado</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="10" width="600" height="122" rx="14" fill="#fff" stroke="#1E2A78" stroke-width="3"/><text x="40" y="48" text-anchor="start" font-size="26" fill="#1E2A78">Mariana sale de inglés a las 4:00.</text><text x="40" y="82" text-anchor="start" font-size="26" fill="#1E2A78">El taller debe empezar después</text><text x="40" y="116" text-anchor="start" font-size="26" fill="#1E2A78">de las 4:00 y antes de las 5:00.</text><rect x="20" y="146" width="600" height="96" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="184" text-anchor="start" font-size="26" font-weight="bold" fill="#1E2A78">Dibujo, 3:00 p. m.</text><text x="40" y="222" text-anchor="start" font-size="26" fill="#1E2A78">empieza antes de las 4:00</text><text x="590" y="202" text-anchor="end" font-size="30" font-weight="bold" fill="#1E2A78">No</text><rect x="20" y="254" width="600" height="96" rx="14" fill="#FFD966" stroke="#1E2A78" stroke-width="6"/><text x="40" y="292" text-anchor="start" font-size="26" font-weight="bold" fill="#1E2A78">Cerámica, 4:30 p. m.</text><text x="40" y="330" text-anchor="start" font-size="26" fill="#1E2A78">cumple las dos condiciones</text><text x="590" y="310" text-anchor="end" font-size="30" font-weight="bold" fill="#1E2A78">Sí</text><rect x="20" y="362" width="600" height="96" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="400" text-anchor="start" font-size="26" font-weight="bold" fill="#1E2A78">Música, 5:00 p. m.</text><text x="40" y="438" text-anchor="start" font-size="26" fill="#1E2A78">no empieza antes de las 5:00</text><text x="590" y="418" text-anchor="end" font-size="30" font-weight="bold" fill="#1E2A78">No</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>De una idea suelta a una oración</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="50" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">De una idea a una oración</text>
<rect x="20" y="76" width="600" height="130" rx="14" fill="#E8ECFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="320.0" y="132" font-size="26" font-weight="bold" fill="#1B1F2A" text-anchor="middle">Idea suelta</text>
<text x="320.0" y="168" font-size="26" fill="#1B1F2A" text-anchor="middle">parque grande</text>
<line x1="320" y1="214" x2="320" y2="262" stroke="#1E2A78" stroke-width="5" stroke-linecap="round"/>
<polygon points="320,262 312,248 328,248" fill="#1E2A78"/>
<rect x="20" y="272" width="600" height="170" rx="14" fill="#E3F3E1" stroke="#2F7D32" stroke-width="3"/>
<text x="320.0" y="348" font-size="26" font-weight="bold" fill="#1B5E20" text-anchor="middle">Oración completa</text>
<text x="320.0" y="384" font-size="26" fill="#1B5E20" text-anchor="middle">Mi barrio tiene un parque grande.</text>
</svg>

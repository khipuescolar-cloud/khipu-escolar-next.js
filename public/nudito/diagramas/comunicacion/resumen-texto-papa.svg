<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Texto sobre la papa en el Perú</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="16" y="12" width="608" height="376" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="36" y="56" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#3A4BB5">La papa en el Perú</text>
<text x="36" y="104" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">La papa nació en los Andes. Hoy el</text>
<text x="36" y="144" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Perú conserva miles de variedades:</text>
<text x="36" y="184" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">amarillas, moradas, huayro y canchán.</text>
<text x="36" y="224" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Las familias campesinas las siembran</text>
<text x="36" y="264" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">a distintas alturas. Gracias a esa</text>
<text x="36" y="304" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">diversidad, siempre hay variedades</text>
<text x="36" y="344" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">que resisten heladas o sequías.</text>
<rect x="16" y="404" width="608" height="62" rx="14" fill="#FFE9A8" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="446" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">¿Qué dejarías en un resumen?</text>
</svg>

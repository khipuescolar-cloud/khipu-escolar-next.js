<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Hecho se comprueba, opinión depende de quien habla</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="16" width="600" height="214" rx="14" fill="#DCE4FF" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="60" text-anchor="start" font-size="30" font-weight="bold" fill="#1E2A78">Hecho</text><text x="40" y="102" text-anchor="start" font-size="26" fill="#1E2A78">Se puede comprobar:</text><text x="40" y="138" text-anchor="start" font-size="26" fill="#1E2A78">contar, medir o buscar</text><text x="40" y="174" text-anchor="start" font-size="26" fill="#1E2A78">en una fuente confiable.</text><rect x="20" y="250" width="600" height="216" rx="14" fill="#FFD966" stroke="#1E2A78" stroke-width="3"/><text x="40" y="294" text-anchor="start" font-size="30" font-weight="bold" fill="#1E2A78">Opinión</text><text x="40" y="336" text-anchor="start" font-size="26" fill="#1E2A78">Depende de lo que alguien piensa.</text><text x="40" y="372" text-anchor="start" font-size="26" fill="#1E2A78">Pistas: creo que, me parece,</text><text x="40" y="408" text-anchor="start" font-size="26" fill="#1E2A78">horrible, aburrido, el más lindo.</text>
</g>
</svg>

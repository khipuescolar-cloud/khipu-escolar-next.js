<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Regla de tilde según la terminación y ejemplos</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="12" width="600" height="92" rx="14" fill="#DCE4FF" stroke="#3A4BB5" stroke-width="3"/><text x="36" y="50" text-anchor="start" font-size="26" font-weight="bold" fill="#1E2A78">Aguda</text><text x="36" y="88" text-anchor="start" font-size="26" fill="#1E2A78">tilde si termina en n, s o vocal</text><rect x="20" y="116" width="600" height="92" rx="14" fill="#DCE4FF" stroke="#3A4BB5" stroke-width="3"/><text x="36" y="154" text-anchor="start" font-size="26" font-weight="bold" fill="#1E2A78">Grave</text><text x="36" y="192" text-anchor="start" font-size="26" fill="#1E2A78">tilde si NO termina en n, s ni vocal</text><rect x="20" y="220" width="600" height="92" rx="14" fill="#DCE4FF" stroke="#3A4BB5" stroke-width="3"/><text x="36" y="258" text-anchor="start" font-size="26" font-weight="bold" fill="#1E2A78">Esdrújula</text><text x="36" y="296" text-anchor="start" font-size="26" fill="#1E2A78">siempre lleva tilde</text><rect x="20" y="326" width="600" height="144" rx="14" fill="#FFD966" stroke="#1E2A78" stroke-width="3"/><text x="36" y="368" text-anchor="start" font-size="26" fill="#1E2A78">balcón: aguda en n, con tilde</text><text x="36" y="406" text-anchor="start" font-size="26" fill="#1E2A78">difícil: grave en l, con tilde</text><text x="36" y="444" text-anchor="start" font-size="26" fill="#1E2A78">examen: grave en n, sin tilde</text>
</g>
</svg>

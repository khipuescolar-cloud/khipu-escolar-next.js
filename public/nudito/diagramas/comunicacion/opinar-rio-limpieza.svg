<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Noticia sobre la limpieza del río</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="50" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Una noticia del colegio</text>
<rect x="20" y="76" width="600" height="250" rx="14" fill="#FFFFFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="320.0" y="150" font-size="26" fill="#1B1F2A" text-anchor="middle">Los alumnos de tercer grado</text>
<text x="320.0" y="190" font-size="26" fill="#1B1F2A" text-anchor="middle">limpiaron la orilla del río.</text>
<text x="320.0" y="230" font-size="26" fill="#1B1F2A" text-anchor="middle">Recogieron botellas y bolsas</text>
<text x="320.0" y="270" font-size="26" fill="#1B1F2A" text-anchor="middle">y dejaron el lugar limpio.</text>
<rect x="20" y="346" width="600" height="100" rx="14" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/>
<text x="320.0" y="406" font-size="28" font-weight="bold" fill="#1B1F2A" text-anchor="middle">¿Qué opinas?</text>
</svg>

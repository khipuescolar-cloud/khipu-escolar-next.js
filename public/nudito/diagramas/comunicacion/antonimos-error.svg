<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Opuestas de verdad</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="46" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Opuestas de verdad</text>
<rect x="24" y="64" width="592" height="66" rx="14" fill="#FBEAEA" stroke="#B91C1C" stroke-width="3"/>
<text x="82" y="106" font-size="28" font-weight="bold" fill="#8A1414" text-anchor="start">Perro es el antónimo de gato.</text>
<circle cx="50" cy="97" r="15" fill="#B91C1C"/><path d="M43 90 L57 104 M57 90 L43 104" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<rect x="24" y="144" width="592" height="142" rx="14" fill="#E3F3E1" stroke="#2F7D32" stroke-width="3"/>
<text x="82" y="186" font-size="28" font-weight="bold" fill="#1B5E20" text-anchor="start">No. Son animales distintos,</text>
<text x="82" y="224" font-size="28" font-weight="bold" fill="#1B5E20" text-anchor="start">pero no opuestos. Ligero y</text>
<text x="82" y="262" font-size="28" font-weight="bold" fill="#1B5E20" text-anchor="start">pesado sí son opuestos.</text>
<circle cx="50" cy="215" r="15" fill="#2F7D32"/><path d="M42 215 L48 222 L59 207" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

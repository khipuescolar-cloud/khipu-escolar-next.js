<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Las cinco partes de una carta</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="18" width="600" height="62" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="60" text-anchor="start" font-size="26" font-weight="bold" fill="#1E2A78">1  Lugar y fecha</text><rect x="20" y="92" width="600" height="62" rx="14" fill="#DCE4FF" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="134" text-anchor="start" font-size="26" font-weight="bold" fill="#1E2A78">2  Saludo</text><rect x="20" y="166" width="600" height="62" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="208" text-anchor="start" font-size="26" font-weight="bold" fill="#1E2A78">3  Cuerpo: lo que quieres decir</text><rect x="20" y="240" width="600" height="62" rx="14" fill="#DCE4FF" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="282" text-anchor="start" font-size="26" font-weight="bold" fill="#1E2A78">4  Despedida</text><rect x="20" y="314" width="600" height="62" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="356" text-anchor="start" font-size="26" font-weight="bold" fill="#1E2A78">5  Firma: tu nombre</text><text x="320" y="418" text-anchor="middle" font-size="26" fill="#1E2A78">Las partes van siempre en este orden</text><text x="320" y="454" text-anchor="middle" font-size="26" fill="#1E2A78">de arriba hacia abajo</text>
</g>
</svg>

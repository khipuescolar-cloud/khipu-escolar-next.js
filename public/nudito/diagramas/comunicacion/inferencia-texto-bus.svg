<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Fragmento sobre pasajeros de un bus a Huaraz</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="16" width="600" height="330" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="40" y="62" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#3A4BB5">Viaje a Huaraz</text>
<text x="40" y="112" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">Los pasajeros del bus miraban sus</text>
<text x="40" y="156" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">relojes. El chofer bajó, abrió el capó</text>
<text x="40" y="200" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">y negó con la cabeza. Un señor sacó</text>
<text x="40" y="244" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">su abrigo y se lo puso, porque la</text>
<text x="40" y="288" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">noche se acercaba.</text>
<rect x="20" y="366" width="600" height="98" rx="14" fill="#FFE9A8" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="426" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1E2A78" text-anchor="middle">¿Qué le pasó al bus?</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Tres relaciones entre ideas</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="16" width="600" height="136" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="68" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="middle">Suman datos</text>
<text x="320" y="116" fill="#1E2A78" font-size="26" text-anchor="middle">y · además · también</text>
<rect x="20" y="168" width="600" height="136" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="220" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="middle">Ordenan en el tiempo</text>
<text x="320" y="268" fill="#1E2A78" font-size="26" text-anchor="middle">primero · luego · finalmente</text>
<rect x="20" y="320" width="600" height="136" rx="14" fill="#FFE9A8" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="372" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="middle">Explican la razón</text>
<text x="320" y="420" fill="#1E2A78" font-size="26" text-anchor="middle">porque</text>
</g>
</svg>

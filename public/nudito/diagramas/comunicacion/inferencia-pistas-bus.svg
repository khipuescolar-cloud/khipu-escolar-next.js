<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Pistas del texto y conclusión sobre el bus</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="14" width="600" height="98" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="40" y="57" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#1E2A78">Pista: los pasajeros miran sus relojes</text>
<text x="40" y="93" font-family="Arial,sans-serif" font-size="26" fill="#B4361F">→ llevan rato esperando</text>
<rect x="20" y="120" width="600" height="98" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="40" y="163" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#1E2A78">Pista: el chofer abre el capó y niega</text>
<text x="40" y="199" font-family="Arial,sans-serif" font-size="26" fill="#B4361F">→ el motor tiene una falla</text>
<rect x="20" y="226" width="600" height="98" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="40" y="269" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#1E2A78">Pista: llega la noche y sacan abrigo</text>
<text x="40" y="305" font-family="Arial,sans-serif" font-size="26" fill="#B4361F">→ seguirán detenidos al anochecer</text>
<rect x="20" y="334" width="600" height="134" rx="14" fill="#DFF3E6" stroke="#1F7A4D" stroke-width="3"/>
<text x="40" y="372" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1F7A4D">Conclusión</text>
<text x="40" y="410" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">El bus se malogró y llegará</text>
<text x="40" y="444" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">tarde a Huaraz.</text>
</svg>

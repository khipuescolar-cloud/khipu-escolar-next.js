<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Dos pistas explican el sentido de una expresión</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="14" width="600" height="86" rx="14" fill="#fff" stroke="#1E2A78" stroke-width="3"/><text x="320" y="68" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E2A78">«¡Se me hace agua la boca!»</text><rect x="20" y="116" width="600" height="76" rx="14" fill="#DCE4FF" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="164" text-anchor="start" font-size="26" fill="#1E2A78">Pista: olió el ají de gallina</text><rect x="20" y="206" width="600" height="76" rx="14" fill="#DCE4FF" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="254" text-anchor="start" font-size="26" fill="#1E2A78">Pista: pidió un plato grande</text><rect x="20" y="302" width="600" height="168" rx="14" fill="#FFD966" stroke="#1E2A78" stroke-width="3"/><text x="40" y="346" text-anchor="start" font-size="28" font-weight="bold" fill="#1E2A78">Quiere decir</text><text x="40" y="390" text-anchor="start" font-size="26" fill="#1E2A78">que tiene muchas ganas de comer</text><text x="40" y="428" text-anchor="start" font-size="26" fill="#1E2A78">ese plato. No sale agua de verdad.</text>
</g>
</svg>

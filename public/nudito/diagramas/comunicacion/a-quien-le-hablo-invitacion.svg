<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Invitación a un amigo para jugar en el recreo</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="130" y="30" width="380" height="130" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><path d="M200 160 L180 205 L250 160 Z" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><rect x="202" y="156" width="46" height="8" fill="#FFFFFF"/><text x="320" y="92" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">¿Jugamos juntos</text><text x="320" y="134" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">en el recreo?</text><circle cx="160" cy="250" r="26" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><circle cx="151" cy="245" r="3" fill="#1E2A78"/><circle cx="169" cy="245" r="3" fill="#1E2A78"/><path d="M149 258 Q160 268 171 258" fill="none" stroke="#1E2A78" stroke-width="3"/><path d="M126 338 Q126 284 160 284 Q194 284 194 338 Z" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><circle cx="480" cy="250" r="26" fill="#D9EFEC" stroke="#1E2A78" stroke-width="3"/><circle cx="471" cy="245" r="3" fill="#1E2A78"/><circle cx="489" cy="245" r="3" fill="#1E2A78"/><path d="M469 258 Q480 268 491 258" fill="none" stroke="#1E2A78" stroke-width="3"/><path d="M446 338 Q446 284 480 284 Q514 284 514 338 Z" fill="#D9EFEC" stroke="#1E2A78" stroke-width="3"/><text x="160" y="390" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Tú</text><text x="480" y="390" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Tu amigo</text><text x="320" y="448" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0F7C7A" text-anchor="middle">Palabras sencillas y amables.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Beto cuenta algo</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="46" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Beto cuenta algo</text>
<g transform="translate(0,36)">
<rect x="24" y="72" width="592" height="104" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/>
<text x="44" y="116" font-size="28" fill="#1E2A78" text-anchor="start">Beto dice: «Hoy mi mamá me</text>
<text x="44" y="154" font-size="28" fill="#1E2A78" text-anchor="start">regaló un cuaderno de dibujo».</text>
<rect x="24" y="196" width="592" height="66" rx="14" fill="#FFF3D1" stroke="#F2B84B" stroke-width="3"/>
<text x="44" y="240" font-size="28" font-weight="bold" fill="#8A5A00" text-anchor="start">¿Qué le dirías a Beto?</text>
</g>
</svg>

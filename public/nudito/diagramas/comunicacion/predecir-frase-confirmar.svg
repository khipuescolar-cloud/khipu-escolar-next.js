<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Predicción con porque y comprobación al leer</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="16" width="600" height="170" rx="14" fill="#E8ECFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="320.0" y="56" font-size="26" font-weight="bold" fill="#1B1F2A" text-anchor="middle">Mi predicción</text>
<text x="320.0" y="92" font-size="26" fill="#1B1F2A" text-anchor="middle">Creo que trata de una aventura</text>
<text x="320.0" y="128" font-size="26" fill="#1B1F2A" text-anchor="middle">de noche, porque hay linternas</text>
<text x="320.0" y="164" font-size="26" fill="#1B1F2A" text-anchor="middle">y luciérnagas.</text>
<line x1="320" y1="194" x2="320" y2="238" stroke="#1E2A78" stroke-width="5" stroke-linecap="round"/>
<polygon points="320,238 312,224 328,224" fill="#1E2A78"/>
<rect x="20" y="246" width="290" height="210" rx="14" fill="#E3F3E1" stroke="#2F7D32" stroke-width="3"/>
<text x="165.0" y="324" font-size="26" font-weight="bold" fill="#1B5E20" text-anchor="middle">Si coincide</text>
<text x="165.0" y="360" font-size="26" fill="#1B5E20" text-anchor="middle">con lo que leo,</text>
<text x="165.0" y="396" font-size="26" fill="#1B5E20" text-anchor="middle">la confirmo</text>
<rect x="330" y="246" width="290" height="210" rx="14" fill="#F8E4EC" stroke="#A8325E" stroke-width="3"/>
<text x="475.0" y="342" font-size="26" font-weight="bold" fill="#1B1F2A" text-anchor="middle">Si no coincide,</text>
<text x="475.0" y="378" font-size="26" fill="#1B1F2A" text-anchor="middle">la cambio</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Una noticia y un cuento</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="14" width="600" height="216" rx="14" fill="#D9F0EE" stroke="#0F7C7A" stroke-width="4"/>
<text x="320" y="52" fill="#0F7C7A" font-size="26" font-weight="bold" text-anchor="middle">Noticia: hecho real</text>
<text x="320" y="100" fill="#1E2A78" font-size="26" text-anchor="middle">Ayer se abrió un nuevo mirador</text>
<text x="320" y="140" fill="#1E2A78" font-size="26" text-anchor="middle">en Sacsayhuamán, Cusco.</text>
<text x="320" y="196" fill="#6B6B6B" font-size="26" text-anchor="middle">Tiene fecha y lugar real.</text>
<rect x="20" y="250" width="600" height="216" rx="14" fill="#fff" stroke="#A8325E" stroke-width="4" stroke-dasharray="8 6"/>
<text x="320" y="288" fill="#A8325E" font-size="26" font-weight="bold" text-anchor="middle">Cuento: hecho inventado</text>
<text x="320" y="336" fill="#1E2A78" font-size="26" text-anchor="middle">Había una vez un puma que</text>
<text x="320" y="376" fill="#1E2A78" font-size="26" text-anchor="middle">hablaba con las estrellas.</text>
<text x="320" y="432" fill="#6B6B6B" font-size="26" text-anchor="middle">No tiene fecha ni lugar real.</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Párrafo y tabla de un torneo de ajedrez con una pregunta</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="10" width="600" height="150" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="48" text-anchor="start" font-size="26" fill="#1E2A78">El sábado, el club de ajedrez de</text><text x="40" y="84" text-anchor="start" font-size="26" fill="#1E2A78">Huancayo hizo un torneo escolar.</text><text x="40" y="120" text-anchor="start" font-size="26" fill="#1E2A78">Cada jugador pagó S/ 5.</text><rect x="20" y="172" width="600" height="180" rx="14" fill="#DCE4FF" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="212" text-anchor="start" font-size="26" font-weight="bold" fill="#1E2A78">Colegio</text><text x="420" y="212" text-anchor="start" font-size="26" font-weight="bold" fill="#1E2A78">Jugadores</text><text x="40" y="254" text-anchor="start" font-size="26" fill="#1E2A78">San Martín</text><text x="500" y="254" text-anchor="middle" font-size="26" fill="#1E2A78">14</text><text x="40" y="296" text-anchor="start" font-size="26" fill="#1E2A78">Santa Rosa</text><text x="500" y="296" text-anchor="middle" font-size="26" fill="#1E2A78">9</text><text x="40" y="338" text-anchor="start" font-size="26" fill="#1E2A78">Andino</text><text x="500" y="338" text-anchor="middle" font-size="26" fill="#1E2A78">12</text><rect x="20" y="368" width="600" height="98" rx="14" fill="#FFD966" stroke="#1E2A78" stroke-width="3"/><text x="320" y="410" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E2A78">¿Cuánto dinero reunió</text><text x="320" y="448" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E2A78">el colegio Andino?</text>
</g>
</svg>

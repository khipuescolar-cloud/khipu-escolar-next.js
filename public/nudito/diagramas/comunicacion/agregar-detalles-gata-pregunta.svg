<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Oración La gata duerme con tres preguntas posibles</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="20" width="600" height="100" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="320" y="84" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#1E2A78" text-anchor="middle">La gata duerme.</text><rect x="20" y="150" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="115" y="212" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">¿Cómo es?</text><rect x="225" y="150" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="320" y="212" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">¿Dónde?</text><rect x="430" y="150" width="190" height="100" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="525" y="212" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">¿Cuándo?</text><rect x="20" y="290" width="600" height="110" rx="14" fill="#FFE9A8" stroke="#1E2A78" stroke-width="3"/><text x="320" y="342" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Quiero decir</text><text x="320" y="382" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">dónde duerme.</text>
</svg>

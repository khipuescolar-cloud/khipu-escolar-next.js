<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Borrador de noticia con cuatro oraciones numeradas</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="52" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#3A4BB5" text-anchor="middle">Borrador de noticia imaginaria</text>
<rect x="20" y="72" width="600" height="88" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<circle cx="62" cy="116" r="22" fill="#3A4BB5"/>
<text x="62" y="126" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="100" y="110" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">El lunes se inauguró la biblioteca del</text>
<text x="100" y="144" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">colegio San Juan, en Abancay.</text>
<rect x="20" y="170" width="600" height="88" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<circle cx="62" cy="214" r="22" fill="#3A4BB5"/>
<text x="62" y="224" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<text x="100" y="208" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Es la biblioteca más linda de todo</text>
<text x="100" y="242" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">el Perú.</text>
<rect x="20" y="268" width="600" height="88" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<circle cx="62" cy="312" r="22" fill="#3A4BB5"/>
<text x="62" y="322" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="100" y="306" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Tiene 800 libros donados por las</text>
<text x="100" y="340" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">familias.</text>
<rect x="20" y="366" width="600" height="88" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<circle cx="62" cy="410" r="22" fill="#3A4BB5"/>
<text x="62" y="420" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
<text x="100" y="404" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Los estudiantes la usarán desde</text>
<text x="100" y="438" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">esta semana.</text>
</svg>

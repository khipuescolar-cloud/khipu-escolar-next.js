<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Seis oraciones numeradas para decidir dónde cambia la idea</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<text x="320" y="44" text-anchor="middle" font-size="30" font-weight="bold" fill="#1E2A78">¿Dónde cambia la idea?</text><rect x="20" y="68" width="600" height="52" rx="14" fill="#DCE4FF" stroke="#3A4BB5" stroke-width="3"/><text x="36" y="104" text-anchor="start" font-size="26" fill="#1E2A78">1. En mi escuela hay un huerto.</text><rect x="20" y="130" width="600" height="52" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/><text x="36" y="166" text-anchor="start" font-size="26" fill="#1E2A78">2. Sembramos lechugas y zanahorias.</text><rect x="20" y="192" width="600" height="52" rx="14" fill="#DCE4FF" stroke="#3A4BB5" stroke-width="3"/><text x="36" y="228" text-anchor="start" font-size="26" fill="#1E2A78">3. Cada tarde las regamos.</text><rect x="20" y="254" width="600" height="52" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/><text x="36" y="290" text-anchor="start" font-size="26" fill="#1E2A78">4. También tenemos una biblioteca.</text><rect x="20" y="316" width="600" height="52" rx="14" fill="#DCE4FF" stroke="#3A4BB5" stroke-width="3"/><text x="36" y="352" text-anchor="start" font-size="26" fill="#1E2A78">5. Allí hay cuentos y enciclopedias.</text><rect x="20" y="378" width="600" height="52" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/><text x="36" y="414" text-anchor="start" font-size="26" fill="#1E2A78">6. Los viernes leemos en voz alta.</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Un texto corto sobre el cuy</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="50" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Un texto sobre un animal</text>
<rect x="20" y="76" width="600" height="250" rx="14" fill="#FFFFFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="320.0" y="170" font-size="26" fill="#1B1F2A" text-anchor="middle">El cuy come pasto y hojas verdes.</text>
<text x="320.0" y="210" font-size="26" fill="#1B1F2A" text-anchor="middle">El cuy vive en jaulas o corrales.</text>
<text x="320.0" y="250" font-size="26" fill="#1B1F2A" text-anchor="middle">Al cuy le gusta estar con otros cuyes.</text>
<rect x="20" y="346" width="600" height="100" rx="14" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/>
<text x="320.0" y="406" font-size="28" font-weight="bold" fill="#1B1F2A" text-anchor="middle">¿De qué trata?</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Un texto, dos respuestas</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="46" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Un texto, dos respuestas</text>
<g transform="translate(0,36)">
<rect x="24" y="68" width="592" height="104" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/>
<text x="44" y="112" font-size="28" fill="#1E2A78" text-anchor="start">Inés abrazó a Mario. Ella</text>
<text x="44" y="150" font-size="28" fill="#1E2A78" text-anchor="start">sonrió.</text>
<rect x="24" y="186" width="592" height="104" rx="14" fill="#FBEAEA" stroke="#B91C1C" stroke-width="3"/>
<text x="82" y="230" font-size="28" font-weight="bold" fill="#8A1414" text-anchor="start">«Ella» es Mario, porque su</text>
<text x="82" y="268" font-size="28" font-weight="bold" fill="#8A1414" text-anchor="start">nombre está más cerca.</text>
<circle cx="50" cy="238" r="15" fill="#B91C1C"/><path d="M43 231 L57 245 M57 231 L43 245" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<rect x="24" y="304" width="592" height="66" rx="14" fill="#E3F3E1" stroke="#2F7D32" stroke-width="3"/>
<text x="82" y="348" font-size="28" font-weight="bold" fill="#1B5E20" text-anchor="start">«Ella» es Inés: es mujer.</text>
<circle cx="50" cy="337" r="15" fill="#2F7D32"/><path d="M42 337 L48 344 L59 329" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>

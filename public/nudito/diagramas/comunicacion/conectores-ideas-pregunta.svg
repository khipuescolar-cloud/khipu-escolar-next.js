<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Dos ideas sin conector</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="16" width="600" height="104" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="40" y="62" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#1E2A78">Idea 1</text>
<text x="40" y="98" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Había mucha neblina en la carretera.</text>
<rect x="20" y="360" width="600" height="104" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="40" y="406" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#1E2A78">Idea 2</text>
<text x="40" y="442" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">El bus llegó a tiempo a Huaraz.</text>
<rect x="120" y="160" width="400" height="160" rx="14" fill="#FFE9A8" stroke="#3A4BB5" stroke-width="3" stroke-dasharray="10 8"/>
<text x="320" y="260" font-family="Arial,sans-serif" font-size="80" font-weight="bold" fill="#3A4BB5" text-anchor="middle">?</text>
<text x="320" y="306" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78" text-anchor="middle">¿Cómo se relacionan?</text>
</svg>

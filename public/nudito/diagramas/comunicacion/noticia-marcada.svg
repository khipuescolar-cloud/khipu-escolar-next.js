<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Una noticia dividida en sus partes</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="14" width="600" height="100" rx="14" fill="#FFE9A8" stroke="#1E2A78" stroke-width="4"/>
<text x="320" y="52" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="middle">Titular</text>
<text x="320" y="94" fill="#1E2A78" font-size="26" font-weight="bold" text-anchor="middle">Estudiantes siembran 200 árboles</text>
<rect x="20" y="126" width="600" height="170" rx="14" fill="#D9F0EE" stroke="#0F7C7A" stroke-width="3"/>
<text x="320" y="164" fill="#0F7C7A" font-size="26" font-weight="bold" text-anchor="middle">Entrada</text>
<text x="320" y="206" fill="#1E2A78" font-size="26" text-anchor="middle">El sábado, estudiantes sembraron</text>
<text x="320" y="246" fill="#1E2A78" font-size="26" text-anchor="middle">200 árboles en la ribera del río Chili.</text>
<rect x="20" y="308" width="600" height="160" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="346" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="middle">Cuerpo</text>
<text x="320" y="388" fill="#1E2A78" font-size="26" text-anchor="middle">La municipalidad donó los plantones</text>
<text x="320" y="428" fill="#1E2A78" font-size="26" text-anchor="middle">y los estudiantes los regarán.</text>
</g>
</svg>

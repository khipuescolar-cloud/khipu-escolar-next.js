<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Apuntes de un reportero sobre una feria de ciencias</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="14" width="600" height="452" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="62" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#3A4BB5" text-anchor="middle">Apuntes: feria imaginaria</text>
<rect x="36" y="88" width="568" height="62" rx="14" fill="#E6EAFB" stroke="#3A4BB5" stroke-width="2"/>
<text x="50" y="128" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#3A4BB5">Qué</text>
<text x="190" y="128" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Feria de ciencias: 40 proyectos</text>
<rect x="36" y="162" width="568" height="62" rx="14" fill="#E6EAFB" stroke="#3A4BB5" stroke-width="2"/>
<text x="50" y="202" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#3A4BB5">Quién</text>
<text x="190" y="202" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Colegio Santa Rosa, sexto grado</text>
<rect x="36" y="236" width="568" height="62" rx="14" fill="#E6EAFB" stroke="#3A4BB5" stroke-width="2"/>
<text x="50" y="276" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#3A4BB5">Cuándo</text>
<text x="190" y="276" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Jueves por la mañana</text>
<rect x="36" y="310" width="568" height="62" rx="14" fill="#E6EAFB" stroke="#3A4BB5" stroke-width="2"/>
<text x="50" y="350" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#3A4BB5">Dónde</text>
<text x="190" y="350" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Patio del colegio, en Tacna</text>
<rect x="36" y="384" width="568" height="62" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="2" stroke-dasharray="10 8"/>
<text x="50" y="424" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#3A4BB5">Detalle</text>
<text x="190" y="424" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Ganó un filtro de agua con arena</text>
</svg>

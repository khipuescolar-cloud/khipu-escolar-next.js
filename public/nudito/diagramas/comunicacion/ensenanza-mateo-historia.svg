<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Historia corta de Mateo y su tarea</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="50" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Una historia corta</text>
<rect x="20" y="76" width="600" height="250" rx="14" fill="#FFFFFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="320.0" y="150" font-size="26" fill="#1B1F2A" text-anchor="middle">Mateo dejó su tarea para el</text>
<text x="320.0" y="190" font-size="26" fill="#1B1F2A" text-anchor="middle">último día. Cuando quiso hacerla,</text>
<text x="320.0" y="230" font-size="26" fill="#1B1F2A" text-anchor="middle">ya no tenía tiempo y llegó</text>
<text x="320.0" y="270" font-size="26" fill="#1B1F2A" text-anchor="middle">sin terminar.</text>
<rect x="20" y="346" width="600" height="100" rx="14" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/>
<text x="320.0" y="406" font-size="28" font-weight="bold" fill="#1B1F2A" text-anchor="middle">¿Qué nos enseña?</text>
</svg>

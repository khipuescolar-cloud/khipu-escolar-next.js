<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Una respuesta sin pista y otra con pista</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="50" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Cuida tu respuesta</text>
<rect x="20" y="76" width="600" height="170" rx="14" fill="#FBEAEA" stroke="#B91C1C" stroke-width="3"/>
<text x="320.0" y="134" font-size="26" font-weight="bold" fill="#8A1414" text-anchor="middle">«Tito es malo»</text>
<text x="320.0" y="170" font-size="26" fill="#8A1414" text-anchor="middle">El cuento no dice nada</text>
<text x="320.0" y="206" font-size="26" fill="#8A1414" text-anchor="middle">de eso.</text>
<circle cx="52" cy="108" r="17" fill="#B91C1C"/><path d="M45 101 L59 115 M59 101 L45 115" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
<rect x="20" y="276" width="600" height="170" rx="14" fill="#E3F3E1" stroke="#2F7D32" stroke-width="3"/>
<text x="320.0" y="352" font-size="26" font-weight="bold" fill="#1B5E20" text-anchor="middle">«Tito es amable porque</text>
<text x="320.0" y="388" font-size="26" font-weight="bold" fill="#1B5E20" text-anchor="middle">le trajo agua al perro»</text>
<circle cx="52" cy="308" r="17" fill="#2F7D32"/><path d="M44 308 L50 315 L61 301" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

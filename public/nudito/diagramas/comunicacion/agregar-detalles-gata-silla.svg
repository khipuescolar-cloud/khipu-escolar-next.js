<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>La gata duerme ampliada con el lugar</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="40" width="600" height="110" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="320" y="108" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#1E2A78" text-anchor="middle">La gata duerme</text><rect x="20" y="180" width="600" height="110" rx="14" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="320" y="248" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#1E2A78" text-anchor="middle">en la silla.</text><text x="320" y="350" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#8A5A00" text-anchor="middle">El detalle dice dónde.</text><text x="320" y="400" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">La idea sigue igual.</text>

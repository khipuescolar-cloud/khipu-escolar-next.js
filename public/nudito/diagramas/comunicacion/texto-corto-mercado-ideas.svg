<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Tres ideas sobre el mercado</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="50" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Tema: el mercado de mi barrio</text>
<rect x="20" y="76" width="600" height="104" rx="14" fill="#FFFFFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="320.0" y="137" font-size="26" fill="#1B1F2A" text-anchor="middle">En el mercado venden frutas.</text>
<rect x="20" y="200" width="600" height="104" rx="14" fill="#FFFFFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="320.0" y="261" font-size="26" fill="#1B1F2A" text-anchor="middle">Hay puestos de verduras.</text>
<rect x="20" y="324" width="600" height="104" rx="14" fill="#FFFFFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="320.0" y="385" font-size="26" fill="#1B1F2A" text-anchor="middle">Mi hermano juega con su trompo.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Análisis de la personificación del cerro</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="14" width="600" height="76" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="62" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78" text-anchor="middle">El cerro se puso su poncho de neblina;</text>
<rect x="20" y="116" width="210" height="90" rx="14" fill="#E6EAFB" stroke="#3A4BB5" stroke-width="3"/>
<text x="125" y="172" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">el cerro</text>
<text x="320" y="150" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#B4361F" text-anchor="middle">hace algo</text>
<text x="320" y="184" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#B4361F" text-anchor="middle">humano</text>
<path d="M232 161 H262 M378 161 H400" stroke="#B4361F" stroke-width="4"/>
<rect x="410" y="116" width="210" height="90" rx="14" fill="#E6EAFB" stroke="#3A4BB5" stroke-width="3"/>
<text x="515" y="162" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#1E2A78" text-anchor="middle">se puso su</text>
<text x="515" y="194" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#1E2A78" text-anchor="middle">poncho</text>
<text x="320" y="262" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78" text-anchor="middle">Un cerro no se viste: lo hacen las personas</text>
<rect x="20" y="292" width="600" height="172" rx="14" fill="#DFF3E6" stroke="#1F7A4D" stroke-width="3"/>
<text x="40" y="334" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1F7A4D">Efecto</text>
<text x="40" y="378" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">La neblina parece un abrigo y</text>
<text x="40" y="412" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">el paisaje se siente cercano y calmo.</text>
</svg>

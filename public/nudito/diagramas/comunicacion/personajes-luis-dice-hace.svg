<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Luis dice una cosa y hace otra</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="50" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Luis, en el recreo</text>
<rect x="20" y="76" width="290" height="210" rx="14" fill="#E8ECFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="165.0" y="154" font-size="26" font-weight="bold" fill="#1B1F2A" text-anchor="middle">Dice</text>
<text x="165.0" y="190" font-size="26" fill="#1B1F2A" text-anchor="middle">«Yo comparto</text>
<text x="165.0" y="226" font-size="26" fill="#1B1F2A" text-anchor="middle">mi lonche»</text>
<rect x="330" y="76" width="290" height="210" rx="14" fill="#F8E4EC" stroke="#A8325E" stroke-width="3"/>
<text x="475.0" y="154" font-size="26" font-weight="bold" fill="#1B1F2A" text-anchor="middle">Hace</text>
<text x="475.0" y="190" font-size="26" fill="#1B1F2A" text-anchor="middle">se come todo</text>
<text x="475.0" y="226" font-size="26" fill="#1B1F2A" text-anchor="middle">su lonche solo</text>
<rect x="20" y="320" width="600" height="110" rx="14" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/>
<text x="320.0" y="385" font-size="28" font-weight="bold" fill="#1B1F2A" text-anchor="middle">¿A cuál pista le creemos?</text>
</svg>

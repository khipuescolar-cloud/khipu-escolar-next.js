<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Anuncio de agua embotellada</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="16" width="600" height="372" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="70" font-family="Arial,sans-serif" font-size="38" font-weight="bold" fill="#3A4BB5" text-anchor="middle">AGUA CIELO AZUL</text>
<text x="320" y="130" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1E2A78" text-anchor="middle">«La mejor del mundo.</text>
<text x="320" y="170" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#1E2A78" text-anchor="middle">Nadie la supera.»</text>
<rect x="50" y="200" width="540" height="100" rx="14" fill="#E6EAFB" stroke="#3A4BB5" stroke-width="2"/>
<text x="320" y="242" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78" text-anchor="middle">Imagen: una deportista sonriente</text>
<text x="320" y="278" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78" text-anchor="middle">bebe de la botella</text>
<text x="320" y="334" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78" text-anchor="middle">Letra pequeña: agua mineral,</text>
<text x="320" y="364" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78" text-anchor="middle">botella de 500 ml.</text>
<rect x="20" y="400" width="600" height="64" rx="14" fill="#FFE9A8" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="442" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">¿Qué quiere lograr este anuncio?</text>
</svg>

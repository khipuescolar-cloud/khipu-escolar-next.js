<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Texto sobre camélidos andinos y dos resúmenes</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="16" y="10" width="608" height="166" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="32" y="50" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Los camélidos andinos son la alpaca, la</text>
<text x="32" y="84" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">llama, la vicuña y el guanaco. La alpaca</text>
<text x="32" y="118" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">y la llama son domésticas y dan fibra.</text>
<text x="32" y="152" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">La vicuña y el guanaco viven libres.</text>
<rect x="16" y="186" width="608" height="134" rx="14" fill="#E6EAFB" stroke="#3A4BB5" stroke-width="3"/>
<circle cx="52" cy="253" r="22" fill="#3A4BB5"/>
<text x="52" y="263" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">A</text>
<text x="90" y="226" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Los camélidos andinos son la alpaca,</text>
<text x="90" y="260" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">la llama, la vicuña y el guanaco. La</text>
<text x="90" y="294" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">alpaca y la llama son domésticas.</text>
<rect x="16" y="330" width="608" height="138" rx="14" fill="#E6EAFB" stroke="#3A4BB5" stroke-width="3"/>
<circle cx="52" cy="399" r="22" fill="#3A4BB5"/>
<text x="52" y="409" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#fff" text-anchor="middle">B</text>
<text x="90" y="372" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">Los camélidos andinos se dividen</text>
<text x="90" y="406" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">en domésticos, la alpaca y la llama,</text>
<text x="90" y="440" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78">y silvestres, la vicuña y el guanaco.</text>
</svg>

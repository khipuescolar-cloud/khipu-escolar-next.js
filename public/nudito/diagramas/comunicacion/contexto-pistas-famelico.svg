<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Pistas para entender famélico</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="14" width="600" height="230" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="62" fill="#1E2A78" font-size="26" text-anchor="middle">El perro estaba</text>
<rect x="190" y="80" width="260" height="56" rx="12" fill="#FFE9A8" stroke="#1E2A78" stroke-width="3"/>
<text x="320" y="120" fill="#1E2A78" font-size="26" font-weight="bold" text-anchor="middle">famélico</text>
<text x="320" y="172" fill="#0F7C7A" font-size="26" text-anchor="middle">no comía desde hacía días</text>
<path d="M110 182 H530" stroke="#0F7C7A" stroke-width="4"/>
<text x="320" y="222" fill="#0F7C7A" font-size="26" text-anchor="middle">y se le veían las costillas.</text>
<path d="M110 232 H530" stroke="#0F7C7A" stroke-width="4"/>
<rect x="20" y="264" width="600" height="200" rx="14" fill="#FFE9A8" stroke="#1E2A78" stroke-width="4"/>
<text x="320" y="314" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="middle">Pistas subrayadas</text>
<text x="320" y="366" fill="#1E2A78" font-size="26" text-anchor="middle">¿Cómo está un perro que no</text>
<text x="320" y="406" fill="#1E2A78" font-size="26" text-anchor="middle">come y se ve muy flaco?</text>
</g>
</svg>

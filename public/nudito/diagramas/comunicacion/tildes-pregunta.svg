<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Tres preguntas para decidir si balcon lleva tilde</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<text x="320" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#1E2A78">Palabra sin tilde</text><rect x="150" y="62" width="150" height="88" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/><rect x="320" y="62" width="170" height="88" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/><text x="225" y="122" text-anchor="middle" font-size="44" font-weight="bold" fill="#1E2A78">bal</text><text x="405" y="122" text-anchor="middle" font-size="44" font-weight="bold" fill="#1E2A78">con</text><rect x="20" y="176" width="600" height="84" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/><text x="36" y="228" text-anchor="start" font-size="26" fill="#1E2A78">1. ¿Dónde suena más fuerte?</text><rect x="490" y="188" width="110" height="60" rx="14" fill="#FFD966" stroke="#1E2A78" stroke-width="3"/><text x="545" y="230" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E2A78">?</text><rect x="20" y="276" width="600" height="84" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/><text x="36" y="328" text-anchor="start" font-size="26" fill="#1E2A78">2. ¿Aguda, grave o esdrújula?</text><rect x="490" y="288" width="110" height="60" rx="14" fill="#FFD966" stroke="#1E2A78" stroke-width="3"/><text x="545" y="330" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E2A78">?</text><rect x="20" y="376" width="600" height="84" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/><text x="36" y="428" text-anchor="start" font-size="26" fill="#1E2A78">3. ¿Con qué letra termina?</text><rect x="490" y="388" width="110" height="60" rx="14" fill="#FFD966" stroke="#1E2A78" stroke-width="3"/><text x="545" y="430" text-anchor="middle" font-size="38" font-weight="bold" fill="#1E2A78">?</text>
</g>
</svg>

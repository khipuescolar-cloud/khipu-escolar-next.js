<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Pistas del texto más lo que ya sé dan una inferencia</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="14" width="600" height="108" rx="14" fill="#DCE4FF" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="56" text-anchor="start" font-size="28" font-weight="bold" fill="#1E2A78">Pistas del texto</text><text x="40" y="98" text-anchor="start" font-size="26" fill="#1E2A78">lo que sí está escrito</text><text x="320" y="160" text-anchor="middle" font-size="44" font-weight="bold" fill="#1E2A78">+</text><rect x="20" y="176" width="600" height="108" rx="14" fill="#DCE4FF" stroke="#3A4BB5" stroke-width="3"/><text x="40" y="218" text-anchor="start" font-size="28" font-weight="bold" fill="#1E2A78">Lo que ya sé</text><text x="40" y="260" text-anchor="start" font-size="26" fill="#1E2A78">mi experiencia del mundo</text><text x="320" y="326" text-anchor="middle" font-size="44" font-weight="bold" fill="#1E2A78">=</text><rect x="20" y="342" width="600" height="128" rx="14" fill="#FFD966" stroke="#1E2A78" stroke-width="3"/><text x="40" y="384" text-anchor="start" font-size="28" font-weight="bold" fill="#1E2A78">Inferencia</text><text x="40" y="422" text-anchor="start" font-size="26" fill="#1E2A78">lo que el texto no dice con</text><text x="40" y="456" text-anchor="start" font-size="26" fill="#1E2A78">todas las letras, pero se entiende</text>
</g>
</svg>

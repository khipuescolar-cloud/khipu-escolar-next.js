<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Tres pistas de la adivinanza llevan a un libro</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="16" width="600" height="100" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="40" y="58" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78">«Tiene hojas y no es árbol»</text><text x="40" y="98" font-family="Arial,sans-serif" font-size="28" fill="#0F7C7A">→ las páginas</text><rect x="20" y="130" width="600" height="100" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="40" y="172" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78">«Tiene lomo y no es caballo»</text><text x="40" y="212" font-family="Arial,sans-serif" font-size="28" fill="#0F7C7A">→ el lomo del libro</text><rect x="20" y="244" width="600" height="100" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="40" y="286" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78">«Te cuenta mil historias»</text><text x="40" y="326" font-family="Arial,sans-serif" font-size="28" fill="#0F7C7A">→ se lee</text><rect x="20" y="366" width="600" height="90" rx="14" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="320" y="424" font-family="Arial,sans-serif" font-size="34" font-weight="bold" fill="#1E2A78" text-anchor="middle">Es un libro.</text>
</svg>

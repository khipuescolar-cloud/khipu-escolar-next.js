<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Opinar con razón y no solo contar</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="50" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Una opinión necesita razón</text>
<rect x="20" y="70" width="600" height="110" rx="14" fill="#FBEAEA" stroke="#B91C1C" stroke-width="3"/>
<text x="320.0" y="116" font-size="26" font-weight="bold" fill="#8A1414" text-anchor="middle">Solo cuenta</text>
<text x="320.0" y="152" font-size="26" fill="#8A1414" text-anchor="middle">«Recogieron botellas y bolsas.»</text>
<circle cx="52" cy="96" r="17" fill="#B91C1C"/><path d="M45 89 L59 103 M59 89 L45 103" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
<rect x="20" y="195" width="600" height="110" rx="14" fill="#FBEAEA" stroke="#B91C1C" stroke-width="3"/>
<text x="320.0" y="241" font-size="26" font-weight="bold" fill="#8A1414" text-anchor="middle">Sin razón</text>
<text x="320.0" y="277" font-size="26" fill="#8A1414" text-anchor="middle">«Me gustó porque sí.»</text>
<circle cx="52" cy="221" r="17" fill="#B91C1C"/><path d="M45 214 L59 228 M59 214 L45 228" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
<rect x="20" y="320" width="600" height="130" rx="14" fill="#E3F3E1" stroke="#2F7D32" stroke-width="3"/>
<text x="320.0" y="358" font-size="26" font-weight="bold" fill="#1B5E20" text-anchor="middle">Opinión con razón</text>
<text x="320.0" y="394" font-size="26" fill="#1B5E20" text-anchor="middle">«Creo que hicieron bien porque</text>
<text x="320.0" y="430" font-size="26" fill="#1B5E20" text-anchor="middle">dejaron limpio el río.»</text>
<circle cx="52" cy="346" r="17" fill="#2F7D32"/><path d="M44 346 L50 353 L61 339" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

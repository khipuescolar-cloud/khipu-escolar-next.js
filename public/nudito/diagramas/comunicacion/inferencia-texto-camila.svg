<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Fragmento sobre Camila en el colegio</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="16" width="600" height="320" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="40" y="68" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">Camila repasó sus cuadernos toda</text>
<text x="40" y="114" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">la noche. Al día siguiente llegó</text>
<text x="40" y="160" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">temprano y no abrió la mochila en</text>
<text x="40" y="206" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">el recreo. Cuando la profesora</text>
<text x="40" y="252" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">repartió las hojas, Camila sonrió y</text>
<text x="40" y="298" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">empezó a escribir sin dudar.</text>
<rect x="20" y="360" width="600" height="104" rx="14" fill="#FFE9A8" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="424" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">¿Qué ocurrió ese día en el aula?</text>
</svg>

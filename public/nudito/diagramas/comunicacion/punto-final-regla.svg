<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Una oración con mayúscula y punto</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="50" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Una oración bien escrita</text>
<rect x="20" y="76" width="600" height="130" rx="14" fill="#FFFFFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="152" font-size="34" text-anchor="middle" fill="#1B1F2A"><tspan fill="#A8325E" font-weight="bold">M</tspan><tspan>i abuelo siembra papas</tspan><tspan fill="#A8325E" font-weight="bold" font-size="52">.</tspan></text>
<line x1="150" y1="296" x2="122" y2="216" stroke="#A8325E" stroke-width="5" stroke-linecap="round"/>
<polygon points="122,216 134,227 119,232" fill="#A8325E"/>
<line x1="490" y1="296" x2="520" y2="216" stroke="#A8325E" stroke-width="5" stroke-linecap="round"/>
<polygon points="520,216 522,232 508,226" fill="#A8325E"/>
<rect x="20" y="300" width="290" height="130" rx="14" fill="#E8ECFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="165.0" y="356" font-size="26" font-weight="bold" fill="#1B1F2A" text-anchor="middle">Empieza con</text>
<text x="165.0" y="392" font-size="26" fill="#1B1F2A" text-anchor="middle">mayúscula</text>
<rect x="330" y="300" width="290" height="130" rx="14" fill="#E8ECFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="475.0" y="356" font-size="26" font-weight="bold" fill="#1B1F2A" text-anchor="middle">Termina con</text>
<text x="475.0" y="392" font-size="26" fill="#1B1F2A" text-anchor="middle">punto</text>
</svg>

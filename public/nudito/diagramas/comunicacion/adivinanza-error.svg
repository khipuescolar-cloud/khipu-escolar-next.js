<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Una sola pista o todas</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="46" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Una sola pista o todas</text>
<g transform="translate(0,8)">
<rect x="24" y="68" width="592" height="142" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/>
<text x="44" y="112" font-size="28" fill="#1E2A78" text-anchor="start">Me abro como una flor y no</text>
<text x="44" y="150" font-size="28" fill="#1E2A78" text-anchor="start">tengo pétalos; cuando llueve,</text>
<text x="44" y="188" font-size="28" fill="#1E2A78" text-anchor="start">te protejo.</text>
<rect x="24" y="224" width="592" height="104" rx="14" fill="#FBEAEA" stroke="#B91C1C" stroke-width="3"/>
<text x="82" y="268" font-size="28" font-weight="bold" fill="#8A1414" text-anchor="start">Una puerta, porque «me</text>
<text x="82" y="306" font-size="28" font-weight="bold" fill="#8A1414" text-anchor="start">abro».</text>
<circle cx="50" cy="276" r="15" fill="#B91C1C"/><path d="M43 269 L57 283 M57 269 L43 283" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<rect x="24" y="342" width="592" height="104" rx="14" fill="#E3F3E1" stroke="#2F7D32" stroke-width="3"/>
<text x="82" y="386" font-size="28" font-weight="bold" fill="#1B5E20" text-anchor="start">Un paraguas: encaja con</text>
<text x="82" y="424" font-size="28" font-weight="bold" fill="#1B5E20" text-anchor="start">todas las pistas.</text>
<circle cx="50" cy="394" r="15" fill="#2F7D32"/><path d="M42 394 L48 401 L59 386" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>

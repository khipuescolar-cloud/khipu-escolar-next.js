<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Mira las dos cosas</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="46" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Mira las dos cosas</text>
<rect x="24" y="64" width="592" height="142" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/>
<text x="44" y="106" font-size="28" fill="#1E2A78" text-anchor="start">Beto tiene un gorro rojo. Lía</text>
<text x="44" y="144" font-size="28" fill="#1E2A78" text-anchor="start">tiene un gorro azul. Los dos</text>
<text x="44" y="182" font-size="28" fill="#1E2A78" text-anchor="start">gorros son de lana.</text>
<rect x="24" y="220" width="592" height="104" rx="14" fill="#FBEAEA" stroke="#B91C1C" stroke-width="3"/>
<text x="82" y="262" font-size="28" font-weight="bold" fill="#8A1414" text-anchor="start">Solo se diferencian: uno es</text>
<text x="82" y="300" font-size="28" font-weight="bold" fill="#8A1414" text-anchor="start">rojo y el otro azul.</text>
<circle cx="50" cy="272" r="15" fill="#B91C1C"/><path d="M43 265 L57 279 M57 265 L43 279" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<rect x="24" y="338" width="592" height="104" rx="14" fill="#E3F3E1" stroke="#2F7D32" stroke-width="3"/>
<text x="82" y="380" font-size="28" font-weight="bold" fill="#1B5E20" text-anchor="start">También se parecen: los dos</text>
<text x="82" y="418" font-size="28" font-weight="bold" fill="#1B5E20" text-anchor="start">gorros son de lana.</text>
<circle cx="50" cy="390" r="15" fill="#2F7D32"/><path d="M42 390 L48 397 L59 382" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

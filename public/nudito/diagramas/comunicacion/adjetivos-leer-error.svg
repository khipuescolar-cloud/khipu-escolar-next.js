<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Acción o adjetivo</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="46" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Acción o adjetivo</text>
<g transform="translate(0,36)">
<rect x="24" y="68" width="592" height="66" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/>
<text x="44" y="112" font-size="28" fill="#1E2A78" text-anchor="start">Nora saludó bajito.</text>
<rect x="24" y="148" width="592" height="66" rx="14" fill="#FBEAEA" stroke="#B91C1C" stroke-width="3"/>
<text x="82" y="192" font-size="28" font-weight="bold" fill="#8A1414" text-anchor="start">«Saludó» dice cómo es Nora.</text>
<circle cx="50" cy="181" r="15" fill="#B91C1C"/><path d="M43 174 L57 188 M57 174 L43 188" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<rect x="24" y="228" width="592" height="104" rx="14" fill="#E3F3E1" stroke="#2F7D32" stroke-width="3"/>
<text x="82" y="272" font-size="28" font-weight="bold" fill="#1B5E20" text-anchor="start">«Saludó» es lo que hace.</text>
<text x="82" y="310" font-size="28" font-weight="bold" fill="#1B5E20" text-anchor="start">«Tímida» dice cómo es.</text>
<circle cx="50" cy="280" r="15" fill="#2F7D32"/><path d="M42 280 L48 287 L59 272" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Solo lo que dice el texto</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="46" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Solo lo que dice el texto</text>
<rect x="24" y="64" width="592" height="104" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/>
<text x="44" y="106" font-size="28" fill="#1E2A78" text-anchor="start">Pedro abrió una caja chiquita. La</text>
<text x="44" y="144" font-size="28" fill="#1E2A78" text-anchor="start">levantó con un dedo.</text>
<rect x="24" y="182" width="592" height="66" rx="14" fill="#FBEAEA" stroke="#B91C1C" stroke-width="3"/>
<text x="82" y="224" font-size="28" font-weight="bold" fill="#8A1414" text-anchor="start">La caja es roja.</text>
<circle cx="50" cy="215" r="15" fill="#B91C1C"/><path d="M43 208 L57 222 M57 208 L43 222" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<rect x="24" y="262" width="592" height="142" rx="14" fill="#E3F3E1" stroke="#2F7D32" stroke-width="3"/>
<text x="82" y="304" font-size="28" font-weight="bold" fill="#1B5E20" text-anchor="start">El texto no dice el color.</text>
<text x="82" y="342" font-size="28" font-weight="bold" fill="#1B5E20" text-anchor="start">Dice que es chiquita y fácil</text>
<text x="82" y="380" font-size="28" font-weight="bold" fill="#1B5E20" text-anchor="start">de levantar.</text>
<circle cx="50" cy="333" r="15" fill="#2F7D32"/><path d="M42 333 L48 340 L59 325" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

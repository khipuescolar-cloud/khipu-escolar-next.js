<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Lista con comas y la palabra y</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="50" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Una lista con comas</text>
<rect x="20" y="76" width="600" height="140" rx="14" fill="#FFFFFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="138" font-size="26" text-anchor="middle" fill="#1B1F2A"><tspan fill="#1B1F2A">En mi mochila hay cuadernos</tspan><tspan fill="#A8325E" font-weight="bold" font-size="48">,</tspan><tspan fill="#1B1F2A">&#160;lápices</tspan><tspan fill="#A8325E" font-weight="bold" font-size="48">,</tspan></text>
<text x="320" y="184" font-size="26" text-anchor="middle" fill="#1B1F2A"><tspan fill="#1B1F2A">colores&#160;</tspan><tspan fill="#A8325E" font-weight="bold">y</tspan><tspan fill="#1B1F2A">&#160;tijeras.</tspan></text>
<rect x="20" y="240" width="290" height="200" rx="14" fill="#E8ECFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="165.0" y="313" font-size="26" font-weight="bold" fill="#1B1F2A" text-anchor="middle">La coma</text>
<text x="165.0" y="349" font-size="26" fill="#1B1F2A" text-anchor="middle">separa cada</text>
<text x="165.0" y="385" font-size="26" fill="#1B1F2A" text-anchor="middle">elemento</text>
<rect x="330" y="240" width="290" height="200" rx="14" fill="#E8ECFF" stroke="#3A4BB5" stroke-width="3"/>
<text x="475.0" y="313" font-size="26" font-weight="bold" fill="#1B1F2A" text-anchor="middle">Antes del</text>
<text x="475.0" y="349" font-size="26" fill="#1B1F2A" text-anchor="middle">último va «y»,</text>
<text x="475.0" y="385" font-size="26" fill="#1B1F2A" text-anchor="middle">sin coma</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Idea ampliada con cuándo y con quién</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="20" width="600" height="80" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="320" y="72" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Fui al parque.</text><rect x="20" y="120" width="600" height="100" rx="14" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="320" y="172" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Fui el domingo.</text><rect x="20" y="240" width="600" height="100" rx="14" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="320" y="292" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Fui con mi primo.</text><text x="320" y="396" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">Dos datos nuevos:</text><text x="320" y="436" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#8A5A00" text-anchor="middle">cuándo y con quién.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Letras y sílabas</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="46" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Letras y sílabas</text>
<rect x="24" y="64" width="592" height="66" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/>
<text x="44" y="106" font-size="28" fill="#1E2A78" text-anchor="start">Sapo</text>
<rect x="24" y="144" width="592" height="104" rx="14" fill="#FBEAEA" stroke="#B91C1C" stroke-width="3"/>
<text x="82" y="186" font-size="28" font-weight="bold" fill="#8A1414" text-anchor="start">Sapo tiene cuatro sílabas</text>
<text x="82" y="224" font-size="28" font-weight="bold" fill="#8A1414" text-anchor="start">porque tiene cuatro letras.</text>
<circle cx="50" cy="196" r="15" fill="#B91C1C"/><path d="M43 189 L57 203 M57 189 L43 203" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<rect x="24" y="262" width="592" height="104" rx="14" fill="#E3F3E1" stroke="#2F7D32" stroke-width="3"/>
<text x="82" y="304" font-size="28" font-weight="bold" fill="#1B5E20" text-anchor="start">No. Se dice sa-po: dos golpes</text>
<text x="82" y="342" font-size="28" font-weight="bold" fill="#1B5E20" text-anchor="start">de voz, dos sílabas.</text>
<circle cx="50" cy="314" r="15" fill="#2F7D32"/><path d="M42 314 L48 321 L59 306" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

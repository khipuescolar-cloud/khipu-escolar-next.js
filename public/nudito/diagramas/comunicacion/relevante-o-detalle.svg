<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Información relevante y detalles</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="14" width="600" height="150" rx="14" fill="#D9F0EE" stroke="#0F7C7A" stroke-width="4"/>
<text x="320" y="58" fill="#0F7C7A" font-size="26" font-weight="bold" text-anchor="middle">Relevante</text>
<text x="320" y="104" fill="#1E2A78" font-size="26" text-anchor="middle">Responde qué, quién,</text>
<text x="320" y="142" fill="#1E2A78" font-size="26" text-anchor="middle">cuándo o dónde.</text>
<rect x="20" y="178" width="600" height="150" rx="14" fill="#EFEFEF" stroke="#6B6B6B" stroke-width="3" stroke-dasharray="8 6"/>
<text x="320" y="222" fill="#6B6B6B" font-size="26" font-weight="bold" text-anchor="middle">Detalle</text>
<text x="320" y="268" fill="#6B6B6B" font-size="26" text-anchor="middle">Adorna. Si lo quitas, la idea</text>
<text x="320" y="306" fill="#6B6B6B" font-size="26" text-anchor="middle">principal sigue igual.</text>
<rect x="20" y="342" width="600" height="124" rx="14" fill="#FFE9A8" stroke="#1E2A78" stroke-width="4"/>
<text x="320" y="390" fill="#1E2A78" font-size="26" font-weight="bold" text-anchor="middle">¿Lo necesito para</text>
<text x="320" y="432" fill="#1E2A78" font-size="26" font-weight="bold" text-anchor="middle">entender el texto?</text>
</g>
</svg>

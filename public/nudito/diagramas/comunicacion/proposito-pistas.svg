<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Propósitos del autor y pistas para reconocerlos</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g stroke="#3A4BB5" stroke-width="3" fill="#fff">
<rect x="20" y="18" width="600" height="100" rx="14"/><rect x="20" y="130" width="600" height="100" rx="14"/>
<rect x="20" y="242" width="600" height="100" rx="14"/><rect x="20" y="354" width="600" height="100" rx="14"/></g>
<g font-family="Arial,sans-serif" fill="#3A4BB5" font-size="30" font-weight="bold">
<text x="40" y="62">Informar</text><text x="40" y="174">Convencer</text><text x="40" y="286">Entretener</text><text x="40" y="398">Enseñar</text></g>
<g font-family="Arial,sans-serif" fill="#1E2A78" font-size="26">
<text x="40" y="100">da datos y casi no opina</text>
<text x="40" y="212">pide y da razones</text>
<text x="40" y="324">cuenta algo divertido</text>
<text x="40" y="436">explica cómo se hace algo</text></g>
</svg>

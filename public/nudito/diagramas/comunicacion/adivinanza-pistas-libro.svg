<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Adivinanza con pistas sobre hojas y cuentos</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="14" width="600" height="68" rx="14" fill="#FCF0D6" stroke="#FCF0D6" stroke-width="3"/><text x="40" y="58" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78">Escucha las pistas:</text><rect x="20" y="96" width="600" height="68" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="320.0" y="140" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">Tengo hojas de papel,</text><rect x="20" y="178" width="600" height="68" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="320.0" y="222" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">pero no soy un árbol.</text><rect x="20" y="260" width="600" height="68" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="320.0" y="304" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">Guardo cuentos.</text><rect x="20" y="342" width="600" height="68" rx="14" fill="#FFE9A8" stroke="#1E2A78" stroke-width="3"/><text x="320.0" y="386" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">¿Qué soy?</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Idea ampliada con dos oraciones de detalle</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="20" width="600" height="80" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="320" y="72" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Mi abuela cocina.</text><rect x="20" y="120" width="600" height="100" rx="14" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="320" y="172" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Cocina mazamorra morada.</text><rect x="20" y="240" width="600" height="100" rx="14" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="320" y="292" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Lo hace en su casa de Ica.</text><text x="320" y="396" font-family="Arial,sans-serif" font-size="28" fill="#1E2A78" text-anchor="middle">Cada oración añade un dato nuevo</text><text x="320" y="436" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#8A5A00" text-anchor="middle">sobre la misma idea.</text>
</svg>

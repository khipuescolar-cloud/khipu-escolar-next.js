<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Cartel con lo relevante resaltado</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="14" width="600" height="330" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="4"/>
<rect x="34" y="28" width="572" height="64" rx="10" fill="#FFD25A" stroke="#FFD25A" stroke-width="0"/>
<text x="320" y="72" fill="#1E2A78" font-size="26" font-weight="bold" text-anchor="middle">Feria del libro en Tarma</text>
<rect x="34" y="112" width="572" height="64" rx="10" fill="#FFD25A" stroke="#FFD25A" stroke-width="0"/>
<text x="320" y="156" fill="#1E2A78" font-size="26" text-anchor="middle">Viernes 5 de julio, de 3 a 6 p. m.</text>
<rect x="34" y="196" width="572" height="64" rx="10" fill="#FFD25A" stroke="#FFD25A" stroke-width="0"/>
<text x="320" y="240" fill="#1E2A78" font-size="26" text-anchor="middle">En la plaza principal</text>
<rect x="34" y="280" width="572" height="50" rx="10" fill="#DADADA" stroke="#DADADA" stroke-width="0"/>
<text x="320" y="318" fill="#6B6B6B" font-size="26" text-anchor="middle">Mi prima estrenó zapatillas.</text>
<rect x="20" y="360" width="30" height="30" rx="6" fill="#FFD25A" stroke="#1E2A78" stroke-width="3"/>
<text x="62" y="386" fill="#1E2A78" font-size="26" text-anchor="start">Relevante</text>
<rect x="260" y="360" width="30" height="30" rx="6" fill="#DADADA" stroke="#6B6B6B" stroke-width="3"/>
<text x="302" y="386" fill="#6B6B6B" font-size="26" text-anchor="start">Detalle</text>
<text x="320" y="448" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="middle">El detalle no ayuda a asistir.</text>
</g>
</svg>

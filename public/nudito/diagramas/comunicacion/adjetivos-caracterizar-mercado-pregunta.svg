<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" font-family="Arial,sans-serif">
<title>Describir el mercado</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<text x="320" y="46" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">Describir el mercado</text>
<g transform="translate(0,36)">
<rect x="24" y="72" width="592" height="142" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/>
<text x="44" y="116" font-size="28" fill="#1E2A78" text-anchor="start">El mercado es bonito. Tiene</text>
<text x="44" y="154" font-size="28" fill="#1E2A78" text-anchor="start">frutas de muchos colores y</text>
<text x="44" y="192" font-size="28" fill="#1E2A78" text-anchor="start">mucha gente que habla fuerte.</text>
<rect x="24" y="234" width="592" height="104" rx="14" fill="#FFF3D1" stroke="#F2B84B" stroke-width="3"/>
<text x="44" y="278" font-size="28" font-weight="bold" fill="#8A5A00" text-anchor="start">¿Qué dos adjetivos precisos</text>
<text x="44" y="316" font-size="28" font-weight="bold" fill="#8A5A00" text-anchor="start">usarías?</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>«Porque» va antes de la razón</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="14" width="600" height="200" rx="14" fill="#fff" stroke="#B91C1C" stroke-width="4"/>
<path d="M48 48 L72 72 M72 48 L48 72" stroke="#B91C1C" stroke-width="6" stroke-linecap="round"/>
<text x="100" y="66" fill="#B91C1C" font-size="26" font-weight="bold" text-anchor="start">Al revés</text>
<text x="320" y="126" fill="#1E2A78" font-size="26" text-anchor="middle">Hacía frío porque me abrigué.</text>
<text x="320" y="176" fill="#6B6B6B" font-size="26" text-anchor="middle">La razón quedó después del resultado.</text>
<rect x="20" y="240" width="600" height="200" rx="14" fill="#fff" stroke="#166534" stroke-width="4"/>
<path d="M46 286 L56 297 L74 274" fill="none" stroke="#166534" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="292" fill="#166534" font-size="26" font-weight="bold" text-anchor="start">Bien</text>
<text x="320" y="352" fill="#1E2A78" font-size="26" text-anchor="middle">Me abrigué porque hacía frío.</text>
<text x="320" y="402" fill="#6B6B6B" font-size="26" text-anchor="middle">«Porque» va antes de la razón.</text>
</g>
</svg>

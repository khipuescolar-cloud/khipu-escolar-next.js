<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Tres versos sobre una mañana en la sierra</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<rect x="20" y="16" width="600" height="330" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="68" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#3A4BB5" text-anchor="middle">Mañana en la sierra</text>
<text x="320" y="140" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78" text-anchor="middle">El cerro se puso su poncho de neblina;</text>
<text x="320" y="208" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78" text-anchor="middle">la acequia, como una cinta de plata,</text>
<text x="320" y="276" font-family="Arial,sans-serif" font-size="26" fill="#1E2A78" text-anchor="middle">corría brillando entre los maizales.</text>
<rect x="20" y="366" width="600" height="98" rx="14" fill="#FFE9A8" stroke="#3A4BB5" stroke-width="3"/>
<text x="320" y="408" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">¿Qué imagen despierta</text>
<text x="320" y="444" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#1E2A78" text-anchor="middle">cada verso en quien lo lee?</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img">
<title>Partes de un texto instructivo</title>
<rect width="640" height="480" rx="24" fill="#FCF0D6"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="14" width="600" height="70" rx="14" fill="#FFE9A8" stroke="#1E2A78" stroke-width="5"/>
<text x="320" y="62" fill="#1E2A78" font-size="26" font-weight="bold" text-anchor="middle">Cómo sembrar un frijol</text>
<rect x="20" y="98" width="600" height="90" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="40" y="138" fill="#0F7C7A" font-size="26" font-weight="bold" text-anchor="start">Materiales</text>
<text x="40" y="176" fill="#1E2A78" font-size="26" text-anchor="start">1 frijol, algodón y un vaso</text>
<rect x="20" y="200" width="600" height="270" rx="14" fill="#fff" stroke="#3A4BB5" stroke-width="3"/>
<text x="40" y="240" fill="#3A4BB5" font-size="26" font-weight="bold" text-anchor="start">Pasos</text>
<text x="40" y="286" fill="#1E2A78" font-size="26" text-anchor="start">1. Pon el algodón en el vaso.</text>
<text x="40" y="328" fill="#1E2A78" font-size="26" text-anchor="start">2. Moja el algodón.</text>
<text x="40" y="370" fill="#1E2A78" font-size="26" text-anchor="start">3. Pon el frijol sobre el algodón.</text>
<text x="40" y="412" fill="#1E2A78" font-size="26" text-anchor="start">4. Deja el vaso junto a la ventana.</text>
<text x="40" y="454" fill="#1E2A78" font-size="26" text-anchor="start">5. Riega un poco cada día.</text>
</g>
</svg>

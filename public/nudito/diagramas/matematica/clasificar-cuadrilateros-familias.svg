<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres figuras de cuatro lados con su nombre: paralelogramo, trapecio y trapezoide"><title>Tres figuras de cuatro lados con su nombre: paralelogramo, trapecio y trapezoide</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="48" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">Tres familias</text><path d="M 60 160 L 170 160 L 210 100 L 100 100 Z" fill="#CDE7E4" stroke="#1E2A78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="250" y="128.0" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">Paralelogramo</text><text x="250" y="164.0" font-family="sans-serif" font-size="26" font-weight="700" fill="#8A5A00" text-anchor="start">dos pares</text><path d="M 60 290 L 210 290 L 170 225 L 100 225 Z" fill="#CDE7E4" stroke="#1E2A78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="250" y="255.5" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">Trapecio</text><text x="250" y="291.5" font-family="sans-serif" font-size="26" font-weight="700" fill="#8A5A00" text-anchor="start">un par</text><path d="M 55 425 L 200 410 L 175 350 L 95 340 Z" fill="#CDE7E4" stroke="#1E2A78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="250" y="379.25" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">Trapezoide</text><text x="250" y="415.25" font-family="sans-serif" font-size="26" font-weight="700" fill="#8A5A00" text-anchor="start">ningún par</text></svg>
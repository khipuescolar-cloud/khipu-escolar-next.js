<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title">
<title>Comprobación de sesenta y ocho entre ocho</title>
<rect width="640" height="480" fill="#FCF0D6"/>

<text x="320" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78">68 ÷ 8 = 8, residuo 4</text>
<rect x="65" y="100" width="510" height="250" rx="24" fill="#fff"/>
<text x="320" y="185" text-anchor="middle" font-family="sans-serif" font-size="46" font-weight="700" fill="#0C706E">8 × 8 + 4</text>
<path d="M190 225H450" stroke="#F2B84B" stroke-width="10" stroke-linecap="round"/>
<text x="320" y="295" text-anchor="middle" font-family="sans-serif" font-size="46" font-weight="700" fill="#1E2A78">64 + 4 = 68</text>
<text x="320" y="420" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#8A5A00">La cuenta recupera el dividendo</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres cajas con ocho cuyes cada una y cuatro cajas con seis cuyes cada una; en ambos lados hay veinticuatro cuyes"><title>Tres cajas con ocho cuyes cada una y cuatro cajas con seis cuyes cada una; en ambos lados hay veinticuatro cuyes</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="56" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Los cuyes de don Pepe y doña Rita</text><rect x="30" y="130" width="76" height="80" rx="8" fill="#E2F3F1" stroke="#0F7C7A" stroke-width="4"/><text x="68" y="182" font-family="sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">8</text><rect x="116" y="130" width="76" height="80" rx="8" fill="#E2F3F1" stroke="#0F7C7A" stroke-width="4"/><text x="154" y="182" font-family="sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">8</text><rect x="202" y="130" width="76" height="80" rx="8" fill="#E2F3F1" stroke="#0F7C7A" stroke-width="4"/><text x="240" y="182" font-family="sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">8</text><rect x="350" y="130" width="60" height="80" rx="8" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="380" y="182" font-family="sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">6</text><rect x="418" y="130" width="60" height="80" rx="8" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="448" y="182" font-family="sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">6</text><rect x="486" y="130" width="60" height="80" rx="8" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="516" y="182" font-family="sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">6</text><rect x="554" y="130" width="60" height="80" rx="8" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="584" y="182" font-family="sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">6</text><text x="314" y="185" font-family="sans-serif" font-size="50" font-weight="700" fill="#1E2A78" text-anchor="middle">=</text><text x="154" y="262" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">3 cajas de 8</text><text x="482" y="262" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">4 cajas de 6</text><text x="154" y="310" font-family="sans-serif" font-size="36" font-weight="700" fill="#0F7C7A" text-anchor="middle">24</text><text x="482" y="310" font-family="sans-serif" font-size="36" font-weight="700" fill="#0F7C7A" text-anchor="middle">24</text><text x="320" y="400" font-family="sans-serif" font-size="38" font-weight="700" fill="#1E2A78" text-anchor="middle">3 × 8 = 4 × 6</text><text x="320" y="450" font-family="sans-serif" font-size="28" font-weight="700" fill="#0F7C7A" text-anchor="middle">24 ÷ 4 = 6 cuyes por caja</text></svg>

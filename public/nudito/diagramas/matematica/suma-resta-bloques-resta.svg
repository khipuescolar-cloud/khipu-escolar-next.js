<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="De cinco barras y tres cubitos se quitan dos barras y un cubito, y quedan tres barras y dos cubitos"><title>De cinco barras y tres cubitos se quitan dos barras y un cubito, y quedan tres barras y dos cubitos</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="56" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">53 − 21 sin canje</text><text x="200" y="100" font-family="sans-serif" font-size="26" font-weight="700" fill="#0F7C7A" text-anchor="middle">Decenas</text><text x="450" y="100" font-family="sans-serif" font-size="26" font-weight="700" fill="#0F7C7A" text-anchor="middle">Unidades</text><rect x="60" y="115" width="36" height="70" rx="5" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><rect x="108" y="115" width="36" height="70" rx="5" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><rect x="156" y="115" width="36" height="70" rx="5" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><rect x="204" y="115" width="36" height="70" rx="5" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" stroke-dasharray="6 5"/><rect x="252" y="115" width="36" height="70" rx="5" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" stroke-dasharray="6 5"/><rect x="400" y="149" width="36" height="36" rx="5" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><rect x="448" y="149" width="36" height="36" rx="5" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><rect x="496" y="149" width="36" height="36" rx="5" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" stroke-dasharray="6 5"/><text x="596" y="170" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">53</text><text x="320" y="250" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">se quitan 2 barras y 1 cubito (−21)</text><rect x="60" y="285" width="36" height="70" rx="5" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><rect x="108" y="285" width="36" height="70" rx="5" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><rect x="156" y="285" width="36" height="70" rx="5" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><rect x="400" y="319" width="36" height="36" rx="5" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><rect x="448" y="319" width="36" height="36" rx="5" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="596" y="340" font-family="sans-serif" font-size="34" font-weight="700" fill="#0F7C7A" text-anchor="middle">32</text><text x="320" y="440" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">5 − 2 = 3 decenas; 3 − 1 = 2 unidades</text></svg>

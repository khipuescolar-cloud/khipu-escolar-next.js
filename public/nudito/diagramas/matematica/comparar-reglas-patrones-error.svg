<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title">
<title>Mismo inicio no significa misma regla</title>
<rect width="640" height="480" fill="#FCF0D6"/>

<text x="320" y="50" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78">El inicio no basta</text>
<rect x="55" y="95" width="530" height="210" rx="24" fill="#fff"/>
<text x="90" y="165" font-family="sans-serif" font-size="30" fill="#0C706E">8 → 11 → 14</text><text x="450" y="165" font-family="sans-serif" font-size="28" fill="#8A5A00">+3</text>
<text x="90" y="260" font-family="sans-serif" font-size="30" fill="#0C706E">8 → 13 → 18</text><text x="450" y="260" font-family="sans-serif" font-size="28" fill="#8A5A00">+5</text>
<text x="320" y="390" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#1E2A78">Compara el cambio entre términos</text>
</svg>

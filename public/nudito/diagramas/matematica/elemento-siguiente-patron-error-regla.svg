<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Patrón tres, seis, doce y veinticuatro junto a una regla de sumar tres tachada porque no sirve en todos los pasos.">
  <title>Una regla debe funcionar siempre</title>
  <rect width="640" height="480" rx="32" fill="#FCF0D6"/>
  <text x="320" y="58" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78">Prueba la regla en cada salto</text>
  <text x="320" y="155" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="700" fill="#1E2A78">3 → 6 → 12 → 24</text>
  <rect x="80" y="215" width="480" height="92" rx="20" fill="#FFFFFF" stroke="#B5412A" stroke-width="5"/>
  <text x="320" y="273" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="700" fill="#B5412A">“Siempre sumo tres”</text>
  <path d="M502 238 L538 274 M538 238 L502 274" stroke="#B5412A" stroke-width="9" stroke-linecap="round"/>
  <text x="320" y="382" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#0C706E">Se duplica en cada paso</text>
</svg>

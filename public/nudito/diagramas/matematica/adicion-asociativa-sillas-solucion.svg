text x="320" y="108" font-family="sans-serif" font-size="30" font-weight="700" fill="#0F7C7A" text-anchor="middle">125 + 75 = 200</text><text x="320" y="390" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">(125 + 75) + 36 = 200 + 36</text><text x="320" y="445" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="middle">Hay 236 sillas</text></svg>

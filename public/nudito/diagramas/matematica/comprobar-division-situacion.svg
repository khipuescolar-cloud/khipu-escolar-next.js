<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title">
<title>Tarjeta de división por comprobar</title>
<rect width="640" height="480" fill="#FCF0D6"/>

<text x="320" y="52" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78">¿La división está bien?</text>
<rect x="95" y="105" width="450" height="235" rx="28" fill="#fff" stroke="#1E2A78" stroke-width="5"/>
<text x="320" y="205" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="700" fill="#0C706E">53 ÷ 5 = 10</text>
<text x="320" y="285" text-anchor="middle" font-family="sans-serif" font-size="36" fill="#8A5A00">residuo 3</text>
<text x="320" y="420" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#1E2A78">Comprueba antes de decidir</text>
</svg>

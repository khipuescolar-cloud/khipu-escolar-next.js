<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Barra con un medio pintado y cada parte se dividirá en tres"><title>Barra con un medio pintado y cada parte se dividirá en tres</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="54" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Un medio por tres</text><text x="320" y="108" font-family="sans-serif" font-size="40" font-weight="700" fill="#1E2A78" text-anchor="middle">1/2</text><rect x="40.0" y="130" width="280.0" height="90" rx="0" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4" /><rect x="320.0" y="130" width="280.0" height="90" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4" /><text x="320" y="295" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Cada parte se divide en 3</text><text x="320" y="370" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">¿Cuántas partes habrá</text><text x="320" y="415" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">y cuántas pintadas?</text></svg>

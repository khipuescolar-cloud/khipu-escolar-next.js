<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Una pared de nueve por cinco metros con una ventana de dos por tres metros: cuarenta y cinco menos seis son treinta y nueve metros cuadrados"><title>Una pared de nueve por cinco metros con una ventana de dos por tres metros: cuarenta y cinco menos seis son treinta y nueve metros cuadrados</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Pared con ventana</text><rect x="158" y="80" width="324" height="180" rx="0" fill="#FBE3AE" stroke="#1E2A78" stroke-width="4"/><rect x="284" y="116" width="72" height="108" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="320" y="177" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">6 m²</text><text x="320" y="295" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">9 m</text><text x="143" y="178" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="end">5 m</text><text x="320" y="350" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Pared completa: 9 × 5 = 45</text><text x="320" y="392" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Ventana: 2 × 3 = 6</text><text x="320" y="440" font-family="sans-serif" font-size="38" font-weight="700" fill="#0F7C7A" text-anchor="middle">45 − 6 = 39 m²</text></svg>
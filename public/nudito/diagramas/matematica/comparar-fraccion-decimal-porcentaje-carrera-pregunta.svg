<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Tres tarjetas con los avances de Ana, Luis y Rosa en formas distintas</title><rect width="640" height="480" rx="28" fill="#FCF0D6"/><text x="320" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1E2A78">¿Quién avanzó más?</text><rect x="70" y="110" width="500" height="76" rx="16" fill="#fff" stroke="#1E2A78" stroke-width="4"/><text x="100" y="160" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1E2A78">Ana</text><text x="540" y="160" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#1E2A78">1/4</text><rect x="70" y="210" width="500" height="76" rx="16" fill="#fff" stroke="#1E2A78" stroke-width="4"/><text x="100" y="260" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1E2A78">Luis</text><text x="540" y="260" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#1E2A78">0,2</text><rect x="70" y="310" width="500" height="76" rx="16" fill="#fff" stroke="#1E2A78" stroke-width="4"/><text x="100" y="360" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1E2A78">Rosa</text><text x="540" y="360" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#1E2A78">30 %</text><text x="320" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#8A5A00">Tres formas distintas</text></svg>

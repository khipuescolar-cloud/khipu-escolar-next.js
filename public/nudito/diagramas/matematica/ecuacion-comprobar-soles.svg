<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dos comprobaciones de x más ocho igual a veinte: con veintiocho resulta treinta y seis, que no es veinte; con doce resulta veinte, que sí es veinte"><title>Dos comprobaciones de x más ocho igual a veinte: con veintiocho resulta treinta y seis, que no es veinte; con doce resulta veinte, que sí es veinte</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="50" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">x + 8 = 20</text><rect x="30" y="100" width="280" height="300" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><rect x="330" y="100" width="280" height="300" rx="14" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="6"/><text x="170" y="160" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">Si x = 28</text><text x="170" y="230" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">28 + 8 = 36</text><text x="170" y="300" font-family="sans-serif" font-size="30" font-weight="700" fill="#5B6170" text-anchor="middle">36 no es 20</text><text x="470" y="160" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="middle">Si x = 12</text><text x="470" y="230" font-family="sans-serif" font-size="34" font-weight="700" fill="#0F7C7A" text-anchor="middle">12 + 8 = 20</text><text x="470" y="300" font-family="sans-serif" font-size="30" font-weight="700" fill="#0F7C7A" text-anchor="middle">20 es 20</text><text x="170" y="364" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">No sirve</text><text x="470" y="364" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="middle">Sirve</text><text x="320" y="450" font-family="sans-serif" font-size="44" font-weight="700" fill="#0F7C7A" text-anchor="middle">x vale 12</text></svg>
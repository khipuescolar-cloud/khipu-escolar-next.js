<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title">
<title>Tres decimales ordenados de menor a mayor</title>
<rect width="640" height="480" fill="#FCF0D6"/>

<text x="320" y="50" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78">De menor a mayor</text>
<line x1="75" y1="255" x2="565" y2="255" stroke="#1E2A78" stroke-width="6"/>
<g stroke="#1E2A78" stroke-width="4"><line x1="118" y1="230" x2="118" y2="280"/><line x1="173" y1="230" x2="173" y2="280"/><line x1="505" y1="230" x2="505" y2="280"/></g>
<g fill="#0F7C7A"><circle cx="118" cy="255" r="14"/><circle cx="173" cy="255" r="14"/><circle cx="505" cy="255" r="14"/></g>
<text x="118" y="205" text-anchor="middle" font-family="sans-serif" font-size="34" fill="#1E2A78">3,08</text><text x="173" y="330" text-anchor="middle" font-family="sans-serif" font-size="34" fill="#1E2A78">3,18</text><text x="505" y="205" text-anchor="middle" font-family="sans-serif" font-size="34" fill="#1E2A78">3,80</text>
<text x="320" y="420" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#8A5A00">3,08 &lt; 3,18 &lt; 3,80</text>
</svg>

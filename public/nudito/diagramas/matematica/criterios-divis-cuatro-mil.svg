<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Número cuatro mil setecientos veinticinco con la última cifra marcada y la suma dieciocho</title><rect width="640" height="480" fill="#FCF0D6"/><rect x="140" y="50" width="84" height="100" rx="10" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" /><text x="182" y="118" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#1E2A78" text-anchor="middle">4</text><rect x="232" y="50" width="84" height="100" rx="10" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" /><text x="274" y="118" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#1E2A78" text-anchor="middle">7</text><rect x="324" y="50" width="84" height="100" rx="10" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" /><text x="366" y="118" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#1E2A78" text-anchor="middle">2</text><rect x="416" y="50" width="84" height="100" rx="10" fill="#F7DDA0" stroke="#1E2A78" stroke-width="3" /><text x="458" y="118" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#1E2A78" text-anchor="middle">5</text><text x="458" y="190" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0C706E" text-anchor="middle">Última cifra: 5</text><text x="320" y="275" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#1E2A78" text-anchor="middle">4 + 7 + 2 + 5 = 18</text><text x="320" y="330" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="middle">18 es múltiplo de 9</text><text x="320" y="420" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">Sí: por 5 y por 9</text></svg>
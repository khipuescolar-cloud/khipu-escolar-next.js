<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Recta de seis mil ochocientos cuarenta a siete mil con saltos de sesenta y de cien</title><rect width="640" height="480" rx="28" fill="#FCF0D6"/><text x="320" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1E2A78">De 6&#160;840 a 7&#160;000</text><line x1="100" y1="260" x2="560" y2="260" stroke="#1E2A78" stroke-width="6" stroke-linecap="round" /><circle cx="192" cy="260" r="10" fill="#F2B84B" stroke="#1E2A78" stroke-width="4"/><circle cx="330" cy="260" r="10" fill="#F2B84B" stroke="#1E2A78" stroke-width="4"/><circle cx="560" cy="260" r="10" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4"/><text x="192" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1E2A78">6&#160;840</text><text x="330" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1E2A78">6&#160;900</text><text x="560" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1E2A78">7&#160;000</text><path d="M192 242 Q261 170 330 242" fill="none" stroke="#0C706E" stroke-width="5"/><path d="M336 242 Q445 150 554 242" fill="none" stroke="#0C706E" stroke-width="5"/><text x="261" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0C706E">+60</text><text x="445" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0C706E">+100</text><text x="320" y="415" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#8A5A00">60 + 100 = 160</text></svg>

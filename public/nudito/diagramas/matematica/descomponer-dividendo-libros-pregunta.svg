<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img"><title>Ciento cincuenta y seis libros por repartir en doce estantes</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#1E2A78">Libros para doce estantes</text><rect x="60" y="105" width="250" height="260" rx="20" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><g fill="#F2B84B" stroke="#1E2A78" stroke-width="3"><rect x="95" y="155" width="28" height="145"/><rect x="130" y="135" width="28" height="165"/><rect x="165" y="165" width="28" height="135"/><rect x="200" y="125" width="28" height="175"/><rect x="235" y="150" width="28" height="150"/></g><text x="185" y="340" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#1E2A78">156 libros</text><rect x="355" y="105" width="225" height="260" rx="20" fill="#FFFFFF" stroke="#0C706E" stroke-width="4" stroke-dasharray="12 8"/><text x="467" y="195" text-anchor="middle" font-family="Arial" font-size="72" font-weight="700" fill="#8A5A00">?</text><text x="467" y="262" text-anchor="middle" font-family="Arial" font-size="30" fill="#1E2A78">en cada</text><text x="467" y="300" text-anchor="middle" font-family="Arial" font-size="30" fill="#1E2A78">estante</text><text x="320" y="430" text-anchor="middle" font-family="Arial" font-size="28" fill="#1E2A78">Se reparten en partes iguales.</text></svg>

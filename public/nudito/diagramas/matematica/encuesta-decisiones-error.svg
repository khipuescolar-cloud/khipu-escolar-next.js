<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Una persona dice que elige danza porque le gusta, pero danza tiene la barra más corta</title><rect width="640" height="480" fill="#FCF0D6"/><rect x="120" y="66" width="400" height="60" rx="14" fill="#FFFFFF" stroke="#B5412A" stroke-width="3" /><text x="320" y="106" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#B5412A" text-anchor="middle">Elijo danza: me gusta</text><rect x="70" y="312" width="270" height="56" rx="10" fill="none" stroke="#B5412A" stroke-width="4" /><text x="176" y="219.0" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#1E2A78" text-anchor="end">Dibujo</text><rect x="190" y="190" width="160" height="40" rx="4" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" /><text x="364" y="220.0" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">8</text><text x="176" y="283.0" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#1E2A78" text-anchor="end">Teatro</text><rect x="190" y="254" width="240" height="40" rx="4" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" /><text x="444" y="284.0" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">12</text><text x="176" y="347.0" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#1E2A78" text-anchor="end">Danza</text><rect x="190" y="318" width="100" height="40" rx="4" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" /><text x="304" y="348.0" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">5</text><text x="320" y="420" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#B5412A" text-anchor="middle">Danza tuvo solo 5 votos</text></svg>
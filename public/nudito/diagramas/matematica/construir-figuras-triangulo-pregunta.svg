<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Un segmento de seis centímetros con las medidas de los tres lados anotadas arriba"><title>Un segmento de seis centímetros con las medidas de los tres lados anotadas arriba</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="48" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Triángulo con tres medidas</text><text x="320" y="100" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">Lados: 4 cm, 5 cm y 6 cm</text><line x1="170" y1="380" x2="470" y2="380" stroke="#1E2A78" stroke-width="6" stroke-linecap="round"/><circle cx="170" cy="380" r="8" fill="#1E2A78" stroke="#1E2A78" stroke-width="3"/><circle cx="470" cy="380" r="8" fill="#1E2A78" stroke="#1E2A78" stroke-width="3"/><text x="320" y="428" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">6 cm</text><text x="320" y="290" font-family="sans-serif" font-size="26" font-weight="700" fill="#8A5A00" text-anchor="middle">¿Dónde va el tercer vértice?</text></svg>
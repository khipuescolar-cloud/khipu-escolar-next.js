  <text x="320" y="58" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78">No cambies de fila</text>
  <g stroke="#1E2A78" stroke-width="4" fill="#FFFFFF"><rect x="105" y="115" width="430" height="240" rx="14"/><line x1="285" y1="115" x2="285" y2="355"/><line x1="105" y1="195" x2="535" y2="195"/><line x1="105" y1="275" x2="535" y2="275"/></g>
  <g font-family="sans-serif" font-size="27" font-weight="700" fill="#1E2A78" text-anchor="middle"><text x="195" y="165">Grado</text><text x="410" y="165">Teatro</text><text x="195" y="245">Quinto A</text><text x="195" y="325">Quinto B</text><text x="410" y="245">3</text><text x="410" y="325">2</text></g>

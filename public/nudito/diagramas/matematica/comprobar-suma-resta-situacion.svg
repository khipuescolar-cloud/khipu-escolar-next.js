<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img"><title>Cuenta de la tienda: dos mil seiscientos más mil ochocientos igual cuatro mil cuatrocientos</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="60" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">La cuenta de la tienda</text><rect x="40" y="110" width="560" height="130" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4" /><text x="320" y="192" font-family="Arial, Liberation Sans, sans-serif" font-size="42" font-weight="700" fill="#1E2A78" text-anchor="middle">2&#160;600 + 1&#160;800 = 4&#160;400</text><circle cx="320" cy="330" r="42" fill="#F2B84B" stroke="#1E2A78" stroke-width="4"/><text x="320" y="346" font-family="Arial, Liberation Sans, sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">?</text><text x="320" y="438" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="middle">¿Está bien hecha?</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Número tres mil cuatrocientos sesenta con respuestas sí por dos, sí por diez y no por tres</title><rect width="640" height="480" fill="#FCF0D6"/><rect x="140" y="40" width="84" height="100" rx="10" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" /><text x="182" y="108" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#1E2A78" text-anchor="middle">3</text><rect x="232" y="40" width="84" height="100" rx="10" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" /><text x="274" y="108" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#1E2A78" text-anchor="middle">4</text><rect x="324" y="40" width="84" height="100" rx="10" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" /><text x="366" y="108" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#1E2A78" text-anchor="middle">6</text><rect x="416" y="40" width="84" height="100" rx="10" fill="#F7DDA0" stroke="#1E2A78" stroke-width="3" /><text x="458" y="108" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#1E2A78" text-anchor="middle">0</text><text x="458" y="180" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#0C706E" text-anchor="middle">Última cifra: 0</text><rect x="30" y="205" width="180" height="54" rx="10" fill="#0F7C7A" stroke="#0F7C7A" stroke-width="3" /><text x="120" y="242" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Por 2: sí</text><rect x="230" y="205" width="180" height="54" rx="10" fill="#0F7C7A" stroke="#0F7C7A" stroke-width="3" /><text x="320" y="242" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Por 10: sí</text><rect x="430" y="205" width="180" height="54" rx="10" fill="#B5412A" stroke="#B5412A" stroke-width="3" /><text x="520" y="242" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Por 3: no</text><text x="320" y="330" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#1E2A78" text-anchor="middle">3 + 4 + 6 + 0 = 13</text><text x="320" y="385" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#B5412A" text-anchor="middle">13 no es múltiplo de 3</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres cajas con cuatro, seis y ocho libros; se pregunta cuántos tendría cada caja al repartirlos por igual.">
  <title>Repartir libros por igual</title>
  <rect width="640" height="480" rx="32" fill="#FCF0D6"/>
  <text x="320" y="58" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#1E2A78">¿Cuántos quedarían en cada caja?</text>
  <g fill="#FFFFFF" stroke="#1E2A78" stroke-width="5">
    <rect x="55" y="125" width="155" height="245" rx="20"/><rect x="243" y="125" width="155" height="245" rx="20"/><rect x="430" y="125" width="155" height="245" rx="20"/>
  </g>
  <g fill="#F2B84B" stroke="#8A5A00" stroke-width="2">

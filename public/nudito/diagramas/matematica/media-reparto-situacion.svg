    <rect x="270" y="317" width="100" height="22"/><rect x="270" y="285" width="100" height="22"/><rect x="270" y="253" width="100" height="22"/><rect x="270" y="221" width="100" height="22"/><rect x="270" y="189" width="100" height="22"/><rect x="270" y="157" width="100" height="22"/>
    <rect x="457" y="333" width="100" height="20"/><rect x="457" y="305" width="100" height="20"/><rect x="457" y="277" width="100" height="20"/><rect x="457" y="249" width="100" height="20"/><rect x="457" y="221" width="100" height="20"/><rect x="457" y="193" width="100" height="20"/><rect x="457" y="165" width="100" height="20"/><rect x="457" y="137" width="100" height="20"/>
  </g>

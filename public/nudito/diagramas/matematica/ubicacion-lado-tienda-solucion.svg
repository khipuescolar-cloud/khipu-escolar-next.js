<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Una casa, tres pasos numerados y una tienda: son pocos pasos, la tienda está cerca"><title>Una casa, tres pasos numerados y una tienda: son pocos pasos, la tienda está cerca</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="54" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Tres pasos: la tienda está cerca</text><rect x="40" y="170" width="80" height="50" rx="0" fill="#F2B632" stroke="#1E2A78" stroke-width="4" /><polygon points="34,170 80,136 126,170" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round" /><text x="80" y="202" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">casa</text><circle cx="170" cy="200" r="24" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><text x="170" y="210" font-family="sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="230" cy="200" r="24" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><text x="230" y="210" font-family="sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><circle cx="290" cy="200" r="24" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><text x="290" y="210" font-family="sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><rect x="340" y="166" width="150" height="68" rx="8" fill="#FBE3AE" stroke="#1E2A78" stroke-width="4" /><text x="415" y="210" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">tienda</text><text x="320" y="370" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">3 pasos son pocos pasos</text><text x="320" y="425" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="middle">La tienda está cerca</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img"><title>Condición de edad menor que doce años</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#1E2A78">Ingreso al juego</text><rect x="70" y="100" width="500" height="120" rx="22" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="320" y="150" text-anchor="middle" font-family="Arial" font-size="30" fill="#1E2A78">Condición</text><text x="320" y="195" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0C706E">Tener menos de 12 años</text><rect x="145" y="270" width="350" height="105" rx="22" fill="#F2B84B" stroke="#1E2A78" stroke-width="4"/><text x="320" y="338" text-anchor="middle" font-family="Arial" font-size="44" font-weight="700" fill="#1E2A78">edad &lt; 12</text><text x="320" y="430" text-anchor="middle" font-family="Arial" font-size="28" fill="#1E2A78">El límite no está incluido.</text></svg>

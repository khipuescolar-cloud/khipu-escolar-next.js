<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title">
<title>Comparación de siete décimos y sesenta y ocho centésimos</title>
<rect width="640" height="480" fill="#FCF0D6"/>

<text x="320" y="48" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78">Siete décimos y sesenta y ocho centésimos</text>
<rect x="40" y="95" width="560" height="255" rx="24" fill="#fff"/>
<text x="140" y="160" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#1E2A78">unidades</text><text x="320" y="160" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#1E2A78">décimos</text><text x="490" y="160" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#1E2A78">centésimos</text>
<text x="140" y="230" text-anchor="middle" font-family="sans-serif" font-size="44" fill="#0C706E">0</text><text x="320" y="230" text-anchor="middle" font-family="sans-serif" font-size="44" fill="#0C706E">7</text><text x="490" y="230" text-anchor="middle" font-family="sans-serif" font-size="44" fill="#0C706E">0</text>
<text x="140" y="310" text-anchor="middle" font-family="sans-serif" font-size="44" fill="#1E2A78">0</text><text x="320" y="310" text-anchor="middle" font-family="sans-serif" font-size="44" fill="#1E2A78">6</text><text x="490" y="310" text-anchor="middle" font-family="sans-serif" font-size="44" fill="#1E2A78">8</text>
<text x="320" y="420" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#8A5A00">0,70 &gt; 0,68</text>
</svg>

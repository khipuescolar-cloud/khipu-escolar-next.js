<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Cuatro mil doscientos segundos dividido entre sesenta son setenta minutos, y setenta minutos son una hora y diez minutos"><title>Cuatro mil doscientos segundos dividido entre sesenta son setenta minutos, y setenta minutos son una hora y diez minutos</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">De segundos a horas</text><rect x="30" y="150" width="120" height="90" rx="10" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="90.0" y="205" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">4 200 s</text><text x="90.0" y="282" font-family="sans-serif" font-size="26" font-weight="700" fill="#0C706E" text-anchor="middle">segundos</text><rect x="230" y="150" width="120" height="90" rx="10" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="290.0" y="205" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">70 min</text><text x="290.0" y="282" font-family="sans-serif" font-size="26" font-weight="700" fill="#0C706E" text-anchor="middle">minutos</text><rect x="430" y="150" width="170" height="90" rx="10" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="515.0" y="205" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">1 h 10 min</text><text x="515.0" y="282" font-family="sans-serif" font-size="26" font-weight="700" fill="#0C706E" text-anchor="middle">horas y minutos</text><line x1="158" y1="195" x2="222" y2="195" stroke="#1E2A78" stroke-width="5" stroke-linecap="round"/><polygon points="222,183 236,195 222,207" fill="#1E2A78"/><text x="190" y="160" font-family="sans-serif" font-size="28" font-weight="700" fill="#8A5A00" text-anchor="middle">÷ 60</text><line x1="358" y1="195" x2="422" y2="195" stroke="#1E2A78" stroke-width="5" stroke-linecap="round"/><polygon points="422,183 436,195 422,207" fill="#1E2A78"/><text x="390" y="160" font-family="sans-serif" font-size="28" font-weight="700" fill="#8A5A00" text-anchor="middle">÷ 60</text><text x="320" y="360" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">4 200 ÷ 60 = 70 min</text><text x="320" y="410" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">70 min = 1 h y sobran 10 min</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img"><title>Tres figuras recortadas: turquesa, amarilla y azul</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="60" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">¿Cuántos lados tiene cada una?</text><polygon points="110.0,170.0 40.0,310.0 180.0,310.0" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round"/><polygon points="250.0,190.0 390.0,190.0 410.0,310.0 230.0,310.0" fill="#F2B84B" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round"/><polygon points="530.0,165.0 606.1,220.3 577.0,309.7 483.0,309.7 453.9,220.3" fill="#8C96DC" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round"/><text x="110" y="375" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="middle">Turquesa</text><text x="320" y="375" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#8A5A00" text-anchor="middle">Amarilla</text><text x="530" y="375" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Azul</text></svg>
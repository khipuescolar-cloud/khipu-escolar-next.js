<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres bolsas del mismo tamaño en fila: lentejas con seis kilogramos, harina con ocho y arroz con once, con una flecha de menor a mayor"><title>Tres bolsas del mismo tamaño en fila: lentejas con seis kilogramos, harina con ocho y arroz con once, con una flecha de menor a mayor</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="56" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">De la más liviana a la más pesada</text><rect x="25" y="125" width="170" height="150" rx="12" fill="#F8DDA0" stroke="#1E2A78" stroke-width="4"/><path d="M55 125 V99 H165 V125" fill="none" stroke="#1E2A78" stroke-width="4"/><text x="110" y="214" font-family="sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">6 kg</text><text x="110" y="340" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Lentejas</text><rect x="235" y="125" width="170" height="150" rx="12" fill="#F8DDA0" stroke="#1E2A78" stroke-width="4"/><path d="M265 125 V99 H375 V125" fill="none" stroke="#1E2A78" stroke-width="4"/><text x="320" y="214" font-family="sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">8 kg</text><text x="320" y="340" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Harina</text><rect x="445" y="125" width="170" height="150" rx="12" fill="#F8DDA0" stroke="#1E2A78" stroke-width="4"/><path d="M475 125 V99 H585 V125" fill="none" stroke="#1E2A78" stroke-width="4"/><text x="530" y="214" font-family="sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">11 kg</text><text x="530" y="340" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Arroz</text><path d="M60 410 H560" stroke="#0F7C7A" stroke-width="6"/><polygon points="580,410 556,396 556,424"
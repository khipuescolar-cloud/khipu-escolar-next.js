<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres puntos con un sobrante más cinco puntos con un sobrante, cuyos sobrantes forman una pareja y dan ocho puntos en cuatro parejas"><title>Tres puntos con un sobrante más cinco puntos con un sobrante, cuyos sobrantes forman una pareja y dan ocho puntos en cuatro parejas</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="54" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Dos impares suman un par</text><circle cx="148" cy="150" r="13" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><circle cx="180" cy="150" r="13" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><circle cx="248" cy="150" r="13" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><circle cx="280" cy="150" r="13" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><circle cx="348" cy="150" r="13" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><circle cx="380" cy="150" r="13" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><circle cx="448" cy="150" r="13" fill="#F2B632" stroke="#1E2A78" stroke-width="3"/><circle cx="480" cy="150" r="13" fill="#F2B632" stroke="#1E2A78" stroke-width="3"/><text x="320" y="215" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">Los dos sobrantes hacen una pareja</text><text x="320" y="290" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">3 + 5 = 8: cuatro parejas</text><text x="320" y="350" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">(2a + 1) + (2b + 1) = 2(a + b + 1)</text><text x="320" y="425" font-family="sans-serif" font-size="30" font-weight="700" fill="#0F7C7A" text-anchor="middle">La suma de dos impares es par</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dos comprobaciones: con x igual a seis y con n igual a veinticuatro, ambas igualdades se cumplen"><title>Dos comprobaciones: con x igual a seis y con n igual a veinticuatro, ambas igualdades se cumplen</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="56" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Comprobamos sustituyendo</text><rect x="30" y="95" width="580" height="160" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="60" y="155" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="start">4x + 6 = 30 con x = 6</text><text x="60" y="210" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="start">4 × 6 + 6 = 24 + 6 = 30</text><circle cx="566" cy="175" r="24" fill="#0F7C7A"/><path d="M554 175 L563 185 L579 165" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="30" y="280" width="580" height="160" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="60" y="340" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="start">n ÷ 3 − 2 = 6 con n = 24</text><text x="60" y="395" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="start">24 ÷ 3 − 2 = 8 − 2 = 6</text><circle cx="566" cy="360" r="24" fill="#0F7C7A"/><path d="M554 360 L563 370 L579 350" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
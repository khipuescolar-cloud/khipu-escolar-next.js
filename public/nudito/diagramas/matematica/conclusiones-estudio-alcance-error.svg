<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Un círculo grande punteado con todos los estudiantes y dentro un círculo turquesa pequeño con los veinticuatro encuestados, y una frase en rojo"><title>Un círculo grande punteado con todos los estudiantes y dentro un círculo turquesa pequeño con los veinticuatro encuestados, y una frase en rojo</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="56" font-family="sans-serif" font-size="32" font-weight="700" fill="#B5412A" text-anchor="middle">Hablar de más</text><circle cx="320" cy="255" r="160" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4" stroke-dasharray="10 8"/><text x="320" y="150" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Todos los</text><text x="320" y="182" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">estudiantes</text><circle cx="320" cy="304" r="96" fill="#0F7C7A"/><text x="320" y="297" font-family="sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Los 24</text><text x="320" y="331" font-family="sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">encuestados</text><text x="320" y="452" font-family="sans-serif" font-size="32" font-weight="700" fill="#B5412A" text-anchor="middle">Solo se habla de los 24</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres pasos: decide si va antes o después, suma o resta uno y comprueba con tres números seguidos"><title>Tres pasos: decide si va antes o después, suma o resta uno y comprueba con tres números seguidos</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><rect x="30" y="30" width="580" height="125" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><circle cx="86" cy="92" r="34" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><text x="86" y="105" font-family="sans-serif" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="140" y="85" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Decide:&#160;¿antes&#160;o&#160;después?</text><text x="140" y="125" font-family="sans-serif" font-size="26" font-weight="400" fill="#0C706E" text-anchor="start">Antes:&#160;antecesor.&#160;Después:&#160;sucesor</text><rect x="30" y="165" width="580" height="125" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><circle cx="86" cy="227" r="34" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><text x="86" y="240" font-family="sans-serif" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="140" y="220" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Resta&#160;uno&#160;o&#160;suma&#160;uno</text><text x="140" y="260" font-family="sans-serif" font-size="26" font-weight="400" fill="#0C706E" text-anchor="start">Antes:&#160;resta.&#160;Después:&#160;suma</text><rect x="30" y="300" width="580" height="125" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><circle cx="86" cy="362" r="34" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><text x="86" y="375" font-family="sans-serif" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="140" y="355" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Comprueba&#160;con&#160;tres&#160;números</text><text x="140" y="395" font-family="sans-serif" font-size="26" font-weight="400" fill="#0C706E" text-anchor="start">Antecesor,&#160;número&#160;y&#160;sucesor</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Puntos unidos en un orden temporal incorrecto</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="42" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#1E2A78">El tiempo va de izquierda a derecha</text><g transform="translate(0,-20)"><line x1="85" y1="380" x2="590" y2="380" stroke="#1E2A78" stroke-width="5"/><line x1="100" y1="380" x2="100" y2="90" stroke="#1E2A78" stroke-width="5"/><g fill="#F2B84B" stroke="#1E2A78" stroke-width="4"><circle cx="180" cy="300" r="12"/><circle cx="330" cy="135" r="12"/><circle cx="480" cy="245" r="12"/></g><polyline points="180,300 480,245 330,135" fill="none" stroke="#B5412A" stroke-width="9"/><path d="M420 185l65 65M485 185l-65 65" stroke="#B5412A" stroke-width="9"/><g font-family="sans-serif" font-size="26" fill="#1E2A78" text-anchor="middle"><text x="180" y="425">Lunes</text><text x="330" y="425">Martes</text><text x="480" y="425">Miércoles</text></g></g><text x="320" y="448" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#B5412A">No saltes de un día a otro</text></svg>

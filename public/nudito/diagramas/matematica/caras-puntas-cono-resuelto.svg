<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Un cono de helado con su punta arriba, el costado curvo y la base redonda plana, y el resumen de una cara plana y una punta"><title>Un cono de helado con su punta arriba, el costado curvo y la base redonda plana, y el resumen de una cara plana y una punta</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle" >Un cono de helado</text><path d="M80 320 L190 110 L300 320 Z" fill="#FBE3AE" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round"/><ellipse cx="190" cy="320" rx="110" ry="34" fill="#BFE3E1" stroke="#1E2A78" stroke-width="4" /><circle cx="190" cy="110" r="11" fill="#A8325E" stroke="#1E2A78" stroke-width="3" /><line x1="206" y1="112" x2="330" y2="112" stroke="#1E2A78" stroke-width="3" stroke-linecap="round" /><text x="340" y="122" font-family="sans-serif" font-size="30" font-weight="700" fill="#A8325E" text-anchor="start" >1 punta</text><line x1="250" y1="215" x2="330" y2="215" stroke="#1E2A78" stroke-width="3" stroke-linecap="round" /><text x="340" y="225" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start" >costado curvo</text><line x1="295" y1="330" x2="330" y2="330" stroke="#1E2A78" stroke-width="3" stroke-linecap="round" /><text x="340" y="340" font-family="sans-serif" font-size="30" font-weight="700" fill="#0F7C7A" text-anchor="start" >1 cara plana</text><text x="190" y="395" font-family="sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="middle" >(la base)</text><text x="320" y="450" font-family="sans-serif" font-size="30" font-weight="700" fill="#0F7C7A" text-anchor="middle" >1 cara plana y 1 punta</text></svg>
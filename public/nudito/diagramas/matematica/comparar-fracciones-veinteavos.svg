<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Tres barras que muestran ocho, diez y quince veinteavos</title><rect width="640" height="480" rx="28" fill="#FCF0D6"/><text x="320" y="56" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#1E2A78">Ordenamos en veinteavos</text><text x="60" y="160" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#1E2A78">2/5</text><rect x="130" y="120" width="160" height="56" rx="8" fill="#0F7C7A"/><text x="304" y="160" text-anchor="start" font-family="Arial" font-size="30" font-weight="700" fill="#1E2A78">8/20</text><text x="60" y="255" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#1E2A78">1/2</text><rect x="130" y="215" width="200" height="56" rx="8" fill="#F2B84B"/><text x="344" y="255" text-anchor="start" font-family="Arial" font-size="30" font-weight="700" fill="#1E2A78">10/20</text><text x="60" y="350" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#1E2A78">3/4</text><rect x="130" y="310" width="300" height="56" rx="8" fill="#D95D59"/><text x="444" y="350" text-anchor="start" font-family="Arial" font-size="30" font-weight="700" fill="#1E2A78">15/20</text><text x="320" y="430" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#1E2A78">2/5 &lt; 1/2 &lt; 3/4</text></svg>

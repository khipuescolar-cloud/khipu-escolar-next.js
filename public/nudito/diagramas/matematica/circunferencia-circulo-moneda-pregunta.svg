<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dos dibujos de una moneda: a la izquierda solo la línea del borde y a la derecha el borde con todo el interior pintado de amarillo"><title>Dos dibujos de una moneda: a la izquierda solo la línea del borde y a la derecha el borde con todo el interior pintado de amarillo</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="48" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle" >Una moneda de dos modos</text><circle cx="170" cy="225" r="90" fill="none" stroke="#1E2A78" stroke-width="6" /><circle cx="470" cy="225" r="90" fill="#FBE3AE" stroke="#1E2A78" stroke-width="6" /><text x="170" y="375" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle" >Solo el borde</text><text x="470" y="375" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle" >Borde e interior</text><text x="320" y="440" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="middle" >¿Cómo se llama cada una?</text></svg>
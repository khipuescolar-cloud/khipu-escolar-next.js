    <path d="M395 145 V250 L425 282 L455 250 V145" fill="#F2B84B"/><path d="M455 145 V250 L485 282 L515 250 V145" fill="#0F7C7A"/><path d="M515 145 V250 L545 282 L575 250 V145" fill="#1E2A78"/>

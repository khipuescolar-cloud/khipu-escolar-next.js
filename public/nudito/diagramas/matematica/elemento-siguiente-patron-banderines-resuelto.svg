  <text x="375" y="373" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">11</text>
  <text x="320" y="440" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#0C706E">La posición once es turquesa</text>

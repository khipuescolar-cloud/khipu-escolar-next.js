<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Costo de cuatro entradas y costo desconocido de seis</title>
  <rect width="640" height="480" rx="32" fill="#FCF0D6"/>
  <text x="320" y="58" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78">Entradas para el museo</text>
  <rect x="68" y="104" width="504" height="250" rx="24" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/>
  <path d="M68 184H572M320 104V354" stroke="#1E2A78" stroke-width="3"/>
  <g font-family="sans-serif" font-size="28" font-weight="700" text-anchor="middle">
    <text x="194" y="156" fill="#0C706E">Entradas</text><text x="446" y="156" fill="#0C706E">Costo</text>
    <text x="194" y="244" fill="#1E2A78">4</text><text x="446" y="244" fill="#1E2A78">S/ 28</text>
    <text x="194" y="321" fill="#1E2A78">6</text><text x="446" y="321" fill="#8A5A00">S/ ?</text>
  </g>
  <text x="320" y="414" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#8A5A00">El precio por entrada no cambia</text>

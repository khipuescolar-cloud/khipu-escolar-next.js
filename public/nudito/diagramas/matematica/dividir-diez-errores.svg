<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Dos errores al dividir entre diez</title><rect width="640" height="480" rx="28" fill="#FCF0D6"/><text x="320" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#1E2A78">Revisa la operación</text><rect x="70" y="105" width="500" height="120" rx="18" fill="#FFF9EC" stroke="#8A5A00" stroke-width="5"/><text x="105" y="155" font-family="Arial" font-size="28" font-weight="700" fill="#8A5A00">Dividir no es restar una vez</text><text x="105" y="200" font-family="Arial" font-size="27" fill="#1E2A78">Ochenta entre diez no es setenta</text><rect x="70" y="265" width="500" height="120" rx="18" fill="#FFF9EC" stroke="#8A5A00" stroke-width="5"/><text x="105" y="315" font-family="Arial" font-size="28" font-weight="700" fill="#8A5A00">Cuenta todas las decenas</text><text x="105" y="360" font-family="Arial" font-size="27" fill="#1E2A78">Una centena también tiene decenas</text><text x="320" y="438" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#0C706E">Comprueba multiplicando por diez</text></svg>

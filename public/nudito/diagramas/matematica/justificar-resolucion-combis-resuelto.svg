<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="División de ciento treinta y ocho entre treinta y dos: cuatro y sobran diez; cinco combis dan ciento sesenta asientos.">
  <title>El residuo cambia la decisión</title>
  <rect width="640" height="480" rx="32" fill="#FCF0D6"/>
  <text x="320" y="56" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#1E2A78">Hay que interpretar el residuo</text>
  <rect x="70" y="110" width="500" height="90" rx="20" fill="#FFFFFF" stroke="#1E2A78" stroke-width="5"/>
  <text x="320" y="165" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="700" fill="#1E2A78">138 ÷ 32 = 4 y sobran 10</text>
  <rect x="70" y="235" width="220" height="135" rx="20" fill="#FFFFFF" stroke="#B5412A" stroke-width="5"/>
  <text x="180" y="285" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#B5412A">4 combis</text>
  <text x="180" y="330" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#1E2A78">128 asientos</text>
  <path d="M258 247 L282 271 M282 247 L258 271" stroke="#B5412A" stroke-width="7" stroke-linecap="round"/>
  <rect x="350" y="235" width="220" height="135" rx="20" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="6"/>
  <text x="460" y="285" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#0C706E">5 combis</text>
  <text x="460" y="330" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#1E2A78">160 asientos</text>
  <text x="320" y="430" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#0C706E">Todos viajan sentados</text>
</svg>

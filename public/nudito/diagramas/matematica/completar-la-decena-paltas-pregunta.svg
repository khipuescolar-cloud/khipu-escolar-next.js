<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Don Tomás tiene paltas y le llegan más; se pregunta cuántas hay ahora"><title>Don Tomás tiene paltas y le llegan más; se pregunta cuántas hay ahora</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="50" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Paltas de don Tomás</text><path d="M320 85 C330 85 350 115 350 137 C350 159 334 167 320 167 C306 167 290 159 290 137 C290 115 310 85 320 85 Z" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="320" cy="139" r="12" fill="#F2B84B" stroke="#1E2A78" stroke-width="2"/><rect x="40" y="190" width="250" height="110" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="165" y="235" font-family="sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="middle">Tiene</text><text x="165" y="280" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">28 paltas</text><text x="320" y="258" font-family="sans-serif" font-size="48" font-weight="700" fill="#1E2A78" text-anchor="middle">+</text><rect x="350" y="190" width="250" height="110" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="475" y="235" font-family="sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="middle">Llegan</text><text x="475" y="280" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">6 más</text><text x="320" y="400" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">¿Cuántas paltas hay ahora?</text></svg>
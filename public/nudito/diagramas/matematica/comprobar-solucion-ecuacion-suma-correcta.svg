<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Se sustituye cuarenta y seis en la ecuación y da setenta, coincide</title><rect width="640" height="480" rx="28" fill="#FCF0D6"/><text x="320" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1E2A78">Sustituimos el valor</text><rect x="80" y="100" width="480" height="84" rx="16" fill="#fff" stroke="#1E2A78" stroke-width="4"/><text x="320" y="157.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#1E2A78">x + 24 = 70</text><rect x="80" y="215" width="480" height="76" rx="16" fill="#fff" stroke="#1E2A78" stroke-width="4"/><text x="320" y="268.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#1E2A78">x = 46</text><rect x="80" y="320" width="480" height="84" rx="16" fill="#fff" stroke="#0F7C7A" stroke-width="5"/><text x="300" y="378" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#0C706E">46 + 24 = 70</text><circle cx="520" cy="362" r="24" fill="#0F7C7A"/><polyline points="509,363 517,372 532,352" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="450" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0C706E">Los dos lados coinciden</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Cinco figuras planas separadas: un triángulo azul verdoso a cada extremo y tres rectángulos amarillos en medio; abajo, dos triángulos más tres rectángulos son cinco caras"><title>Cinco figuras planas separadas: un triángulo azul verdoso a cada extremo y tres rectángulos amarillos en medio; abajo, dos triángulos más tres rectángulos son cinco caras</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Las caras del chocolate</text><polygon points="75,125 120,225 30,225" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" stroke-linejoin="round"/><polygon points="555,125 600,225 510,225" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" stroke-linejoin="round"/><rect x="160" y="115" width="70" height="110" rx="0" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><rect x="280" y="115" width="70" height="110" rx="0" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><rect x="400" y="115" width="70" height="110" rx="0" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><polygon points="60,290 90,330 30,330" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" stroke-linejoin="round"/><text x="110" y="325" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">2 triángulos</text><rect x="330" y="295" width="50" height="36" rx="0" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="395" y="325" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">3 rectángulos</text><text x="320" y="420" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">2 + 3 = 5 caras</text></svg>
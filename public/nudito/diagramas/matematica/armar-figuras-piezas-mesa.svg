<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Una mesa con cuatro piezas planas: un cuadrado, un triángulo, un círculo y un rectángulo"><title>Una mesa con cuatro piezas planas: un cuadrado, un triángulo, un círculo y un rectángulo</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Piezas sobre la mesa</text><rect x="50" y="140" width="90" height="90" rx="6" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4"/><text x="95" y="275" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">cuadrado</text><polygon points="185,230 285,230 235,140" fill="#F2B84B" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round"/><text x="235" y="275" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">triángulo</text><circle cx="370" cy="185" r="45" fill="#8FD0CC" stroke="#1E2A78" stroke-width="4"/><text x="370" y="275" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">círculo</text><rect x="460" y="160" width="120" height="70" rx="6" fill="#CFEAE8" stroke="#1E2A78" stroke-width="4"/><text x="520" y="275" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">rectángulo</text><line x1="40" y1="245" x2="600" y2="245" stroke="#1E2A78" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 8"/><text x="320" y="370" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">¿Qué podemos armar</text><text x="320" y="415" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">con ellas?</text></svg>

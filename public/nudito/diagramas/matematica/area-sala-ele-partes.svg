<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="El piso en ele cortado en dos rectángulos: arriba tres por cuatro es doce, abajo ocho por tres es veinticuatro, en total treinta y seis metros cuadrados"><title>El piso en ele cortado en dos rectángulos: arriba tres por cuatro es doce, abajo ocho por tres es veinticuatro, en total treinta y seis metros cuadrados</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Dos rectángulos</text><polygon points="150,110 246,110 246,238 150,238" fill="#BFE3E1" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round"/><polygon points="150,238 406,238 406,334 150,334" fill="#FBE3AE" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round"/><line x1="246" y1="238" x2="406" y2="238" stroke="#5B6170" stroke-width="2" stroke-linecap="round"/><text x="198" y="150" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">A</text><text x="198" y="188" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">3 × 4</text><text x="198" y="224" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">12 m²</text><text x="278" y="280" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">B</text><text x="278" y="314" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">8 × 3 = 24 m²</text><text x="520" y="150" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">A + B</text><text x="520" y="190" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">12 + 24</text><text x="520" y="232" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="middle">= 36 m²</text><text x="320" y="410" font-family="sans-serif" font-size="36" font-weight="700" fill="#0F7C7A" text-anchor="middle">Área del piso: 36 m²</text></svg>
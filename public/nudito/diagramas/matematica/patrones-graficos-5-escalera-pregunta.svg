<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
<title>Escalera de cuadritos en tres figuras y un espacio vacío para la cuarta</title>
<rect width="640" height="480" fill="#FCF0D6"/>
<text x="320" y="80" font-family="Nunito, Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Escalera de cuadritos</text>
<rect x="70" y="300" width="30" height="30" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" />
<rect x="190" y="300" width="30" height="30" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" />
<rect x="220" y="300" width="30" height="30" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" />
<rect x="220" y="270" width="30" height="30" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" />
<rect x="320" y="300" width="30" height="30" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" />
<rect x="350" y="300" width="30" height="30" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" />
<rect x="350" y="270" width="30" height="30" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" />
<rect x="380" y="300" width="30" height="30" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" />
<rect x="380" y="270" width="30" height="30" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" />
<rect x="380" y="240" width="30" height="30" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" />
<rect x="470" y="210" width="120" height="120" fill="none" stroke="#1E2A78" stroke-width="4" stroke-dasharray="10 8"/>
<text x="530" y="292" font-family="Nunito, Arial, sans-serif" font-size="64" font-weight="700" fill="#1E2A78" text-anchor="middle">?</text>
<text x="85" y="375" font-family="Nunito, Arial, sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">Figura 1</text>
<text x="220" y="375" font-family="Nunito, Arial, sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">Figura 2</text>
<text x="365" y="375" font-family="Nunito, Arial, sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">Figura 3</text>
<text x="530" y="375" font-family="Nunito, Arial, sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">Figura 4</text>
<text x="320" y="440" font-family="Nunito, Arial, sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">¿Cuántos cuadritos tendrá la cuarta?</text>

</svg>

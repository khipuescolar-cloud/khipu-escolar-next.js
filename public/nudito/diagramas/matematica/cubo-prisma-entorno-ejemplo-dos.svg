<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Caja de té alta de base cuadrada con medidas de ocho, ocho y veinte centímetros; arriba un cuadrado y a los lados rectángulos"><title>Caja de té alta de base cuadrada con medidas de ocho, ocho y veinte centímetros; arriba un cuadrado y a los lados rectángulos</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="50" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">Caja de té</text><polygon points="150,160 185,125 265,125 230,160" fill="#BFE6E3" stroke="#1E2A78" stroke-width="3" stroke-linejoin="round"/><polygon points="230,160 265,125 265,325 230,360" fill="#5DB3AE" stroke="#1E2A78" stroke-width="3" stroke-linejoin="round"/><polygon points="150,160 230,160 230,360 150,360" fill="#8CCFCB" stroke="#1E2A78" stroke-width="3" stroke-linejoin="round"/><text x="140" y="270" font-family="sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="end">20 cm</text><text x="190" y="400" font-family="sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="middle">8 cm</text><text x="284" y="140" font-family="sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="start">8 cm</text><text x="345" y="200" font-family="sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="start">Arriba y abajo:</text><text x="345" y="236" font-family="sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="start">dos cuadrados</text><text x="345" y="306" font-family="sans-serif" font-size="28" font-weight="700" fill="#8A5A00" text-anchor="start">En los lados:</text><text x="345" y="342" font-family="sans-serif" font-size="28" font-weight="700" fill="#8A5A00" text-anchor="start">cuatro rectángulos</text></svg>
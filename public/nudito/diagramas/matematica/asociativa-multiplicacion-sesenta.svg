<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Cuatro por cinco por tres calculado de dos formas: veinte por tres y cuatro por quince, ambas dan sesenta"><title>Cuatro por cinco por tres calculado de dos formas: veinte por tres y cuatro por quince, ambas dan sesenta</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">El mismo producto</text><text x="320" y="130" font-family="sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">(4 × 5) × 3 = 20 × 3 = 60</text><text x="320" y="210" font-family="sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">4 × (5 × 3) = 4 × 15 = 60</text><rect x="120" y="260" width="400" height="80" rx="12" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="320" y="314" font-family="sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">Mismo producto: 60</text><text x="320" y="405" font-family="sans-serif" font-size="30" font-weight="700" fill="#0F7C7A" text-anchor="middle">Cambia la agrupación,</text><text x="320" y="445" font-family="sans-serif" font-size="30" font-weight="700" fill="#0F7C7A" text-anchor="middle">no cambia el resultado</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres tarjetas en fila: sábado, domingo y lunes, unidas por flechas gruesas"><title>Tres tarjetas en fila: sábado, domingo y lunes, unidas por flechas gruesas</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Los días vuelven a empezar</text><rect x="30" y="130" width="160" height="120" rx="16" fill="#FCF0D6" stroke="#1E2A78" stroke-width="4"/><text x="110" y="205" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">sábado</text><rect x="240" y="130" width="160" height="120" rx="16" fill="#F2B84B" stroke="#1E2A78" stroke-width="4"/><text x="320" y="205" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">domingo</text><rect x="450" y="130" width="160" height="120" rx="16" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4"/><text x="530" y="205" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">lunes</text><line x1="196" y1="190" x2="234" y2="190" stroke="#1E2A78" stroke-width="7" stroke-linecap="round"/><polygon points="234,190 214.3,200.7 214.3,179.3" fill="#1E2A78"/><line x1="406" y1="190" x2="444" y2="190" stroke="#0F7C7A" stroke-width="7" stroke-linecap="round"/><polygon points="444,190 424.3,200.7 424.3,179.3" fill="#0F7C7A"/><text x="320" y="340" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Después del domingo</text><text x="320" y="386" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">empieza otra semana</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Secuencia con un salto distinto señalado</title>
  <rect width="640" height="480" fill="#FCF0D6"/>
  <text x="320" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1E2A78">Revisa cada salto</text>
  <g fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"><rect x="55" y="155" width="110" height="100" rx="18"/><rect x="195" y="155" width="110" height="100" rx="18"/><rect x="335" y="155" width="110" height="100" rx="18"/><rect x="475" y="155" width="110" height="100" rx="18"/></g>
  <g font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#1E2A78" text-anchor="middle"><text x="110" y="220">12</text><text x="250" y="220">14</text><text x="390" y="220">15</text><text x="530" y="220">16</text></g>
  <g font-family="Arial, sans-serif" font-size="28" text-anchor="middle"><text x="180" y="315" fill="#0C706E">+2</text><text x="320" y="315" fill="#B5412A">+1</text><text x="460" y="315" fill="#0C706E">+1</text></g>
  <path d="M295 340 L345 390 M345 340 L295 390" stroke="#B5412A" stroke-width="10" stroke-linecap="round"/>
  <text x="320" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#1E2A78">Un solo salto no basta.</text>
</svg>

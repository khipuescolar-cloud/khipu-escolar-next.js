<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title">
<title>Error al comparar solo unidades</title>
<rect width="640" height="480" fill="#FCF0D6"/>

<text x="320" y="55" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78">No mires solo la última cifra</text>
<rect x="75" y="105" width="200" height="180" rx="24" fill="#fff"/><rect x="365" y="105" width="200" height="180" rx="24" fill="#fff"/>
<text x="175" y="205" text-anchor="middle" font-family="sans-serif" font-size="64" font-weight="700" fill="#1E2A78">19</text><text x="465" y="205" text-anchor="middle" font-family="sans-serif" font-size="64" font-weight="700" fill="#1E2A78">21</text>
<circle cx="218" cy="188" r="34" fill="none" stroke="#B5412A" stroke-width="6"/><path d="M195 165l46 46M241 165l-46 46" stroke="#B5412A" stroke-width="6"/>
<path d="M175 315v55M465 315v55" stroke="#0F7C7A" stroke-width="8"/><text x="320" y="355" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#0C706E">Primero, las decenas</text>
<text x="320" y="425" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#1E2A78">19 es menor que 21</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Un lado horizontal hacia la derecha con un punto grueso en el vértice y el rótulo lado inicial; arriba a la izquierda, un recuadro con trazar ciento treinta grados y un signo de pregunta donde irá el otro lado"><title>Un lado horizontal hacia la derecha con un punto grueso en el vértice y el rótulo lado inicial; arriba a la izquierda, un recuadro con trazar ciento treinta grados y un signo de pregunta donde irá el otro lado</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="48" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Un ángulo por trazar</text><line x1="320.0" y1="400.0" x2="600.0" y2="400.0" stroke="#0C706E" stroke-width="6" stroke-linecap="round"/><circle cx="320.0" cy="400.0" r="10" fill="#1E2A78"/><text x="290" y="448" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">vértice</text><text x="480" y="440" font-family="sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="middle">lado inicial</text><rect x="40" y="80" width="250" height="68" rx="14" fill="#FBE3AE" stroke="#F2B84B" stroke-width="3"/><text x="165" y="127" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">Trazar 130°</text><text x="200" y="260" font-family="sans-serif" font-size="70" font-weight="700" fill="#8A5A00" text-anchor="middle">?</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title">
<title>Tres quintos y un medio convertidos a décimos</title>
<rect width="640" height="480" fill="#FCF0D6"/>

<text x="320" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78">Tres quintos y un medio</text>
<rect x="65" y="100" width="510" height="250" rx="24" fill="#fff"/>
<text x="185" y="180" text-anchor="middle" font-family="sans-serif" font-size="38" fill="#1E2A78">3/5 × 2/2</text><text x="455" y="180" text-anchor="middle" font-family="sans-serif" font-size="38" fill="#1E2A78">1/2 × 5/5</text>
<text x="185" y="275" text-anchor="middle" font-family="sans-serif" font-size="46" font-weight="700" fill="#0C706E">6/10</text><text x="455" y="275" text-anchor="middle" font-family="sans-serif" font-size="46" font-weight="700" fill="#0C706E">5/10</text>
<text x="320" y="330" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#8A5A00">Ahora las partes tienen igual tamaño</text>
<text x="320" y="430" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#1E2A78">Se conserva el valor de cada fracción</text>
</svg>

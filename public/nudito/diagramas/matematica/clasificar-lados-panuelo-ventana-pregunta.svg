<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img"><title>Un pañuelo cuadrado y una ventana larga</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="60" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">¿Van en el mismo grupo?</text><rect x="80" y="160" width="150" height="150" rx="4" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4" /><rect x="330" y="185" width="250" height="100" rx="4" fill="#F2B84B" stroke="#1E2A78" stroke-width="4" /><text x="155" y="370" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="middle">Pañuelo</text><text x="455" y="370" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#8A5A00" text-anchor="middle">Ventana</text></svg>
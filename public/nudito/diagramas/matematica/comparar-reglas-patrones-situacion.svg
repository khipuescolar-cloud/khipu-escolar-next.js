<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title">
<title>Dos patrones para descubrir su regla</title>
<rect width="640" height="480" fill="#FCF0D6"/>

<text x="320" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78">¿Qué regla comparten?</text>
<rect x="50" y="90" width="540" height="125" rx="20" fill="#fff"/><rect x="50" y="245" width="540" height="125" rx="20" fill="#fff"/>
<text x="85" y="165" font-family="sans-serif" font-size="28" fill="#1E2A78">Patrón Sol</text><text x="270" y="165" font-family="sans-serif" font-size="34" fill="#0C706E">4 → 7 → 10 → ?</text>
<text x="85" y="320" font-family="sans-serif" font-size="28" fill="#1E2A78">Patrón Río</text><text x="245" y="320" font-family="sans-serif" font-size="34" fill="#0C706E">20 → 23 → 26 → ?</text>

</svg>

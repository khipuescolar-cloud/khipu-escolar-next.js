<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Cuatro múltiplos de seis: seis, doce, dieciocho y veinticuatro, con doce y veinticuatro múltiplos de cuatro y seis y dieciocho no"><title>Cuatro múltiplos de seis: seis, doce, dieciocho y veinticuatro, con doce y veinticuatro múltiplos de cuatro y seis y dieciocho no</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="54" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Múltiplos de 6</text><rect x="44" y="130" width="120" height="100" rx="12" fill="#F2B632" stroke="#1E2A78" stroke-width="4" /><text x="104" y="196" font-family="sans-serif" font-size="48" font-weight="700" fill="#1E2A78" text-anchor="middle">6</text><text x="104" y="285" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">no</text><rect x="188" y="130" width="120" height="100" rx="12" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4" /><text x="248" y="196" font-family="sans-serif" font-size="48" font-weight="700" fill="#FFFFFF" text-anchor="middle">12</text><text x="248" y="285" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="middle">sí</text><rect x="332" y="130" width="120" height="100" rx="12" fill="#F2B632" stroke="#1E2A78" stroke-width="4" /><text x="392" y="196" font-family="sans-serif" font-size="48" font-weight="700" fill="#1E2A78" text-anchor="middle">18</text><text x="392" y="285" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">no</text><rect x="476" y="130" width="120" height="100" rx="12" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4" /><text x="536" y="196" font-family="sans-serif" font-size="48" font-weight="700" fill="#FFFFFF" text-anchor="middle">24</text><text x="536" y="285" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="middle">sí</text><text x="320" y="340" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">¿Es múltiplo de 4?</text><text x="320" y="395" font-family="sans-serif" font-size="30" font-weight="700" fill="#0F7C7A" text-anchor="middle">6 y 18 son contraejemplos</text><text x="320" y="445" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Un caso basta: es falsa</text></svg>

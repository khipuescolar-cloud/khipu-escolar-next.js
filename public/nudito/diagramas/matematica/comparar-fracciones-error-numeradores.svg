<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Error de comparar solo numeradores y su corrección</title><rect width="640" height="480" rx="28" fill="#FCF0D6"/><text x="320" y="56" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#1E2A78">Las partes deben medir lo mismo</text><rect x="40" y="110" width="270" height="250" rx="18" fill="#FFF9EC" stroke="#8A5A00" stroke-width="5"/><text x="175" y="160" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#8A5A00">Error</text><text x="175" y="215" text-anchor="middle" font-family="Arial" font-size="28" fill="#1E2A78">Mirar solo los</text><text x="175" y="252" text-anchor="middle" font-family="Arial" font-size="28" fill="#1E2A78">numeradores</text><line x1="153" y1="288" x2="197" y2="332" stroke="#8A5A00" stroke-width="8"/><line x1="153" y1="332" x2="197" y2="288" stroke="#8A5A00" stroke-width="8"/><rect x="330" y="110" width="270" height="250" rx="18" fill="#FFF9EC" stroke="#0F7C7A" stroke-width="5"/><text x="465" y="160" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#0C706E">Corrección</text><text x="465" y="215" text-anchor="middle" font-family="Arial" font-size="28" fill="#1E2A78">Usar un mismo</text><text x="465" y="252" text-anchor="middle" font-family="Arial" font-size="28" fill="#1E2A78">denominador</text><circle cx="465" cy="310" r="36" fill="#0F7C7A"/><path d="M447 312 L460 325 L485 296" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="430" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#1E2A78">Luego compara y ordena</text></svg>

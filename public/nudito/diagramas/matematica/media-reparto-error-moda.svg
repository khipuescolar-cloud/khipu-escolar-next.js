<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Datos cuatro, cuatro y diez; tomar cuatro como media aparece tachado y se muestra dieciocho dividido entre tres igual a seis.">
  <title>No confundas moda con media</title>
  <rect width="640" height="480" rx="32" fill="#FCF0D6"/>
  <text x="320" y="58" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#1E2A78">Moda y media no son lo mismo</text>
  <text x="320" y="130" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="700" fill="#1E2A78">4, 4, 10</text>
  <rect x="40" y="175" width="270" height="125" rx="20" fill="#FFFFFF" stroke="#B5412A" stroke-width="5"/>
  <text x="175" y="225" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#B5412A">“La media es 4”</text>
  <path d="M155 245 L195 285 M195 245 L155 285" stroke="#B5412A" stroke-width="8"/>
  <rect x="340" y="175" width="260" height="125" rx="20" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="5"/>
  <text x="470" y="225" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#0C706E">18 ÷ 3 = 6</text>
  <text x="470" y="270" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#1E2A78">reparto igual</text>
  <text x="320" y="390" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#0C706E">La media usa todos los datos</text>
</svg>

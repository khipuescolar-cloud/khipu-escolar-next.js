<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Barra con las partes trescientos cuarenta, una pieza amarilla de tres y doscientos noventa y siete, y las cuentas"><title>Barra con las partes trescientos cuarenta, una pieza amarilla de tres y doscientos noventa y siete, y las cuentas</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">Se quita de más</text><rect x="80.0" y="130" width="215" height="74" rx="8" fill="#0F7C7A" stroke="#0F7C7A" stroke-width="3"/><text x="187.5" y="177.0" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">340</text><rect x="295.0" y="130" width="40" height="74" rx="8" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="315.0" y="177.0" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">3</text><rect x="335.0" y="130" width="225" height="74" rx="8" fill="#A9AEB9" stroke="#A9AEB9" stroke-width="3"/><text x="447.5" y="177.0" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">297</text><path d="M 295.0 114 L 295.0 100 L 560.0 100 L 560.0 114" fill="none" stroke="#1E2A78" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="427.5" y="90" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">se quitan 300</text><text x="320" y="270" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">640 − 300 = 340</text><text x="320" y="330" font-family="sans-serif" font-size="28" font-weight="700" fill="#8A5A00" text-anchor="middle">3 de más</text><text x="320" y="392" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">340 + 3 = 343</text></svg>
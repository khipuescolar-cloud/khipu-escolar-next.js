<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dos triángulos iguales pegados por su lado más largo forman un cuadrado"><title>Dos triángulos iguales pegados por su lado más largo forman un cuadrado</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="54" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Dos triángulos pegados</text><polygon points="230,100 410,100 230,280" fill="#F2B632" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round" /><polygon points="410,100 410,280 230,280" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round" /><line x1="410" y1="100" x2="230" y2="280" stroke="#1E2A78" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8"/><text x="320" y="350" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">2 triángulos iguales</text><text x="320" y="392" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">4 lados iguales</text><text x="320" y="445" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="middle">Sale un cuadrado</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="titulo">
  <title id="titulo">Cinta dividida en ocho tramos con tres coloreados y una pregunta</title>
  <rect width="640" height="480" fill="#FCF0D6"/>
  <text x="320" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1E2A78">Una cinta para decorar</text>
  <text x="320" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#0C706E">Todos los tramos tienen el mismo ancho</text>
  <g stroke="#1E2A78" stroke-width="4">
    <rect x="72" y="176" width="62" height="112" rx="4" fill="#0F7C7A"/>
    <rect x="134" y="176" width="62" height="112" fill="#0F7C7A"/>
    <rect x="196" y="176" width="62" height="112" fill="#0F7C7A"/>
    <rect x="258" y="176" width="62" height="112" fill="#FFFFFF"/>
    <rect x="320" y="176" width="62" height="112" fill="#FFFFFF"/>
    <rect x="382" y="176" width="62" height="112" fill="#FFFFFF"/>
    <rect x="444" y="176" width="62" height="112" fill="#FFFFFF"/>
    <rect x="506" y="176" width="62" height="112" rx="4" fill="#FFFFFF"/>
  </g>
  <text x="165" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#0C706E">tramos pintados</text>
  <text x="451" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1E2A78">tramos sin pintar</text>
  <rect x="184" y="380" width="272" height="62" rx="22" fill="#F2B84B"/>
  <text x="320" y="421" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1E2A78">¿Qué fracción está pintada?</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Suma de nueve, once, trece y quince igual a cuarenta y ocho; reparto entre cuatro días igual a doce vasos.">
  <title>Media de las ventas diarias</title>
  <rect width="640" height="480" rx="32" fill="#FCF0D6"/>
  <text x="320" y="58" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78">Suma y reparte entre cuatro días</text>
  <g font-family="sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#1E2A78">
    <text x="320" y="150">9 + 11 + 13 + 15 = 48</text>
    <text x="320" y="235">48 ÷ 4 = 12</text>
  </g>
  <rect x="125" y="290" width="390" height="105" rx="24" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="6"/>
  <text x="320" y="355" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#0C706E">Media: 12 vasos</text>
</svg>

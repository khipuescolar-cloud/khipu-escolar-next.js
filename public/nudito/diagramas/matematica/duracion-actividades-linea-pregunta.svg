<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Línea de tiempo de una actividad sin duración escrita</title>
  <rect width="640" height="480" rx="28" fill="#FCF0D6"/>
  <text x="320" y="62" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78">De inicio a fin</text>
  <line x1="105" y1="245" x2="535" y2="245" stroke="#1E2A78" stroke-width="10" stroke-linecap="round"/>
  <g stroke="#0F7C7A" stroke-width="7"><line x1="135" y1="200" x2="135" y2="290"/><line x1="505" y1="200" x2="505" y2="290"/></g>
  <g font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle"><text x="135" y="345">8:15</text><text x="505" y="345">9:45</text></g>
  <g font-family="sans-serif" font-size="27" font-weight="700" fill="#0C706E" text-anchor="middle"><text x="135" y="175">Inicio</text><text x="505" y="175">Fin</text></g>
  <text x="320" y="420" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="700" fill="#0C706E">¿Cuánto dura?</text>
</svg>

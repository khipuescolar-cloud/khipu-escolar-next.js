<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tarjeta con tres pasos para completar un patrón: buscar el grupo, mirar antes del espacio y poner la ficha"><title>Tarjeta con tres pasos para completar un patrón: buscar el grupo, mirar antes del espacio y poner la ficha</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Tres pasos para completar</text><rect x="30" y="80" width="580" height="112" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><circle cx="82" cy="136" r="28" fill="#1E2A78"/><text x="82" y="146" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="130" y="124" font-family="sans-serif" font-size="26" font-weight="700" fill="#5B6170" text-anchor="start">Busca el grupo</text><text x="130" y="168" font-family="sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="start">Lo que se repite igual</text><rect x="30" y="205" width="580" height="112" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><circle cx="82" cy="261" r="28" fill="#1E2A78"/><text x="82" y="271" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="130" y="249" font-family="sans-serif" font-size="26" font-weight="700" fill="#5B6170" text-anchor="start">Mira antes del espacio</text><text x="130" y="293" font-family="sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="start">Eso dice qué sigue</text><rect x="30" y="330" width="580" height="112" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><circle cx="82" cy="386" r="28" fill="#1E2A78"/><text x="82" y="396" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="130" y="374" font-family="sans-serif" font-size="26" font-weight="700" fill="#5B6170" text-anchor="start">Pon la ficha y revisa</text><text x="130" y="418" font-family="sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="start">Lee toda la fila otra vez</text></svg>
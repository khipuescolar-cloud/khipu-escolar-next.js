<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Una estrella equivale a dos cuyes; la jaula 1 tiene tres estrellas, con un dos debajo de cada una, y abajo dice tres por dos igual a seis cuyes"><title>Una estrella equivale a dos cuyes; la jaula 1 tiene tres estrellas, con un dos debajo de cada una, y abajo dice tres por dos igual a seis cuyes</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Cuyes en la jaula 1</text><polygon points="60.0,104.0 66.9,120.5 84.7,122.0 71.1,133.6 75.3,151.0 60.0,141.7 44.7,151.0 48.9,133.6 35.3,122.0 53.1,120.5" fill="#F2B84B" stroke="#1E2A78" stroke-width="3" stroke-linejoin="round"/><text x="100" y="142" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="start">= 2 cuyes</text><text x="30" y="258" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">Jaula 1</text><polygon points="215.0,212.0 225.1,236.2 251.1,238.3 231.3,255.3 237.3,280.7 215.0,267.1 192.7,280.7 198.7,255.3 178.9,238.3 204.9,236.2" fill="#F2B84B" stroke="#1E2A78" stroke-width="3" stroke-linejoin="round"/><text x="215" y="336" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="middle">2</text><polygon points="345.0,212.0 355.1,236.2 381.1,238.3 361.3,255.3 367.3,280.7 345.0,267.1 322.7,280.7 328.7,255.3 308.9,238.3 334.9,236.2" fill="#F2B84B" stroke="#1E2A78" stroke-width="3" stroke-linejoin="round"/><text x="345" y="336" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="middle">2</text><polygon points="475.0,212.0 485.1,236.2 511.1,238.3 491.3,255.3 497.3,280.7 475.0,267.1 452.7,280.7 458.7,255.3 438.9,238.3 464.9,236.2" fill="#F2B84B" stroke="#1E2A78" stroke-width="3" stroke-linejoin="round"/><text x="475" y="336" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="middle">2</text><text x="280" y="336" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">+</text><text x="410" y="336" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">+</text><text x="320" y="420" font-family="sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">3 × 2 = 6 cuyes</text></svg>
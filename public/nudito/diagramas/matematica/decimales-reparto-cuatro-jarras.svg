<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Cuatro jarras con uno coma tres litros cada una, que juntas son cinco coma dos litros"><title>Cuatro jarras con uno coma tres litros cada una, que juntas son cinco coma dos litros</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="56" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">5,2 L entre 4 jarras</text><rect x="40" y="100" width="110" height="150" rx="16" fill="#BFE3E1" stroke="#1E2A78" stroke-width="4"/><text x="95" y="184" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">1,3 L</text><rect x="185" y="100" width="110" height="150" rx="16" fill="#BFE3E1" stroke="#1E2A78" stroke-width="4"/><text x="240" y="184" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">1,3 L</text><rect x="330" y="100" width="110" height="150" rx="16" fill="#BFE3E1" stroke="#1E2A78" stroke-width="4"/><text x="385" y="184" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">1,3 L</text><rect x="475" y="100" width="110" height="150" rx="16" fill="#BFE3E1" stroke="#1E2A78" stroke-width="4"/><text x="530" y="184" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">1,3 L</text><text x="320" y="305" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Sobra 1 unidad = 10 décimos</text><text x="320" y="350" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">10 + 2 = 12 décimos ÷ 4 = 3 décimos</text><text x="320" y="415" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="middle">Comprobación: 1,3 × 4 = 5,2</text></svg>
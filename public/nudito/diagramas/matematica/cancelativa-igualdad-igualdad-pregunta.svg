<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="La igualdad dieciocho más once es igual a dieciocho más seis más un cuadrado vacío"><title>La igualdad dieciocho más once es igual a dieciocho más seis más un cuadrado vacío</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle" >Una igualdad con un hueco</text><rect x="30" y="130" width="210" height="90" rx="14" fill="#FFF9ED" stroke="#1E2A78" stroke-width="3" /><rect x="280" y="130" width="330" height="90" rx="14" fill="#FFF9ED" stroke="#1E2A78" stroke-width="3" /><text x="135" y="190" font-family="sans-serif" font-size="40" font-weight="700" fill="#1E2A78" text-anchor="middle" >18 + 11</text><text x="260" y="190" font-family="sans-serif" font-size="44" font-weight="700" fill="#0F7C7A" text-anchor="middle" >=</text><text x="380" y="190" font-family="sans-serif" font-size="40" font-weight="700" fill="#1E2A78" text-anchor="middle" >18 + 6 +</text><rect x="470" y="150" width="48" height="48" rx="4" fill="none" stroke="#1E2A78" stroke-width="3" stroke-dasharray="7 6"/><text x="320" y="290" font-family="sans-serif" font-size="28" font-weight="400" fill="#1E2A78" text-anchor="middle" >Los dos lados valen lo mismo</text><text x="320" y="420" font-family="sans-serif" font-size="30" font-weight="700" fill="#0F7C7A" text-anchor="middle" >¿Qué número va en el cuadrado?</text></svg>
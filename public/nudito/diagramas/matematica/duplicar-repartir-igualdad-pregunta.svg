<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img"><title>Igualdad cuatro más seis igual a diez antes de duplicar</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="65" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#1E2A78">Una igualdad verdadera</text><rect x="70" y="130" width="500" height="150" rx="22" fill="#FFFFFF" stroke="#1E2A78" stroke-width="5"/><text x="320" y="225" text-anchor="middle" font-family="Arial" font-size="52" font-weight="700" fill="#1E2A78">4 + 6 = 10</text><path d="M150 340 H490" stroke="#0C706E" stroke-width="8"/><path d="M150 340 L190 315 M150 340 L190 365 M490 340 L450 315 M490 340 L450 365" stroke="#0C706E" stroke-width="8" fill="none"/><text x="320" y="420" text-anchor="middle" font-family="Arial" font-size="30" fill="#8A5A00">¿Qué pasa al duplicar ambos lados?</text></svg>

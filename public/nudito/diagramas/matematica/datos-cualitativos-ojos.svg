<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Cinco tarjetas de color de ojos agrupadas en marrón y negro</title>
  <rect width="640" height="480" fill="#FCF0D6"/>
  <text x="320" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1E2A78">Color de ojos</text>
  <g fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"><rect x="55" y="105" width="240" height="280" rx="18"/><rect x="345" y="105" width="240" height="280" rx="18"/></g>
  <text x="175" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0C706E">Marrón</text>
  <text x="465" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0C706E">Negro</text>
  <g stroke="#1E2A78" stroke-width="4"><ellipse cx="130" cy="235" rx="40" ry="28" fill="#8A5A00"/><ellipse cx="220" cy="235" rx="40" ry="28" fill="#8A5A00"/><ellipse cx="175" cy="315" rx="40" ry="28" fill="#8A5A00"/><ellipse cx="420" cy="235" rx="40" ry="28" fill="#1E2A78"/><ellipse cx="510" cy="300" rx="40" ry="28" fill="#1E2A78"/></g>
  <text x="320" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#1E2A78">Cinco respuestas, dos nombres.</text>
</svg>

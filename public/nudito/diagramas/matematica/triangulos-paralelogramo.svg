<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Paralelogramo formado por dos triángulos iguales, base 10 cm, altura 6 cm, área 60 cm², cada triángulo 30 cm²"><title>Paralelogramo formado por dos triángulos iguales, base 10 cm, altura 6 cm, área 60 cm², cada triángulo 30 cm²</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="56" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Dos triángulos iguales</text><polygon points="90,320 400,320 550,150 240,150" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round"/><polygon points="90,320 400,320 550,150" fill="#BFE3E1" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round"/><polygon points="90,320 550,150 240,150" fill="#FBE3AE" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round"/><line x1="240" y1="150" x2="240" y2="320" stroke="#1E2A78" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 8"/><path d="M240 296 L264 296 L264 320" fill="none" stroke="#1E2A78" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="254" y="208" font-family="sans-serif" font-size="28" font-weight="700" fill="#1B1F2A" text-anchor="start">6 cm</text><text x="245" y="368" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">base 10 cm</text><text x="320" y="422" font-family="sans-serif" font-size="34" font-weight="700" fill="#0F7C7A" text-anchor="middle">10 × 6 = 60 cm²</text><text x="320" y="462" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">cada triángulo: 30 cm²</text></svg>
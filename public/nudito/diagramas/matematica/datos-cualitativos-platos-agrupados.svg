<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Respuestas de platos favoritos agrupadas en tres categorías</title>
  <rect width="640" height="480" fill="#FCF0D6"/>
  <text x="320" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1E2A78">Tres categorías</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"><rect x="15" y="85" width="190" height="310" rx="18"/><rect x="225" y="85" width="190" height="310" rx="18"/><rect x="435" y="85" width="190" height="310" rx="18"/></g>
    <g font-size="28" font-weight="700" fill="#0C706E"><text x="110" y="140">Ceviche</text><text x="320" y="125">Lomo</text><text x="320" y="157">saltado</text><text x="530" y="125">Ají de</text><text x="530" y="157">gallina</text></g>
    <g font-size="26" fill="#1E2A78"><text x="110" y="215">Ceviche</text><text x="110" y="265">Ceviche</text><text x="110" y="315">Ceviche</text><text x="320" y="210">Lomo</text><text x="320" y="238">saltado</text><text x="320" y="285">Lomo</text><text x="320" y="313">saltado</text><text x="530" y="240">Ají de</text><text x="530" y="268">gallina</text></g>
    <g font-size="30" font-weight="700" fill="#8A5A00"><text x="110" y="372">3</text><text x="320" y="372">2</text><text x="530" y="372">1</text></g>
  </g>
  <text x="320" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#1E2A78">Junta lo que se llama igual.</text>
</svg>

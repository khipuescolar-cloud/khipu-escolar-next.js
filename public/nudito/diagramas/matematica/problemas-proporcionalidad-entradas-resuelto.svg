<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Precio unitario y costo de seis entradas</title>
  <rect width="640" height="480" rx="32" fill="#FCF0D6"/>
  <text x="320" y="56" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78">Primero, una entrada</text>
  <rect x="54" y="94" width="532" height="300" rx="24" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/>
  <rect x="90" y="135" width="180" height="92" rx="16" fill="#FDE7A7" stroke="#8A5A00" stroke-width="3"/>
  <text x="180" y="176" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78">4 entradas</text>
  <text x="180" y="211" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78">S/ 28</text>
  <path d="M286 180H348" stroke="#0F7C7A" stroke-width="7" stroke-linecap="round"/><path d="M330 163L351 180L330 197" fill="none" stroke="#0F7C7A" stroke-width="7" stroke-linejoin="round"/>
  <rect x="366" y="135" width="180" height="92" rx="16" fill="#D7F0EE" stroke="#0F7C7A" stroke-width="3"/>
  <text x="456" y="176" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78">1 entrada</text>
  <text x="456" y="211" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#0C706E">S/ 7</text>
  <text x="320" y="278" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78">S/ 28 ÷ 4 = S/ 7</text>
  <text x="320" y="332" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#0C706E">6 × S/ 7 = S/ 42</text>
  <text x="320" y="374" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#8A5A00">Seis entradas cuestan S/ 42</text>
</svg>

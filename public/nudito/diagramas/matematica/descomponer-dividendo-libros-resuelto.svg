<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img"><title>División de ciento cincuenta y seis entre doce mediante dos partes</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#1E2A78">Dos partes fáciles</text><rect x="55" y="95" width="530" height="80" rx="18" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="320" y="148" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#1E2A78">156 = 120 + 36</text><g fill="#FFFFFF" stroke-width="4"><rect x="55" y="215" width="245" height="120" rx="18" stroke="#0C706E"/><rect x="340" y="215" width="245" height="120" rx="18" stroke="#8A5A00"/></g><text x="177" y="287" text-anchor="middle" font-family="Arial" font-size="34" fill="#0C706E">120 ÷ 12 = 10</text><text x="462" y="287" text-anchor="middle" font-family="Arial" font-size="34" fill="#8A5A00">36 ÷ 12 = 3</text><rect x="180" y="365" width="280" height="75" rx="18" fill="#F2B84B" stroke="#1E2A78" stroke-width="4"/><text x="320" y="414" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#1E2A78">10 + 3 = 13</text></svg>

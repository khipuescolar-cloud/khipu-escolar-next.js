cto</text><text x="290" y="263" font-family="sans-serif" font-size="28" font-weight="400" fill="#1E2A78" text-anchor="start">igual a 90°</text><line x1="150" y1="395" x2="238.63269777109872" y2="379.37166400997626" stroke="#1E2A78" stroke-width="6" stroke-linecap="round"/><line x1="150" y1="395" x2="81.056000119292" y2="337.14911512821146" stroke="#1E2A78" stroke-width="6" stroke-linecap="round"/><path d="M 177.6 390.1 A 28 28 0 0 0 128.6 377.0" fill="none" stroke="#F2B84B" stroke-width="5"/><circle cx="150" cy="395" r="6" fill="#1E2A78" stroke="#1E2A78" stroke-width="0"/><text x="290" y="345" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="start">obtuso</text><text x="290" y="378" font-family="sans-serif" font-size="28" font-weight="400" fill="#1E2A78" text-anchor="start">mayor que 90°</text><text x="290" y="410" font-family="sans-serif" font-size="28" font-weight="400" fill="#1E2A78" text-anchor="start">menor que 180°</text></svg>
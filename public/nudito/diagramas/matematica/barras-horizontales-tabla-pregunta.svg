<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Una tabla con mango cinco, piña tres y uva cuatro, y a su derecha un gráfico vacío con los nombres de las frutas; abajo dice que cada cuadradito vale un voto"><title>Una tabla con mango cinco, piña tres y uva cuatro, y a su derecha un gráfico vacío con los nombres de las frutas; abajo dice que cada cuadradito vale un voto</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">De la tabla al gráfico</text><rect x="40" y="92" width="260" height="206" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" /><text x="62" y="146" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">mango</text><text x="278" y="146" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="end">5</text><text x="62" y="206" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">piña</text><text x="278" y="206" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="end">3</text><text x="62" y="266" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">uva</text><text x="278" y="266" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="end">4</text><rect x="340" y="92" width="260" height="206" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" stroke-dasharray="10 8"/><text x="362" y="146" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">mango</text><line x1="486" y1="136" x2="580" y2="136" stroke="#D9C9A3" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 8"/><text x="362" y="206" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">piña</text><line x1="486" y1="196" x2="580" y2="19
  <text x="320" y="58" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="700" fill="#1E2A78">Dado normal</text>
  <rect x="118" y="112" width="404" height="205" rx="26" fill="#FFFFFF" stroke="#1E2A78" stroke-width="6"/>

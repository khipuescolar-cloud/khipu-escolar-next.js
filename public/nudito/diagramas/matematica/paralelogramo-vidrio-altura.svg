<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Un paralelogramo de base nueve centímetros y área setenta y dos centímetros cuadrados: setenta y dos entre nueve da una altura de ocho centímetros"><title>Un paralelogramo de base nueve centímetros y área setenta y dos centímetros cuadrados: setenta y dos entre nueve da una altura de ocho centímetros</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Vidrio de ventana</text><polygon points="70,290 250,290 370,130 190,130" fill="#FBE3AE" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round"/><line x1="190" y1="130" x2="190" y2="290" stroke="#1E2A78" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round"/><rect x="190" y="276" width="14" height="14" rx="0" fill="none" stroke="#1E2A78" stroke-width="2"/><text x="160" y="326" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">9 cm</text><text x="250" y="186" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">72 cm²</text><text x="210" y="238" font-family="sans-serif" font-size="28" font-weight="700" fill="#0F7C7A" text-anchor="start">8 cm</text><text x="320" y="385" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">9 × altura = 72</text><text x="320" y="438" font-family="sans-serif" font-size="38" font-weight="700" fill="#0F7C7A" text-anchor="middle">72 ÷ 9 = 8 cm</text></svg>
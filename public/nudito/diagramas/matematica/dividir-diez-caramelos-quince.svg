<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Ciento cincuenta caramelos como quince decenas</title><rect width="640" height="480" rx="28" fill="#FCF0D6"/><text x="320" y="55" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#1E2A78">Ciento cincuenta caramelos</text><rect x="75" y="115" width="250" height="220" rx="20" fill="#F2B84B" stroke="#1E2A78" stroke-width="5"/><text x="200" y="205" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#1E2A78">una centena</text><text x="200" y="255" text-anchor="middle" font-family="Arial" font-size="29" fill="#1E2A78">diez decenas</text><rect x="360" y="115" width="205" height="220" rx="20" fill="#0F7C7A" stroke="#1E2A78" stroke-width="5"/><text x="462" y="205" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#FFFFFF">cinco</text><text x="462" y="255" text-anchor="middle" font-family="Arial" font-size="29" fill="#FFFFFF">decenas</text><text x="320" y="405" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#1E2A78">Quince decenas en total</text></svg>

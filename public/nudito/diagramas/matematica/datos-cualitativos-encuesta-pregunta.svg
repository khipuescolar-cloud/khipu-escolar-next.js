  <g font-family="Arial, sans-serif" font-size="27" fill="#1E2A78" text-anchor="middle">
    <g fill="#FFFFFF" stroke="#0C706E" stroke-width="4"><rect x="40" y="105" width="170" height="90" rx="16"/><rect x="235" y="105" width="170" height="90" rx="16"/><rect x="430" y="105" width="170" height="90" rx="16"/><rect x="40" y="215" width="170" height="90" rx="16"/><rect x="235" y="215" width="170" height="90" rx="16"/><rect x="430" y="215" width="170" height="90" rx="16"/></g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres bloques de siglos: el año 1821 cae en el segundo, el siglo XIX"><title>Tres bloques de siglos: el año 1821 cae en el segundo, el siglo XIX</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="50" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Línea de siglos</text><rect x="30" y="150" width="193" height="120" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="126" y="205" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Siglo XVIII</text><text x="126" y="248" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">1701 a 1800</text><rect x="223" y="150" width="193" height="120" rx="0" fill="#FBE3AE" stroke="#1E2A78" stroke-width="4"/><text x="319" y="205" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Siglo XIX</text><text x="319" y="248" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">1801 a 1900</text><rect x="416" y="150" width="193" height="120" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="512" y="205" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Siglo XX</text><text x="512" y="248" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">1901 a 2000</text><circle cx="262" cy="150" r="11" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><line x1="262" y1="139" x2="262" y2="112" stroke="#0C706E" stroke-width="4" stroke-linecap="round"/><text x="262" y="98" font-family="sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="middle">1821</text><text x="320" y="360" font-family="sans-serif" font-size="32" font-weight="700" fill="#0C706E" text-anchor="middle">18 + 1 = 19: siglo XIX</text></svg>
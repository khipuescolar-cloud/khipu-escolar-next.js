<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title">
<title>Error al cambiar solo el denominador</title>
<rect width="640" height="480" fill="#FCF0D6"/>

<text x="320" y="50" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78">Cambia arriba y abajo</text>
<rect x="65" y="105" width="510" height="220" rx="24" fill="#fff"/>
<text x="170" y="225" text-anchor="middle" font-family="sans-serif" font-size="52" fill="#1E2A78">1/2</text><path d="M235 205H385" stroke="#B5412A" stroke-width="7" marker-end="url(#a)"/><text x="470" y="225" text-anchor="middle" font-family="sans-serif" font-size="52" fill="#B5412A">1/6</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#B5412A"/></marker></defs>
<path d="M405 200H535" stroke="#B5412A" stroke-width="6"/>
<text x="320" y="380" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#0C706E">Si abajo se multiplica por tres,</text><text x="320" y="425" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#0C706E">arriba también</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres tarjetas. Primera: cuatro, siete, doce, con saltos de tres y cinco, y cruz roja. Segunda: tres coma dos más tres da seis coma dos, con cruz roja. Tercera: tres coma dos más cero coma tres da tres coma cinco, con marca verde."><title>Tres tarjetas. Primera: cuatro, siete, doce, con saltos de tres y cinco, y cruz roja. Segunda: tres coma dos más tres da seis coma dos, con cruz roja. Tercera: tres coma dos más cero coma tres da tres coma cinco, con marca verde.</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Errores y camino correcto</text><rect x="50" y="90" width="540" height="96" rx="14" fill="#FFFFFF" stroke="#B5412A" stroke-width="4"/><text x="78" y="126" font-family="sans-serif" font-size="26" font-weight="700" fill="#B5412A" text-anchor="start">Cambios distintos</text><text x="78" y="168" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="start">4, 7, 12:  +3 y +5</text><path d="M532 122L564 154M564 122L532 154" stroke="#B5412A" stroke-width="7" stroke-linecap="round" fill="none"/><rect x="50" y="202" width="540" height="96" rx="14" fill="#FFFFFF" stroke="#B5412A" stroke-width="4"/><text x="78" y="238" font-family="sans-serif" font-size="26" font-weight="700" fill="#B5412A" text-anchor="start">Coma mal leída</text><text x="78" y="280" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="start">3,2 + 3 = 6,2</text><path d="M532 234L564 266M564 234L532 266" stroke="#B5412A" stroke-width="7" stroke-linecap="round" fill="none"/><rect x="50" y="314" width="540" height="96" rx="14" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="4"/><text x="78" y="350" font-family="sans-serif" font-size="26" font-weight="700" fill="#0C706E" text-anchor="start">Mismo cambio, coma bien</text><text x="78" y="392" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="start">3,2 + 0,3 = 3,5</text><path d="M532 362L542.6666666666666 374.8L564 349.2" stroke="#0F7C7A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
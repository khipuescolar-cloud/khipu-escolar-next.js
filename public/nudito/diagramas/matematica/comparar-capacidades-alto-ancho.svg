<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img"><title>Un vaso alto y delgado, y un tazón bajo y ancho</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="60" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Medimos con vasitos iguales</text><line x1="30" y1="390" x2="610" y2="390" stroke="#1E2A78" stroke-width="4" stroke-linecap="round" /><rect x="140" y="160" width="60" height="230" rx="12" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4" /><path d="M310,270 L590,270 C590,380 540,390 450,390 C360,390 310,380 310,270 Z" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="170" y="440" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="middle">Alto: 3 vasitos</text><text x="450" y="440" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#8A5A00" text-anchor="middle">Ancho: 5 vasitos</text></svg>
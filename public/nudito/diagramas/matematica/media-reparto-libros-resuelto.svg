<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres cajas con seis libros cada una y la igualdad cuatro más seis más ocho igual a dieciocho, dividido entre tres igual a seis.">
  <title>El total repartido por igual</title>
  <rect width="640" height="480" rx="32" fill="#FCF0D6"/>
  <text x="320" y="55" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#1E2A78">El total no cambia</text>
  <text x="320" y="115" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78">4 + 6 + 8 = 18</text>
  <g fill="#FFFFFF" stroke="#0F7C7A" stroke-width="5">
    <rect x="70" y="155" width="145" height="185" rx="20"/><rect x="248" y="155" width="145" height="185" rx="20"/><rect x="425" y="155" width="145" height="185" rx="20"/>
  </g>
  <g fill="#F2B84B" stroke="#8A5A00" stroke-width="2">
    <rect x="92" y="285" width="100" height="18"/><rect x="92" y="260" width="100" height="18"/><rect x="92" y="235" width="100" height="18"/><rect x="92" y="210" width="100" height="18"/><rect x="92" y="185" width="100" height="18"/><rect x="92" y="160" width="100" height="18"/>
    <rect x="270" y="285" width="100" height="18"/><rect x="270" y="260" width="100" height="18"/><rect x="270" y="235" width="100" height="18"/><rect x="270" y="210" width="100" height="18"/><rect x="270" y="185" width="100" height="18"/><rect x="270" y="160" width="100" height="18"/>
    <rect x="447" y="285" width="100" height="18"/><rect x="447" y="260" width="100" height="18"/><rect x="447" y="235" width="100" height="18"/><rect x="447" y="210" width="100" height="18"/><rect x="447" y="185" width="100" height="18"/><rect x="447" y="160" width="100" height="18"/>
  </g>
  <text x="320" y="405" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="700" fill="#0C706E">18 ÷ 3 = 6 libros</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dos recuadros: primero se resuelven multiplicaciones y divisiones, después sumas y restas, en cada grupo de izquierda a derecha"><title>Dos recuadros: primero se resuelven multiplicaciones y divisiones, después sumas y restas, en cada grupo de izquierda a derecha</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="52" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">Orden de las operaciones</text><rect x="60" y="100" width="520" height="120" rx="16" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4"/><text x="320" y="178" font-family="sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="middle">Primero: × y ÷</text><text x="320" y="262" font-family="sans-serif" font-size="50" font-weight="700" fill="#1E2A78" text-anchor="middle">↓</text><rect x="60" y="290" width="520" height="120" rx="16" fill="#1E2A78" stroke="#1E2A78" stroke-width="4"/><text x="320" y="368" font-family="sans-serif" font-size="46" font-weight="700" fill="#FFFFFF" text-anchor="middle">Después: + y −</text><text x="320" y="452" font-family="sans-serif" font-size="28" font-weight="700" fill="#1B1F2A" text-anchor="middle">En cada grupo, de izquierda a derecha</text></svg>
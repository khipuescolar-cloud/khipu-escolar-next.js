<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Huerta de ocho cuadros: tres columnas sembradas, la fila de arriba con zanahorias, tres de ocho"><title>Huerta de ocho cuadros: tres columnas sembradas, la fila de arriba con zanahorias, tres de ocho</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="56" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">La mitad de tres cuartos</text><rect x="120" y="88" width="100" height="90" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4"/><rect x="120" y="178" width="100" height="90" fill="#FBE3AE" stroke="#1E2A78" stroke-width="4"/><rect x="220" y="88" width="100" height="90" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4"/><rect x="220" y="178" width="100" height="90" fill="#FBE3AE" stroke="#1E2A78" stroke-width="4"/><rect x="320" y="88" width="100" height="90" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4"/><rect x="320" y="178" width="100" height="90" fill="#FBE3AE" stroke="#1E2A78" stroke-width="4"/><rect x="420" y="88" width="100" height="90" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><rect x="420" y="178" width="100" height="90" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="320" y="325" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Sembrado: 3 de 4 columnas = 3/4</text><text x="320" y="370" font-family="sans-serif" font-size="28" font-weight="700" fill="#0F7C7A" text-anchor="middle">Zanahorias: 3 cuadros de 8</text><text x="320" y="436" font-family="sans-serif" font-size="40" font-weight="700" fill="#1E2A78" text-anchor="middle">1/2 × 3/4 = 3/8</text></svg>
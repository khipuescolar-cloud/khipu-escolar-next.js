<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title">
<title>Patrones con cambios opuestos</title>
<rect width="640" height="480" fill="#FCF0D6"/>

<text x="320" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78">Mismo cambio, sentido opuesto</text>
<rect x="50" y="90" width="540" height="120" rx="20" fill="#fff"/><rect x="50" y="245" width="540" height="120" rx="20" fill="#fff"/>
<text x="78" y="160" font-family="sans-serif" font-size="28" fill="#1E2A78">Costa</text><text x="200" y="160" font-family="sans-serif" font-size="34" fill="#0C706E">30 → 25 → 20</text><text x="505" y="160" font-family="sans-serif" font-size="28" fill="#8A5A00">−5</text>
<text x="78" y="315" font-family="sans-serif" font-size="28" fill="#1E2A78">Sierra</text><text x="200" y="315" font-family="sans-serif" font-size="34" fill="#0C706E">10 → 15 → 20</text><text x="505" y="315" font-family="sans-serif" font-size="28" fill="#8A5A00">+5</text>
<text x="320" y="430" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#1E2A78">Uno baja y el otro sube</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dos bloques de siglos: el año 1900 queda al final del siglo XIX y el siglo XX empieza en 1901"><title>Dos bloques de siglos: el año 1900 queda al final del siglo XIX y el siglo XX empieza en 1901</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="50" font-family="sans-serif" font-size="30" font-weight="700" fill="#B5412A" text-anchor="middle">Error: 1900 es del siglo XX</text><rect x="70" y="150" width="240" height="120" rx="0" fill="#FBE3AE" stroke="#1E2A78" stroke-width="4"/><rect x="330" y="150" width="240" height="120" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="190" y="205" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Siglo XIX</text><text x="190" y="248" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">1801 a 1900</text><text x="450" y="205" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Siglo XX</text><text x="450" y="248" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">1901 a 2000</text><circle cx="290" cy="150" r="11" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><line x1="290" y1="139" x2="290" y2="112" stroke="#0C706E" stroke-width="4" stroke-linecap="round"/><text x="290" y="98" font-family="sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="middle">1900</text><text x="320" y="345" font-family="sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="middle">Termina en dos ceros:</text><text x="320" y="390" font-family="sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="middle">es el último año del XIX</text></svg>
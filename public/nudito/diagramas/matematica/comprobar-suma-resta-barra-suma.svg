<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img"><title>Barras que muestran el total cuatro mil cuatrocientos, sus dos partes y lo que queda al quitar mil ochocientos</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="60" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Quitamos un sumando</text><text x="40" y="118" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="start">Total</text><rect x="60" y="130" width="520" height="56" rx="6" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4" /><text x="320.0" y="168.0" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">4&#160;400</text><text x="40" y="232" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="start">Partes</text><rect x="60" y="244" width="307" height="56" rx="6" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4" /><text x="213.5" y="282.0" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">2&#160;600</text><rect x="367" y="244" width="213" height="56" rx="6" fill="#F2B84B" stroke="#1E2A78" stroke-width="4" /><text x="473.5" y="282.0" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">1&#160;800</text><rect x="367" y="316" width="213" height="56" rx="6" fill="none" stroke="#B5412A" stroke-width="4" stroke-dasharray="10 8"/><text x="473.5" y="354" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#B5412A" text-anchor="middle">Se quita</text><rect x="60" y="316" width="307" height="56" rx="6" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4" /><text x="213.5" y="354.0" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Queda</text><text x="320" y="438" font-family="Arial, Liberation Sans, sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">4&#160;400 − 1&#160;800 = 2&#160;600</text></svg>
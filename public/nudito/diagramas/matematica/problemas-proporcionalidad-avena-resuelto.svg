<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Las porciones y las tazas se triplican</title>
  <rect width="640" height="480" rx="32" fill="#FCF0D6"/>
  <text x="320" y="57" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78">El mismo factor en ambas cantidades</text>
  <rect x="62" y="100" width="516" height="266" rx="24" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/>
  <g font-family="sans-serif" font-weight="700" text-anchor="middle">
    <text text-anchor="middle" x="178" y="153" font-size="27" fill="#1E2A78">4 porciones</text>
    <text text-anchor="middle" x="178" y="222" font-size="29" fill="#1E2A78">3 tazas</text>
    <text text-anchor="middle" x="462" y="153" font-size="27" fill="#1E2A78">12 porciones</text>
    <text text-anchor="middle" x="462" y="222" font-size="29" fill="#0C706E">9 tazas</text>
    <text text-anchor="middle" x="320" y="308" font-size="28" fill="#8A5A00">Las dos cantidades se triplican</text>
  </g>
  <path d="M276 143H340" stroke="#0F7C7A" stroke-width="7" stroke-linecap="round"/><path d="M322 126L344 143L322 160" fill="none" stroke="#0F7C7A" stroke-width="7" stroke-linejoin="round"/>
  <path d="M276 212H340" stroke="#0F7C7A" stroke-width="7" stroke-linecap="round"/><path d="M322 195L344 212L322 229" fill="none" stroke="#0F7C7A" stroke-width="7" stroke-linejoin="round"/>
  <text x="320" y="415" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#1E2A78">Cuatro por tres; tres por tres</text>
</svg>

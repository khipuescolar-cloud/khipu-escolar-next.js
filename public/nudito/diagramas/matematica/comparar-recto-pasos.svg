<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres pasos: toma una esquina de hoja, ponla sobre el ángulo y mira dónde queda el otro lado"><title>Tres pasos: toma una esquina de hoja, ponla sobre el ángulo y mira dónde queda el otro lado</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><rect x="30" y="30" width="580" height="125" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><circle cx="86" cy="92" r="34" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><text x="86" y="105" font-family="sans-serif" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="140" y="85" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Toma&#160;la&#160;esquina&#160;de&#160;una&#160;hoja</text><text x="140" y="125" font-family="sans-serif" font-size="26" font-weight="400" fill="#0C706E" text-anchor="start">Es&#160;tu&#160;ángulo&#160;recto</text><rect x="30" y="165" width="580" height="125" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><circle cx="86" cy="227" r="34" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><text x="86" y="240" font-family="sans-serif" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="140" y="220" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Pon&#160;la&#160;esquina&#160;sobre&#160;el&#160;ángulo</text><text x="140" y="260" font-family="sans-serif" font-size="26" font-weight="400" fill="#0C706E" text-anchor="start">Vértice&#160;con&#160;vértice,&#160;un&#160;lado&#160;sobre&#160;otro</text><rect x="30" y="300" width="580" height="125" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><circle cx="86" cy="362" r="34" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><text x="86" y="375" font-family="sans-serif" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="140" y="355" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Mira&#160;el&#160;otro&#160;lado</text><text x="140" y="395" font-family="sans-serif" font-size="26" font-weight="400" fill="#0C706E" text-anchor="start">Dentro,&#160;encima&#160;o&#160;fuera&#160;de&#160;la&#160;esquina</text></svg>
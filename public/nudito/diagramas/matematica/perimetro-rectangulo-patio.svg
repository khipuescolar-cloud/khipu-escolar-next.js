<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Patio rectangular con dos lados largos de doce metros y dos lados cortos de siete metros"><title>Patio rectangular con dos lados largos de doce metros y dos lados cortos de siete metros</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="56" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">El patio del colegio</text><rect x="140" y="115" width="360" height="210" rx="4" fill="#E2F3F1" stroke="#FFFFFF" stroke-width="1"/><line x1="140" y1="115" x2="500" y2="115" stroke="#0F7C7A" stroke-width="8" stroke-linecap="round"/><line x1="500" y1="115" x2="500" y2="325" stroke="#F2B84B" stroke-width="8" stroke-linecap="round"/><line x1="500" y1="325" x2="140" y2="325" stroke="#0F7C7A" stroke-width="8" stroke-linecap="round"/><line x1="140" y1="325" x2="140" y2="115" stroke="#F2B84B" stroke-width="8" stroke-linecap="round"/><text x="320" y="98" font-family="sans-serif" font-size="30" font-weight="700" fill="#0F7C7A" text-anchor="middle">12 m</text><text x="320" y="368" font-family="sans-serif" font-size="30" font-weight="700" fill="#0F7C7A" text-anchor="middle">12 m</text><text x="122" y="232" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="end">7 m</text><text x="518" y="232" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">7 m</text><text x="320" y="228" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">patio</text><text x="320" y="425" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">12 + 7 + 12 + 7 = 38 m</text><text x="320" y="463" font-family="sans-serif" font-size="26" font-weight="700" fill="#0F7C7A" text-anchor="middle">Se suman los cuatro lados</text></svg>

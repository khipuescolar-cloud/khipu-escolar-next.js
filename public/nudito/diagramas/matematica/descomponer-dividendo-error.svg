<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img"><title>Error de dividir solo una parte del dividendo</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#1E2A78">Una parte quedó sin dividir</text><rect x="65" y="105" width="510" height="90" rx="18" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="320" y="164" text-anchor="middle" font-family="Arial" font-size="38" fill="#1E2A78">96 = 80 + 16</text><rect x="65" y="235" width="230" height="105" rx="18" fill="#FFFFFF" stroke="#0C706E" stroke-width="4"/><text x="180" y="300" text-anchor="middle" font-family="Arial" font-size="34" fill="#0C706E">80 ÷ 8 = 10</text><rect x="345" y="235" width="230" height="105" rx="18" fill="#FFFFFF" stroke="#B5412A" stroke-width="5"/><text x="460" y="290" text-anchor="middle" font-family="Arial" font-size="32" fill="#B5412A">16 sin dividir</text><path d="M390 315 H530" stroke="#B5412A" stroke-width="9" stroke-linecap="round"/><text x="320" y="420" text-anchor="middle" font-family="Arial" font-size="28" fill="#1E2A78">Todas las partes usan el mismo divisor.</text></svg>

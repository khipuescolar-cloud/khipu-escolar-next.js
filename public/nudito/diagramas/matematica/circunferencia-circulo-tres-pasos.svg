<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres tarjetas con los pasos: mirar los extremos, reconocer el radio y reconocer la cuerda y el diámetro"><title>Tres tarjetas con los pasos: mirar los extremos, reconocer el radio y reconocer la cuerda y el diámetro</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="50" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle" >Tres pasos para nombrar</text><rect x="40" y="80" width="560" height="95" rx="14" fill="#FFF9ED" stroke="#1E2A78" stroke-width="3" /><circle cx="90" cy="127.5" r="26" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" /><text x="90" y="137.5" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle" >1</text><text x="135" y="119.5" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start" >Miro los extremos</text><text x="135" y="153.5" font-family="sans-serif" font-size="28" font-weight="400" fill="#1E2A78" text-anchor="start" >del segmento</text><rect x="40" y="190" width="560" height="95" rx="14" fill="#FFF9ED" stroke="#1E2A78" stroke-width="3" /><circle cx="90" cy="237.5" r="26" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" /><text x="90" y="247.5" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle" >2</text><text x="135" y="229.5" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start" >Un extremo en el centro</text><text x="135" y="263.5" font-family="sans-serif" font-size="28" font-weight="400" fill="#1E2A78" text-anchor="start" >y otro en el borde: radio</text><rect x="40" y="300" width="560" height="135" rx="14" fill="#FFF9ED" stroke="#1E2A78" stroke-width="3" /><circle cx="90" cy="367.5" r="26" fill="#F2B84B" stroke="#1E2A78" stroke-width="3" /><text x="90" y="377.5" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle" >3</text><text x="135" y="359.5" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start" >Los dos en el borde: cuerda;</text><text x="135" y="393.5" font-family="sans-serif" font-size="28" font-weight="400" fill="#1E2A78" text-anchor="start" >si pasa por el centro: diámetro</text></svg>
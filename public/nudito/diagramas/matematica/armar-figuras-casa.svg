<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Un triángulo amarillo sobre un cuadrado turquesa forma una casa sencilla; el triángulo es el techo y el cuadrado la pared"><title>Un triángulo amarillo sobre un cuadrado turquesa forma una casa sencilla; el triángulo es el techo y el cuadrado la pared</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Casa con piezas</text><rect x="235" y="210" width="170" height="150" rx="0" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4"/><polygon points="235,210 405,210 320,95" fill="#F2B84B" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round"/><text x="320" y="410" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">triángulo = techo</text><text x="320" y="450" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">cuadrado = pared</text></svg>

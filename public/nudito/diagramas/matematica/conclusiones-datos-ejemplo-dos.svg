<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tabla de visitas a la biblioteca con la frase de Luz aceptada y la frase de Beto rechazada"><title>Tabla de visitas a la biblioteca con la frase de Luz aceptada y la frase de Beto rechazada</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="44" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Visitas a la biblioteca</text><rect x="40" y="62" width="176" height="92" rx="10" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="128" y="98" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">Lunes</text><text x="128" y="140" font-family="sans-serif" font-size="36" font-weight="700" fill="#0C706E" text-anchor="middle">12</text><rect x="228" y="62" width="176" height="92" rx="10" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="316" y="98" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">Martes</text><text x="316" y="140" font-family="sans-serif" font-size="36" font-weight="700" fill="#0C706E" text-anchor="middle">9</text><rect x="416" y="62" width="176" height="92" rx="10" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="504" y="98" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">Miércoles</text><text x="504" y="140" font-family="sans-serif" font-size="36" font-weight="700" fill="#0C706E" text-anchor="middle">15</text><rect x="40" y="178" width="560" height="120" rx="12" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="3"/><circle cx="90" cy="238" r="22" fill="#0F7C7A" stroke="#0F7C7A" stroke-width="2"/><polyline points="80,238 88,247 101,229" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="135" y="226" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Luz: «El miércoles tuvo más</text><text x="135" y="264" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">visitas: seis más que el martes»</text><rect x="40" y="318" width="560" height="120" rx="12" fill="#FFFFFF" stroke="#B5412A" stroke-width="3"/><circle cx="90" cy="378" r="22" fill="#B5412A" stroke="#B5412A" stroke-width="2"/><line x1="80.1" y1="368.1" x2="99.9" y2="387.9" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/><line x1="80.1" y1="387.9" x2="99.9" y2="368.1" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/><text x="135" y="366" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Beto: «La biblioteca es lo</text><text x="135" y="404" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">mejor del colegio»</text></svg>
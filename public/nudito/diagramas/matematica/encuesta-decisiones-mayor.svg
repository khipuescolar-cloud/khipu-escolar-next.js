<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Barras de votos con la de teatro resaltada y la suma de todos los votos</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="52" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Votos para el taller del viernes</text><text x="176" y="139.0" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#1E2A78" text-anchor="end">Dibujo</text><rect x="190" y="110" width="180" height="40" rx="4" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" /><text x="384" y="140.0" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">9</text><text x="176" y="201.0" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#1E2A78" text-anchor="end">Teatro</text><rect x="190" y="172" width="260" height="40" rx="4" fill="#F2B84B" stroke="#1E2A78" stroke-width="3" /><text x="464" y="202.0" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">13</text><text x="176" y="263.0" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#1E2A78" text-anchor="end">Música</text><rect x="190" y="234" width="120" height="40" rx="4" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" /><text x="324" y="264.0" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">6</text><text x="176" y="325.0" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#1E2A78" text-anchor="end">Danza</text><rect x="190" y="296" width="140" height="40" rx="4" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" /><text x="344" y="326.0" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">7</text><text x="320" y="400" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="middle">Teatro tiene más votos</text><text x=
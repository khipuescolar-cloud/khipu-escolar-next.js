<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="titulo">
  <title id="titulo">Dos de cuatro tramos marcados equivalen a dos cuartos</title>
  <rect width="640" height="480" fill="#FCF0D6"/>
  <text x="320" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1E2A78">Dos tramos de cuatro</text>
  <g stroke="#1E2A78" stroke-width="4">
    <rect x="92" y="132" width="114" height="106" rx="4" fill="#F2B84B"/>
    <rect x="206" y="132" width="114" height="106" fill="#F2B84B"/>
    <rect x="320" y="132" width="114" height="106" fill="#FFFFFF"/>
    <rect x="434" y="132" width="114" height="106" rx="4" fill="#FFFFFF"/>
  </g>
  <text x="206" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#8A5A00">Marcados: 2</text>
  <text x="434" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1E2A78">Total: 4</text>
  <line x1="286" y1="364" x2="354" y2="364" stroke="#1E2A78" stroke-width="4"/>
  <text x="320" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#8A5A00">2</text>
  <text x="320" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#1E2A78">4</text>
  <text x="430" y="386" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#0C706E">de la regleta</text>
</svg>

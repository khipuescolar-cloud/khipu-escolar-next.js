<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres tarjetas: una con el error diez unidades de millar igual a cien mil, y dos correctas, diez unidades de millar son diez mil y diez decenas de millar son cien mil"><title>Tres tarjetas: una con el error diez unidades de millar igual a cien mil, y dos correctas, diez unidades de millar son diez mil y diez decenas de millar son cien mil</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="48" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">Cuidado con los ceros</text><rect x="40" y="76" width="560" height="96" rx="12" fill="#FFFFFF" stroke="#B5412A" stroke-width="3" stroke-dasharray="10 7"/><text x="70" y="134" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="start">10 UM = 100 000</text><text x="572" y="134" font-family="sans-serif" font-size="30" font-weight="700" fill="#B5412A" text-anchor="end">Error</text><rect x="40" y="190" width="560" height="96" rx="12" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="3"/><text x="70" y="248" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="start">10 UM = 10 000 = 1 DM</text><rect x="40" y="304" width="560" height="96" rx="12" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="3"/><text x="70" y="362" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="start">10 DM = 100 000 = 1 CM</text><text x="320" y="450" font-family="sans-serif" font-size="26" font-weight="700" fill="#0C706E" text-anchor="middle">UM: mil · DM: diez mil · CM: cien mil</text></svg>
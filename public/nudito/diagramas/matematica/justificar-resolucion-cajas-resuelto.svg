<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Seis cajas de veinticuatro cuadernos, cálculo de ciento cuarenta y cuatro y comprobación mediante división.">
  <title>Explicar y comprobar una multiplicación</title>
  <rect width="640" height="480" rx="32" fill="#FCF0D6"/>
  <text x="320" y="55" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#1E2A78">Seis cajas · veinticuatro cuadernos</text>
  <g fill="#FFFFFF" stroke="#1E2A78" stroke-width="4">
    <rect x="55" y="105" width="145" height="85" rx="15"/><rect x="248" y="105" width="145" height="85" rx="15"/><rect x="440" y="105" width="145" height="85" rx="15"/>
    <rect x="55" y="215" width="145" height="85" rx="15"/><rect x="248" y="215" width="145" height="85" rx="15"/><rect x="440" y="215" width="145" height="85" rx="15"/>
  </g>
  <g font-family="sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#0C706E">
    <text x="128" y="158">24</text><text x="320" y="158">24</text><text x="512" y="158">24</text>
    <text x="128" y="268">24</text><text x="320" y="268">24</text><text x="512" y="268">24</text>
  </g>
  <text x="320" y="360" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="700" fill="#1E2A78">6 × 24 = 144 cuadernos</text>
  <text x="320" y="414" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#0C706E">Compruebo: 144 ÷ 6 = 24</text>
</svg>

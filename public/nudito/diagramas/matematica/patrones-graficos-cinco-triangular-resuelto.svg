      <circle cx="542" cy="108" r="14"/><circle cx="524" cy="143" r="14"/><circle cx="560" cy="143" r="14"/><circle cx="506" cy="178" r="14"/><circle cx="542" cy="178" r="14"/><circle cx="578" cy="178" r="14"/><circle cx="488" cy="213" r="14"/><circle cx="524" cy="213" r="14"/><circle cx="560" cy="213" r="14"/><circle cx="596" cy="213" r="14"/>

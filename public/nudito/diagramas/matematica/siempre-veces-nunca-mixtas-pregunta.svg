  <path d="M485 168 A66 66 0 1 0 485 286 A52 52 0 1 1 485 168" fill="#0F7C7A"/>
  <text x="455" y="322" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78">LUNA</text>
  <text x="320" y="420" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#0C706E">¿Saldrá SOL?</text>
</svg>

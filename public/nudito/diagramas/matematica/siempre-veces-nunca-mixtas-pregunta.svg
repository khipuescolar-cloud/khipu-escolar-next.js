<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Tarjetas de sol y luna sin clasificar el resultado</title>
  <rect width="640" height="480" rx="28" fill="#FCF0D6"/>
  <text x="320" y="62" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78">Una tarjeta sin mirar</text>
  <rect x="80" y="130" width="210" height="220" rx="24" fill="#FFFFFF" stroke="#1E2A78" stroke-width="6"/>
  <g stroke="#8A5A00" stroke-width="6" stroke-linecap="round"><line x1="249" y1="220" x2="269" y2="220"/><line x1="121" y1="220" x2="101" y2="220"/><line x1="185" y1="284" x2="185" y2="304"/><line x1="185" y1="156" x2="185" y2="136"/><line x1="230" y1="265" x2="244" y2="279"/><line x1="140" y1="265" x2="126" y2="279"/><line x1="230" y1="175" x2="244" y2="161"/><line x1="140" y1="175" x2="126" y2="161"/></g>
  <circle cx="185" cy="220" r="52" fill="#F2B84B" stroke="#8A5A00" stroke-width="5"/>

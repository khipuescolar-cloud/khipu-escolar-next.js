osta</text><circle cx="200" cy="240" r="19" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="200" y="210" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">Mercado</text><text x="320" y="402" font-family="sans-serif" font-size="26" font-weight="700" fill="#8A5A00" text-anchor="middle">Aquí: calles de lado a lado</text><text x="320" y="438" font-family="sans-serif" font-size="26" font-weight="700" fill="#8A5A00" text-anchor="middle">y avenidas de arriba abajo</text></svg>
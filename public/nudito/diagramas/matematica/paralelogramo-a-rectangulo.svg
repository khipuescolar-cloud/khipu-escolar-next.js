<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Un paralelogramo de base catorce y altura seis: se mueve el triángulo de la izquierda a la derecha y queda un rectángulo de catorce por seis, ochenta y cuatro metros cuadrados"><title>Un paralelogramo de base catorce y altura seis: se mueve el triángulo de la izquierda a la derecha y queda un rectángulo de catorce por seis, ochenta y cuatro metros cuadrados</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">De paralelogramo a rectángulo</text><polygon points="60,226 284,226 412,130 188,130" fill="#BFE3E1" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round"/><polygon points="60,226 188,226 188,130" fill="#F2B84B" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round"/><polygon points="284,226 412,226 412,130" fill="none" stroke="#F2B84B" stroke-width="4" stroke-linejoin="round" stroke-dasharray="8 6"/><line x1="188" y1="130" x2="188" y2="226" stroke="#1E2A78" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round"/><line x1="130" y1="108" x2="350" y2="108" stroke="#5B6170" stroke-width="4" stroke-linecap="round"/><line x1="350" y1="108" x2="338" y2="115" stroke="#5B6170" stroke-width="4" stroke-linecap="round"/><line x1="350" y1="108" x2="338" y2="101" stroke="#5B6170" stroke-width="4" stroke-linecap="round"/><text x="240" y="90" font-family="sans-serif" font-size="26" font-weight="700" fill="#5B6170" text-anchor="middle">mover</text><polygon points="188,274 412,274 412,370 188,370" fill="#BFE3E1" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round"/><polygon points="284,370 412,370 412,274" fill="#F2B84B" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round"/><text x="300" y="408" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">14 m</text><text x="175" y="329" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="end">6 m</text><text x="440" y="319" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">14 × 6</text><text x="440" y="362" font-family="sans-serif" font-size="34" font-weight="700" fill="#0F7C7A" text-anchor="start">= 84 m²</text><text x="320" y="454" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">El lado de 10 m no se usa</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
<title>Regleta de doce centímetros con marcas cada tres centímetros</title>
<rect width="640" height="480" fill="#FCF0D6"/>
<text x="320" y="100" font-family="Nunito, Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Regleta de doce centímetros</text>
<rect x="60" y="160" width="130" height="70" fill="#F2B84B" stroke="#1E2A78" stroke-width="3" />
<rect x="190" y="160" width="130" height="70" fill="#F2B84B" stroke="#1E2A78" stroke-width="3" />
<rect x="320" y="160" width="130" height="70" fill="#FFF8E8" stroke="#1E2A78" stroke-width="3" />
<rect x="450" y="160" width="130" height="70" fill="#FFF8E8" stroke="#1E2A78" stroke-width="3" />
<line x1="60" y1="230" x2="60" y2="244" stroke="#1E2A78" stroke-width="3" stroke-linecap="round" />
<text x="60" y="276" font-family="Nunito, Arial, sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">0</text>
<line x1="190" y1="230" x2="190" y2="244" stroke="#1E2A78" stroke-width="3" stroke-linecap="round" />
<text x="190" y="276" font-family="Nunito, Arial, sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">3</text>
<line x1="320" y1="230" x2="320" y2="244" stroke="#1E2A78" stroke-width="3" stroke-linecap="round" />
<text x="320" y="276" font-family="Nunito, Arial, sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">6</text>
<line x1="450" y1="230" x2="450" y2="244" stroke="#1E2A78" stroke-width="3" stroke-linecap="round" />
<text x="450" y="276" font-family="Nunito, Arial, sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">9</text>
<line x1="580" y1="230" x2="580" y2="244" stroke="#1E2A78" stroke-width="3" stroke-linecap="round" />
<text x="580" y="276" font-family="Nunito, Arial, sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">12</text>
<text x="320" y="340" font-family="Nunito, Arial, sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">medidas en centímetros</text>
<text x="320" y="430" font-family="Nunito, Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">¿Qué fracción está marcada?</text>

</svg>

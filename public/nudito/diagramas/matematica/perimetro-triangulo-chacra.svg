<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Chacra con forma de triángulo con lados de treinta, cuarenta y cincuenta metros"><title>Chacra con forma de triángulo con lados de treinta, cuarenta y cincuenta metros</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="56" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">La chacra de don Julián</text><polygon points="110,100 110,360 470,360" fill="#E2F3F1" stroke="#1E2A78" stroke-width="6" stroke-linejoin="round"/><rect x="110" y="330" width="30" height="30" rx="0" fill="none" stroke="#1E2A78" stroke-width="3"/><text x="92" y="240" font-family="sans-serif" font-size="30" font-weight="700" fill="#0F7C7A" text-anchor="end">30 m</text><text x="290" y="408" font-family="sans-serif" font-size="30" font-weight="700" fill="#0F7C7A" text-anchor="middle">40 m</text><text x="350" y="215" font-family="sans-serif" font-size="30" font-weight="700" fill="#0F7C7A" text-anchor="start">50 m</text><text x="320" y="462" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">40 + 50 + 30 = 120 m</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dos bloques en fila: uno de dos horas y otro de diez minutos, con la pregunta de cuántos minutos dura en total"><title>Dos bloques en fila: uno de dos horas y otro de diez minutos, con la pregunta de cuántos minutos dura en total</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="64" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">Una película</text><rect x="50" y="150" width="360" height="100" rx="8" fill="#1E2A78" stroke="#1E2A78" stroke-width="3"/><text x="230" y="209" font-family="sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">2 horas</text><rect x="420" y="150" width="170" height="100" rx="8" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="505" y="209" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">10 min</text><text x="320" y="340" font-family="sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="middle">¿Cuántos minutos dura en total?</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres figuras de cuadrados de palitos en fila, con cuatro, siete y diez palitos; término general tres n más uno"><title>Tres figuras de cuadrados de palitos en fila, con cuatro, siete y diez palitos; término general tres n más uno</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="56" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Cuadrados de palitos</text><rect x="60" y="110" width="56" height="56" fill="#FBE3AE" stroke="#1E2A78" stroke-width="7" stroke-linejoin="round"/><text x="88.0" y="214" font-family="sans-serif" font-size="28" font-weight="700" fill="#5B6170" text-anchor="middle">n = 1</text><text x="88.0" y="258" font-family="sans-serif" font-size="30" font-weight="700" fill="#0F7C7A" text-anchor="middle">4 palitos</text><rect x="200" y="110" width="56" height="56" fill="#FBE3AE" stroke="#1E2A78" stroke-width="7" stroke-linejoin="round"/><rect x="256" y="110" width="56" height="56" fill="#FBE3AE" stroke="#1E2A78" stroke-width="7" stroke-linejoin="round"/><text x="256.0" y="214" font-family="sans-serif" font-size="28" font-weight="700" fill="#5B6170" text-anchor="middle">n = 2</text><text x="256.0" y="258" font-family="sans-serif" font-size="30" font-weight="700" fill="#0F7C7A" text-anchor="middle">7 palitos</text><rect x="360" y="110" width="56" height="56" fill="#FBE3AE" stroke="#1E2A78" stroke-width="7" stroke-linejoin="round"/><rect x="416" y="110" width="56" height="56" fill="#FBE3AE" stroke="#1E2A78" stroke-width="7" stroke-linejoin="round"/><rect x="472" y="110" width="56" height="56" fill="#FBE3AE" stroke="#1E2A78" stroke-width="7" stroke-linejoin="round"/><text x="444.0" y="214" font-family="sans-serif" font-size="28" font-weight="700" fill="#5B6170" text-anchor="middle">n = 3</text><text x="444.0" y="258" font-family="sans-serif" font-size="30" font-weight="700" fill="#0F7C7A" text-anchor="middle">10 palitos</text><text x="320" y="322" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Cada cuadrado nuevo agrega 3 palitos</text><text x="170" y="372" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">3 × 1 + 1 = 4</text><text x="470" y="372" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">3 × 3 + 1 = 10</text><text x="320" y="440" font-family="sans-serif" font-size="40" font-weight="700" fill="#0F7C7A" text-anchor="middle">T(n) = 3n + 1</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img"><title>Mango y llama en tarjetas separadas con un signo de distinto</title>
  <rect width="640" height="480" fill="#FCF0D6"/>
  <text x="320" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1E2A78">¿Pertenecen al mismo grupo?</text>
  <g fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"><rect x="40" y="150" width="210" height="140" rx="20"/><rect x="390" y="150" width="210" height="140" rx="20"/></g>
  <g font-family="Arial, sans-serif" font-size="34" text-anchor="middle" fill="#1E2A78"><text x="145" y="232">Mango</text><text x="495" y="232">Llama</text></g>
  <text x="320" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="80" font-weight="700" fill="#B5412A">≠</text>
  <text x="320" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#1E2A78">Un mango y una llama no son iguales.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title">
<title>Cuartos y sextos convertidos a doceavos</title>
<rect width="640" height="480" fill="#FCF0D6"/>

<text x="320" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78">Tres cuartos y cinco sextos</text>
<text x="65" y="125" font-family="sans-serif" font-size="28" fill="#1E2A78">Múltiplos de 4:</text><text x="300" y="125" font-family="sans-serif" font-size="28" fill="#0C706E">4, 8, 12</text>
<text x="65" y="180" font-family="sans-serif" font-size="28" fill="#1E2A78">Múltiplos de 6:</text><text x="300" y="180" font-family="sans-serif" font-size="28" fill="#0C706E">6, 12</text>
<rect x="65" y="225" width="510" height="145" rx="22" fill="#fff"/>
<text x="180" y="285" text-anchor="middle" font-family="sans-serif" font-size="38" fill="#1E2A78">3/4 = 9/12</text><text x="460" y="285" text-anchor="middle" font-family="sans-serif" font-size="38" fill="#1E2A78">5/6 = 10/12</text>
<text x="320" y="345" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#8A5A00">El denominador común es 12</text>
<text x="320" y="430" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#0C706E">Multiplica arriba y abajo</text>
</svg>

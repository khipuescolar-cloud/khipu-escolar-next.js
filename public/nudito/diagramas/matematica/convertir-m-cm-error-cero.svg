<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dos tramos de cien centímetros y uno de cinco centímetros, con el error veinticinco centímetros en rojo y la suma doscientos más cinco igual a doscientos cinco centímetros"><title>Dos tramos de cien centímetros y uno de cinco centímetros, con el error veinticinco centímetros en rojo y la suma doscientos más cinco igual a doscientos cinco centímetros</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="64" font-family="sans-serif" font-size="32" font-weight="700" fill="#B5412A" text-anchor="middle">2 m 5 cm</text><rect x="30" y="130" width="150" height="90" rx="8" fill="#DCEFEA" stroke="#1E2A78" stroke-width="3"/><text x="105" y="184" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">100 cm</text><rect x="190" y="130" width="150" height="90" rx="8" fill="#DCEFEA" stroke="#1E2A78" stroke-width="3"/><text x="265" y="184" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">100 cm</text><rect x="350" y="130" width="100" height="90" rx="8" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="400" y="184" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">5 cm</text><text x="320" y="300" font-family="sans-serif" font-size="34" font-weight="700" fill="#B5412A" text-anchor="middle">No es 25 cm</text><text x="320" y="372" font-family="sans-serif" font-size="36" font-weight="700" fill="#0C706E" text-anchor="middle">200 + 5 = 205 cm</text><text x="320" y="430" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Primero se convierten los metros</text></svg>
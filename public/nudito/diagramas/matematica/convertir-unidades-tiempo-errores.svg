<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Error en rojo, una hora y quince minutos igual a ciento quince minutos; abajo un bloque de una hora con sesenta minutos y otro de quince minutos que suman setenta y cinco minutos"><title>Error en rojo, una hora y quince minutos igual a ciento quince minutos; abajo un bloque de una hora con sesenta minutos y otro de quince minutos que suman setenta y cinco minutos</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="64" font-family="sans-serif" font-size="32" font-weight="700" fill="#B5412A" text-anchor="middle">No se pegan los números</text><text x="320" y="130" font-family="sans-serif" font-size="34" font-weight="700" fill="#B5412A" text-anchor="middle">1 h 15 min = 115 min</text><rect x="40" y="180" width="300" height="100" rx="8" fill="#1E2A78" stroke="#1E2A78" stroke-width="3"/><text x="190" y="222" font-family="sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">1 hora</text><text x="190" y="256" font-family="sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">60 min</text><rect x="350" y="180" width="250" height="100" rx="8" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="475" y="239" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">15 min</text><text x="320" y="350" font-family="sans-serif" font-size="36" font-weight="700" fill="#0C706E" text-anchor="middle">60 + 15 = 75 min</text><text x="320" y="410" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Una hora tiene 60 min</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Siete por veinticinco por cuatro: agrupar veinticinco por cuatro da cien y siete por cien es setecientos, igual que el otro camino"><title>Siete por veinticinco por cuatro: agrupar veinticinco por cuatro da cien y siete por cien es setecientos, igual que el otro camino</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Elegir el grupo fácil</text><text x="320" y="125" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">(7 × 25) × 4 = 175 × 4 = 700</text><text x="320" y="160" font-family="sans-serif" font-size="26" font-weight="400" fill="#6B5A2E" text-anchor="middle">cuenta pesada</text><rect x="60" y="205" width="520" height="100" rx="12" fill="#CFEAE8" stroke="#0F7C7A" stroke-width="3"/><text x="320" y="252" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">7 × (25 × 4) = 7 × 100 = 700</text><text x="320" y="290" font-family="sans-serif" font-size="26" font-weight="700" fill="#0F7C7A" text-anchor="middle">25 × 4 = 100: cuenta fácil</text><text x="320" y="375" font-family="sans-serif" font-size="38" font-weight="700" fill="#1E2A78" text-anchor="middle">El producto es 700</text><text x="320" y="425" font-family="sans-serif" font-size="28" font-weight="700" fill="#0F7C7A" text-anchor="middle">Elegimos el camino fácil</text></svg>

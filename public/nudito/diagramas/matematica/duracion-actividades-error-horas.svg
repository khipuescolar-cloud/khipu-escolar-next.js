<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Error al restar solo los números de las horas</title>
  <rect width="640" height="480" rx="28" fill="#FCF0D6"/>
  <text x="320" y="60" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78">No ignores los minutos</text>
  <rect x="75" y="120" width="490" height="220" rx="28" fill="#FFFFFF" stroke="#1E2A78" stroke-width="6"/>
  <text x="320" y="200" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78">3:30 a 5:00</text>
  <text x="320" y="280" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#B5412A">5 − 3 = 2 horas</text>
  <line x1="170" y1="298" x2="470" y2="298" stroke="#B5412A" stroke-width="5" stroke-linecap="round"/>
  <text x="320" y="410" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#0C706E">Primero cuenta hasta la hora completa</text>
</svg>

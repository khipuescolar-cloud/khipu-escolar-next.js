<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="titulo">
  <title id="titulo">Resolución de tres octavos de una cinta</title>
  <rect width="640" height="480" fill="#FCF0D6"/>
  <text x="320" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1E2A78">Contamos toda la unidad</text>
  <g stroke="#1E2A78" stroke-width="4">
    <rect x="72" y="132" width="62" height="92" rx="4" fill="#0F7C7A"/>
    <rect x="134" y="132" width="62" height="92" fill="#0F7C7A"/>
    <rect x="196" y="132" width="62" height="92" fill="#0F7C7A"/>
    <rect x="258" y="132" width="62" height="92" fill="#FFFFFF"/>
    <rect x="320" y="132" width="62" height="92" fill="#FFFFFF"/>
    <rect x="382" y="132" width="62" height="92" fill="#FFFFFF"/>
    <rect x="444" y="132" width="62" height="92" fill="#FFFFFF"/>
    <rect x="506" y="132" width="62" height="92" rx="4" fill="#FFFFFF"/>
  </g>
  <text x="190" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0C706E">Pintados: 3</text>
  <text x="450" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1E2A78">Total: 8</text>
  <line x1="286" y1="360" x2="354" y2="360" stroke="#1E2A78" stroke-width="4"/>
  <text x="320" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#0C706E">3</text>
  <text x="320" y="411" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#1E2A78">8</text>
  <text x="420" y="381" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#8A5A00">de la cinta</text>
</svg>

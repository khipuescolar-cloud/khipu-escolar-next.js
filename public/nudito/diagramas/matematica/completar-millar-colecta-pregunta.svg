<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Barra de colecta entre cuatro mil y cinco mil soles con un tramo por completar</title><rect width="640" height="480" rx="28" fill="#FCF0D6"/><text x="320" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1E2A78">Llevamos 4&#160;300 soles</text><rect x="100" y="220" width="460" height="56" fill="#fff" stroke="#1E2A78" stroke-width="4"/><rect x="100" y="220" width="138.0" height="56" fill="#F2B84B" stroke="#1E2A78" stroke-width="4"/><text x="100" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1E2A78">4&#160;000</text><text x="560" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1E2A78">5&#160;000</text><text x="238.0" y="330" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#1E2A78">4&#160;300</text><line x1="238.0" y1="276" x2="238.0" y2="298" stroke="#1E2A78" stroke-width="3" stroke-linecap="round" /><text x="399.0" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#8A5A00">?</text><text x="320" y="420" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#8A5A00">¿Cuánto falta para 5&#160;000?</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img"><title>Signo de desigualdad orientado de forma incorrecta y corregida</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#1E2A78">No sigas la punta como flecha</text><rect x="55" y="105" width="240" height="215" rx="20" fill="#FFFFFF" stroke="#B5412A" stroke-width="4"/><rect x="345" y="105" width="240" height="215" rx="20" fill="#FFFFFF" stroke="#0C706E" stroke-width="4"/><g font-family="Arial" font-size="48" font-weight="700" text-anchor="middle"><text x="175" y="185" fill="#B5412A">8 &lt; 3</text><text x="465" y="185" fill="#0C706E">8 &gt; 3</text></g><path d="M110 215 L240 285 M240 215 L110 285" stroke="#B5412A" stroke-width="11" stroke-linecap="round"/><path d="M415 255 L450 285 L520 215" fill="none" stroke="#0C706E" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><g font-family="Arial" font-size="30" font-weight="700" text-anchor="middle"><text x="175" y="370" fill="#B5412A">Así no</text><text x="465" y="370" fill="#0C706E">Así sí</text></g><text x="320" y="435" text-anchor="middle" font-family="Arial" font-size="28" fill="#1E2A78">La abertura queda junto al número mayor.</text></svg>

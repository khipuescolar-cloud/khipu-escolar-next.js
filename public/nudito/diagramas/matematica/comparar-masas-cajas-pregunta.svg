<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dos cajas del mismo tamaño: duraznos con ocho kilogramos y tunas con cinco kilogramos"><title>Dos cajas del mismo tamaño: duraznos con ocho kilogramos y tunas con cinco kilogramos</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="64" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Dos cajas del mismo tamaño</text><rect x="70" y="145" width="200" height="170" rx="12" fill="#F8DDA0" stroke="#1E2A78" stroke-width="4"/><path d="M100 145 V119 H240 V145" fill="none" stroke="#1E2A78" stroke-width="4"/><text x="170" y="244" font-family="sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">8 kg</text><text x="170" y="370" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Duraznos</text><rect x="370" y="145" width="200" height="170" rx="12" fill="#F8DDA0" stroke="#1E2A78" stroke-width="4"/><path d="M400 145 V119 H540 V145" fill="none" stroke="#1E2A78" stroke-width="4"/><text x="470" y="244" font-family="sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">5 kg</text><text x="470" y="370" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Tunas</text><text x="320" y="438" font-family="sans-serif" font-size="32" font-weight="700" fill="#0C706E" text-anchor="middle">¿Cuál pesa más?</text></svg>
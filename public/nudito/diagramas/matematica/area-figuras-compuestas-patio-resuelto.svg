<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="El patio amarillo con cuarenta metros cuadrados y la esquina rayada de tres metros cuadrados señalada con una línea; abajo dice cuarenta menos tres igual treinta y siete metros cuadrados"><title>El patio amarillo con cuarenta metros cuadrados y la esquina rayada de tres metros cuadrados señalada con una línea; abajo dice cuarenta menos tres igual treinta y siete metros cuadrados</title><defs><pattern id="ray" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#FCF0D6"/><line x1="0" y1="0" x2="0" y2="14" stroke="#F2B84B" stroke-width="6"/></pattern></defs><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Un patio</text><rect x="150" y="110" width="352" height="220" rx="0" fill="#FBE3AE" stroke="#1E2A78" stroke-width="4" /><polygon points="414,110 502,110 502,242" fill="url(#ray)" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round" stroke-dasharray="9 6"/><text x="300" y="234.0" font-family="sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">40 m²</text><line x1="480" y1="150" x2="532" y2="188" stroke="#1E2A78" stroke-width="2" stroke-linecap="round" /><text x="536" y="200" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">3 m²</text><text x="320" y="400" font-family="sans-serif" font-size="34" font-weight="700" fill="#0C706E" text-anchor="middle">40 − 3 = 37 m²</text></svg>
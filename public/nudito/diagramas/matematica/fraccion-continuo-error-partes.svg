  </g>
  <line x1="74" y1="146" x2="542" y2="218" stroke="#B5412A" stroke-width="7"/>
  <rect x="54" y="258" width="532" height="166" rx="18" fill="#FFFFFF" stroke="#0C706E" stroke-width="4"/>
  <text x="84" y="298" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#0C706E">Sí sirve</text>
  <g stroke="#1E2A78" stroke-width="3">
    <rect x="84" y="326" width="111" height="56" fill="#F2B84B"/>
    <rect x="195" y="326" width="111" height="56" fill="#FFFFFF"/>
    <rect x="306" y="326" width="111" height="56" fill="#FFFFFF"/>
    <rect x="417" y="326" width="111" height="56" fill="#FFFFFF"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="titulo">
  <title id="titulo">Comparación entre divisiones desiguales y partes iguales</title>
  <rect width="640" height="480" fill="#FCF0D6"/>
  <text x="320" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1E2A78">Primero revisa los tamaños</text>
  <rect x="54" y="92" width="532" height="142" rx="18" fill="#FFFFFF" stroke="#B5412A" stroke-width="4"/>
  <text x="84" y="130" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#B5412A">No sirve</text>
  <g stroke="#1E2A78" stroke-width="3">
    <rect x="84" y="158" width="70" height="48" fill="#F2B84B"/>
    <rect x="154" y="158" width="156" height="48" fill="#FFFFFF"/>
    <rect x="310" y="158" width="92" height="48" fill="#FFFFFF"/>

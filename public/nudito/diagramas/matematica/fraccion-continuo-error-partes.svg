  <circle cx="552" cy="298" r="20" fill="#0C706E"/>
  <path d="M542 298l7 8 14-18" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

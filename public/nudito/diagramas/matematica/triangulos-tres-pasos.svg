<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres pasos: treinta por veinticuatro igual a setecientos veinte, dividir entre dos da trescientos sesenta, unidad centímetros cuadrados"><title>Tres pasos: treinta por veinticuatro igual a setecientos veinte, dividir entre dos da trescientos sesenta, unidad centímetros cuadrados</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="56" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Tres pasos para el área</text><rect x="30" y="95" width="580" height="100" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><circle cx="82" cy="145" r="28" fill="#1E2A78"/><text x="82" y="155" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="130" y="135" font-family="sans-serif" font-size="26" font-weight="700" fill="#5B6170" text-anchor="start">Base × altura</text><text x="130" y="175" font-family="sans-serif" font-size="34" font-weight="700" fill="#0F7C7A" text-anchor="start">30 × 24 = 720</text><rect x="30" y="220" width="580" height="100" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><circle cx="82" cy="270" r="28" fill="#1E2A78"/><text x="82" y="280" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="130" y="260" font-family="sans-serif" font-size="26" font-weight="700" fill="#5B6170" text-anchor="start">Dividir entre dos</text><text x="130" y="300" font-family="sans-serif" font-size="34" font-weight="700" fill="#0F7C7A" text-anchor="start">720 ÷ 2 = 360</text><rect x="30" y="345" width="580" height="100" rx="16" fill="#BFE3E1" stroke="#1E2A78" stroke-width="4"/><circle cx="82" cy="395" r="28" fill="#1E2A78"/><text x="82" y="405" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="130" y="385" font-family="sans-serif" font-size="26" font-weight="700" fill="#5B6170" text-anchor="start">Unidad cuadrada</text><text x="130" y="425" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="start">360 cm²</text></svg>
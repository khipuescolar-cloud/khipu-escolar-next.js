<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Una caja grande con dos kilogramos y una caja pequeña con siete kilogramos"><title>Una caja grande con dos kilogramos y una caja pequeña con siete kilogramos</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="56" font-family="sans-serif" font-size="32" font-weight="700" fill="#B5412A" text-anchor="middle">El tamaño engaña</text><rect x="60" y="125" width="260" height="200" rx="12" fill="#F8DDA0" stroke="#1E2A78" stroke-width="4"/><path d="M90 125 V99 H290 V125" fill="none" stroke="#1E2A78" stroke-width="4"/><text x="190" y="239" font-family="sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">2 kg</text><text x="190" y="382" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Caja grande</text><rect x="435" y="205" width="130" height="110" rx="12" fill="#F8DDA0" stroke="#1E2A78" stroke-width="4"/><path d="M465 205 V179 H535 V205" fill="none" stroke="#1E2A78" stroke-width="4"/><text x="500" y="274" font-family="sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">7 kg</text><text x="500" y="382" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Caja pequeña</text><text x="320" y="440" font-family="sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="middle">Se comparan los kilogramos</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Cuatro casillas con cinco, diez, quince y veinte monedas; entre cada una hay un arco que dice más cinco"><title>Cuatro casillas con cinco, diez, quince y veinte monedas; entre cada una hay un arco que dice más cinco</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="56" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Patrón aditivo</text><text x="95" y="135" font-family="sans-serif" font-size="26" font-weight="700" fill="#0F7C7A" text-anchor="middle">Día 1</text><rect x="45" y="150" width="100" height="80" rx="10" fill="#E2F3F1" stroke="#0F7C7A" stroke-width="4"/><text x="95" y="205" font-family="sans-serif" font-size="40" font-weight="700" fill="#1E2A78" text-anchor="middle">5</text><path d="M95 250 Q170.0 320 245 250" fill="none" stroke="#1E2A78" stroke-width="4"/><text x="170" y="318" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="middle">+5</text><text x="245" y="135" font-family="sans-serif" font-size="26" font-weight="700" fill="#0F7C7A" text-anchor="middle">Día 2</text><rect x="195" y="150" width="100" height="80" rx="10" fill="#E2F3F1" stroke="#0F7C7A" stroke-width="4"/><text x="245" y="205" font-family="sans-serif" font-size="40" font-weight="700" fill="#1E2A78" text-anchor="middle">10</text><path d="M245 250 Q320.0 320 395 250" fill="none" stroke="#1E2A78" stroke-width="4"/><text x="320" y="318" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="middle">+5</text><text x="395" y="135" font-family="sans-serif" font-size="26" font-weight="700" fill="#0F7C7A" text-anchor="middle">Día 3</text><rect x="345" y="150" width="100" height="80" rx="10" fill="#E2F3F1" stroke="#0F7C7A" stroke-width="4"/><text x="395" y="205" font-family="sans-serif" font-size="40" font-weight="700" fill="#1E2A78" text-anchor="middle">15</text><path d="M395 2
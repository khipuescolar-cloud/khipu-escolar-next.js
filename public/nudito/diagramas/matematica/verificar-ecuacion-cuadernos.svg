<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img"><title>Reemplazando c por cuatro, los dos lados valen veinticuatro</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="60" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Reemplazamos c por 4</text><rect x="40" y="100" width="250" height="220" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4" /><rect x="350" y="100" width="250" height="220" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4" /><text x="165" y="146" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="middle">Lado izquierdo</text><text x="475" y="146" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="middle">Lado derecho</text><text x="165" y="216" font-family="Arial, Liberation Sans, sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">5 × 4 + 4</text><text x="165" y="272" font-family="Arial, Liberation Sans, sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">= 24</text><text x="475" y="244" font-family="Arial, Liberation Sans, sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">24</text><text x="320" y="224" font-family="Arial, Liberation Sans, sans-serif" font-size="46" font-weight="700" fill="#1E2A78" text-anchor="middle">=</text><circle cx="70" cy="400" r="24" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="4"/><path d="M59,400 L67,409 L82,391" fill="none" stroke="#0F7C7A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><text x="110" y="410" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="start">Los dos lados valen 24</text></svg>
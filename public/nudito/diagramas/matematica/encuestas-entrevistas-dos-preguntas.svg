<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dos preguntas: una con tres respuestas posibles, marcada como buena; otra que empuja la respuesta, marcada como mala"><title>Dos preguntas: una con tres respuestas posibles, marcada como buena; otra que empuja la respuesta, marcada como mala</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="48" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Dos preguntas para el salón</text><rect x="40" y="70" width="560" height="112" rx="18" fill="#FFFDF5" stroke="#1E2A78" stroke-width="3"/><text x="320" y="112" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">¿Cómo vienes al colegio:</text><text x="320" y="152" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">caminando, en combi o en moto?</text><circle cx="66.0" cy="222.0" r="20" fill="none" stroke="#0C706E" stroke-width="4"/><path d="M57 222 L64 230 L77 214" fill="none" stroke="#0C706E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="100" y="232" font-family="sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="start">Sirve: da respuestas posibles</text><rect x="40" y="262" width="560" height="112" rx="18" fill="#FFFDF5" stroke="#B5412A" stroke-width="3"/><text x="320" y="304" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">¿No crees que la combi</text><text x="320" y="344" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">es la mejor?</text><circle cx="66.0" cy="414.0" r="20" fill="none" stroke="#B5412A" stroke-width="4"/><line x1="58.0" y1="406.0" x2="74.0" y2="422.0" stroke="#B5412A" stroke-width="5" stroke-linecap="round"/><line x1="74.0" y1="406.0" x2="58.0" y2="422.0" stroke="#B5412A" stroke-width="5" stroke-linecap="round"/><text x="100" y="424" font-family="sans-serif" font-size="28" font-weight="700" fill="#B5412A" text-anchor="start">No sirve: empuja la respuesta</text></svg>

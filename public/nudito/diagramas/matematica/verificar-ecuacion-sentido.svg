<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img"><title>Una propuesta que cumple la igualdad pero no tiene sentido: dos coma cinco entradas</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="60" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Revisa también el sentido</text><rect x="60" y="90" width="520" height="90" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4" /><text x="320" y="156" font-family="Arial, Liberation Sans, sans-serif" font-size="46" font-weight="700" fill="#1E2A78" text-anchor="middle">6e = 15</text><text x="320" y="220" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="middle">e es la cantidad de entradas</text><rect x="120" y="240" width="400" height="64" rx="14" fill="#F2B84B" stroke="#1E2A78" stroke-width="4" /><text x="320" y="286" font-family="Arial, Liberation Sans, sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">Propuesta: e = 2,5</text><circle cx="70" cy="352" r="24" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="4"/><path d="M59,352 L67,361 L82,343" fill="none" stroke="#0F7C7A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><text x="110" y="362" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="start">6 × 2,5 = 15: los lados coinciden</text><circle cx="70" cy="414" r="24" fill="#FFFFFF" stroke="#B5412A" stroke-width="4"/><line x1="61" y1="405" x2="79" y2="423" stroke="#B5412A" stroke-width="6" stroke-linecap="round" /><line x1="79" y1="405" x2="61" y2="423" stroke="#B5412A" stroke-width="6" stroke-linecap="round" /><text x="110" y="424" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#B5412A" text-anchor="start">Pero no hay 2,5 entradas</text></svg>
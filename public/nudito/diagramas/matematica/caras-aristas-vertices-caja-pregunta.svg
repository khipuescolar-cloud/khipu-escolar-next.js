<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Una caja con forma de cubo: la cara de arriba en azul claro, una arista gruesa amarilla y un vértice marcado con un punto, cada uno con su nombre"><title>Una caja con forma de cubo: la cara de arriba en azul claro, una arista gruesa amarilla y un vértice marcado con un punto, cada uno con su nombre</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Las partes de una caja</text><line x1="150" y1="130" x2="150" y2="290" stroke="#C9BFA3" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7"/><line x1="150" y1="290" x2="310" y2="290" stroke="#C9BFA3" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7"/><line x1="80" y1="350" x2="150" y2="290" stroke="#C9BFA3" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7"/><polygon points="80,190 240,190 240,350 80,350" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" stroke-linejoin="round"/><polygon points="80,190 240,190 310,130 150,130" fill="#CFEAE8" stroke="#1E2A78" stroke-width="3" stroke-linejoin="round"/><polygon points="240,190 240,350 310,290 310,130" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" stroke-linejoin="round"/><line x1="310" y1="130" x2="310" y2="290" stroke="#F2B84B" stroke-width="9" stroke-linecap="round"/><circle cx="240" cy="350" r="9" fill="#1E2A78"/><line x1="190" y1="122" x2="190" y2="156" stroke="#1E2A78" stroke-width="3" stroke-linecap="round"/><circle cx="190" cy="158" r="6" fill="#1E2A78"/><text x="190" y="112" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">una cara</text><line x1="355" y1="215" x2="318" y2="215" stroke="#1E2A78" stroke-width="3" stroke-linecap="round"/><text x="365" y="225" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">una arista</text><line x1="355" y1="350" x2="252" y2="350" stroke="#1E2A78" stroke-width="3" stroke-linecap="round"/><text x="365" y="360" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">un vértice</text><text x="320" y="430" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Luis mira una caja</text></svg>
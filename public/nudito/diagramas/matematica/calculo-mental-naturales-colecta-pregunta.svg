<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dos frascos de tapitas: uno con trescientos noventa y ocho y otro con doscientos cincuenta y siete, unidos por un signo más; abajo la pregunta de cuántas hay en total"><title>Dos frascos de tapitas: uno con trescientos noventa y ocho y otro con doscientos cincuenta y siete, unidos por un signo más; abajo la pregunta de cuántas hay en total</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Colecta de tapitas</text><rect x="80" y="110" width="150" height="40" rx="10" fill="#F2B84B" stroke="#1E2A78" stroke-width="4"/><rect x="50" y="150" width="210" height="190" rx="24" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="155" y="245" font-family="sans-serif" font-size="48" font-weight="700" fill="#1E2A78" text-anchor="middle">398</text><text x="155" y="295" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">tapitas</text><rect x="400" y="110" width="150" height="40" rx="10" fill="#F2B84B" stroke="#1E2A78" stroke-width="4"/><rect x="370" y="150" width="210" height="190" rx="24" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="475" y="245" font-family="sans-serif" font-size="48" font-weight="700" fill="#1E2A78" text-anchor="middle">257</text><text x="475" y="295" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">tapitas</text><text x="320" y="260" font-family="sans-serif" font-size="50" font-weight="700" fill="#1E2A78" text-anchor="middle">+</text><text x="320" y="415" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">¿Cuántas tapitas hay en total?</text></svg>
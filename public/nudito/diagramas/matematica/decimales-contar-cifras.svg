<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Uno coma cinco por cero coma dos: quince por dos son treinta, dos cifras decimales, resultado cero coma treinta igual a cero coma tres"><title>Uno coma cinco por cero coma dos: quince por dos son treinta, dos cifras decimales, resultado cero coma treinta igual a cero coma tres</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="56" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Colocar la coma</text><text x="320" y="125" font-family="sans-serif" font-size="44" font-weight="700" fill="#0F7C7A" text-anchor="middle">1,5 × 0,2</text><rect x="30" y="165" width="580" height="80" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><circle cx="78" cy="205" r="26" fill="#1E2A78"/><text x="78" y="215" font-family="sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="122" y="216" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">Sin comas: 15 × 2 = 30</text><rect x="30" y="265" width="580" height="80" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><circle cx="78" cy="305" r="26" fill="#1E2A78"/><text x="78" y="315" font-family="sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="122" y="316" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">Cifras decimales: 1 + 1 = 2</text><rect x="30" y="365" width="580" height="80" rx="16" fill="#BFE3E1" stroke="#1E2A78" stroke-width="4"/><circle cx="78" cy="405" r="26" fill="#1E2A78"/><text x="78" y="415" font-family="sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="122" y="416" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">Dos lugares: 0,30 = 0,3</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img"><title>Triángulo turquesa con sus tres lados numerados</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="60" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Contamos los lados</text><polygon points="320.0,110.0 170.0,330.0 470.0,330.0" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round"/><circle cx="245.0" cy="220.0" r="22" fill="#FFFFFF" stroke="#0C706E" stroke-width="4"/><text x="245.0" y="229.0" font-family="Arial, Liberation Sans, sans-serif" font-size="26" font-weight="700" fill="#0C706E" text-anchor="middle">1</text><circle cx="320.0" cy="330.0" r="22" fill="#FFFFFF" stroke="#0C706E" stroke-width="4"/><text x="320.0" y="339.0" font-family="Arial, Liberation Sans, sans-serif" font-size="26" font-weight="700" fill="#0C706E" text-anchor="middle">2</text><circle cx="395.0" cy="220.0" r="22" fill="#FFFFFF" stroke="#0C706E" stroke-width="4"/><text x="395.0" y="229.0" font-family="Arial, Liberation Sans, sans-serif" font-size="26" font-weight="700" fill="#0C706E" text-anchor="middle">3</text><text x="320" y="415" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Tres lados: es un triángulo</text></svg>
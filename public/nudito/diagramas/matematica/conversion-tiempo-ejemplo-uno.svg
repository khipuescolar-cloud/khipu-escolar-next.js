<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Barra con una hora, igual a sesenta minutos, y cincuenta minutos; suman ciento diez minutos"><title>Barra con una hora, igual a sesenta minutos, y cincuenta minutos; suman ciento diez minutos</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">De horas a minutos</text><text x="320" y="118" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">1 h 50 min</text><rect x="100" y="140" width="240" height="84" rx="8" fill="#8CCFCB" stroke="#1E2A78" stroke-width="3"/><text x="220" y="192" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">1 h = 60 min</text><rect x="340" y="140" width="200" height="84" rx="8" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="440" y="192" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">50 min</text><line x1="100" y1="256" x2="540" y2="256" stroke="#1E2A78" stroke-width="4" stroke-linecap="round"/><line x1="100" y1="244" x2="100" y2="268" stroke="#1E2A78" stroke-width="4" stroke-linecap="round"/><line x1="540" y1="244" x2="540" y2="268" stroke="#1E2A78" stroke-width="4" stroke-linecap="round"/><text x="320" y="330" font-family="sans-serif" font-size="40" font-weight="700" fill="#1E2A78" text-anchor="middle">60 + 50 = 110 min</text><text x="320" y="410" font-family="sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="middle">Valeria entrenó 110 minutos</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Arriba, dos tarjetas: uno coma veinticinco litros con la nota error veinticinco mayor que tres, y uno coma tres litros con la nota uno coma treinta mayor que uno coma veinticinco. Abajo, cero coma cinco litros no es cinco mililitros sino quinientos mililitros"><title>Arriba, dos tarjetas: uno coma veinticinco litros con la nota error veinticinco mayor que tres, y uno coma tres litros con la nota uno coma treinta mayor que uno coma veinticinco. Abajo, cero coma cinco litros no es cinco mililitros sino quinientos mililitros</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="48" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Dos errores frecuentes</text><rect x="50" y="76" width="250" height="76" rx="14" fill="#FFFDF5" stroke="#B5412A" stroke-width="3"/><text x="175" y="128" font-family="sans-serif" font-size="38" font-weight="700" fill="#1E2A78" text-anchor="middle">1,25 L</text><rect x="340" y="76" width="250" height="76" rx="14" fill="#FFFDF5" stroke="#0C706E" stroke-width="3"/><text x="465" y="128" font-family="sans-serif" font-size="38" font-weight="700" fill="#1E2A78" text-anchor="middle">1,3 L</text><text x="175" y="198" font-family="sans-serif" font-size="28" font-weight="700" fill="#B5412A" text-anchor="middle">Error: 25 &gt; 3</text><text x="465" y="198" font-family="sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="middle">1,30 &gt; 1,25</text><line x1="40.0" y1="236.0" x2="600.0" y2="236.0" stroke="#1E2A78" stroke-width="2" stroke-linecap="round"/><text x="320" y="298" font-family="sans-serif" font-size="30" font-weight="700" fill="#B5412A" text-anchor="middle">Error: 0,5 L = 5 mL</text><text x="320" y="372" font-family="sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="middle">Bien: 0,5 L = 500 mL</text><text x="320" y="432" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">La mitad de 1000 mL</text></svg>

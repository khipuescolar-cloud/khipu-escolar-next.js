<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img"><title>Reemplazando p por veinte, el lado izquierdo vale cinco y el derecho seis</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="60" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Reemplazamos p por 20</text><rect x="40" y="100" width="250" height="220" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4" /><rect x="350" y="100" width="250" height="220" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4" /><text x="165" y="146" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="middle">Lado izquierdo</text><text x="475" y="146" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="middle">Lado derecho</text><text x="165" y="216" font-family="Arial, Liberation Sans, sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">20 ÷ 4</text><text x="165" y="272" font-family="Arial, Liberation Sans, sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">= 5</text><text x="475" y="244" font-family="Arial, Liberation Sans, sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">6</text><text x="320" y="244" font-family="Arial, Liberation Sans, sans-serif" font-size="46" font-weight="700" fill="#B5412A" text-anchor="middle">≠</text><circle cx="70" cy="400" r="24" fill="#FFFFFF" stroke="#B5412A" stroke-width="4"/><line x1="61" y1="391" x2="79" y2="409" stroke="#B5412A" stroke-width="6" stroke-linecap="round" /><line x1="79" y1="391" x2="61" y2="409" stroke="#B5412A" stroke-width="6" stroke-linecap="round" /><text x="110" y="410" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#B5412A" text-anchor="start">5 no es igual a 6: no sirve</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img"><title>Treinta y seis es mayor que veintinueve con la abertura hacia treinta y seis</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="62" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#1E2A78">La abertura mira al mayor</text><g fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"><rect x="75" y="125" width="180" height="160" rx="20"/><rect x="385" y="125" width="180" height="160" rx="20"/></g><g font-family="Arial" font-size="64" font-weight="700" fill="#1E2A78" text-anchor="middle"><text x="165" y="230">36</text><text x="475" y="230">29</text></g><path d="M285 155 L365 205 L285 255" fill="none" stroke="#0C706E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="355" text-anchor="middle" font-family="Arial" font-size="42" font-weight="700" fill="#0C706E">36 &gt; 29</text><text x="320" y="425" text-anchor="middle" font-family="Arial" font-size="28" fill="#1E2A78">Treinta y seis es mayor que veintinueve.</text></svg>

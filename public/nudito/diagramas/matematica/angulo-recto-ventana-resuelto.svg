<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="La esquina de una hoja se apoya sobre la esquina de la ventana y sus bordes cubren justo los dos lados: es un ángulo recto"><title>La esquina de una hoja se apoya sobre la esquina de la ventana y sus bordes cubren justo los dos lados: es un ángulo recto</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><rect x="150" y="110" width="340" height="260" rx="0" fill="#CFE7EE" stroke="#1E2A78" stroke-width="8"/><line x1="320" y1="110" x2="320" y2="370" stroke="#1E2A78" stroke-width="5" stroke-linecap="round"/><line x1="150" y1="240" x2="490" y2="240" stroke="#1E2A78" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="110" r="11" fill="#F2B632" stroke="#1E2A78" stroke-width="3"/><rect x="150" y="110" width="110" height="110" rx="0" fill="rgba(15,124,122,0.35)" stroke="#0F7C7A" stroke-width="4"/><rect x="150" y="110" width="24" height="24" rx="0" fill="none" stroke="#B5412A" stroke-width="4"/><text x="320" y="54" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">La hoja encaja justo</text><text x="320" y="430" font-family="sans-serif" font-size="32" font-weight="700" fill="#B5412A" text-anchor="middle">Ángulo recto</text></svg>
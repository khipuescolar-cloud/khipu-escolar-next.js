<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Conversión incorrecta de seis metros a centímetros</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="52" font-family="Arial, sans-serif" font-size="31" font-weight="600" fill="#1E2A78" text-anchor="middle">Revisa el sentido</text><rect x="55" y="130" width="210" height="100" rx="18" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="4"/><text x="160" y="190" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#0C706E" text-anchor="middle">6 m</text><line x1="285" y1="180" x2="337" y2="180" stroke="#8A5A00" stroke-width="7"/><polygon points="355,180 337,168 337,192" fill="#8A5A00"/><rect x="375" y="130" width="210" height="100" rx="18" fill="#FFFFFF" stroke="#B5412A" stroke-width="5"/><text x="480" y="190" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#B5412A" text-anchor="middle">0,06 cm</text><text x="320" y="300" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#B5412A" text-anchor="middle">El número no puede bajar</text><text x="320" y="385" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#1E2A78" text-anchor="middle">6 m son 600 cm</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="titulo">
  <title id="titulo">Tres mosaicos con dos, cinco y nueve fichas y una cuarta etapa sin completar</title>
  <rect width="640" height="480" fill="#FCF0D6"/>
  <text x="320" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1E2A78">Mosaicos por etapas</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="27" fill="#1E2A78">
    <text x="98" y="105">Etapa 1</text><text x="248" y="105">Etapa 2</text><text x="414" y="105">Etapa 3</text><text x="558" y="105">Etapa 4</text>
  </g>
  <g fill="#F2B84B" stroke="#1E2A78" stroke-width="3">
    <rect x="62" y="158" width="34" height="34"/><rect x="100" y="158" width="34" height="34"/>
    <rect x="194" y="134" width="34" height="34"/><rect x="232" y="134" width="34" height="34"/><rect x="270" y="134" width="34" height="34"/><rect x="213" y="172" width="34" height="34"/><rect x="251" y="172" width="34" height="34"/>
    <rect x="342" y="116" width="34" height="34"/><rect x="380" y="116" width="34" height="34"/><rect x="418" y="116" width="34" height="34"/><rect x="456" y="116" width="34" height="34"/><rect x="361" y="154" width="34" height="34"/><rect x="399" y="154" width="34" height="34"/><rect x="437" y="154" width="34" height="34"/><rect x="380" y="192" width="34" height="34"/><rect x="418" y="192" width="34" height="34"/>
  </g>
  <rect x="516" y="132" width="84" height="104" rx="18" fill="#FFFFFF" stroke="#8A5A00" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="558" y="203" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#8A5A00">?</text>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="28" font-weight="700">
    <text x="98" y="286" fill="#1E2A78">2 fichas</text><text x="248" y="286" fill="#1E2A78">5 fichas</text><text x="414" y="286" fill="#1E2A78">9 fichas</text>
    <text x="173" y="346" fill="#0C706E">añade 3</text><text x="331" y="346" fill="#0C706E">añade 4</text><text x="488" y="346" fill="#8A5A00">¿qué añade?</text>
  </g>
  <text x="320" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" fill="#1E2A78">La cantidad nueva también sigue un patrón</text>
</svg>

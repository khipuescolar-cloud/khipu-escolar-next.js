<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Cinco por tres frente a cinco más tres</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="50" font-family="Arial, sans-serif" font-size="31" font-weight="600" fill="#1E2A78" text-anchor="middle">No cambies la operación</text><rect x="60" y="110" width="240" height="190" rx="18" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="4"/><rect x="340" y="110" width="240" height="190" rx="18" fill="#FFFFFF" stroke="#B5412A" stroke-width="4"/><text x="180" y="185" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#1E2A78" text-anchor="middle">cinco por tres</text><text x="180" y="250" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#0C706E" text-anchor="middle">quince</text><text x="460" y="185" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#1E2A78" text-anchor="middle">cinco más tres</text><text x="460" y="250" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#B5412A" text-anchor="middle">ocho</text><text x="180" y="350" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#0C706E" text-anchor="middle">Mismos factores</text><text x="460" y="350" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#B5412A" text-anchor="middle">Otra operación</text><text x="320" y="425" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#1E2A78" text-anchor="middle">Solo se intercambian los factores</text></svg>
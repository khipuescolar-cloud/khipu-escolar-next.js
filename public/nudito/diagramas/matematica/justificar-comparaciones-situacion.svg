<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Dos almacenes con cantidades para comparar</title>
  <rect width="640" height="480" rx="32" fill="#FCF0D6"/>
  <text x="320" y="58" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78">¿Qué cantidad es mayor?</text>
  <rect x="54" y="98" width="240" height="250" rx="24" fill="#FFFFFF" stroke="#1E2A78" stroke-width="5"/>
  <rect x="346" y="98" width="240" height="250" rx="24" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="5"/>
  <text x="174" y="144" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78">Almacén Sol</text>
  <text x="466" y="144" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#0C706E">Almacén Mar</text>
  <text x="174" y="240" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="700" fill="#1E2A78">6 205</text>
  <text x="466" y="240" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="700" fill="#1E2A78">6 025</text>
  <text x="320" y="408" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#8A5A00">¿Qué lugar decide la comparación?</text>
</svg>

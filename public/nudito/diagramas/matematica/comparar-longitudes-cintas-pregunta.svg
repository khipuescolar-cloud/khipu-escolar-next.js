<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Dos cintas que empiezan en lugares distintos</title><rect width="640" height="480" rx="28" fill="#FCF0D6"/><text x="320" y="58" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#1E2A78">¿Cuál cinta es más larga?</text><text x="60" y="140" text-anchor="start" font-family="Arial" font-size="28" font-weight="700" fill="#1E2A78">Cinta roja</text><rect x="220" y="155" width="280" height="46" rx="23" fill="#D95D59"/><text x="60" y="260" text-anchor="start" font-family="Arial" font-size="28" font-weight="700" fill="#1E2A78">Cinta verde</text><rect x="100" y="275" width="340" height="46" rx="23" fill="#0F7C7A"/><text x="320" y="400" text-anchor="middle" font-family="Arial" font-size="28" fill="#1E2A78">Empiezan en lugares distintos</text></svg>

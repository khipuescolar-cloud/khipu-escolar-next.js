<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img"><title>Igualdad duplicada de ocho más doce igual a veinte</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#1E2A78">Duplicar ambos lados</text><rect x="80" y="100" width="480" height="100" rx="20" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="320" y="165" text-anchor="middle" font-family="Arial" font-size="42" fill="#1E2A78">4 + 6 = 10</text><path d="M320 220 V275" stroke="#0C706E" stroke-width="7"/><path d="M300 255 L320 278 L340 255" fill="none" stroke="#0C706E" stroke-width="7"/><rect x="60" y="300" width="520" height="105" rx="20" fill="#F2B84B" stroke="#1E2A78" stroke-width="4"/><text x="320" y="368" text-anchor="middle" font-family="Arial" font-size="44" font-weight="700" fill="#1E2A78">8 + 12 = 20</text><text x="320" y="450" text-anchor="middle" font-family="Arial" font-size="28" fill="#0C706E">Cada cantidad quedó al doble.</text></svg>

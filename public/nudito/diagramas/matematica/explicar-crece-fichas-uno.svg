<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Secuencia de una, dos, tres y cuatro fichas</title>
  <rect width="640" height="480" fill="#FCF0D6"/>
  <text x="320" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1E2A78">Crece de uno en uno</text>
  <g fill="#FFFFFF" stroke="#1E2A78" stroke-width="4">
    <rect x="35" y="95" width="130" height="270" rx="18"/><rect x="180" y="95" width="130" height="270" rx="18"/>
    <rect x="325" y="95" width="130" height="270" rx="18"/><rect x="470" y="95" width="130" height="270" rx="18"/>
  </g>
  <g fill="#F2B84B" stroke="#1E2A78" stroke-width="3">
    <circle cx="100" cy="165" r="20"/>
    <circle cx="213" cy="165" r="20"/><circle cx="277" cy="165" r="20"/>
    <circle cx="358" cy="165" r="20"/><circle cx="422" cy="165" r="20"/><circle cx="390" cy="225" r="20"/>
    <circle cx="503" cy="165" r="20"/><circle cx="567" cy="165" r="20"/><circle cx="503" cy="225" r="20"/><circle cx="567" cy="225" r="20"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#0C706E" text-anchor="middle">
    <text x="100" y="330">1</text><text x="245" y="330">2</text><text x="390" y="330">3</text><text x="535" y="330">4</text>
  </g>
  <text x="320" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#1E2A78">En cada paso aparece una ficha más.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres tarjetas numeradas: uno, mira las decenas; dos, si empatan, mira las unidades; tres, di verdadero o falso"><title>Tres tarjetas numeradas: uno, mira las decenas; dos, si empatan, mira las unidades; tres, di verdadero o falso</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Tres pasos</text><rect x="50" y="84" width="540" height="92" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" /><circle cx="106" cy="130" r="30" fill="#1E2A78" stroke="#1E2A78" stroke-width="2"/><text x="106" y="141" font-family="sans-serif" font-size="34" font-weight="700" fill="#FCF0D6" text-anchor="middle">1</text><text x="158" y="140" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Mira las decenas</text><rect x="50" y="192" width="540" height="92" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" /><circle cx="106" cy="238" r="30" fill="#1E2A78" stroke="#1E2A78" stroke-width="2"/><text x="106" y="249" font-family="sans-serif" font-size="34" font-weight="700" fill="#FCF0D6" text-anchor="middle">2</text><text x="158" y="248" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Si empatan, mira las unidades</text><rect x="50" y="300" width="540" height="92" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" /><circle cx="106" cy="346" r="30" fill="#1E2A78" stroke="#1E2A78" stroke-width="2"/><text x="106" y="357" font-family="sans-serif" font-size="34" font-weight="700" fill="#FCF0D6" text-anchor="middle">3</text><text x="158" y="356" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Di verdadero o falso</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Conversión de una tabla a pictograma</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="45" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#1E2A78">Familias que siembran papa</text><rect x="45" y="95" width="240" height="250" fill="#fff" stroke="#1E2A78" stroke-width="4"/><text x="165" y="135" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#1E2A78">Tabla:</text><text x="165" y="175" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#1E2A78">60 familias</text><text x="165" y="235" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#0C706E">Cada símbolo</text><text x="165" y="275" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#0C706E">vale 15 familias</text><rect x="330" y="95" width="265" height="250" fill="#fff" stroke="#1E2A78" stroke-width="4"/><text x="462" y="155" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#1E2A78">Pictograma</text><text x="462" y="265" text-anchor="middle" font-family="sans-serif" font-size="62" font-weight="700" fill="#8A5A00">?</text><text x="320" y="410" text-anchor="middle" font-family="sans-serif" font-size="29" fill="#1E2A78">¿Cuántos símbolos hacen falta?</text></svg>

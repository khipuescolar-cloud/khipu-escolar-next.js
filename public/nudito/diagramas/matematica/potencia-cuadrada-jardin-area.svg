<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
<title>Jardín cuadrado: veinte por veinte son cuatrocientos metros cuadrados</title>
<rect width="640" height="480" fill="#FCF0D6"/>
<text x="320" y="92" font-family="Nunito, Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">20 m</text>
<text x="170" y="250" font-family="Nunito, Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="end">20 m</text>
<rect x="190" y="110" width="260" height="260" fill="#F2B84B" stroke="#1E2A78" stroke-width="4" fill-opacity="0.45"/>
<text x="320" y="232" font-family="Nunito, Arial, sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">20 × 20</text>
<text x="320" y="282" font-family="Nunito, Arial, sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">= 400 m²</text>
<text x="320" y="430" font-family="Nunito, Arial, sans-serif" font-size="34" font-weight="700" fill="#0C706E" text-anchor="middle">20² = 400 m²</text>

</svg>

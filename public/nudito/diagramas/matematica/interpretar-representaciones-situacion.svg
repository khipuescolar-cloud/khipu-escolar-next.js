<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Tabla y pictograma sobre una cosecha</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="45" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#1E2A78">Dos formas de mostrar la cosecha</text><rect x="35" y="85" width="275" height="300" fill="#fff" stroke="#1E2A78" stroke-width="4"/><line x1="35" y1="150" x2="310" y2="150" stroke="#1E2A78" stroke-width="3"/><line x1="200" y1="85" x2="200" y2="385" stroke="#1E2A78" stroke-width="3"/><g font-family="sans-serif" font-size="26" fill="#1E2A78"><text x="60" y="128">Producto</text><text x="220" y="128">Sacos</text><text x="65" y="220">Cacao</text><text x="65" y="315">Maíz</text><text x="235" y="220">40</text><text x="235" y="315">60</text></g><rect x="335" y="85" width="270" height="300" fill="#fff" stroke="#1E2A78" stroke-width="4"/><g fill="#F2B84B" stroke="#8A5A00" stroke-width="3"><circle cx="400" cy="210" r="24"/><circle cx="470" cy="210" r="24"/><circle cx="385" cy="300" r="24"/><circle cx="455" cy="300" r="24"/><circle cx="525" cy="300" r="24"/></g><text x="470" y="120" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#1E2A78">Cada círculo</text><text x="470" y="152" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#1E2A78">vale 20 sacos</text><text x="320" y="435" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#8A5A00">¿Comunican los mismos datos?</text></svg>

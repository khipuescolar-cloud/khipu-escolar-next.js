<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Una unidad completa un nuevo millar</title>
  <rect width="640" height="480" rx="32" fill="#FCF0D6"/>
  <text x="320" y="58" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78">Una unidad completa el millar</text>
  <rect x="64" y="104" width="512" height="112" rx="22" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/>
  <text x="137" y="173" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78">4 999</text>
  <text x="244" y="173" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#0C706E">+ 1</text>
  <path d="M302 160H370" stroke="#0F7C7A" stroke-width="7" stroke-linecap="round"/>
  <path d="M351 143L373 160L351 177" fill="none" stroke="#0F7C7A" stroke-width="7" stroke-linejoin="round"/>
  <text x="470" y="173" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="700" fill="#1E2A78">5 000</text>
  <g fill="#F2B84B" stroke="#8A5A00" stroke-width="3">
    <rect x="92" y="268" width="72" height="72" rx="8"/><rect x="179" y="268" width="72" height="72" rx="8"/><rect x="266" y="268" width="72" height="72" rx="8"/><rect x="353" y="268" width="72" height="72" rx="8"/><rect x="440" y="268" width="72" height="72" rx="8"/>
  </g>
  <text x="320" y="392" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#1E2A78">5 placas de millar</text>
  <text x="320" y="434" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#0C706E">5 millares son más que 4 millares</text>
</svg>

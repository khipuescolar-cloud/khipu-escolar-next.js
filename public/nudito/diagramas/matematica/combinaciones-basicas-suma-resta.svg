<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Barra de trece partida en cinco y ocho con tres cuentas de la misma familia"><title>Barra de trece partida en cinco y ocho con tres cuentas de la misma familia</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">La suma ayuda a restar</text><rect x="60" y="100" width="520" height="64" rx="8" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="320" y="143" font-family="sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">13</text><rect x="60" y="190" width="200" height="64" rx="8" fill="#0F7C7A" stroke="#0F7C7A" stroke-width="3"/><text x="160" y="233" font-family="sans-serif" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><rect x="260" y="190" width="320" height="64" rx="8" fill="#1E2A78" stroke="#1E2A78" stroke-width="3"/><text x="420" y="233" font-family="sans-serif" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">8</text><text x="320" y="322" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">5 + 8 = 13</text><text x="320" y="372" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">13 − 5 = 8</text><text x="320" y="422" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">13 − 8 = 5</text></svg>
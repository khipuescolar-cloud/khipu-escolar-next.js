<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres pasos para contar: reunir de diez en diez, contar los grupos y seguir con las sueltas"><title>Tres pasos para contar: reunir de diez en diez, contar los grupos y seguir con las sueltas</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="50" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">Tres pasos para contar</text><rect x="40" y="76" width="560" height="120" rx="12" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><circle cx="92" cy="136.0" r="28" fill="#0F7C7A" stroke="#1E2A78" stroke-width="2.5"/><text x="92" y="146.0" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="142" y="145.0" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Reúne de diez en diez</text><rect x="40" y="206" width="560" height="120" rx="12" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><circle cx="92" cy="266.0" r="28" fill="#0F7C7A" stroke="#1E2A78" stroke-width="2.5"/><text x="92" y="276.0" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="142" y="258.0" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Cuenta los grupos:</text><text x="142" y="292.0" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">10, 20, 30...</text><rect x="40" y="336" width="560" height="120" rx="12" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><circle cx="92" cy="396.0" r="28" fill="#0F7C7A" stroke="#1E2A78" stroke-width="2.5"/><text x="92" y="406.0" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="142" y="388.0" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Sigue con las sueltas,</text><text x="142" y="422.0" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">una por una</text></svg>
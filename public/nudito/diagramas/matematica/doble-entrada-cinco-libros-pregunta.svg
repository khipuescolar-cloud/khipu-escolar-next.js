  <g stroke="#1E2A78" stroke-width="4" fill="#FFFFFF"><rect x="80" y="105" width="480" height="285" rx="14"/><line x1="240" y1="105" x2="240" y2="390"/><line x1="400" y1="105" x2="400" y2="390"/><line x1="80" y1="200" x2="560" y2="200"/><line x1="80" y1="295" x2="560" y2="295"/></g>
  <rect x="400" y="105" width="160" height="285" fill="#F2B84B" opacity="0.25"/>

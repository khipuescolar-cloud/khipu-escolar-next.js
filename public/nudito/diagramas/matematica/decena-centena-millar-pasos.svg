<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres pasos para cambiar de orden: reconocer el orden, agrupar para subir y desagrupar para bajar"><title>Tres pasos para cambiar de orden: reconocer el orden, agrupar para subir y desagrupar para bajar</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="50" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">Tres pasos para cambiar de orden</text><rect x="40" y="76" width="560" height="120" rx="12" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><circle cx="92" cy="136.0" r="28" fill="#0F7C7A" stroke="#1E2A78" stroke-width="2.5"/><text x="92" y="146.0" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="142" y="128.0" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Reconoce el orden:</text><text x="142" y="162.0" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">mil, diez mil, cien mil</text><rect x="40" y="206" width="560" height="120" rx="12" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><circle cx="92" cy="266.0" r="28" fill="#0F7C7A" stroke="#1E2A78" stroke-width="2.5"/><text x="92" y="276.0" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="142" y="258.0" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Agrupa de diez en diez</text><text x="142" y="292.0" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">para subir de orden</text><rect x="40" y="336" width="560" height="120" rx="12" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><circle cx="92" cy="396.0" r="28" fill="#0F7C7A" stroke="#1E2A78" stroke-width="2.5"/><text x="92" y="406.0" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="142" y="388.0" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Desagrupa para bajar:</text><text x="142" y="422.0" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">el total no cambia</text></svg>
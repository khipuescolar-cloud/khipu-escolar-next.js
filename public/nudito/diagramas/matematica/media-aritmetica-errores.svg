<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Datos: tres, nueve y doce, que suman veinticuatro. Tres tarjetas: dividir entre el mayor da dos, con cruz roja; quedarse con el total, veinticuatro, con cruz roja; dividir entre tres da ocho, con marca verde."><title>Datos: tres, nueve y doce, que suman veinticuatro. Tres tarjetas: dividir entre el mayor da dos, con cruz roja; quedarse con el total, veinticuatro, con cruz roja; dividir entre tres da ocho, con marca verde.</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Errores y camino correcto</text><text x="320" y="100" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Datos: 3, 9 y 12</text><rect x="50" y="120" width="540" height="96" rx="14" fill="#FFFFFF" stroke="#B5412A" stroke-width="4"/><text x="78" y="156" font-family="sans-serif" font-size="26" font-weight="700" fill="#B5412A" text-anchor="start">Dividir entre el mayor</text><text x="78" y="198" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="start">24 ÷ 12 = 2</text><path d="M532 152L564 184M564 152L532 184" stroke="#B5412A" stroke-width="7" stroke-linecap="round" fill="none"/><rect x="50" y="232" width="540" height="96" rx="14" fill="#FFFFFF" stroke="#B5412A" stroke-width="4"/><text x="78" y="268" font-family="sans-serif" font-size="26" font-weight="700" fill="#B5412A" text-anchor="start">Quedarse con el total</text><text x="78" y="310" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="start">24</text><path d="M532 264L564 296M564 264L532 296" stroke="#B5412A" stroke-width="7" stroke-linecap="round" fill="none"/><rect x="50" y="344" width="540" height="96" rx="14" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="4"/><text x="78" y="380" font-family="sans-serif" font-size="26" font-weight="700" fill="#0C706E" text-anchor="start">Dividir entre los datos</text><text x="78" y="422" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="start">24 ÷ 3 = 8</text><path d="M532 392L542.6666666666666 404.8L564 379.2" stroke="#0F7C7A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Barra de doce unidades dividida en dos partes: una parte desconocida x y otra de cinco, para x más cinco igual a doce"><title>Barra de doce unidades dividida en dos partes: una parte desconocida x y otra de cinco, para x más cinco igual a doce</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="50" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">Bolsa de naranjas</text><text x="320" y="128" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">12 en total</text><rect x="70" y="146" width="500" height="60" rx="6" fill="none" stroke="#1E2A78" stroke-width="4"/><rect x="70" y="230" width="291.6666666666667" height="80" rx="6" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="6"/><rect x="361.6666666666667" y="230" width="208.33333333333334" height="80" rx="6" fill="#F2B84B" stroke="#1E2A78" stroke-width="4"/><text x="215.83333333333334" y="282" font-family="sans-serif" font-size="46" font-weight="700" fill="#1B1F2A" text-anchor="middle">x</text><text x="465.83333333333337" y="282" font-family="sans-serif" font-size="46" font-weight="700" fill="#1B1F2A" text-anchor="middle">5</text><line x1="70" y1="146" x2="70" y2="230" stroke="#1E2A78" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/><line x1="570" y1="146" x2="570" y2="230" stroke="#1E2A78" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/><text x="320" y="398" font-family="sans-serif" font-size="52" font-weight="700" fill="#0F7C7A" text-anchor="middle">x + 5 = 12</text><text x="320" y="448" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">12 − 5 = 7</text></svg>
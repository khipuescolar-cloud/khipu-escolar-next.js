<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dos tarjetas: multiplicar trescientos segundos por sesenta da dieciocho mil minutos, que es un error; dividir entre sesenta da cinco minutos, que es correcto"><title>Dos tarjetas: multiplicar trescientos segundos por sesenta da dieciocho mil minutos, que es un error; dividir entre sesenta da cinco minutos, que es correcto</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">Multiplicar o dividir</text><rect x="40" y="84" width="560" height="150" rx="12" fill="#FFFFFF" stroke="#B5412A" stroke-width="3" stroke-dasharray="10 7"/><circle cx="86" cy="130" r="22" fill="#B5412A" stroke="#B5412A" stroke-width="2"/><line x1="76.1" y1="120.1" x2="95.9" y2="139.9" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/><line x1="76.1" y1="139.9" x2="95.9" y2="120.1" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/><text x="130" y="142" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="start">300 s × 60 = 18 000 min</text><text x="130" y="196" font-family="sans-serif" font-size="26" font-weight="700" fill="#B5412A" text-anchor="start">Error: sale un número enorme</text><rect x="40" y="264" width="560" height="150" rx="12" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="3"/><circle cx="86" cy="310" r="22" fill="#0F7C7A" stroke="#0F7C7A" stroke-width="2"/><polyline points="76,310 84,319 97,301" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="130" y="322" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="start">300 s ÷ 60 = 5 min</text><text x="130" y="376" font-family="sans-serif" font-size="26" font-weight="700" fill="#0C706E" text-anchor="start">A una unidad mayor, se divide</text></svg>
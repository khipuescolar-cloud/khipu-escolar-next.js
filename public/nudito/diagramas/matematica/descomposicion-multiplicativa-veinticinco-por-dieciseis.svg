<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Cadena de dos pasos: veinticinco por cuatro es cien y cien por cuatro es cuatrocientos"><title>Cadena de dos pasos: veinticinco por cuatro es cien y cien por cuatro es cuatrocientos</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Dos pasos</text><text x="320" y="130" font-family="sans-serif" font-size="40" font-weight="700" fill="#0C706E" text-anchor="middle">16 = 4 × 4</text><rect x="40" y="190" width="130" height="90" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="105.0" y="250" font-family="sans-serif" font-size="48" font-weight="700" fill="#1E2A78" text-anchor="middle">25</text><line x1="172" y1="235" x2="234" y2="235" stroke="#1E2A78" stroke-width="5" stroke-linecap="round"/><polygon points="248.0,235.0 226.0,222.0 226.0,248.0" fill="#1E2A78" stroke="#1E2A78" stroke-width="1" stroke-linejoin="round"/><text x="210" y="218" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">× 4</text><rect x="250" y="190" width="130" height="90" rx="16" fill="#FBE3A6" stroke="#1E2A78" stroke-width="4"/><text x="315.0" y="250" font-family="sans-serif" font-size="48" font-weight="700" fill="#1E2A78" text-anchor="middle">100</text><line x1="382" y1="235" x2="444" y2="235" stroke="#1E2A78" stroke-width="5" stroke-linecap="round"/><polygon points="458.0,235.0 436.0,222.0 436.0,248.0" fill="#1E2A78" stroke="#1E2A78" stroke-width="1" stroke-linejoin="round"/><text x="420" y="218" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">× 4</text><rect x="460" y="190" width="130" height="90" rx="16" fill="#BFE0DC" stroke="#1E2A78" stroke-width="4"/><text x="525.0" y="250" font-family="sans-serif" font-size="48" font-weight="700" fill="#1E2A78" text-anchor="middle">400</text><text x="210" y="340" font-family="sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="middle">primero</text><text x="420" y="340" font-family="sans-serif" font-size="26" font-weight="400" fill="#1E2A78" text-anchor="middle">después</text><text x="320" y="420" font-family="sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">25 × 16 = 400</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dos cintas del mismo largo sin pintar: una dividida en tres partes y otra en cinco partes"><title>Dos cintas del mismo largo sin pintar: una dividida en tres partes y otra en cinco partes</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Cintas de Elena y de Bruno</text><text x="80" y="100" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Elena usó 2/3 de su cinta</text><rect x="80.0" y="112" width="160.0" height="60" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><rect x="240.0" y="112" width="160.0" height="60" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><rect x="400.0" y="112" width="160.0" height="60" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="80" y="250" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Bruno usó 2/5 de su cinta</text><rect x="80.0" y="262" width="96.0" height="60" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><rect x="176.0" y="262" width="96.0" height="60" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><rect x="272.0" y="262" width="96.0" height="60" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><rect x="368.0" y="262" width="96.0" height="60" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><rect x="464.0" y="262" width="96.0" height="60" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="320" y="385" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Las dos cintas miden lo mismo</text><text x="320" y="435" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">¿Quién usó más?</text></svg>
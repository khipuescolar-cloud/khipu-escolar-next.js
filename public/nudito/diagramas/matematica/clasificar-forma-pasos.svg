<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres pasos para clasificar: elige una regla, junta los que la cumplen y revisa cada grupo"><title>Tres pasos para clasificar: elige una regla, junta los que la cumplen y revisa cada grupo</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><rect x="30" y="30" width="580" height="125" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><circle cx="86" cy="92" r="34" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><text x="86" y="105" font-family="sans-serif" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="140" y="85" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Elige&#160;una&#160;regla</text><text x="140" y="125" font-family="sans-serif" font-size="26" font-weight="400" fill="#0C706E" text-anchor="start">Por&#160;ejemplo:&#160;ruedan&#160;o&#160;no&#160;ruedan</text><rect x="30" y="165" width="580" height="125" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><circle cx="86" cy="227" r="34" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><text x="86" y="240" font-family="sans-serif" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="140" y="220" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Junta&#160;los&#160;que&#160;la&#160;cumplen</text><text x="140" y="260" font-family="sans-serif" font-size="26" font-weight="400" fill="#0C706E" text-anchor="start">Pon&#160;cada&#160;objeto&#160;en&#160;su&#160;grupo</text><rect x="30" y="300" width="580" height="125" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><circle cx="86" cy="362" r="34" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><text x="86" y="375" font-family="sans-serif" font-size="36" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="140" y="355" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Revisa&#160;cada&#160;grupo</text><text x="140" y="395" font-family="sans-serif" font-size="26" font-weight="400" fill="#0C706E" text-anchor="start">Todos&#160;deben&#160;cumplir&#160;la&#160;regla</text></svg>
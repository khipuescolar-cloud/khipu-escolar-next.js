<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="titulo">
  <title id="titulo">Tres figuras triangulares que crecen por filas y una cuarta por completar</title>
  <rect width="640" height="480" fill="#FCF0D6"/>
  <text x="320" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1E2A78">Un diseño que crece</text>
  <text x="100" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1E2A78">Figura 1</text>
  <circle cx="100" cy="174" r="18" fill="#0F7C7A"/>
  <text x="245" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1E2A78">Figura 2</text>
  <circle cx="245" cy="146" r="18" fill="#0F7C7A"/>
  <circle cx="220" cy="190" r="18" fill="#0F7C7A"/>
  <circle cx="270" cy="190" r="18" fill="#0F7C7A"/>
  <text x="410" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1E2A78">Figura 3</text>
  <circle cx="410" cy="132" r="18" fill="#0F7C7A"/>
  <circle cx="385" cy="176" r="18" fill="#0F7C7A"/>
  <circle cx="435" cy="176" r="18" fill="#0F7C7A"/>
  <circle cx="360" cy="220" r="18" fill="#0F7C7A"/>
  <circle cx="410" cy="220" r="18" fill="#0F7C7A"/>
  <circle cx="460" cy="220" r="18" fill="#0F7C7A"/>
  <text x="558" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1E2A78">Figura 4</text>
  <rect x="516" y="136" width="84" height="104" rx="18" fill="#FFFFFF" stroke="#8A5A00" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="558" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#8A5A00">?</text>
  <path d="M88 294h464" stroke="#1E2A78" stroke-width="4" stroke-linecap="round"/>
  <text x="320" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#0C706E">Cada figura conserva las filas anteriores</text>
  <rect x="180" y="382" width="280" height="62" rx="22" fill="#F2B84B"/>
  <text x="320" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#1E2A78">¿Cómo seguirá el crecimiento?</text>
</svg>

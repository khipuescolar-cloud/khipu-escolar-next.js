<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="titulo">
  <title id="titulo">Mosaicos con totales dos, cinco, nueve y catorce</title>
  <rect width="640" height="480" fill="#FCF0D6"/>
  <text x="320" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1E2A78">El crecimiento aumenta de uno en uno</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="54" y="122" width="112" height="76" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="110" y="156" font-size="27" fill="#1E2A78">Etapa 1</text><text x="110" y="190" font-size="30" font-weight="700" fill="#0C706E">2</text>
    <rect x="194" y="122" width="112" height="76" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="250" y="156" font-size="27" fill="#1E2A78">Etapa 2</text><text x="250" y="190" font-size="30" font-weight="700" fill="#0C706E">5</text>
    <rect x="334" y="122" width="112" height="76" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="390" y="156" font-size="27" fill="#1E2A78">Etapa 3</text><text x="390" y="190" font-size="30" font-weight="700" fill="#0C706E">9</text>
    <rect x="474" y="122" width="112" height="76" rx="14" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="530" y="156" font-size="27" fill="#1E2A78">Etapa 4</text><text x="530" y="190" font-size="30" font-weight="700" fill="#1E2A78">14</text>
    <path d="M166 160h28M306 160h28M446 160h28" stroke="#8A5A00" stroke-width="4"/>
    <text x="180" y="245" font-size="28" font-weight="700" fill="#8A5A00">+ 3</text><text x="320" y="245" font-size="28" font-weight="700" fill="#8A5A00">+ 4</text><text x="460" y="245" font-size="28" font-weight="700" fill="#8A5A00">+ 5</text>
    <rect x="100" y="292" width="440" height="120" rx="20" fill="#FFFFFF" stroke="#0C706E" stroke-width="4"/>
    <text x="320" y="338" font-size="29" fill="#1E2A78">El siguiente aumento es cinco</text>
    <text x="320" y="384" font-size="31" font-weight="700" fill="#0C706E">Nueve más cinco son catorce</text>
  </g>
</svg>

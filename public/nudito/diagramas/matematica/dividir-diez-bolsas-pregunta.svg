<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Sesenta lápices y una bolsa para diez</title><rect width="640" height="480" rx="28" fill="#FCF0D6"/><text x="320" y="56" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#1E2A78">Lápices en bolsas</text><rect x="50" y="120" width="220" height="200" rx="18" fill="#F2B84B" stroke="#1E2A78" stroke-width="4"/><text x="160" y="225" text-anchor="middle" font-family="Arial" font-size="72" font-weight="700" fill="#1E2A78">60</text><text x="160" y="278" text-anchor="middle" font-family="Arial" font-size="28" fill="#1E2A78">lápices</text><path d="M390 130 L570 130 L550 320 L410 320 Z" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4"/><text x="480" y="255" text-anchor="middle" font-family="Arial" font-size="72" font-weight="700" fill="#FFFFFF">10</text><text x="480" y="365" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#1E2A78">en cada bolsa</text><text x="320" y="440" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#1E2A78">¿Cuántas bolsas se llenan?</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Núcleo cortado antes de terminar</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="55" font-family="Arial, sans-serif" font-size="31" font-weight="600" fill="#1E2A78" text-anchor="middle">No empieces antes de terminar</text><polygon points="156,140 128,194 184,194" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><polygon points="238,140 210,194 266,194" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><circle cx="320" cy="170" r="25" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><polygon points="402,140 374,194 430,194" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><circle cx="484" cy="170" r="25" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><circle cx="484" cy="170" r="42" fill="none" stroke="#B5412A" stroke-width="6"/><text x="320" y="290" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#B5412A" text-anchor="middle">Se cortó el núcleo</text><text x="320" y="380" font-family="Arial, sans-serif" font-size="28" font-weight="600" fill="#8A5A00" text-anchor="middle">Termina la vuelta y luego repite</text></svg>
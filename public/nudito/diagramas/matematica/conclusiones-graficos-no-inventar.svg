<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Diferencia entre un dato observado y una idea no mostrada</title><rect width="640" height="480" rx="28" fill="#FCF0D6"/><text x="320" y="52" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#1E2A78">Di solo lo que muestran los datos</text><rect x="65" y="105" width="235" height="260" rx="20" fill="#FFF9EC" stroke="#0F7C7A" stroke-width="5"/><text x="182" y="150" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#0C706E">Dato</text><text x="182" y="215" text-anchor="middle" font-family="Arial" font-size="28" fill="#1E2A78">Catorce llegan</text><text x="182" y="255" text-anchor="middle" font-family="Arial" font-size="28" fill="#1E2A78">a pie</text><circle cx="182" cy="315" r="25" fill="#0F7C7A"/><rect x="340" y="105" width="235" height="260" rx="20" fill="#FFF9EC" stroke="#8A5A00" stroke-width="5"/><text x="457" y="150" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#8A5A00">No se sabe</text><text x="457" y="215" text-anchor="middle" font-family="Arial" font-size="28" fill="#1E2A78">Si prefieren</text><text x="457" y="255" text-anchor="middle" font-family="Arial" font-size="28" fill="#1E2A78">caminar</text><path d="M435 305 l45 45 M480 305 l-45 45" stroke="#8A5A00" stroke-width="10"/><text x="320" y="430" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#1E2A78">No agregues gustos ni causas</text></svg>

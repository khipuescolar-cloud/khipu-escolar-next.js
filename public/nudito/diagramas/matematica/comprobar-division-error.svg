<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title">
<title>Residuo demasiado grande</title>
<rect width="640" height="480" fill="#FCF0D6"/>

<text x="320" y="50" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78">Revisa también el residuo</text>
<rect x="75" y="100" width="490" height="215" rx="24" fill="#fff"/>
<text x="320" y="175" text-anchor="middle" font-family="sans-serif" font-size="42" fill="#1E2A78">68 ÷ 6 = 10</text><text x="345" y="245" text-anchor="end" font-family="sans-serif" font-size="36" fill="#B5412A">residuo</text><text x="395" y="245" text-anchor="middle" font-family="sans-serif" font-size="36" fill="#B5412A">8</text>
<circle cx="395" cy="232" r="34" fill="none" stroke="#B5412A" stroke-width="6"/><path d="M373 210l44 44M417 210l-44 44" stroke="#B5412A" stroke-width="6"/>
<text x="320" y="380" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#0C706E">Ocho no puede sobrar al repartir entre seis</text>
<text x="320" y="430" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#1E2A78">El residuo debe ser menor que el divisor</text>
</svg>

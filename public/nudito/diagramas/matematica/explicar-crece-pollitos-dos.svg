<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Secuencia numérica que aumenta de dos en dos</title>
  <rect width="640" height="480" fill="#FCF0D6"/>
  <text x="320" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1E2A78">Patitas de pollitos</text>
  <g stroke="#0C706E" stroke-width="5" fill="none">
    <path d="M95 235 Q150 125 205 235"/><path d="M235 235 Q290 125 345 235"/><path d="M375 235 Q430 125 485 235"/>
  </g>
  <g fill="#F2B84B" stroke="#1E2A78" stroke-width="3"><circle cx="80" cy="250" r="38"/><circle cx="220" cy="250" r="38"/><circle cx="360" cy="250" r="38"/><circle cx="500" cy="250" r="38"/></g>
  <g font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">
    <text x="80" y="262">2</text><text x="220" y="262">4</text><text x="360" y="262">6</text><text x="500" y="262">8</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="28" fill="#0C706E" text-anchor="middle"><text x="150" y="165">+2</text><text x="290" y="165">+2</text><text x="430" y="165">+2</text></g>
  <text x="320" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#1E2A78">Todos los saltos aumentan lo mismo.</text>
</svg>

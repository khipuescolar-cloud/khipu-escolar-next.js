<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Patrón numérico seis, diez, catorce y dieciocho, con flechas que muestran aumentos de cuatro.">
  <title>Patrón que aumenta de cuatro en cuatro</title>
  <rect width="640" height="480" rx="32" fill="#FCF0D6"/>
  <text x="320" y="60" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78">La misma regla en cada salto</text>
  <g font-family="sans-serif" font-size="38" font-weight="700" text-anchor="middle" fill="#1E2A78">
    <rect x="55" y="190" width="105" height="90" rx="18" fill="#FFFFFF" stroke="#1E2A78" stroke-width="5"/><text x="108" y="247">6</text>
    <rect x="195" y="190" width="105" height="90" rx="18" fill="#FFFFFF" stroke="#1E2A78" stroke-width="5"/><text x="248" y="247">10</text>
    <rect x="335" y="190" width="105" height="90" rx="18" fill="#FFFFFF" stroke="#1E2A78" stroke-width="5"/><text x="388" y="247">14</text>
    <rect x="475" y="190" width="105" height="90" rx="18" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="7"/><text x="528" y="247">18</text>
  </g>
  <g font-family="sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#0C706E">
    <text x="178" y="160">+4</text><text x="318" y="160">+4</text><text x="458" y="160">+4</text>
  </g>
  <path d="M155 175 H192 M295 175 H332 M435 175 H472" stroke="#0F7C7A" stroke-width="6"/>
  <text x="320" y="385" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#0C706E">Después de catorce viene dieciocho</text>
</svg>

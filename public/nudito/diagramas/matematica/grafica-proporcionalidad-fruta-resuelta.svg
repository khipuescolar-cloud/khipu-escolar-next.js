<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Puntos de kilos y soles alineados desde el origen</title>
  <rect width="640" height="480" rx="28" fill="#FCF0D6"/>
  <text x="320" y="52" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78">Tres soles por kilo</text>
  <g stroke="#D6C7A7" stroke-width="2"><line x1="170" y1="100" x2="170" y2="390"/><line x1="270" y1="100" x2="270" y2="390"/><line x1="370" y1="100" x2="370" y2="390"/><line x1="470" y1="100" x2="470" y2="390"/><line x1="570" y1="100" x2="570" y2="390"/><line x1="70" y1="310" x2="590" y2="310"/><line x1="70" y1="230" x2="590" y2="230"/><line x1="70" y1="150" x2="590" y2="150"/></g>
  <g stroke="#1E2A78" stroke-width="6" fill="none"><path d="M70 390 V80"/><path d="M70 390 H600"/></g>
  <line x1="70" y1="390" x2="470" y2="70" stroke="#0F7C7A" stroke-width="8"/>
  <g fill="#F2B84B" stroke="#1E2A78" stroke-width="4"><circle cx="70" cy="390" r="11"/><circle cx="170" cy="310" r="11"/><circle cx="270" cy="230" r="11"/><circle cx="370" cy="150" r="11"/></g>
  <g font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78"><text x="85" y="458">origen</text><text x="150" y="350">(1, 3)</text><text x="250" y="270">(2, 6)</text><text x="400" y="195">(3, 9)</text></g>
  <g font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle"><text x="170" y="425">1</text><text x="270" y="425">2</text><text x="370" y="425">3</text><text x="470" y="425">4</text><text x="570" y="425">5</text><text x="46" y="319">3</text><text x="46" y="239">6</text><text x="46" y="159">9</text><text x="560" y="458">Kilos</text><text x="130" y="92">Soles</text></g>
</svg>

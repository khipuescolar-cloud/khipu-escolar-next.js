<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Cuatro filas, cada una con una figura y su nombre: tres lados, triángulo; cuatro lados, cuadrilátero; cinco lados, pentágono; seis lados, hexágono"><title>Cuatro filas, cada una con una figura y su nombre: tres lados, triángulo; cuatro lados, cuadrilátero; cinco lados, pentágono; seis lados, hexágono</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Nombres según los lados</text><polygon points="106,88 142,150 70,150" fill="#BFE3E1" stroke="#1E2A78" stroke-width="3" stroke-linejoin="round" /><text x="190" y="130" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">3 lados: triángulo</text><polygon points="66,187 146,187 146,243 66,243" fill="#FBE3AE" stroke="#1E2A78" stroke-width="3" stroke-linejoin="round" /><text x="190" y="225" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">4 lados: cuadrilátero</text><polygon points="106.0,274.0 140.2,298.9 127.2,339.1 84.8,339.1 71.8,298.9" fill="#E4D6F0" stroke="#1E2A78" stroke-width="3" stroke-linejoin="round" /><text x="190" y="320" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">5 lados: pentágono</text><polygon points="142.0,405.0 124.0,436.2 88.0,436.2 70.0,405.0 88.0,373.8 124.0,373.8" fill="#F7C9B6" stroke="#1E2A78" stroke-width="3" stroke-linejoin="round" /><text x="190" y="415" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">6 lados: hexágono</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title">
<title>Comparación de veinticuatro y treinta y uno</title>
<rect width="640" height="480" fill="#FCF0D6"/>

<text x="320" y="52" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78">24 es menor que 31</text>
<rect x="55" y="92" width="240" height="280" rx="22" fill="#fff"/><rect x="345" y="92" width="240" height="280" rx="22" fill="#fff"/>
<text x="175" y="135" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#1E2A78">24</text><text x="465" y="135" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#1E2A78">31</text>
<g fill="#F2B84B" stroke="#8A5A00" stroke-width="3"><rect x="118" y="170" width="52" height="150" rx="8"/><rect x="180" y="170" width="52" height="150" rx="8"/><rect x="377" y="170" width="52" height="150" rx="8"/><rect x="439" y="170" width="52" height="150" rx="8"/><rect x="501" y="170" width="52" height="150" rx="8"/></g>
<g fill="#0F7C7A"><circle cx="115" cy="345" r="15"/><circle cx="155" cy="345" r="15"/><circle cx="195" cy="345" r="15"/><circle cx="235" cy="345" r="15"/><circle cx="465" cy="345" r="16"/></g>
<text x="320" y="430" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#0C706E">Dos decenas son menos que tres</text>
</svg>

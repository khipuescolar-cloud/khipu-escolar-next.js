<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img"><title>Una comprobación mal hecha y otra bien hecha de la misma resta</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="60" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Dos comprobaciones</text><text x="320" y="118" font-family="Arial, Liberation Sans, sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">6&#160;000 − 2&#160;350 = 3&#160;650</text><circle cx="60" cy="205" r="24" fill="#FFFFFF" stroke="#B5412A" stroke-width="4"/><line x1="51" y1="196" x2="69" y2="214" stroke="#B5412A" stroke-width="6" stroke-linecap="round" /><line x1="69" y1="196" x2="51" y2="214" stroke="#B5412A" stroke-width="6" stroke-linecap="round" /><text x="340" y="215" font-family="Arial, Liberation Sans, sans-serif" font-size="34" font-weight="700" fill="#B5412A" text-anchor="middle">3&#160;650 + 6&#160;000 = 9&#160;650</text><text x="340" y="258" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#B5412A" text-anchor="middle">No vuelve a seis mil</text><circle cx="60" cy="335" r="24" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="4"/><path d="M49,335 L57,344 L72,326" fill="none" stroke="#0F7C7A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><text x="340" y="345" font-family="Arial, Liberation Sans, sans-serif" font-size="34" font-weight="700" fill="#0C706E" text-anchor="middle">3&#160;650 + 2&#160;350 = 6&#160;000</text><text x="340" y="388" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="middle">Sí vuelve a seis mil</text></svg>
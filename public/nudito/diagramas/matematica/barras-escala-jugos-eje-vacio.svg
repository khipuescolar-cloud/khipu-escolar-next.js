<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tabla de jugos con papaya cuarenta, naranja veinticinco y piña treinta y cinco, y un eje vertical sin números"><title>Tabla de jugos con papaya cuarenta, naranja veinticinco y piña treinta y cinco, y un eje vertical sin números</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Ventas de jugos</text><rect x="55" y="80" width="170" height="50" rx="8" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="140" y="114" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">papaya: 40</text><rect x="235" y="80" width="170" height="50" rx="8" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="320" y="114" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">naranja: 25</text><rect x="415" y="80" width="170" height="50" rx="8" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="500" y="114" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">piña: 35</text><text x="320" y="172" font-family="sans-serif" font-size="28" font-weight="700" fill="#0F7C7A" text-anchor="middle">¿De cuánto en cuánto va el eje?</text><line x1="110" y1="420" x2="570" y2="420" stroke="#1E2A78" stroke-width="4" stroke-linecap="round"/><line x1="110" y1="420" x2="110" y2="200" stroke="#1E2A78" stroke-width="4" stroke-linecap="round"/><polygon points="110,184 100,204 120,204" fill="#1E2A78" stroke="#1E2A78" stroke-width="1" stroke-linejoin="round"/><text x="96" y="429" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="end">0</text><text x="220" y="456" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">papaya</text><text x="360" y="456" font-family="sans-serif" font-size="26" font
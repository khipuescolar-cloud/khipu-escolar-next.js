<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dos números en columnas, uno coma sesenta y uno coma cuarenta y cinco, con la columna de los décimos resaltada; abajo, los litros son iguales y seis décimos es mayor que cuatro décimos"><title>Dos números en columnas, uno coma sesenta y uno coma cuarenta y cinco, con la columna de los décimos resaltada; abajo, los litros son iguales y seis décimos es mayor que cuatro décimos</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Comparar columna por columna</text><text x="180" y="112" font-family="sans-serif" font-size="26" font-weight="700" fill="#0C706E" text-anchor="middle">litros</text><text x="335" y="112" font-family="sans-serif" font-size="26" font-weight="700" fill="#0C706E" text-anchor="middle">décimos</text><text x="500" y="112" font-family="sans-serif" font-size="26" font-weight="700" fill="#0C706E" text-anchor="middle">centésimos</text><rect x="283" y="128" width="104" height="196" rx="12" fill="#FBE3AE" stroke="#F2B84B" stroke-width="3"/><line x1="276.0" y1="128.0" x2="276.0" y2="324.0" stroke="#F2B84B" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 10"/><text x="180" y="200" font-family="sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">1</text><text x="255" y="200" font-family="sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">,</text><text x="335" y="200" font-family="sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">6</text><text x="500" y="200" font-family="sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">0</text><text x="180" y="290" font-family="sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">1</text><text x="255" y="290" font-family="sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">,</text><text x="335" y="290" font-family="sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">4</text><text x="500" y="290" font-family="sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">5</text><text x="580" y="200" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle"></text><text x="320" y="382" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Los litros son iguales</text><text x="320" y="430" font-family="sans-serif" font-size="30" font-weight="700" fill="#8A5A00" text-anchor="middle">6 décimos &gt; 4 décimos</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Ciento treinta y ocho estudiantes y combis con treinta y dos asientos cada una; se pregunta cuántas se necesitan.">
  <title>¿Cuántas combis se necesitan?</title>
  <rect width="640" height="480" rx="32" fill="#FCF0D6"/>
  <text x="320" y="58" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="700" fill="#1E2A78">138 estudiantes</text>
  <g fill="#0F7C7A" stroke="#1E2A78" stroke-width="5">
    <rect x="92" y="160" width="185" height="120" rx="24"/><rect x="363" y="160" width="185" height="120" rx="24"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="115" y="185" width="58" height="42" rx="7"/><rect x="185" y="185" width="58" height="42" rx="7"/>
    <rect x="386" y="185" width="58" height="42" rx="7"/><rect x="456" y="185" width="58" height="42" rx="7"/>
  </g>
  <g fill="#1E2A78"><circle cx="145" cy="292" r="20"/><circle cx="230" cy="292" r="20"/><circle cx="416" cy="292" r="20"/><circle cx="501" cy="292" r="20"/></g>
  <text x="320" y="355" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#0C706E">32 asientos en cada combi</text>
  <rect x="245" y="390" width="150" height="62" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="5" stroke-dasharray="11 9"/>
  <text x="320" y="434" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="700" fill="#1E2A78">?</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dos formas de agrupar cuatro por cinco por tres: con paréntesis en los dos primeros o en los dos últimos, con el resultado por hallar"><title>Dos formas de agrupar cuatro por cinco por tres: con paréntesis en los dos primeros o en los dos últimos, con el resultado por hallar</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Dos formas de agrupar</text><text x="320" y="160" font-family="sans-serif" font-size="42" font-weight="700" fill="#1E2A78" text-anchor="middle"><tspan fill="#0F7C7A">(4 × 5)</tspan> × 3 = ?</text><text x="320" y="200" font-family="sans-serif" font-size="26" font-weight="400" fill="#0F7C7A" text-anchor="middle">agrupo los dos primeros</text><text x="320" y="285" font-family="sans-serif" font-size="42" font-weight="700" fill="#1E2A78" text-anchor="middle">4 × <tspan fill="#0F7C7A">(5 × 3)</tspan> = ?</text><text x="320" y="325" font-family="sans-serif" font-size="26" font-weight="400" fill="#0F7C7A" text-anchor="middle">agrupo los dos últimos</text><text x="320" y="405" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">¿Cuánto da en cada caso?</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="La igualdad con el dieciocho tachado a los dos lados, que deja once igual a seis más cinco, y el cuadrado vale cinco"><title>La igualdad con el dieciocho tachado a los dos lados, que deja once igual a seis más cinco, y el cuadrado vale cinco</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle" >Quitamos el 18 de cada lado</text><rect x="30" y="120" width="210" height="90" rx="14" fill="#FFF9ED" stroke="#1E2A78" stroke-width="3" /><rect x="280" y="120" width="330" height="90" rx="14" fill="#FFF9ED" stroke="#1E2A78" stroke-width="3" /><text x="135" y="180" font-family="sans-serif" font-size="40" font-weight="700" fill="#1E2A78" text-anchor="middle" >18 + 11</text><text x="260" y="180" font-family="sans-serif" font-size="44" font-weight="700" fill="#0F7C7A" text-anchor="middle" >=</text><text x="380" y="180" font-family="sans-serif" font-size="40" font-weight="700" fill="#1E2A78" text-anchor="middle" >18 + 6 +</text><rect x="470" y="140" width="48" height="48" rx="4" fill="none" stroke="#1E2A78" stroke-width="3" stroke-dasharray="7 6"/><line x1="66" y1="166" x2="116" y2="166" stroke="#A8325E" stroke-width="6" stroke-linecap="round" /><line x1="304" y1="166" x2="354" y2="166" stroke="#A8325E" stroke-width="6" stroke-linecap="round" /><path d="M320 225 L320 285 M300 265 L320 290 L340 265" fill="none" stroke="#1E2A78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="350" font-family="sans-serif" font-size="46" font-weight="700" fill="#0F7C7A" text-anchor="middle" >11 = 6 + 5</text><text x="320" y="420" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle" >El cuadrado vale 5</text></svg>
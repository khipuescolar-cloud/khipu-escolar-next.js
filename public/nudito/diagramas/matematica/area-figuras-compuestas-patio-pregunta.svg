<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Un patio rectangular de ocho metros por cinco con una esquina triangular rayada, de dos metros de base y tres de altura, que no se pavimenta"><title>Un patio rectangular de ocho metros por cinco con una esquina triangular rayada, de dos metros de base y tres de altura, que no se pavimenta</title><defs><pattern id="ray" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#FCF0D6"/><line x1="0" y1="0" x2="0" y2="14" stroke="#F2B84B" stroke-width="6"/></pattern></defs><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Un patio</text><rect x="150" y="110" width="352" height="220" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4" /><polygon points="414,110 502,110 502,242" fill="url(#ray)" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round" stroke-dasharray="9 6"/><text x="326.0" y="370" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">8 m</text><text x="136" y="229.0" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="end">5 m</text><text x="458" y="96" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">2 m</text><text x="516" y="188" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="start">3 m</text><rect x="150" y="408" width="28" height="28" rx="0" fill="url(#ray)" stroke="#1E2A78" stroke-width="3" stroke-dasharray="6 4"/><text x="192" y="432" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="start">esquina sin pavimentar</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="titulo">
  <title id="titulo">Regleta de doce centímetros dividida en cuatro tramos con dos marcados</title>
  <rect width="640" height="480" fill="#FCF0D6"/>
  <text x="320" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#1E2A78">Una regleta de 12 cm</text>
  <line x1="92" y1="130" x2="548" y2="130" stroke="#1E2A78" stroke-width="4"/>
  <line x1="92" y1="116" x2="92" y2="144" stroke="#1E2A78" stroke-width="4"/>
  <line x1="548" y1="116" x2="548" y2="144" stroke="#1E2A78" stroke-width="4"/>
  <text x="320" y="116" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1E2A78">longitud total</text>
  <g stroke="#1E2A78" stroke-width="4">
    <rect x="92" y="190" width="114" height="106" rx="4" fill="#F2B84B"/>
    <rect x="206" y="190" width="114" height="106" fill="#F2B84B"/>
    <rect x="320" y="190" width="114" height="106" fill="#FFFFFF"/>
    <rect x="434" y="190" width="114" height="106" rx="4" fill="#FFFFFF"/>
  </g>
  <text x="149" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#8A5A00">3 cm</text>
  <text x="263" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#8A5A00">3 cm</text>
  <text x="377" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1E2A78">3 cm</text>
  <text x="491" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" fill="#1E2A78">3 cm</text>
  <rect x="196" y="382" width="248" height="62" rx="22" fill="#FFFFFF" stroke="#0C706E" stroke-width="4"/>
  <text x="320" y="423" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#0C706E">¿Qué fracción se marcó?</text>
</svg>

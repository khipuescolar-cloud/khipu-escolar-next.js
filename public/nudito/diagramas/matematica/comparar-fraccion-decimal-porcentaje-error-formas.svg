<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Dos barras, una llena al cincuenta por ciento y otra al veinticinco por ciento</title><rect width="640" height="480" rx="28" fill="#FCF0D6"/><text x="320" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1E2A78">Más cifras no es más</text><text x="320" y="108" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#B5412A">Error: veinticinco es más que cinco</text><text x="80" y="165" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1E2A78">0,5</text><rect x="80" y="179" width="480" height="44" fill="#fff" stroke="#1E2A78" stroke-width="4"/><rect x="80" y="179" width="240" height="44" fill="#F2B84B" stroke="#1E2A78" stroke-width="4"/><text x="334.0" y="213" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0C706E">50 %</text><text x="80" y="280" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#1E2A78">0,25</text><rect x="80" y="294" width="480" height="44" fill="#fff" stroke="#1E2A78" stroke-width="4"/><rect x="80" y="294" width="120" height="44" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4"/><text x="214.0" y="328" text-anchor="start" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0C706E">25 %</text><text x="320" y="435" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0C706E">Mayor: 0,5, que es 50 %</text></svg>

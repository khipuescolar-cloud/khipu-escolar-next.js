<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Cuatro círculos con dos, seis, dieciocho y cincuenta y cuatro cuyes; entre cada par hay un arco que dice por tres"><title>Cuatro círculos con dos, seis, dieciocho y cincuenta y cuatro cuyes; entre cada par hay un arco que dice por tres</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="56" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Patrón multiplicativo</text><circle cx="90" cy="230" r="44" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4"/><text x="90" y="244" font-family="sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="90" y="320" font-family="sans-serif" font-size="26" font-weight="700" fill="#0F7C7A" text-anchor="middle">Mes 1</text><path d="M90 180 Q166.5 110 243 180" fill="none" stroke="#1E2A78" stroke-width="4"/><text x="166" y="100" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">× 3</text><circle cx="243" cy="230" r="44" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4"/><text x="243" y="244" font-family="sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text><text x="243" y="320" font-family="sans-serif" font-size="26" font-weight="700" fill="#0F7C7A" text-anchor="middle">Mes 2</text><path d="M243 180 Q319.5 110 396 180" fill="none" stroke="#1E2A78" stroke-width="4"/><text x="319" y="100" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">× 3</text><circle cx="396" cy="230" r="44" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4"/><text x="396" y="244" font-family="sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle">18</text><text x="396" y="320" font-family="sans-serif" font-size="26" font-weight="700" fill="#0F7C7A" text-anchor="middle">Mes 3</text><path d="M396 180 Q472.5 110 549 180" fill="none" stroke="#1E2A78" stroke-width="4"/><text x="472" y="100" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">× 3</text><circle cx="549" cy="230" r="44" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4"/><text x="549" y="244" font-family="sans-serif" font-size="40" font-weight="700" fill="#FFFFFF" text-anchor="middle">54</text><text x="549" y="320" font-family="sans-serif" font-size="26" font-weight="700" fill="#0F7C7A" text-anchor="middle">Mes 4</text><text x="320" y="400" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">2 × 3 = 6, 6 × 3 = 18, 18 × 3 = 54</text></svg>

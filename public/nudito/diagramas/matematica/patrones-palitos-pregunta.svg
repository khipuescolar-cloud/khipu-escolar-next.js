<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres figuras de cuadrados de palitos en fila, con cuatro, siete y diez palitos, y la pregunta por n cuadrados"><title>Tres figuras de cuadrados de palitos en fila, con cuatro, siete y diez palitos, y la pregunta por n cuadrados</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="56" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Cuadrados de palitos</text><rect x="60" y="130" width="56" height="56" fill="#FBE3AE" stroke="#1E2A78" stroke-width="7" stroke-linejoin="round"/><text x="88.0" y="244" font-family="sans-serif" font-size="28" font-weight="700" fill="#5B6170" text-anchor="middle">n = 1</text><text x="88.0" y="290" font-family="sans-serif" font-size="30" font-weight="700" fill="#0F7C7A" text-anchor="middle">4 palitos</text><rect x="200" y="130" width="56" height="56" fill="#FBE3AE" stroke="#1E2A78" stroke-width="7" stroke-linejoin="round"/><rect x="256" y="130" width="56" height="56" fill="#FBE3AE" stroke="#1E2A78" stroke-width="7" stroke-linejoin="round"/><text x="256.0" y="244" font-family="sans-serif" font-size="28" font-weight="700" fill="#5B6170" text-anchor="middle">n = 2</text><text x="256.0" y="290" font-family="sans-serif" font-size="30" font-weight="700" fill="#0F7C7A" text-anchor="middle">7 palitos</text><rect x="360" y="130" width="56" height="56" fill="#FBE3AE" stroke="#1E2A78" stroke-width="7" stroke-linejoin="round"/><rect x="416" y="130" width="56" height="56" fill="#FBE3AE" stroke="#1E2A78" stroke-width="7" stroke-linejoin="round"/><rect x="472" y="130" width="56" height="56" fill="#FBE3AE" stroke="#1E2A78" stroke-width="7" stroke-linejoin="round"/><text x="444.0" y="244" font-family="sans-serif" font-size="28" font-weight="700" fill="#5B6170" text-anchor="middle">n = 3</text><text x="444.0" y="290" font-family="sans-serif" font-size="30" font-weight="700" fill="#0F7C7A" text-anchor="middle">10 palitos</text><text x="320" y="380" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Cada cuadrado nuevo agrega 3 palitos</text><text x="320" y="435" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">¿Cuántos palitos con n cuadrados?</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres pasos para el área del paralelogramo: ubicar la altura, multiplicar base por altura y escribir la unidad cuadrada"><title>Tres pasos para el área del paralelogramo: ubicar la altura, multiplicar base por altura y escribir la unidad cuadrada</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Tres pasos para el área</text><rect x="30" y="80" width="580" height="112" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><circle cx="82" cy="136" r="28" fill="#1E2A78" stroke="#1E2A78" stroke-width="2"/><text x="82" y="146" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="130" y="124" font-family="sans-serif" font-size="26" font-weight="700" fill="#5B6170" text-anchor="start">Ubica la altura</text><text x="130" y="168" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="start">6 m, no el lado de 10 m</text><rect x="30" y="205" width="580" height="112" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><circle cx="82" cy="261" r="28" fill="#1E2A78" stroke="#1E2A78" stroke-width="2"/><text x="82" y="271" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="130" y="249" font-family="sans-serif" font-size="26" font-weight="700" fill="#5B6170" text-anchor="start">Multiplica</text><text x="130" y="293" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="start">14 × 6 = 84</text><rect x="30" y="330" width="580" height="112" rx="16" fill="#BFE3E1" stroke="#1E2A78" stroke-width="4"/><circle cx="82" cy="386" r="28" fill="#1E2A78" stroke="#1E2A78" stroke-width="2"/><text x="82" y="396" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="130" y="374" font-family="sans-serif" font-size="26" font-weight="700" fill="#5B6170" text-anchor="start">Escribe la unidad</text><text x="130" y="418" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="start">84 m²</text></svg>
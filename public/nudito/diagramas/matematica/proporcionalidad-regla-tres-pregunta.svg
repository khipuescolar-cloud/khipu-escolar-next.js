<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres horas con noventa kilómetros y cinco horas con x kilómetros por hallar"><title>Tres horas con noventa kilómetros y cinco horas con x kilómetros por hallar</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="56" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Regla de tres: mototaxi</text><text x="180" y="102" font-family="sans-serif" font-size="28" font-weight="700" fill="#5B6170" text-anchor="middle">horas</text><text x="460" y="102" font-family="sans-serif" font-size="28" font-weight="700" fill="#5B6170" text-anchor="middle">kilómetros</text><rect x="80" y="120" width="200" height="70" rx="12" fill="#FBE3AE" stroke="#1E2A78" stroke-width="4"/><text x="180" y="169" font-family="sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">3 h</text><rect x="360" y="120" width="200" height="70" rx="12" fill="#BFE3E1" stroke="#1E2A78" stroke-width="4"/><text x="460" y="169" font-family="sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">90 km</text><rect x="80" y="250" width="200" height="70" rx="12" fill="#FBE3AE" stroke="#1E2A78" stroke-width="4"/><text x="180" y="299" font-family="sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">5 h</text><rect x="360" y="250" width="200" height="70" rx="12" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="460" y="299" font-family="sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">x km</text><text x="320" y="410" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">¿Cuántos km en 5 h?</text></svg>
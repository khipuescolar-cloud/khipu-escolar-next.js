<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Dos grupos diferentes con cinco fichas cada uno</title>
  <desc id="descripcion">A la izquierda hay dos fichas turquesas y tres amarillas. A la derecha hay cuatro fichas rosadas y una azul. Entre ambos grupos aparece el signo igual.</desc>
  <rect width="600" height="450" rx="28" fill="#f8fafc"/>
  <rect x="35" y="58" width="220" height="334" rx="24" fill="#ffffff" stroke="#d6d3cd" stroke-width="4"/>
  <rect x="345" y="58" width="220" height="334" rx="24" fill="#ffffff" stroke="#d6d3cd" stroke-width="4"/>
  <g stroke-width="4">
    <g fill="#0f7c7a" stroke="#075b59">
      <circle cx="105" cy="155" r="42"/>
      <circle cx="185" cy="155" r="42"/>
    </g>
    <g fill="#f2b84b" stroke="#9a5b00">
      <circle cx="105" cy="245" r="42"/>
      <circle cx="185" cy="245" r="42"/>
      <circle cx="145" cy="335" r="42"/>
    </g>
    <g fill="#a8325e" stroke="#76203e">
      <circle cx="415" cy="155" r="42"/>
      <circle cx="495" cy="155" r="42"/>
      <circle cx="415" cy="245" r="42"/>
      <circle cx="495" cy="245" r="42"/>
    </g>
    <circle cx="455" cy="335" r="42" fill="#3a4bb5" stroke="#1e2a78"/>
  </g>
  <g fill="#1e2a78">
    <rect x="278" y="202" width="44" height="12" rx="6"/>
    <rect x="278" y="236" width="44" height="12" rx="6"/>
  </g>
</svg>

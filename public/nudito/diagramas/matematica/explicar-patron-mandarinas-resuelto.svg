<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Patrón que suma cuatro y llega a veinte</title>
  <rect width="640" height="480" rx="28" fill="#FCF0D6"/>
  <text x="320" y="58" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78">El mismo salto</text>
  <g fill="#FFFFFF" stroke="#1E2A78" stroke-width="5">
    <rect x="42" y="170" width="92" height="78" rx="16"/><rect x="160" y="170" width="92" height="78" rx="16"/><rect x="278" y="170" width="92" height="78" rx="16"/><rect x="396" y="170" width="92" height="78" rx="16"/><rect x="514" y="170" width="92" height="78" rx="16"/>
  </g>
  <g font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">
    <text x="88" y="220">4</text><text x="206" y="220">8</text><text x="324" y="220">12</text><text x="442" y="220">16</text><text x="560" y="220">20</text>
  </g>
  <g font-family="sans-serif" font-size="27" font-weight="700" fill="#0C706E" text-anchor="middle">
    <text x="147" y="140">+4</text><text x="265" y="140">+4</text><text x="383" y="140">+4</text><text x="501" y="140">+4</text>
  </g>
  <text x="320" y="350" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#0C706E">Se suma cuatro cada vez</text>
</svg>

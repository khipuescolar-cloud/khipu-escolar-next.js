<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dos tiras iguales: un medio y dos cuartos coloreados hasta la misma mitad"><title>Dos tiras iguales: un medio y dos cuartos coloreados hasta la misma mitad</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="56" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">Misma unidad, mismo largo</text><rect x="120.0" y="120" width="240.0" height="66" rx="0" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><rect x="360.0" y="120" width="240.0" height="66" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="60" y="166" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">1/2</text><rect x="120.0" y="230" width="120.0" height="66" rx="0" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><rect x="240.0" y="230" width="120.0" height="66" rx="0" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><rect x="360.0" y="230" width="120.0" height="66" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><rect x="480.0" y="230" width="120.0" height="66" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="60" y="276" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">2/4</text><line x1="360.0" y1="100" x2="360.0" y2="340" stroke="#1E2A78" stroke-width="4" stroke-dasharray="10 8"/><text x="320" y="420" font-family="sans-serif" font-size="44" font-weight="700" fill="#0F7C7A" text-anchor="middle">1/2 = 2/4</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dos cuadros: en decenas tres barras largas y en unidades seis cubitos; tres decenas son 30 y seis unidades son 6"><title>Dos cuadros: en decenas tres barras largas y en unidades seis cubitos; tres decenas son 30 y seis unidades son 6</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="56" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">El número 36</text><rect x="50" y="95" width="260" height="240" rx="16" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="4"/><rect x="330" y="95" width="260" height="240" rx="16" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="4"/><text x="180" y="135" font-family="sans-serif" font-size="28" font-weight="700" fill="#0F7C7A" text-anchor="middle">Decenas</text><text x="460" y="135" font-family="sans-serif" font-size="28" font-weight="700" fill="#0F7C7A" text-anchor="middle">Unidades</text><rect x="95" y="160" width="40" height="150" rx="5" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><rect x="155" y="160" width="40" height="150" rx="5" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><rect x="215" y="160" width="40" height="150" rx="5" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><rect x="355" y="175" width="46" height="46" rx="5" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><rect x="425" y="175" width="46" height="46" rx="5" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><rect x="495" y="175" width="46" height="46" rx="5" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><rect x="355" y="245" width="46" height="46" rx="5" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><rect x="425" y="245" width="46" height="46" rx="5" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><rect x="495" y="245" width="46" height="46" rx="5" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="180" y="380" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">3 decenas = 30</text><text x="460" y="380" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">6 unidades = 6</text><text x="320" y="440" font-family="sans-serif" font-size="38" font-weight="700" fill="#0F7C7A" text-anchor="middle">30 + 6 = 36</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Un resultado no basta para decir siempre</title>
  <rect width="640" height="480" rx="28" fill="#FCF0D6"/>
  <text x="320" y="58" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78">Revisa todos los casos</text>
  <rect x="55" y="120" width="230" height="235" rx="24" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="6"/>
  <circle cx="170" cy="210" r="48" fill="#F2B84B" stroke="#8A5A00" stroke-width="5"/>
  <text x="170" y="315" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#0C706E">Salió SOL</text>
  <path d="M335 135 L550 350 M550 135 L335 350" stroke="#B5412A" stroke-width="16" stroke-linecap="round"/>
  <text x="440" y="405" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#B5412A">No dice «siempre»</text>
</svg>

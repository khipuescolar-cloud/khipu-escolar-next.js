<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Se prueban once y doce en seis por equis igual a setenta y dos</title><rect width="640" height="480" rx="28" fill="#FCF0D6"/><text x="320" y="56" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1E2A78">Dos valores probados</text><rect x="80" y="88" width="480" height="76" rx="16" fill="#fff" stroke="#1E2A78" stroke-width="4"/><text x="320" y="141.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#1E2A78">6 × x = 72</text><rect x="80" y="190" width="480" height="76" rx="16" fill="#fff" stroke="#B5412A" stroke-width="5"/><text x="300" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#B5412A">6 × 11 = 66</text><circle cx="520" cy="228" r="24" fill="#B5412A"/><path d="M510 218 L530 238 M530 218 L510 238" stroke="#fff" stroke-width="6" stroke-linecap="round"/><text x="320" y="305" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#B5412A">66 no es 72</text><rect x="80" y="335" width="480" height="76" rx="16" fill="#fff" stroke="#0F7C7A" stroke-width="5"/><text x="300" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#0C706E">6 × 12 = 72</text><circle cx="520" cy="373" r="24" fill="#0F7C7A"/><polyline points="509,374 517,383 532,363" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="320" y="450" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0C706E">Con doce sí coincide</text></svg>

-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">10</text><circle cx="440" cy="190" r="27" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="440" y="200" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">1</text><circle cx="540" cy="190" r="27" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="540" y="200" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">1</text><circle cx="440" cy="254" r="27" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="440" y="264" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">1</text><circle cx="540" cy="254" r="27" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="540" y="264" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">1</text><text x="200" y="335" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">5 decenas = 50</text><text x="490" y="335" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">4 unidades = 4</text><text x="320" y="420" font-family="sans-serif" font-size="38" font-weight="700" fill="#0F7C7A" text-anchor="middle">50 + 4 = 54 soles</text></svg>

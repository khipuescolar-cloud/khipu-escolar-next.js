<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title">
<title>Dos patrones que suman cuatro</title>
<rect width="640" height="480" fill="#FCF0D6"/>

<text x="320" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78">La misma regla, distintos inicios</text>
<rect x="45" y="90" width="550" height="120" rx="20" fill="#fff"/><rect x="45" y="245" width="550" height="120" rx="20" fill="#fff"/>
<text x="75" y="160" font-family="sans-serif" font-size="28" fill="#1E2A78">Luna</text><text x="200" y="160" font-family="sans-serif" font-size="34" fill="#0C706E">5 → 9 → 13</text><text x="500" y="160" font-family="sans-serif" font-size="28" fill="#8A5A00">+4</text>
<text x="75" y="315" font-family="sans-serif" font-size="28" fill="#1E2A78">Bosque</text><text x="200" y="315" font-family="sans-serif" font-size="34" fill="#0C706E">40 → 44 → 48</text><text x="500" y="315" font-family="sans-serif" font-size="28" fill="#8A5A00">+4</text>
<text x="320" y="430" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#1E2A78">Ambos suman cuatro</text>
</svg>

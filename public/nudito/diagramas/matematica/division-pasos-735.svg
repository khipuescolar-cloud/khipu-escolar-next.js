<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres pasos de la división de 735 entre 5: una centena y sobran dos, cuatro decenas y sobran tres, siete unidades"><title>Tres pasos de la división de 735 entre 5: una centena y sobran dos, cuatro decenas y sobran tres, siete unidades</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="56" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">735 ÷ 5 = 147</text><rect x="40" y="100" width="560" height="80" rx="16" fill="#E2F3F1" stroke="#0F7C7A" stroke-width="4"/><circle cx="90" cy="140" r="24" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="90" y="150" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">1</text><text x="130" y="150" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">7 centenas ÷ 5 = 1, sobran 2</text><rect x="40" y="200" width="560" height="80" rx="16" fill="#E2F3F1" stroke="#0F7C7A" stroke-width="4"/><circle cx="90" cy="240" r="24" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="90" y="250" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">2</text><text x="130" y="250" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">23 decenas ÷ 5 = 4, sobran 3</text><rect x="40" y="300" width="560" height="80" rx="16" fill="#E2F3F1" stroke="#0F7C7A" stroke-width="4"/><circle cx="90" cy="340" r="24" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="90" y="350" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">3</text><text x="130" y="350" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">35 unidades ÷ 5 = 7</text><text x="320" y="440" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="middle">El cociente es 1, 4 y 7: 147</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img"><title>Igualdad doce igual a seis más seis repartida entre dos</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#1E2A78">Repartir ambos lados entre dos</text><rect x="75" y="105" width="490" height="100" rx="20" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="320" y="170" text-anchor="middle" font-family="Arial" font-size="42" fill="#1E2A78">12 = 6 + 6</text><text x="320" y="265" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#0C706E">Cada número se divide entre 2</text><rect x="75" y="305" width="490" height="100" rx="20" fill="#F2B84B" stroke="#1E2A78" stroke-width="4"/><text x="320" y="370" text-anchor="middle" font-family="Arial" font-size="44" font-weight="700" fill="#1E2A78">6 = 3 + 3</text><text x="320" y="450" text-anchor="middle" font-family="Arial" font-size="28" fill="#1E2A78">Los dos lados siguen valiendo lo mismo.</text></svg>

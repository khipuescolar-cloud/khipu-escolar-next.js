<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Se repite el cálculo y se sustituye veinticinco en la ecuación, da diez y no cuarenta</title><rect width="640" height="480" rx="28" fill="#FCF0D6"/><text x="320" y="58" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1E2A78">Repetir no es comprobar</text><rect x="80" y="86" width="480" height="76" rx="16" fill="#fff" stroke="#1E2A78" stroke-width="4"/><text x="320" y="139.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#1E2A78">x − 15 = 40</text><rect x="80" y="185" width="480" height="80" rx="16" fill="#fff" stroke="#B5412A" stroke-width="5"/><text x="300" y="236" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#B5412A">40 − 15 = 25</text><circle cx="520" cy="225" r="24" fill="#B5412A"/><path d="M510 215 L530 235 M530 215 L510 235" stroke="#fff" stroke-width="6" stroke-linecap="round"/><text x="320" y="300" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#B5412A">Es el mismo cálculo</text><rect x="80" y="330" width="480" height="80" rx="16" fill="#fff" stroke="#0F7C7A" stroke-width="5"/><text x="300" y="382" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#0C706E">25 − 15 = 10</text><circle cx="520" cy="370" r="24" fill="#B5412A"/><path d="M510 360 L530 380 M530 360 L510 380" stroke="#fff" stroke-width="6" stroke-linecap="round"/><text x="320" y="450" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#0C706E">Da diez, no cuarenta</text></svg>

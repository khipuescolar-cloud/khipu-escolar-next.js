<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
<title>Dos errores frecuentes con fracciones de una tira</title>
<rect width="640" height="480" fill="#FCF0D6"/>
<text x="320" y="70" font-family="Nunito, Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Dos errores frecuentes</text>
<text x="40" y="125" font-family="Nunito, Arial, sans-serif" font-size="28" font-weight="700" fill="#B5412A" text-anchor="start">Partes desiguales</text>
<rect x="40" y="140" width="60" height="56" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" />
<rect x="100" y="140" width="200" height="56" fill="#FFF8E8" stroke="#1E2A78" stroke-width="3" />
<rect x="300" y="140" width="80" height="56" fill="#FFF8E8" stroke="#1E2A78" stroke-width="3" />
<rect x="380" y="140" width="220" height="56" fill="#FFF8E8" stroke="#1E2A78" stroke-width="3" />
<text x="320" y="240" font-family="Nunito, Arial, sans-serif" font-size="28" font-weight="700" fill="#B5412A" text-anchor="middle">no es un cuarto</text>
<text x="40" y="300" font-family="Nunito, Arial, sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Seis partes iguales, dos pintadas</text>
<rect x="50.0" y="315" width="90.0" height="56" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" />
<rect x="140.0" y="315" width="90.0" height="56" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3" />
<rect x="230.0" y="315" width="90.0" height="56" fill="#FFF8E8" stroke="#1E2A78" stroke-width="3" />
<rect x="320.0" y="315" width="90.0" height="56" fill="#FFF8E8" stroke="#1E2A78" stroke-width="3" />
<rect x="410.0" y="315" width="90.0" height="56" fill="#FFF8E8" stroke="#1E2A78" stroke-width="3" />
<rect x="500.0" y="315" width="90.0" height="56" fill="#FFF8E8" stroke="#1E2A78" stroke-width="3" />
<text x="180" y="440" font-family="Nunito, Arial, sans-serif" font-size="32" font-weight="700" fill="#B5412A" text-anchor="middle">mal: 6/2</text>
<text x="450" y="440" font-family="Nunito, Arial, sans-serif" font-size="32" font-weight="700" fill="#0C706E" text-anchor="middle">bien: 2/6</text>

</svg>

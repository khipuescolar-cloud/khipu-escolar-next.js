<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Receta de avena para cuatro y doce porciones sin resolver</title>
  <rect width="640" height="480" rx="32" fill="#FCF0D6"/>
  <text x="320" y="57" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78">Avena para más porciones</text>
  <rect x="58" y="100" width="232" height="270" rx="24" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/>
  <rect x="350" y="100" width="232" height="270" rx="24" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="4"/>
  <text x="174" y="145" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#1E2A78">4 porciones</text>
  <text x="466" y="145" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#0C706E">12 porciones</text>
  <g fill="#F2B84B" stroke="#8A5A00" stroke-width="3">
    <path d="M90 193Q174 256 258 193L244 287Q174 330 104 287Z"/>
    <circle cx="128" cy="180" r="16"/><circle cx="174" cy="170" r="16"/><circle cx="220" cy="180" r="16"/>
  </g>
  <path d="M382 193Q466 256 550 193L536 287Q466 330 396 287Z" fill="#D7F0EE" stroke="#0F7C7A" stroke-width="3"/>
  <text x="174" y="349" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#1E2A78">3 tazas</text>
  <text x="466" y="271" text-anchor="middle" font-family="sans-serif" font-size="54" font-weight="700" fill="#8A5A00">?</text>
  <text x="320" y="425" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78">¿Cuántas tazas hacen falta?</text>
</svg>

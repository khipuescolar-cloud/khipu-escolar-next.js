<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="El mismo gráfico con la barra de mango resaltada en turquesa y las otras en gris, y una frase que dice que el mango fue la fruta más elegida entre los veinticuatro encuestados"><title>El mismo gráfico con la barra de mango resaltada en turquesa y las otras en gris, y una frase que dice que el mango fue la fruta más elegida entre los veinticuatro encuestados</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="44" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Fruta favorita de 24 estudiantes</text><text x="320" y="86" font-family="sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="middle">Entre los 24 encuestados,</text><text x="320" y="120" font-family="sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="middle">el mango fue la fruta más elegida</text><rect x="70" y="230" width="120" height="180" rx="6" fill="#0F7C7A" stroke="#0F7C7A" stroke-width="2"/><text x="130" y="220" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">10</text><text x="130" y="448" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Mango</text><rect x="250" y="266" width="120" height="144" rx="6" fill="#5B6170" stroke="#5B6170" stroke-width="2"/><text x="310" y="256" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">8</text><text x="310" y="448" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Plátano</text><rect x="430" y="302" width="120" height="108" rx="6" fill="#5B6170" stroke="#5B6170" stroke-width="2"/><text x="490" y="292" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">6</text><text x="490" y="448" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Uva</text><path d="M40 410 H600" stroke="#1E2A78" stroke-width="3"/></svg>
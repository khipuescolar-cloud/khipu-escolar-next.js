<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
<title>Dos errores frecuentes al contar figuras que crecen</title>
<rect width="640" height="480" fill="#FCF0D6"/>
<text x="320" y="60" font-family="Nunito, Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Dos errores frecuentes</text>
<circle cx="70" cy="120" r="9" fill="#0F7C7A" stroke="#1E2A78" stroke-width="2.5"/>
<circle cx="94" cy="120" r="9" fill="#0F7C7A" stroke="#1E2A78" stroke-width="2.5"/>
<circle cx="70" cy="148" r="9" fill="#0F7C7A" stroke="#1E2A78" stroke-width="2.5"/>
<circle cx="94" cy="148" r="9" fill="#0F7C7A" stroke="#1E2A78" stroke-width="2.5"/>
<circle cx="118" cy="148" r="9" fill="#0F7C7A" stroke="#1E2A78" stroke-width="2.5"/>
<circle cx="70" cy="176" r="9" fill="#0F7C7A" stroke="#1E2A78" stroke-width="2.5"/>
<circle cx="94" cy="176" r="9" fill="#0F7C7A" stroke="#1E2A78" stroke-width="2.5"/>
<circle cx="118" cy="176" r="9" fill="#0F7C7A" stroke="#1E2A78" stroke-width="2.5"/>
<circle cx="142" cy="176" r="9" fill="#0F7C7A" stroke="#1E2A78" stroke-width="2.5"/>
<rect x="50" y="158" width="160" height="36" fill="none" stroke="#B5412A" stroke-width="4" />
<text x="300" y="150" font-family="Nunito, Arial, sans-serif" font-size="28" font-weight="700" fill="#B5412A" text-anchor="start">mal: contar solo 4</text>
<text x="300" y="205" font-family="Nunito, Arial, sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="start">bien: 2 + 3 + 4 = 9</text>
<rect x="70" y="310" width="80" height="70" fill="#FFF8E8" stroke="#1E2A78" stroke-width="3" />
<text x="110" y="358" font-family="Nunito, Arial, sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">2</text>
<rect x="250" y="310" width="80" height="70" fill="#FFF8E8" stroke="#1E2A78" stroke-width="3" />
<text x="290" y="358" font-family="Nunito, Arial, sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">5</text>
<rect x="430" y="310" width="80" height="70" fill="#FFF8E8" stroke="#1E2A78" stroke-width="3" />
<text x="470" y="358" font-family="Nunito, Arial, sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">9</text>
<line x1="160" y1="345" x2="240" y2="345" stroke="#1E2A78" stroke-width="4" stroke-linecap="round" />
<text x="200" y="330" font-family="Nunito, Arial, sans-serif" font-size="28" font-weight="700" fill="#8A5A00" text-anchor="middle">+3</text>
<line x1="340" y1="345" x2="420" y2="345" stroke="#1E2A78" stroke-width="4" stroke-linecap="round" />
<text x="380" y="330" font-family="Nunito, Arial, sans-serif" font-size="28" font-weight="700" fill="#8A5A00" text-anchor="middle">+4</text>
<text x="320" y="420" font-family="Nunito, Arial, sans-serif" font-size="28" font-weight="700" fill="#B5412A" text-anchor="middle">mal: sumar siempre 3</text>
<text x="320" y="458" font-family="Nunito, Arial, sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="middle">bien: sumar 3 y luego 4</text>
</svg>

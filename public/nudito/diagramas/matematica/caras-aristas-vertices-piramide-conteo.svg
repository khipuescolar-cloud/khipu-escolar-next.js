<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Una pirámide de base cuadrada con un punto en cada vértice; a la derecha, la indicación de contar sus caras, sus aristas y sus vértices"><title>Una pirámide de base cuadrada con un punto en cada vértice; a la derecha, la indicación de contar sus caras, sus aristas y sus vértices</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Una pirámide de base cuadrada</text><polygon points="60,350 220,350 150,130" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" stroke-linejoin="round"/><polygon points="220,350 280,300 150,130" fill="#CFEAE8" stroke="#1E2A78" stroke-width="3" stroke-linejoin="round"/><line x1="120" y1="300" x2="60" y2="350" stroke="#1E2A78" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7"/><line x1="120" y1="300" x2="280" y2="300" stroke="#1E2A78" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7"/><line x1="120" y1="300" x2="150" y2="130" stroke="#1E2A78" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 7"/><circle cx="60" cy="350" r="8" fill="#1E2A78" stroke="#FCF0D6" stroke-width="2"/><circle cx="220" cy="350" r="8" fill="#1E2A78" stroke="#FCF0D6" stroke-width="2"/><circle cx="280" cy="300" r="8" fill="#1E2A78" stroke="#FCF0D6" stroke-width="2"/><circle cx="120" cy="300" r="8" fill="#1E2A78" stroke="#FCF0D6" stroke-width="2"/><circle cx="150" cy="130" r="8" fill="#1E2A78" stroke="#FCF0D6" stroke-width="2"/><text x="330" y="200" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="start">Otro cuerpo:</text><text x="330" y="250" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">cuenta sus caras,</text><text x="330" y="292" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">sus aristas</text><text x="330" y="334" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">y sus vértices</text></svg>
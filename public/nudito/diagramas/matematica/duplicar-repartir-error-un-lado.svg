<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img"><title>Error al duplicar solo un lado de una igualdad</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="60" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#1E2A78">Solo un lado cambió</text><rect x="65" y="115" width="510" height="140" rx="22" fill="#FFFFFF" stroke="#B5412A" stroke-width="5"/><text x="320" y="205" text-anchor="middle" font-family="Arial" font-size="48" font-weight="700" fill="#1E2A78">8 + 12 = 10</text><path d="M290 280 L350 330 M350 280 L290 330" stroke="#B5412A" stroke-width="12" stroke-linecap="round"/><g font-family="Arial" font-size="28" text-anchor="middle"><text x="180" y="365" fill="#0C706E">Izquierda: 20</text><text x="460" y="365" fill="#8A5A00">Derecha: 10</text></g><text x="320" y="430" text-anchor="middle" font-family="Arial" font-size="28" fill="#1E2A78">Ya no es una igualdad.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Número tres mil cuatrocientos sesenta en cuatro casillas</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="60" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">¿Divisible por 2, 3 y 10?</text><rect x="140" y="190" width="84" height="100" rx="10" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" /><text x="182" y="258" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#1E2A78" text-anchor="middle">3</text><rect x="232" y="190" width="84" height="100" rx="10" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" /><text x="274" y="258" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#1E2A78" text-anchor="middle">4</text><rect x="324" y="190" width="84" height="100" rx="10" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" /><text x="366" y="258" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#1E2A78" text-anchor="middle">6</text><rect x="416" y="190" width="84" height="100" rx="10" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" /><text x="458" y="258" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#1E2A78" text-anchor="middle">0</text></svg>
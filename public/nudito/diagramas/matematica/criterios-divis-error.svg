<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Número mil doscientos cincuenta y tres con la última cifra rodeada de rojo y la suma once</title><rect width="640" height="480" fill="#FCF0D6"/><rect x="140" y="40" width="84" height="100" rx="10" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" /><text x="182" y="108" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#1E2A78" text-anchor="middle">1</text><rect x="232" y="40" width="84" height="100" rx="10" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" /><text x="274" y="108" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#1E2A78" text-anchor="middle">2</text><rect x="324" y="40" width="84" height="100" rx="10" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" /><text x="366" y="108" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#1E2A78" text-anchor="middle">5</text><rect x="416" y="40" width="84" height="100" rx="10" fill="#FFFFFF" stroke="#B5412A" stroke-width="5" /><text x="458" y="108" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#1E2A78" text-anchor="middle">3</text><text x="320" y="185" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#B5412A" text-anchor="middle">Solo miró la última: 3</text><text x="320" y="260" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#1E2A78" text-anchor="middle">1 + 2 + 5 + 3 = 11</text><text x="320" y="318" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">11 no es múltiplo de 3</text><text x="320" y="400" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#B5412A" text-anchor="middle">La última cifra no basta</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title">
<title>Más cifras no significa mayor decimal</title>
<rect width="640" height="480" fill="#FCF0D6"/>

<text x="320" y="50" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78">No cuentes las cifras</text>
<rect x="70" y="105" width="500" height="210" rx="24" fill="#fff"/>
<text x="205" y="225" text-anchor="middle" font-family="sans-serif" font-size="58" fill="#1E2A78">0,45</text><text x="320" y="225" text-anchor="middle" font-family="sans-serif" font-size="46" fill="#B5412A">&gt;</text><text x="455" y="225" text-anchor="middle" font-family="sans-serif" font-size="58" fill="#1E2A78">0,5</text>
<path d="M140 205H500" stroke="#B5412A" stroke-width="6"/>
<text x="320" y="375" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#0C706E">Escribe 0,5 como 0,50</text>
<text x="320" y="425" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#8A5A00">Compara lugares del mismo valor</text>
</svg>

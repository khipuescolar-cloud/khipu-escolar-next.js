<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Gráfico de votos con la barra del charango en amarillo y la conclusión: ganó el charango con diez votos, dos más que la zampoña"><title>Gráfico de votos con la barra del charango en amarillo y la conclusión: ganó el charango con diez votos, dos más que la zampoña</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="50" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">Leemos los votos</text><text x="40" y="123.0" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Zampoña</text><rect x="185" y="90" width="288" height="46" rx="6" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><text x="485" y="123.0" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">8</text><text x="40" y="201.0" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Quena</text><rect x="185" y="168" width="216" height="46" rx="6" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><text x="413" y="201.0" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">6</text><text x="40" y="279.0" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Charango</text><rect x="185" y="246" width="360" height="46" rx="6" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="557" y="279.0" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="start">10</text><text x="320" y="384" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Ganó el charango: 10 votos</text><text x="320" y="434" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">2 votos más que la zampoña</text></svg>
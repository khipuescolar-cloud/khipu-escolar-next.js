<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Ochenta en cuatro grupos de veinte; un grupo coloreado es el veinticinco por ciento"><title>Ochenta en cuatro grupos de veinte; un grupo coloreado es el veinticinco por ciento</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="56" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">25 % de 80</text><rect x="62" y="110" width="120" height="120" rx="12" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4"/><text x="122" y="185" font-family="sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" text-anchor="middle">20</text><rect x="194" y="110" width="120" height="120" rx="12" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="254" y="185" font-family="sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">20</text><rect x="326" y="110" width="120" height="120" rx="12" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="386" y="185" font-family="sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">20</text><rect x="458" y="110" width="120" height="120" rx="12" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="518" y="185" font-family="sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">20</text><text x="320" y="300" font-family="sans-serif" font-size="34" font-weight="700" fill="#1E2A78" text-anchor="middle">1 de 4 grupos = 25 %</text><text x="320" y="380" font-family="sans-serif" font-size="44" font-weight="700" fill="#0F7C7A" text-anchor="middle">80 ÷ 4 = 20</text></svg>

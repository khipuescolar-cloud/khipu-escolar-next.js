<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Una tabla de frutas vendidas en el mercado de Belén: aguaje seis y camu camu dos; abajo dice que cada cuadradito vale uno"><title>Una tabla de frutas vendidas en el mercado de Belén: aguaje seis y camu camu dos; abajo dice que cada cuadradito vale uno</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Frutas vendidas en Belén</text><rect x="120" y="100" width="400" height="170" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3" /><text x="150" y="165" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="start">aguaje</text><text x="490" y="165" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="end">6</text><text x="150" y="235" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="start">camu camu</text><text x="490" y="235" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="end">2</text><text x="320" y="340" font-family="sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="middle">mercado de Belén, Iquitos</text><text x="320" y="410" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">cada cuadradito vale uno</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tarjeta con tres pasos para décimos y centésimos"><title>Tarjeta con tres pasos para décimos y centésimos</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Tres pasos</text><rect x="40" y="80" width="560" height="112" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><circle cx="104" cy="136" r="30" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><text x="104" y="147" font-family="sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="160" y="128" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Parte la unidad en</text><text x="160" y="166" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">10 o en 100 partes</text><rect x="40" y="208" width="560" height="112" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><circle cx="104" cy="264" r="30" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><text x="104" y="275" font-family="sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="160" y="256" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Cuenta las partes</text><text x="160" y="294" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">y escribe la fracción</text><rect x="40" y="336" width="560" height="112" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><circle cx="104" cy="392" r="30" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><text x="104" y="403" font-family="sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="160" y="384" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">De décimos a centésimos:</text><text x="160" y="422" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">multiplica por 10</text></svg>
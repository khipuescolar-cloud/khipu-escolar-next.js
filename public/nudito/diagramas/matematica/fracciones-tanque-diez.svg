<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Barra de diez partes: siete décimos del tanque, de los cuales cinco décimos se usan y quedan dos décimos, que son un quinto"><title>Barra de diez partes: siete décimos del tanque, de los cuales cinco décimos se usan y quedan dos décimos, que son un quinto</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="48" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">Tanque con 7/10</text><rect x="80" y="80" width="48" height="64" rx="0" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><rect x="128" y="80" width="48" height="64" rx="0" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><rect x="176" y="80" width="48" height="64" rx="0" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><rect x="224" y="80" width="48" height="64" rx="0" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><rect x="272" y="80" width="48" height="64" rx="0" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><rect x="320" y="80" width="48" height="64" rx="0" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><rect x="368" y="80" width="48" height="64" rx="0" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><rect x="416" y="80" width="48" height="64" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><rect x="464" y="80" width="48" height="64" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><rect x="512" y="80" width="48" height="64" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><rect x="80" y="196" width="28" height="28" rx="4" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="124" y="222" font-family="sans-serif" font-size="28" font-weight="700" fill="#1B1F2A" text-anchor="start">se usa 5/10 (la mitad)</text><rect x="80" y="256" width="28" height="28" rx="4" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><text x="124" y="282" font-family="sans-serif" font-size="28" font-weight="700" fill="#1B1F2A" text-ancho
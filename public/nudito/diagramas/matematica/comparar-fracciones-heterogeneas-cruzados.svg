<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Las fracciones dos tercios y siete décimos con dos líneas que se cruzan; debajo: dos por diez es veinte y tres por siete es veintiuno; veinte es menor que veintiuno"><title>Las fracciones dos tercios y siete décimos con dos líneas que se cruzan; debajo: dos por diez es veinte y tres por siete es veintiuno; veinte es menor que veintiuno</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Productos cruzados</text><text x="180" y="167" font-family="sans-serif" font-size="56" font-weight="700" fill="#1E2A78" text-anchor="middle">2</text><line x1="153.2" y1="175" x2="206.8" y2="175" stroke="#1E2A78" stroke-width="4" stroke-linecap="round"/><text x="180" y="227" font-family="sans-serif" font-size="56" font-weight="700" fill="#1E2A78" text-anchor="middle">3</text><text x="460" y="167" font-family="sans-serif" font-size="56" font-weight="700" fill="#1E2A78" text-anchor="middle">7</text><line x1="416.4" y1="175" x2="503.6" y2="175" stroke="#1E2A78" stroke-width="4" stroke-linecap="round"/><text x="460" y="227" font-family="sans-serif" font-size="56" font-weight="700" fill="#1E2A78" text-anchor="middle">10</text><line x1="235" y1="125" x2="410" y2="210" stroke="#0F7C7A" stroke-width="4" stroke-linecap="round"/><line x1="405" y1="125" x2="235" y2="210" stroke="#F2B84B" stroke-width="4" stroke-linecap="round"/><text x="180" y="320" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">2 × 10 = 20</text><text x="460" y="320" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">3 × 7 = 21</text><text x="320" y="410" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">20 es menor que 21,</text><text x="320" y="448" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="middle">entonces 2/3 &lt; 7/10</text></svg>
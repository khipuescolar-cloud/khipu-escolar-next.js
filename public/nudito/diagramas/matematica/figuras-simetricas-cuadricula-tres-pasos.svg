<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres tarjetas numeradas: uno, ubica el eje; dos, cuenta cuántas casillas hay hasta el eje; tres, pinta a la misma distancia."><title>Tres tarjetas numeradas: uno, ubica el eje; dos, cuenta cuántas casillas hay hasta el eje; tres, pinta a la misma distancia.</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Tres pasos</text><rect x="50" y="88" width="540" height="100" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><circle cx="104" cy="138" r="30" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><text x="104" y="149" font-family="sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="156" y="148" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Ubica el eje</text><rect x="50" y="206" width="540" height="100" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><circle cx="104" cy="256" r="30" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><text x="104" y="267" font-family="sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="156" y="248" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Cuenta cuántas casillas</text><text x="156" y="284" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">hay hasta el eje</text><rect x="50" y="324" width="540" height="100" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><circle cx="104" cy="374" r="30" fill="#0F7C7A" stroke="#1E2A78" stroke-width="3"/><text x="104" y="385" font-family="sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="156" y="384" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Pinta a la misma distancia</text></svg>
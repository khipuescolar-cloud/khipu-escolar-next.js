<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Secuencia de fichas que crece con una casilla por completar</title>
  <rect width="640" height="480" fill="#FCF0D6"/>
  <text x="320" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1E2A78">¿Cómo crece la fila?</text>
  <g fill="#FFFFFF" stroke="#1E2A78" stroke-width="4">
    <rect x="45" y="105" width="120" height="245" rx="18"/><rect x="190" y="105" width="120" height="245" rx="18"/>
    <rect x="335" y="105" width="120" height="245" rx="18"/><rect x="480" y="105" width="120" height="245" rx="18" stroke-dasharray="10 8"/>
  </g>
  <g fill="#F2B84B" stroke="#1E2A78" stroke-width="3">
    <circle cx="105" cy="175" r="20"/>
    <circle cx="220" cy="175" r="20"/><circle cx="280" cy="175" r="20"/>
    <circle cx="365" cy="175" r="20"/><circle cx="425" cy="175" r="20"/><circle cx="395" cy="235" r="20"/>
  </g>
  <text x="105" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#0C706E">Uno</text>
  <text x="250" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#0C706E">Dos</text>
  <text x="395" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#0C706E">Tres</text>
  <text x="540" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#8A5A00">?</text>
  <text x="320" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" fill="#1E2A78">Observa todos los cambios.</text>
</svg>

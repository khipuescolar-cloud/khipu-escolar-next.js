<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres tarjetas: lunes, doce; martes, quince; miércoles, veintiuno. Debajo, doce más quince más veintiuno son cuarenta y ocho; cuarenta y ocho entre tres es dieciséis. Abajo: dieciséis panes por día."><title>Tres tarjetas: lunes, doce; martes, quince; miércoles, veintiuno. Debajo, doce más quince más veintiuno son cuarenta y ocho; cuarenta y ocho entre tres es dieciséis. Abajo: dieciséis panes por día.</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Panes de tres días</text><rect x="50" y="90" width="160" height="110" rx="12" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="130" y="128" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">Lunes</text><text x="130" y="180" font-family="sans-serif" font-size="48" font-weight="700" fill="#1E2A78" text-anchor="middle">12</text><rect x="230" y="90" width="160" height="110" rx="12" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="310" y="128" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">Martes</text><text x="310" y="180" font-family="sans-serif" font-size="48" font-weight="700" fill="#1E2A78" text-anchor="middle">15</text><rect x="410" y="90" width="160" height="110" rx="12" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="490" y="128" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">Miércoles</text><text x="490" y="180" font-family="sans-serif" font-size="48" font-weight="700" fill="#1E2A78" text-anchor="middle">21</text><text x="320" y="278" font-family="sans-serif" font-size="38" font-weight="700" fill="#1E2A78" text-anchor="middle">12 + 15 + 21 = 48</text><text x="320" y="350" font-family="sans-serif" font-size="44" font-weight="700" fill="#0C706E" text-anchor="middle">48 ÷ 3 = 16</text><text x="320" y="420" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">16 panes por día</text></svg>
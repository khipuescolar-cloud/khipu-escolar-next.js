<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tabla de 483 y 438 donde un niño solo compara las unidades y se equivoca"><title>Tabla de 483 y 438 donde un niño solo compara las unidades y se equivoca</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="46" font-family="sans-serif" font-size="28" font-weight="700" fill="#B5412A" text-anchor="middle">Error: miró solo las unidades</text><rect x="490" y="64" width="100" height="180" rx="8" fill="#FFF9ED" stroke="#B5412A" stroke-width="3"/><text x="300" y="100" font-family="sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="middle">C</text><text x="420" y="100" font-family="sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="middle">D</text><text x="540" y="100" font-family="sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="middle">U</text><text x="60" y="160" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Luis</text><text x="300" y="160" font-family="sans-serif" font-size="40" font-weight="700" fill="#1E2A78" text-anchor="middle">4</text><text x="420" y="160" font-family="sans-serif" font-size="40" font-weight="700" fill="#1E2A78" text-anchor="middle">8</text><text x="540" y="160" font-family="sans-serif" font-size="40" font-weight="700" fill="#1E2A78" text-anchor="middle">3</text><text x="60" y="230" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">Rosa</text><text x="300" y="230" font-family="sans-serif" font-size="40" font-weight="700" fill="#1E2A78" text-anchor="middle">4</text><text x="420" y="230" font-family="sans-serif" font-size="40" font-weight="700" fill="#1E2A78" text-anchor="middle">3</text><text x="540" y="230" font-family="sans-serif" font-size="40" font-weight="700" fill="#1E2A78" text-anchor="middle">8</text><text x="320" y="305" font-family="sans-serif" font-size="28" font-weight="700"
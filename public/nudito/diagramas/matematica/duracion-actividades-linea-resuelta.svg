<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img">
  <title>Duración dividida en dos tramos de cuarenta y cinco minutos</title>
  <rect width="640" height="480" rx="28" fill="#FCF0D6"/>
  <text x="320" y="58" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78">Cuenta por tramos</text>
  <line x1="70" y1="235" x2="570" y2="235" stroke="#1E2A78" stroke-width="9"/>
  <g stroke="#0F7C7A" stroke-width="6"><line x1="90" y1="195" x2="90" y2="275"/><line x1="320" y1="195" x2="320" y2="275"/><line x1="550" y1="195" x2="550" y2="275"/></g>
  <g font-family="sans-serif" font-size="27" font-weight="700" fill="#1E2A78" text-anchor="middle"><text x="90" y="320">8:15</text><text x="320" y="320">9:00</text><text x="550" y="320">9:45</text></g>
  <g font-family="sans-serif" font-size="26" font-weight="700" fill="#0C706E" text-anchor="middle"><text x="205" y="165">45 min</text><text x="435" y="165">45 min</text></g>
  <text x="320" y="405" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#0C706E">90 minutos</text>
</svg>

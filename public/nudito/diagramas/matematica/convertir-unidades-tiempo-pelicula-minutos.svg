<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dos bloques de una hora con sesenta minutos cada uno, un bloque de diez minutos, y la suma sesenta más sesenta más diez igual a ciento treinta minutos"><title>Dos bloques de una hora con sesenta minutos cada uno, un bloque de diez minutos, y la suma sesenta más sesenta más diez igual a ciento treinta minutos</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="64" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">Una película</text><rect x="40" y="150" width="200" height="100" rx="8" fill="#1E2A78" stroke="#1E2A78" stroke-width="3"/><text x="140" y="192" font-family="sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">1 hora</text><text x="140" y="226" font-family="sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">60 min</text><rect x="250" y="150" width="200" height="100" rx="8" fill="#1E2A78" stroke="#1E2A78" stroke-width="3"/><text x="350" y="192" font-family="sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">1 hora</text><text x="350" y="226" font-family="sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">60 min</text><rect x="460" y="150" width="140" height="100" rx="8" fill="#FFFFFF" stroke="#1E2A78" stroke-width="3"/><text x="530" y="209" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">10 min</text><path d="M40 116 V128 H450 V116" fill="none" stroke="#1E2A78" stroke-width="4"/><text x="245" y="108" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">2 horas = 120 min</text><text x="320" y="340" font-family="sans-serif" font-size="34" font-weight="700" fill="#0C706E" text-anchor="middle">60 + 60 + 10 = 130 min</text></svg>
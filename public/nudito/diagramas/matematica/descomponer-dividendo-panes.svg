<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img"><title>División de ochenta y cuatro panes entre siete puestos usando setenta y catorce</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#1E2A78">Ochenta y cuatro panes</text><rect x="55" y="90" width="530" height="85" rx="18" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="320" y="146" text-anchor="middle" font-family="Arial" font-size="40" font-weight="700" fill="#1E2A78">84 = 70 + 14</text><g fill="#FFFFFF" stroke="#0C706E" stroke-width="4"><rect x="55" y="215" width="250" height="100" rx="18"/><rect x="335" y="215" width="250" height="100" rx="18"/></g><g font-family="Arial" font-size="32" font-weight="700" text-anchor="middle"><text x="180" y="277" fill="#0C706E">70 ÷ 7 = 10</text><text x="460" y="277" fill="#8A5A00">14 ÷ 7 = 2</text></g><text x="320" y="425" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#1E2A78">10 + 2 = 12</text></svg>

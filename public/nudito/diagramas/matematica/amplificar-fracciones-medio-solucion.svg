<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Barra con un medio pintado que ahora tiene seis partes y tres pintadas, tres sextos"><title>Barra con un medio pintado que ahora tiene seis partes y tres pintadas, tres sextos</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="54" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Un medio es tres sextos</text><rect x="40.0" y="110" width="93.3" height="90" rx="0" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4" /><rect x="133.3" y="110" width="93.3" height="90" rx="0" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4" /><rect x="226.7" y="110" width="93.3" height="90" rx="0" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4" /><rect x="320.0" y="110" width="93.3" height="90" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4" /><rect x="413.3" y="110" width="93.3" height="90" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4" /><rect x="506.7" y="110" width="93.3" height="90" rx="0" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4" /><line x1="320" y1="100" x2="320" y2="210" stroke="#1E2A78" stroke-width="6" stroke-linecap="round"/><text x="320" y="290" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">(1 × 3) / (2 × 3) = 3/6</text><text x="320" y="365" font-family="sans-serif" font-size="40" font-weight="700" fill="#0F7C7A" text-anchor="middle">1/2 = 3/6</text><text x="320" y="430" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="middle">Se pinta el mismo largo</text></svg>

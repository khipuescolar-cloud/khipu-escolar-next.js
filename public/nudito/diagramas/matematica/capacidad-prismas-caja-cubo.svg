<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Una caja con forma de prisma, vacía, y a su derecha un cubo unidad pequeño; se pregunta cuántos cubos caben"><title>Una caja con forma de prisma, vacía, y a su derecha un cubo unidad pequeño; se pregunta cuántos cubos caben</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Una caja y su cubo unidad</text><polygon points="80,276 260,276 260,168 80,168" fill="none" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round"/><polygon points="50,300 230,300 230,192 50,192" fill="none" stroke="#1E2A78" stroke-width="4" stroke-linejoin="round"/><line x1="50" y1="300" x2="80" y2="276" stroke="#1E2A78" stroke-width="4" stroke-linecap="round"/><line x1="230" y1="300" x2="260" y2="276" stroke="#1E2A78" stroke-width="4" stroke-linecap="round"/><line x1="230" y1="192" x2="260" y2="168" stroke="#1E2A78" stroke-width="4" stroke-linecap="round"/><line x1="50" y1="192" x2="80" y2="168" stroke="#1E2A78" stroke-width="4" stroke-linecap="round"/><rect x="450" y="230" width="70" height="70" rx="0" fill="#0F7C7A" stroke="#FFFFFF" stroke-width="2.5"/><polygon points="450,230 520,230 546,210 476,210" fill="#63AAA9" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/><polygon points="520,300 520,230 546,210 546,280" fill="#0A5755" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/><text x="480" y="350" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">1 cubo unidad</text><text x="160" y="350" font-family="sans-serif" font-size="26" font-weight="700" fill="#1E2A78" text-anchor="middle">caja vacía</text><text x="320" y="425" font-family="sans-serif" font-size="34" font-weight="700" fill="#0F7C7A" text-anchor="middle">¿Cuántos cubos caben?</text></svg>

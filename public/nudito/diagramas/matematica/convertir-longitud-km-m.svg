<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Dos kilómetros equivalen a dos mil metros</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="52" font-family="Arial, sans-serif" font-size="31" font-weight="600" fill="#1E2A78" text-anchor="middle">De kilómetros a metros</text><rect x="55" y="130" width="210" height="100" rx="18" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="4"/><text x="160" y="190" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#0C706E" text-anchor="middle">2 km</text><line x1="285" y1="180" x2="355" y2="180" stroke="#8A5A00" stroke-width="7"/><polygon points="355,180 337,168 337,192" fill="#8A5A00"/><rect x="375" y="130" width="210" height="100" rx="18" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><text x="480" y="190" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#1E2A78" text-anchor="middle">2000 m</text><text x="320" y="300" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#8A5A00" text-anchor="middle">Unidad más pequeña: aumenta la cantidad</text><text x="320" y="385" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#0C706E" text-anchor="middle">Multiplica por mil</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title">
<title>Comparación de cuarenta y tres y cuarenta y seis</title>
<rect width="640" height="480" fill="#FCF0D6"/>

<text x="320" y="52" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78">43 es menor que 46</text>
<rect x="50" y="95" width="250" height="285" rx="22" fill="#fff"/><rect x="340" y="95" width="250" height="285" rx="22" fill="#fff"/>
<text x="175" y="138" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#1E2A78">43</text><text x="465" y="138" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#1E2A78">46</text>
<text x="175" y="215" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#8A5A00">4 decenas</text><text x="465" y="215" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#8A5A00">4 decenas</text>
<g fill="#0F7C7A"><circle cx="131" cy="285" r="18"/><circle cx="175" cy="285" r="18"/><circle cx="219" cy="285" r="18"/><circle cx="375" cy="285" r="14"/><circle cx="411" cy="285" r="14"/><circle cx="447" cy="285" r="14"/><circle cx="483" cy="285" r="14"/><circle cx="519" cy="285" r="14"/><circle cx="555" cy="285" r="14"/></g>
<text x="175" y="350" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#1E2A78">3 unidades</text><text x="465" y="350" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#1E2A78">6 unidades</text>
<text x="320" y="435" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#0C706E">Deciden las unidades</text>
</svg>

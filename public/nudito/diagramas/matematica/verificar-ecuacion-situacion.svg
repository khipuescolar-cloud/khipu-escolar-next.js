<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img"><title>Ecuación cinco c más cuatro igual veinticuatro con la propuesta c igual cuatro</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="60" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">La compra de Ana</text><rect x="60" y="100" width="520" height="110" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4" /><text x="320" y="178" font-family="Arial, Liberation Sans, sans-serif" font-size="46" font-weight="700" fill="#1E2A78" text-anchor="middle">5c + 4 = 24</text><text x="320" y="268" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="middle">c es la cantidad de cuadernos</text><rect x="120" y="300" width="400" height="70" rx="14" fill="#F2B84B" stroke="#1E2A78" stroke-width="4" /><text x="320" y="348" font-family="Arial, Liberation Sans, sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">Propuesta: c = 4</text><text x="320" y="438" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="middle">¿Sirve esta respuesta?</text></svg>
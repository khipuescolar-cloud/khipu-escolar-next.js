<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title">
<title>Comprobación de cuarenta y siete entre seis</title>
<rect width="640" height="480" fill="#FCF0D6"/>

<text x="320" y="48" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78">47 ÷ 6 = 7, residuo 5</text>
<rect x="65" y="100" width="510" height="250" rx="24" fill="#fff"/>
<text x="320" y="170" text-anchor="middle" font-family="sans-serif" font-size="38" fill="#1E2A78">divisor × cociente + residuo</text>
<text x="320" y="245" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="700" fill="#0C706E">6 × 7 + 5 = 47</text>
<text x="320" y="315" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#8A5A00">42 + 5 recupera 47</text>
<text x="320" y="420" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#1E2A78">El residuo es menor que seis</text>
</svg>

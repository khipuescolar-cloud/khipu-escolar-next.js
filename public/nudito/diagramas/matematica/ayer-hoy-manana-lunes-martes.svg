<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres tarjetas en orden: ayer lunes, hoy martes y mañana miércoles"><title>Tres tarjetas en orden: ayer lunes, hoy martes y mañana miércoles</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Antes y después del martes</text><rect x="30" y="130" width="180" height="170" rx="16" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4"/><text x="120" y="180" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Ayer</text><text x="120" y="260" font-family="sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">lunes</text><rect x="230" y="130" width="180" height="170" rx="16" fill="#F2B84B" stroke="#1E2A78" stroke-width="4"/><text x="320" y="180" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Hoy</text><text x="320" y="260" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">martes</text><rect x="430" y="130" width="180" height="170" rx="16" fill="#FCF0D6" stroke="#1E2A78" stroke-width="4"/><text x="520" y="180" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Mañana</text><text x="520" y="260" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">miércoles</text><text x="320" y="370" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Mamá fue al mercado el lunes.</text></svg>
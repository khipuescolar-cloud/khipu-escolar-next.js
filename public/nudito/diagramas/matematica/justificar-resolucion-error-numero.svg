<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Respuesta ciento cuarenta y cuatro tachada por no indicar cuadernos ni explicar el cálculo; debajo aparecen operación, unidad y comprobación.">
  <title>Un número solo no es una justificación</title>
  <rect width="640" height="480" rx="32" fill="#FCF0D6"/>
  <text x="320" y="58" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#1E2A78">La respuesta necesita razones</text>
  <rect x="95" y="100" width="450" height="105" rx="22" fill="#FFFFFF" stroke="#B5412A" stroke-width="5"/>
  <text x="320" y="168" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="700" fill="#B5412A">144</text>
  <path d="M470 125 L505 185 M505 125 L470 185" stroke="#B5412A" stroke-width="8" stroke-linecap="round"/>
  <rect x="70" y="245" width="500" height="165" rx="22" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="5"/>
  <text x="320" y="298" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78">Seis grupos de veinticuatro</text>
  <text x="320" y="345" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#0C706E">Resultado: 144 cuadernos</text>
  <text x="320" y="390" text-anchor="middle" font-family="sans-serif" font-size="27" fill="#0C706E">Compruebo con la división</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tres pasos para calcular cuarenta menos tres por cinco más seis: tres por cinco es quince, cuarenta menos quince es veinticinco y veinticinco más seis es treinta y uno"><title>Tres pasos para calcular cuarenta menos tres por cinco más seis: tres por cinco es quince, cuarenta menos quince es veinticinco y veinticinco más seis es treinta y uno</title><rect width="640" height="480" rx="20" fill="#FFF9ED"/><text x="320" y="52" font-family="sans-serif" font-size="42" font-weight="700" fill="#1E2A78" text-anchor="middle">40 − 3 × 5 + 6</text><rect x="50" y="100" width="540" height="90" rx="14" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="5"/><text x="80" y="162" font-family="sans-serif" font-size="36" font-weight="700" fill="#5B6170" text-anchor="start">1.º</text><text x="320" y="162" font-family="sans-serif" font-size="44" font-weight="700" fill="#0F7C7A" text-anchor="middle">3 × 5 = 15</text><rect x="50" y="210" width="540" height="90" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="5"/><text x="80" y="272" font-family="sans-serif" font-size="36" font-weight="700" fill="#5B6170" text-anchor="start">2.º</text><text x="320" y="272" font-family="sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">40 − 15 = 25</text><rect x="50" y="320" width="540" height="90" rx="14" fill="#FFFFFF" stroke="#1E2A78" stroke-width="5"/><text x="80" y="382" font-family="sans-serif" font-size="36" font-weight="700" fill="#5B6170" text-anchor="start">3.º</text><text x="320" y="382" font-family="sans-serif" font-size="44" font-weight="700" fill="#1E2A78" text-anchor="middle">25 + 6 = 31</text><text x="320" y="454" font-family="sans-serif" font-size="32" font-weight="700" fill="#0F7C7A" text-anchor="middle">Quedan 31 stickers</text></svg>
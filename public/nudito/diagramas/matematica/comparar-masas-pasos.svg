<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Tarjeta con tres pasos para comparar masas: escribir cada masa, comparar los números y ordenar"><title>Tarjeta con tres pasos para comparar masas: escribir cada masa, comparar los números y ordenar</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Tres pasos para comparar</text><rect x="30" y="80" width="580" height="112" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><circle cx="82" cy="136" r="28" fill="#1E2A78"/><text x="82" y="146" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><text x="130" y="124" font-family="sans-serif" font-size="26" font-weight="700" fill="#5B6170" text-anchor="start">Escribe cada masa</text><text x="130" y="168" font-family="sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="start">Con su unidad: 8 kg</text><rect x="30" y="205" width="580" height="112" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><circle cx="82" cy="261" r="28" fill="#1E2A78"/><text x="82" y="271" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><text x="130" y="249" font-family="sans-serif" font-size="26" font-weight="700" fill="#5B6170" text-anchor="start">Compara los números</text><text x="130" y="293" font-family="sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="start">Más kilogramos, más pesado</text><rect x="30" y="330" width="580" height="112" rx="16" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4"/><circle cx="82" cy="386" r="28" fill="#1E2A78"/><text x="82" y="396" font-family="sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="130" y="374" font-family="sans-serif" font-size="26" font-weight="700" fill="#5B6170" text-anchor="start">Ordena y explica</text><text x="130" y="418" font-family="sans-serif" font-size="30" font-weight="700" fill="#0C706E" text-anchor="start">Del número menor al mayor</text></svg>
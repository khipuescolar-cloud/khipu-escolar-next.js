<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Dos conclusiones tachadas en rojo: una opinión sobre el charango y una frase sobre todos los niños del Perú"><title>Dos conclusiones tachadas en rojo: una opinión sobre el charango y una frase sobre todos los niños del Perú</title><rect width="640" height="480" rx="20" fill="#FCF0D6"/><text x="320" y="52" font-family="sans-serif" font-size="32" font-weight="700" fill="#1E2A78" text-anchor="middle">Dos conclusiones sin apoyo</text><rect x="40" y="80" width="560" height="150" rx="12" fill="#FFFFFF" stroke="#B5412A" stroke-width="3" stroke-dasharray="10 7"/><circle cx="90" cy="130" r="22" fill="#B5412A" stroke="#B5412A" stroke-width="2"/><line x1="80.1" y1="120.1" x2="99.9" y2="139.9" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/><line x1="80.1" y1="139.9" x2="99.9" y2="120.1" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/><text x="135" y="122" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">«El charango es el mejor</text><text x="135" y="158" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">instrumento»</text><text x="135" y="206" font-family="sans-serif" font-size="26" font-weight="700" fill="#B5412A" text-anchor="start">Es una opinión, no un dato</text><rect x="40" y="250" width="560" height="150" rx="12" fill="#FFFFFF" stroke="#B5412A" stroke-width="3" stroke-dasharray="10 7"/><circle cx="90" cy="300" r="22" fill="#B5412A" stroke="#B5412A" stroke-width="2"/><line x1="80.1" y1="290.1" x2="99.9" y2="309.9" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/><line x1="80.1" y1="309.9" x2="99.9" y2="290.1" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/><text x="135" y="292" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">«A todos los niños del Perú</text><text x="135" y="328" font-family="sans-serif" font-size="28" font-weight="700" fill="#1E2A78" text-anchor="start">les gusta el charango»</text><text x="135" y="376" font-family="sans-serif" font-size="26" font-weight="700" fill="#B5412A" text-anchor="start">Solo votó un salón</text><text x="320" y="446" font-family="sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="middle">Usa solo lo que muestran los datos</text></svg>
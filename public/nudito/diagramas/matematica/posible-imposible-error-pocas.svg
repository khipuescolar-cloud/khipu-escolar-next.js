<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Afirmación tachada de que una bolita morada es imposible y recordatorio de que sí está en la bolsa.">
  <title>No confundas pocas veces con imposible</title>
  <rect width="640" height="480" rx="32" fill="#FCF0D6"/>
  <text x="320" y="58" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#1E2A78">Cuidado al decidir</text>
  <rect x="72" y="105" width="496" height="120" rx="22" fill="#FFFFFF" stroke="#B5412A" stroke-width="5"/>
  <circle cx="130" cy="165" r="27" fill="#7961A8"/>
  <text x="350" y="175" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700" fill="#B5412A">“Es imposible”</text>
  <path d="M490 135 L525 195 M525 135 L490 195" stroke="#B5412A" stroke-width="8" stroke-linecap="round"/>
  <rect x="72" y="265" width="496" height="145" rx="22" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="5"/>
  <text x="320" y="325" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="700" fill="#0C706E">La morada está en la bolsa</text>
  <text x="320" y="375" text-anchor="middle" font-family="sans-serif" font-size="28" fill="#1E2A78">Puede salir, aunque haya una</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480"><title>Ruta de dos kilómetros entre dos pueblos</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="52" font-family="Arial, sans-serif" font-size="31" font-weight="600" fill="#1E2A78" text-anchor="middle">Una ruta entre pueblos</text><rect x="230" y="90" width="180" height="70" rx="16" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="4"/><text x="320" y="137" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#0C706E" text-anchor="middle">2 km</text><path d="M95 330 C 190 250, 290 400, 380 330 S 500 280 545 250" fill="none" stroke="#0F7C7A" stroke-width="9" stroke-linecap="round"/><circle cx="95" cy="330" r="17" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><circle cx="545" cy="250" r="17" fill="#F2B84B" stroke="#1E2A78" stroke-width="3"/><text x="95" y="385" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#1E2A78" text-anchor="middle">Inicio</text><text x="535" y="300" font-family="Arial, sans-serif" font-size="27" font-weight="600" fill="#1E2A78" text-anchor="middle">Llegada</text><text x="320" y="440" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#8A5A00" text-anchor="middle">¿Cuántos metros son?</text></svg>
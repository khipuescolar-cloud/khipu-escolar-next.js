<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img"><title>Barras con dos mil trescientos cincuenta y tres mil seiscientos cincuenta que forman seis mil</title><rect width="640" height="480" fill="#FCF0D6"/><text x="320" y="60" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">Volvemos a formar el total</text><text x="40" y="118" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="start">Total</text><rect x="60" y="130" width="520" height="56" rx="6" fill="#FFFFFF" stroke="#1E2A78" stroke-width="4" /><text x="320.0" y="168.0" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">6&#160;000</text><text x="40" y="232" font-family="Arial, Liberation Sans, sans-serif" font-size="28" font-weight="700" fill="#0C706E" text-anchor="start">Partes</text><rect x="60" y="244" width="204" height="56" rx="6" fill="#F2B84B" stroke="#1E2A78" stroke-width="4" /><text x="162.0" y="282.0" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#1E2A78" text-anchor="middle">2&#160;350</text><rect x="264" y="244" width="316" height="56" rx="6" fill="#0F7C7A" stroke="#1E2A78" stroke-width="4" /><text x="422.0" y="282.0" font-family="Arial, Liberation Sans, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">3&#160;650</text><text x="320" y="352" font-family="Arial, Liberation Sans, sans-serif" font-size="36" font-weight="700" fill="#1E2A78" text-anchor="middle">2&#160;350 + 3&#160;650 = 6&#160;000</text><circle cx="320" cy="410" r="24" fill="#FFFFFF" stroke="#0F7C7A" stroke-width="4"/><path d="M309,410 L317,419 L332,401" fill="none" stroke="#0F7C7A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><text x="360" y="420" font-family="Arial, Liberation Sans, sans-serif" font-size="2